      A subdivided grid of square blocks that recursively divide into four smaller squares, filling the screen with a dense, uneven mosaic. A continuous, wavelike colour cycle sweeps diagonally across the blocks, dynamically shifting their hue and brightness based on their hierarchical depth. Every block is a clickable link leading to a random corridor.
  - id: munching-squares
