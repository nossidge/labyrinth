  - id: isometric-blocks
    title: Isometric Blocks
    created: 2026-07-13 16:36
    links: dynamic
    tags: [abstract, crt, mobile]
    visual_description: >-
      A dense field of isometric blocks rendered in SVG on a black background. Each block has three shaded faces giving a 3D effect, and coloured in varying shades of a hue that shifts across the grid. Blocks are drawn back-to-front so nearer ones overlap farther ones. Hovering a block lifts it upward and brightens it with a glowing drop-shadow. Every block is a clickable link to a random corridor in the labyrinth.
  - id: tile-slide
    title: Tile Slide
    created: 2026-07-14 13:35
    links: dynamic
    tags: [abstract, crt, mobile]
    visual_description: >-
      A grid of colourful tiles with one empty space in the bottom right corner. Every few tenths of a second, a random tile adjacent to the empty space slides into it, causing the gap to appear to wander across the board. The tiles are coloured by their original home position, so the shuffling motion is visually apparent. The gap never immediately reverses direction, preventing the same tile from bouncing back and forth. Every tile is a clickable link to a random corridor in the labyrinth.
  - id: bathroom-tiles
    title: Bathroom Tiles
    created: 2026-07-15 15:46
    links: dynamic
    tags: [abstract, mobile]
    visual_description: >-
