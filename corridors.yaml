  - id: turing-patterns
    title: Turing Patterns
    created: 2026-07-10 14:52
    links: dynamic
    tags: [crt, maths, mobile]
    visual_description: >-
      A reaction-diffusion simulation based on the Gray-Scott model, producing organic Turing patterns such as spots, stripes, worms, and coral-like structures. The chemical concentrations are mapped to a glowing two-tone colour ramp that cycles through hues over time. The square canvas is a single clickable link to a random corridor in the labyrinth.
  - id: space-torus
    title: Space Torus
    created: 2026-07-11 23:25
    links: 1
    tags: [crt, maths, mobile, parallax]
    visual_description: >-
      A canvas-based 3D torus rendered as a point cloud in a deep space setting. The torus rotates continuously, with points coloured on a magenta-to-cyan gradient based on depth. The background is a multi-layered parallax starfield with twinkling stars that respond to mouse movement. The user can click and drag to control the torus's rotation. Clicking the canvas links to a random corridor in the labyrinth.
  - id: cmyk-blend
    title: CMYK Blend
    created: 2026-07-12 01:51
    links: dynamic
    tags: [abstract, crt, mobile, parallax]
