  - id: crystal-shards
    title: Crystal Shards
    created: 2026-08-13 16:13
    links: dynamic
    tags: [abstract, crt, mobile]
    visual_description: >-
      A dark void filled with 30 translucent, coloured crystal shards rendered as skewed polygons with screen blend mode. Each shard animates with a slow rotate effect, rotating and skewing while cycling through hue shifts. The shards use a palette of vivid neon colours (red, cyan, purple, yellow, green, pink). Hovering a shard increases its opacity. Every shard is a clickable link to a random corridor.
  - id: crystal-hinges
    title: Crystal Hinges
    created: 2026-08-14 12:18
    links: dynamic
    tags: [abstract, mobile]
    visual_description: >-
      A field of 36 coloured crystal shapes scattered across a warm beige background. Each crystal is a polygon rendered with a distinct hue from a palette of red, yellow, blue, green, and purple, rotated in 3D space with a multiply blend mode. Hovering a crystal inverts its colours and flattens its rotation. Pressing any key or clicking the background re-hinges all crystals to new random angles. Every crystal is a clickable link to a random corridor.
  - id: backscatter-orbs
    title: Backscatter Orbs
    created: 2026-08-15 02:08
    links: 7
    tags: [abstract, mobile]
    visual_description: >-
      Seven translucent orbs drift in slow orbital paths around the centre of a dark canvas. Each orb is a radial gradient in a distinct hue that shifts over time, rendered with additive blending for a soft glowing effect. The orbs leave faint trails as they move, fading gradually against the near-black background. Clicking outside an orb resets the simulation. Every orb is a clickable link to a random corridor.
  - id: stellations
    title: Stellations
    created: 2026-08-16 16:55
    links: 1
    tags: [abstract, crt, mobile]
    visual_description: >-
      A canvas-based visualisation of star polygon stellations. Multiple layers of star polygons are drawn with glowing neon lines, each layer slowly spinning and morphing through different densities. The layers are scaled inward creating a nested, hypnotic effect. Colours shift across the hue spectrum over time. The canvas is centered on a black background and acts as a clickable link to a random corridor.
  - id: starfish-flux
    title: Starfish Flux
    created: 2026-08-17 23:24
    links: 1
    tags: [abstract, crt, mobile]
    visual_description: >-
      A canvas-based generative animation of concentric starfish-shaped rings that pulse and distort based on sine waves. The rings cycle through a rainbow of hues with shifting opacity. The entire canvas is a single clickable link to a random corridor.
  - id: irregular-houndstooth
    title: Irregular Houndstooth
    created: 2026-08-18 20:27
    links: dynamic
    tags: [abstract, mobile]
    visual_description: >-
      A full-screen grid of 4x4-cell "tooth" pattern tiles in a two-tone black and white palette, each one the same base shape randomly rotated by a right angle and randomly inverted, loosely approximating a houndstooth weave. Hovering a tooth smoothly swaps its dark and light colours. A fine woven fabric grain overlay adds a textile texture across the page. Clicking the background or pressing any key refreshes the page. Every pattern is a clickable link to a random corridor.
  - id: vasarely-vega
    title: Vasarely Vega
    created: 2026-08-19 18:14
    links: 1
    tags: [abstract, art, mobile]
    visual_description: >-
      A homage to Victor Vasarely's Vega series. A checkerboard of white squares on a dark background is rendered on a canvas. A spherical lens bulges out of the grid, warping the checkerboard cells within its radius. The lens follows the mouse cursor; left alone, it moves around the board, and the lens radius pulses gently over time. Scroll wheel or arrow keys adjust the lens size. Clicking the canvas links to a random corridor.
  - id: dot-grid-warp
    title: Dot Grid Warp
    created: 2026-08-20 18:49
    links: dynamic
    tags: [abstract, crt, mobile]
    visual_description: >-
      A full-screen grid of small blue dots on a dark background. An active point moves around the page, warping the dots toward it and glowing them brighter based on proximity. The point follows the mouse cursor; left alone for a few seconds it switches to an automatic mode, tracing a path determined by the time. The scroll wheel or arrow keys adjust the size of the warping radius. Every dot is a clickable link to a random corridor.
  - id: halftone-pulse
    title: Halftone Pulse
    created: 2026-08-21 18:01
    links: dynamic
    tags: [abstract, crt, mobile]
    visual_description: >-
      A dense, screen-filling grid of black halftone dots on an off-white background. Each dot's radius oscillates continuously, with the pulse phase determined by its distance from the centre of the screen and time, creating concentric waves radiating outward. Every dot is a clickable link to a random corridor.
  - id: day-for-night
    title: Day for Night
    created: 2026-08-22 03:33
    links: dynamic
    tags: [abstract, mobile]
    visual_description: >-
      Vertical slats fill the screen, each one a 3D flip-card with a sunset scene on the front and a night scene on the back. The slats ripple-flip in sequence, smoothly rotating between day and night with a staggered wave that travels across the screen. Hovering a slat brightens it. Every slat is a clickable link to a random corridor.
  - id: enso
    title: Ensō
    created: 2026-08-24 08:22
    links: dynamic
    tags: [art, mobile]
    visual_description: >-
      A Zen-inspired page featuring hand-drawn ensō circles rendered on canvas with a brush-stroke aesthetic. Each circle animates in with a thick-to-thin ink taper, simulating a real brush running out of ink as the line progresses. Completed circles are baked onto a static canvas to keep CPU usage low. Clicking anywhere spawns a new ensō at the cursor position. Each circle has a numbered seal (using formal Japanese numerals) that fades in after the drawing animation completes. Hovering over an ensō reveals it as a portal to a random corridor.
  - id: kolam
    title: Kolam
    created: 2026-08-25 22:48
    links: dynamic
    tags: [art, mobile]
    visual_description: >-
      A generative interpretation of the South Indian kolam tradition. Concentric diamond-shaped rings of dots are drawn on a brown background. Smooth looping curves weave around the dots, bulging outward at each point and denting inward between them, creating patterns. Curve colours are mostly cream with occasional amber and terracotta accents. Clicking the background or pressing any key regenerates the pattern. Each dot is a clickable link to a random corridor.
  - id: deoxyribose
    title: Deoxyribose
    created: 2026-08-26 05:17
    links: dynamic
    tags: [mobile, science]
    visual_description: >-
      A rotating DNA double helix rendered on canvas against a dark background. Two sugar-phosphate backbones spiral around each other, connected by horizontal rungs. Each rung displays a nucleotide base pair (A-T or G-C) in distinctive colours: yellow for adenine, red for thymine, green for guanine, and blue for cytosine. The helix rotates continuously, with depth-based opacity creating a 3D effect. Each base letter on the rungs is a clickable link to a random corridor.
  - id: warp-weft-waves
    title: Warp Weft Waves
    created: 2026-08-27 16:05
    links: 100
    tags: [abstract, mobile]
    visual_description: >-
      Vertical "warp" threads and horizontal "weft" threads are simluated as sine wave lines with their amplitudes, frequencies, phases, and widths randomised. The background is deep maroon and the threads are earthy browns, terracottas, and muted blues. The number of threads scales with the viewport so the warp-to-weft ratio always matches the screen's width-to-height. Pressing a key gives new random values to the existing waves. An invisible grid of cells over the whole page are links to random corridors.
