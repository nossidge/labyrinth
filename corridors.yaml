  - id: movement-in-squares
    title: Movement in Squares
    created: 2026-07-17 02:19
    links: dynamic
    tags: [art, mobile]
    visual_description: >-
      An op-art homage to Bridget Riley's "Movement in Squares" (1961). A grid of black and white squares fills the screen. A vertical wave of compression sweeps across the columns, narrowing the squares as the wave passes and widening them behind it, creating a hypnotic optical illusion of depth and movement. Every square in the grid is a clickable link to a random corridor in the labyrinth.
  - id: riley-current
    title: Riley Current
    created: 2026-07-18 15:55
    links: dynamic
    tags: [art, mobile]
    visual_description: >-
      An op-art homage to Bridget Riley's "Current" (1964). Vertical black wavy parallel lines drift on a canvas, moving subtly. A secondary kink wave adds subtle distortion. Hovering between two lines highlights the space between them with a faint red wash. Each gap between lines is a clickable link to a random corridor in the labyrinth.
  - id: cp-1919
    title: CP 1919
    created: 2026-07-19 16:34
    links: 40
    tags: [mobile, science]
    visual_description: >-
      A canvas-based simulation of the famous CP 1919 pulsar radio emissions, famously used as the cover art for Joy Division's "Unknown Pleasures" album. White ridged lines undulate across a black background, overlapping and occluding each other to create a 3D landscape effect. Hovering over the ridges highlights them. Each of the 40 lines acts as a clickable link to a random corridor in the labyrinth.
  - id: barnsley-fern
    title: Barnsley Fern
    created: 2026-07-20 14:19
    links: 1
    tags: [crt, maths, mobile]
    visual_description: >-
      A procedural rendering of the Barnsley fern fractal, drawn point by point using iterated function systems (IFS). Five fern variants cycle on each reset: the classic Barnsley fern, a modified variant, Cuscita, Cyclosorus, and Fishbone. The points are drawn in a randomly chosen hue, starting green for the first fern. The entire canvas is a single clickable link to a random corridor in the labyrinth.
  - id: leaves-of-grass
    title: Leaves of Grass
    created: 2026-07-21 02:28
    links: dynamic
    tags: [crt, maths, mobile]
    visual_description: >-
      An L-system plant rendered progressively on a canvas against a dark background. A procedural plant grows from the bottom of the screen, its branching structure drawn segment by segment in glowing green hues that shift with depth. Each generation of branches is a different shade, creating a gradient from dark at the base to bright at the tips. The entire canvas is a single clickable link to a random corridor in the labyrinth.
  - id: letters-go-then
    title: Letters Go Then
    created: 2026-07-22 05:06
    links: dynamic
    tags: [crt, meta, unicode]
    visual_description: >-
      A screen-filling grid of monospace letter glyphs, each representing the first letter of a corridor's title. Every glyph is rendered with three overlapping RGB colour layers using screen blend mode, producing a chromatic-aberration effect on hover as the red, green, and blue channels shift apart. A subtle random jitter animation periodically nudges individual glyphs. Each glyph is a clickable link to its corresponding corridor in the labyrinth.
  - id: ninja-turtles
    title: Ninja Turtles
    created: 2026-07-23 03:44
    links: dynamic
    tags: [images, humour, mobile, pop]
    visual_description: >-
      A riff on the "turtles all the way down" concept using the Teenage Mutant Ninja Turtles. The page starts with a 2x2 grid showing the faces of Donatello, Leonardo, Michelangelo, and Raphael in a random order. Clicking any turtle causes it to split into four smaller squares, each displaying a different turtle's face in a randomised arrangement. The process is recursively infinite, with images scaling to fit their containing square. Each word of the phrase "It's ninja turtles all the way down" is a clickable link to another labyrinth page.
  - id: particle-tracks
    title: Particle Tracks
    created: 2026-07-24 07:01
    links: dynamic
    tags: [mobile, science]
    visual_description: >-
      A procedural simulation of subatomic particle tracks, like those from a bubble chamber. Against a black background with faint crosshair marks, clicking (or pressing any key) triggers a particle collision that spawns a burst of tracks: curved whorls, straight lines, and normal trajectories, each in pale cyan or purple hues. Tracks leave fading trails as they spiral, curve, and slow over time. The canvas gradually darkens with each collision, building layers of ghostly traces. Small circular links appear at each collision point.
  - id: suprematist-composition
    title: Suprematist Composition
    created: 2026-07-25 15:52
    links: dynamic
    tags: [art, mobile]
    visual_description: >-
      A composition of diagonally tilted shapes, invoking the work of Kazimir Malevich. Against a warm off-white background, geometric shapes drift slowly with subtle rotation and translation. A central black square anchors the composition, surrounded by diagonal bars in black, red, gold, and blue, along with smaller accent shapes and circles. Hovering over a shape applies a soft drop-shadow. Every shape is a clickable link to a random corridor in the labyrinth.
  - id: schotter
    title: Schotter
    created: 2026-07-26 14:31
    links: dynamic
    tags: [art, mobile]
    visual_description: >-
      A tribute to Georg Nees's 1968 plotter work "Schotter" (Gravel). A grid of black squares is arranged in rows on a white background. The top rows are orderly and aligned, but disorder increases toward the bottom, with squares shifting position and rotating at random. Every square is a clickable link to a random corridor in the labyrinth.
  - id: memphis
    title: Memphis
    created: 2026-07-27 14:42
    links: dynamic
    tags: [art, mobile]
    visual_description: >-
      A tribute to the Memphis design movement of the 1980s. Against a warm off-white background with a subtle repeating pattern, colourful abstract shapes are scattered across the page: squiggles, zigzags, circles, semicircles, triangles, plus signs, and striped bars in bold hues. Larger shapes sit in the background while smaller, more detailed elements occupy the foreground. Hovering over a shape triggers a wiggle animation. Every shape is a clickable link to a random corridor in the labyrinth.
  - id: farbstudie
    title: Farbstudie
    created: 2026-07-29 18:05
    links: dynamic
    tags: [art, mobile]
    visual_description: >-
      A grid of squares inspired by Kandinsky's "Farbstudie - Quadrate mit konzentrischen Ringen" (1913). Each cell contains concentric rings rendered as slightly wobbling ellipses in watercolour-like hues from a curated palette, evoking hand-drawn washes. The grid dimensions adapt to the viewport. Hovering over a cell scales it up slightly. Every cell is a clickable link to a random corridor in the labyrinth.
  - id: razzle-dazzle
    title: Razzle Dazzle
    created: 2026-07-30 01:31
    links: 24
    tags: [abstract, mobile]
    visual_description: >-
      A page inspired by dazzle camouflage, the WWI ship-painting technique. The screen is divided into a grid of distorted polygons, each filled with a randomly rotated black-and-white stripe pattern. Hovering over a pattern inverts its colours. Every pattern is a clickable link to a random corridor in the labyrinth.
  - id: arabesque
    title: Arabesque
    created: 2026-07-31 16:46
    links: dynamic
    tags: [art, mobile]
    visual_description: >-
      A zellige-inspired lattice rendered on canvas with rotating, interlocking squares in deep teal and gold. Each cell contains nested squares that rotate in alternating directions over time, producing a hypnotic strapwork pattern. Small gold dots mark the centre of each cell. Every cell is a clickable link to a random corridor in the labyrinth.
  - id: bokeh
