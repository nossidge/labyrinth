<!DOCTYPE html>
<html lang="en">

<!--
https://www.imdb.com/title/tt0120669/quotes/
-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Too weird to live, and too rare to die.">
  <title>BAT COUNTRY</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://unpkg.com/topojson@3"></script>
  <style>
    :root {
      --background: #000;
      --text-color: #0f0;
      --text-shadow: #050;
      --bat-shadow: #0f0;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--text-color);
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      height: 100vh;
    }

    #globe-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .bat {
      position: absolute;
      font-size: 24px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.5s ease-out, opacity 0.5s ease-out;
      pointer-events: auto;
      z-index: 10;
      text-decoration: none;
      transform: translate(-50%, -50%) scale(var(--scale, 0)) rotate(var(--rot, 0deg));
    }

    .bat:hover {
      transform: translate(-50%, -50%) scale(calc(var(--scale, 1) * 1.5)) rotate(var(--rot, 0deg));
      filter: drop-shadow(0 0 5px var(--bat-shadow));
    }

    .nav-button {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: #111;
      border: 2px solid var(--text-color);
      color: var(--text-color);
      font-size: 40px;
      padding: 10px 20px;
      cursor: pointer;
      z-index: 100;
      box-shadow: 5px 5px 0 var(--text-shadow);
    }

    .nav-button:active {
      box-shadow: 2px 2px 0 var(--text-shadow);
      transform: translateY(-50%) translate(3px, 3px);
    }

    #prev-btn {
      left: 20px;
    }

    #next-btn {
      right: 20px;
    }

    #vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, transparent 50%, rgba(0, 50, 0, 0.4) 100%);
      pointer-events: none;
    }

    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 4px, 3px 100%;
      pointer-events: none;
      z-index: 200;
    }

    #country-name {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      background: #111;
      border: 2px solid var(--text-color);
      padding: 10px 40px;
      text-align: center;
      font-size: 32px;
      letter-spacing: 5px;
      text-transform: uppercase;
      text-shadow: 2px 2px var(--text-shadow);
      pointer-events: none;
      z-index: 5;
    }

    #quote {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #111;
      border: 2px solid var(--text-color);
      padding: 10px 30px;
      text-align: center;
      color: var(--text-color);
      font-size: 20px;
      pointer-events: none;
      text-shadow: 1px 1px var(--text-shadow);
      letter-spacing: 2px;
      z-index: 5;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <div id="vignette"></div>
  <div class="scanlines"></div>
  <div id="country-name">LOADING...</div>
  <div id="quote">"WE CAN'T STOP HERE. THIS IS BAT COUNTRY!"</div>

  <button id="prev-btn" class="nav-button">&lt;</button>
  <button id="next-btn" class="nav-button">&gt;</button>

  <div id="globe-container">
    <canvas id="globe-canvas"></canvas>
    <div id="bats-overlay"></div>
  </div>

  <script src="../../common/labyrinthPages.js"></script>
  <script src="../../common/CyclicRandomiser.js"></script>
  <script>
    const currentPage = "corridors/bat-country/index.html";
    const otherPages = labyrinthPages.filter(p => !p.includes(currentPage));
    const pageRandomiser = new CyclicRandomiser(otherPages);

    const canvas = document.getElementById('globe-canvas');
    const ctx = canvas.getContext('2d');
    const batsOverlay = document.getElementById('bats-overlay');
    const countryLabel = document.getElementById('country-name');

    let width = window.innerWidth;
    let height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    const projection = d3.geoOrthographic()
      .scale(350)
      .translate([width / 2, height / 2])
      .clipAngle(90);

    const path = d3.geoPath(projection, ctx);

    const zoomEndScale = 750; // Focused zoom
    const zoomMidScale = 250; // Zoom out during transit
    const zoomDuration = 1800; // Slightly longer for the more complex motion

    // Developer testing constants, for countries with special cases
    // The forced country will appear when the user clicks "prev-btn"
    const DEV_FORCE_COUNTRY = false;
    const DEV_FORCE_COUNTRY_NAME = 'France';
    let devForceUsed = false;

    let worldData;
    let countriesRandomiser;
    let visitedCountries = [];
    let historyIndex = -1;
    let currentRotation = [0, 0];
    let targetRotation = [0, 0];
    let isMoving = false;
    let spawnSession = 0;

    async function init() {
      try {
        const response = await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json');
        const topoData = await response.json();
        worldData = topojson.feature(topoData, topoData.objects.countries);

        const countries = worldData.features.filter(d => d.properties.name);
        countriesRandomiser = new CyclicRandomiser(countries);

        // Set initial random country immediately without animation
        const firstCountry = countriesRandomiser.nextOne();
        visitedCountries.push(firstCountry);
        historyIndex = 0;

        countryLabel.textContent = firstCountry.properties.name;
        const centroid = d3.geoCentroid(firstCountry);
        currentRotation = [-centroid[0], -centroid[1]];
        projection.rotate(currentRotation);
        projection.scale(zoomEndScale); // Set to final zoom level immediately

        spawnBats(true);
        render();
      } catch (err) {
        console.error('Failed to load map data', err);
        countryLabel.textContent = 'COMMUNICATION FAILURE';
      }
    }

    function goToNextCountry() {
      if (historyIndex < visitedCountries.length - 1) {
        historyIndex++;
        updateToCountry(visitedCountries[historyIndex]);
      } else {
        const randomCountry = countriesRandomiser.nextOne();
        visitedCountries.push(randomCountry);
        historyIndex = visitedCountries.length - 1;
        updateToCountry(randomCountry);
      }
    }

    function goToPrevCountry() {
      if (historyIndex > 0) {
        historyIndex--;
        updateToCountry(visitedCountries[historyIndex]);
      } else {
        let randomCountry;
        if (DEV_FORCE_COUNTRY && !devForceUsed) {
          const foundCountry = worldData.features.find(f => f.properties.name === DEV_FORCE_COUNTRY_NAME)
          randomCountry = foundCountry || countriesRandomiser.nextOne();
          devForceUsed = true;
        } else {
          randomCountry = countriesRandomiser.nextOne();
        }
        visitedCountries.unshift(randomCountry);
        historyIndex = 0;
        updateToCountry(randomCountry);
      }
    }

    function updateToCountry(country) {
      isMoving = true;
      countryLabel.textContent = country.properties.name;

      const centroid = d3.geoCentroid(country);
      targetRotation = [-centroid[0], -centroid[1]];

      // Special case: France - offset rotation to focus on Mainland France
      // instead of its overseas territories (French Guiana)
      if (country.properties.name === 'France') {
        const lonOffset = 8.2; // Positive moves target East
        const latOffset = 4.0; // Positive moves target North
        targetRotation[0] -= lonOffset;
        targetRotation[1] -= latOffset;
      }

      spawnSession++;
      clearBats();
      animateRotation();
    }

    function animateRotation() {
      const interpolateRot = d3.interpolate(currentRotation, targetRotation);
      const zoomStartScale = projection.scale();
      const start = performance.now();

      function step(now) {
        const t = Math.min(1, (now - start) / zoomDuration);

        // Update rotation
        currentRotation = interpolateRot(t);
        projection.rotate(currentRotation);

        // Update scale: zoom out then in
        let s;
        if (t < 0.5) {
          // 0.0 -> 0.5: zoomStartScale -> zoomMidScale
          s = d3.interpolate(zoomStartScale, zoomMidScale)(t * 2);
        } else {
          // 0.5 -> 1.0: zoomMidScale -> zoomEndScale
          s = d3.interpolate(zoomMidScale, zoomEndScale)((t - 0.5) * 2);
        }
        projection.scale(s);

        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          isMoving = false;
          spawnBats();
        }
      }
      requestAnimationFrame(step);
    }

    function spawnBats(instant = false) {
      const country = visitedCountries[historyIndex];
      const bounds = d3.geoBounds(country);
      const area = d3.geoArea(country);

      // Handle antimeridian wrapping for longitude spread
      let lonSpread = (bounds[1][0] - bounds[0][0] + 360) % 360;

      // Special case: Antarctica - if it spans exactly 360 degrees, lonSpread becomes 0
      if (lonSpread === 0 && Math.abs(bounds[1][0] - bounds[0][0]) > 1) lonSpread = 360;

      const latSpread = bounds[1][1] - bounds[0][1];

      // Scale number of bats by country area
      let numBats = 6 + Math.floor(Math.sqrt(area) * 120);

      const centroid = d3.geoCentroid(country);
      const isAntarctica = country.properties.name === 'Antarctica';
      const isFrance = country.properties.name === 'France';

      // Special case: France - offset the bat spawn center to match the globe rotation
      if (isFrance) {
        const lonOffset = 8.2;
        const latOffset = 4.0;
        centroid[0] += lonOffset;
        centroid[1] += latOffset;
      }

      for (let i = 0; i < numBats; i++) {
        // Randomize bats within the spread of the country
        // Antarctica needs a wider spread to look like a full disk
        // France needs a tight spread to avoid its overseas territories
        let spreadMult = 0.7;
        if (isAntarctica) spreadMult = 1.0;
        if (isFrance) spreadMult = 0.1;

        const lon = centroid[0] + (Math.random() - 0.5) * lonSpread * spreadMult;
        const lat = centroid[1] + (Math.random() - 0.5) * latSpread * spreadMult;

        const coords = projection([lon, lat]);
        // Only draw if the point is on the visible hemisphere
        if (!coords || d3.geoDistance(centroid, [lon, lat]) > Math.PI / 2) continue;

        const bat = document.createElement('a');
        bat.className = 'bat';
        bat.innerHTML = '🦇';

        // Randomize bat size slightly for depth/chaos
        const scale = 1.5 + Math.random() * 1.5;
        bat.style.fontSize = (24 * scale) + 'px';

        bat.style.left = coords[0] + 'px';
        bat.style.top = coords[1] + 'px';

        bat.href = pageRandomiser.nextOne();
        batsOverlay.appendChild(bat);

        // Randomize bat rotation (upright but tilted slightly)
        bat.style.setProperty('--rot', ((Math.random() - 0.5) * 60) + 'deg');

        if (instant) {
          bat.style.opacity = '1';
          bat.style.setProperty('--scale', '1');
        } else {
          bat.style.opacity = '0';
          bat.style.setProperty('--scale', '0');

          // Stagger spawn with random delays
          const thisSession = spawnSession;
          setTimeout(() => {
            if (thisSession !== spawnSession) return;
            bat.style.opacity = '1';
            bat.style.setProperty('--scale', '1');
          }, i * (500 / numBats) + Math.random() * 200);
        }
      }
    }

    function clearBats() {
      const bats = document.querySelectorAll('.bat');
      bats.forEach((bat, i) => {
        bat.style.pointerEvents = 'none';
        bat.style.opacity = '0';
        bat.style.transform = 'scale(2) translate(' + (Math.random() - 0.5) * 500 + 'px, ' + (Math.random() - 0.5) * 500 + 'px)';
        setTimeout(() => bat.remove(), 500);
      });
    }

    function render() {
      ctx.clearRect(0, 0, width, height);

      // Draw sphere
      ctx.beginPath();
      ctx.arc(width / 2, height / 2, projection.scale(), 0, 2 * Math.PI);
      ctx.fillStyle = '#001a00';
      ctx.fill();
      ctx.strokeStyle = '#0f0';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Draw graticule
      const graticule = d3.geoGraticule()();
      ctx.beginPath();
      path(graticule);
      ctx.strokeStyle = '#030';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Draw countries
      ctx.beginPath();
      path(worldData);
      ctx.strokeStyle = '#0f0';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Highlight active country
      if (visitedCountries[historyIndex]) {
        ctx.beginPath();
        path(visitedCountries[historyIndex]);
        ctx.fillStyle = 'rgba(0, 255, 0, 0.2)';
        ctx.fill();
      }

      requestAnimationFrame(render);
    }

    document.getElementById('next-btn').onclick = () => {
      if (!isMoving) goToNextCountry();
    };

    document.getElementById('prev-btn').onclick = () => {
      if (!isMoving) goToPrevCountry();
    };

    window.addEventListener('keydown', (e) => {
      if (isMoving) return;
      if (e.key === 'ArrowRight') {
        goToNextCountry();
      } else if (e.key === 'ArrowLeft') {
        goToPrevCountry();
      }
    });

    window.addEventListener('resize', () => {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
      projection.translate([width / 2, height / 2]);

      // This isn't perfect, but I quite like the scrappiness :-)
      clearBats();
      spawnBats();
    });

    init();
  </script>
</body>

</html>
