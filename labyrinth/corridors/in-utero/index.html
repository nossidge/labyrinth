<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umbilical thoughts</title>
  <meta name="description" content="Umbilical thoughts in utero">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --womb-deep: #1a0505;
      --womb-glow: #4d0a0a;
      --vein-color: #8a1515;
      --text-color: #ffcccc;
      --baby-shadow: rgba(0, 0, 0, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at center, var(--womb-glow) 0%, var(--womb-deep) 100%);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Newsreader', serif;
      cursor: crosshair;
    }

    /* Womb atmosphere layers */
    .womb-layers {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.4;
      background:
        radial-gradient(circle at 30% 30%, transparent 0%, rgba(138, 21, 21, 0.2) 50%, transparent 100%),
        radial-gradient(circle at 70% 70%, transparent 0%, rgba(138, 21, 21, 0.2) 50%, transparent 100%);
      animation: pulse 8s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.3;
      }

      100% {
        transform: scale(1.1);
        opacity: 0.5;
      }
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none;
    }

    .baby-container {
      position: relative;
      z-index: 10;
      animation: float-baby 6s ease-in-out infinite alternate;
    }

    @keyframes float-baby {
      0% {
        transform: translate(0, 0) rotate(-2deg);
      }

      100% {
        transform: translate(0, 15px) rotate(2deg);
      }
    }

    .baby-image {
      max-width: 300px;
      height: auto;
      filter: drop-shadow(0 0 30px var(--baby-shadow)) sepia(0.3) saturate(1.2);
      transition: all 0.4s ease;
    }

    .baby-image:hover {
      filter: drop-shadow(0 0 20px var(--vein-color)) sepia(0);
    }

    .thought-word {
      position: absolute;
      z-index: 15;
      color: var(--text-color);
      text-decoration: none;
      font-size: 1.5rem;
      font-weight: 200;
      font-style: italic;
      white-space: nowrap;
      padding: 5px 15px;
      transition: all 0.4s ease;
      text-shadow: 0 0 10px rgba(255, 204, 204, 0.5);
    }

    .thought-word:hover {
      text-shadow: 0 0 20px #fff;
      font-weight: 500;
      transform: scale(1.2);
      letter-spacing: 2px;
    }

    .thought-word {
      pointer-events: auto;
    }

    /* This is applied using JS with a random duration in the script tag */
    @keyframes drift {
      0% {
        transform: translate(0, 0);
      }

      100% {
        transform: translate(20px, 15px);
      }
    }

    #words-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 15;
    }
  </style>
</head>

<body>
  <div class="womb-layers"></div>
  <canvas id="connections"></canvas>

  <a href="index2.html" class="baby-container" id="baby">
    <img src="baby.png" alt="Fetal Mind" class="baby-image">
  </a>

  <div id="words-container"></div>

  <script>
    const thoughts = [
      {
        word: "Becoming",
        link: "../../todo.html"
      }, {
        word: "Connection",
        link: "../../todo.html"
      }, {
        word: "Floating",
        link: "../../todo.html"
      }, {
        word: "Growth",
        link: "../../todo.html"
      }, {
        word: "Heartbeat",
        link: "../../todo.html"
      }, {
        word: "Love",
        link: "../../todo.html"
      }, {
        word: "Mother",
        link: "../../todo.html"
      }, {
        word: "Possibility",
        link: "../../todo.html"
      }, {
        word: "Rhythm",
        link: "../../todo.html"
      }, {
        word: "Safe",
        link: "../../todo.html"
      }, {
        word: "Soft",
        link: "../../todo.html"
      }, {
        word: "Warmth",
        link: "../../todo.html"
      },
    ];

    const container = document.getElementById('words-container');
    const canvas = document.getElementById('connections');
    const ctx = canvas.getContext('2d');
    const baby = document.getElementById('baby');
    const wordElements = [];

    function init() {
      resize();
      createWords();
      requestAnimationFrame(draw);
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function createWords() {
      const vh = window.innerHeight;
      const vw = window.innerWidth;
      const radius = Math.min(vw, vh) * 0.35;

      shuffle(thoughts).forEach((thought, i) => {
        const angle = (i / thoughts.length) * Math.PI * 2 + Math.random() * 0.2;
        const dist = radius + (Math.random() - 0.5) * 100;

        const xPx = (vw / 2) + Math.cos(angle) * dist - 50;
        const yPx = (vh / 2) + Math.sin(angle) * dist;

        const xPct = (xPx / vw) * 100;
        const yPct = (yPx / vh) * 100;

        const a = document.createElement('a');
        a.className = 'thought-word';
        a.innerText = thought.word;
        a.href = thought.link;
        a.style.left = `${xPct}%`;
        a.style.top = `${yPct}%`;

        // Random duration and delay for drift animation
        // (The keyframes for `drift` are defined in the CSS)
        const duration = 10 + Math.random() * 10;
        const delay = -Math.random() * duration;
        a.style.animation = `drift ${duration}s ease-in-out ${delay}s infinite alternate`;

        container.appendChild(a);
        wordElements.push({
          el: a,
          angle: angle,
          phase: Math.random() * Math.PI * 2
        });
      });
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const babyRect = baby.getBoundingClientRect();
      const babyX = babyRect.left + babyRect.width / 2;
      const babyY = babyRect.top + babyRect.height / 2;

      ctx.beginPath();
      ctx.strokeStyle = 'rgba(138, 21, 21, 0.4)';
      ctx.lineWidth = 1;

      wordElements.forEach((word, i) => {
        // Compute current position including animation
        const rect = word.el.getBoundingClientRect();
        const wordX = rect.left + rect.width / 2;
        const wordY = rect.top + rect.height / 2;

        // Draw line from baby center to word center
        ctx.moveTo(babyX, babyY);

        // Quadratic curve for a more organic feel
        const cpX = (babyX + wordX) / 2 + Math.sin(Date.now() * 0.001 + i) * 30;
        const cpY = (babyY + wordY) / 2 + Math.cos(Date.now() * 0.001 + i) * 30;

        ctx.quadraticCurveTo(cpX, cpY, wordX, wordY);
      });

      ctx.stroke();

      // Add glow effect to lines
      ctx.shadowBlur = 10;
      ctx.shadowColor = 'rgba(255, 100, 100, 0.2)';

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('load', init);
  </script>
</body>

</html>
