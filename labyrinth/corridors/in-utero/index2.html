<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Umbilical multiplicity</title>
  <meta name="description" content="Ex uno plures">
  <style>
    :root {
      --womb-deep: #1a0505;
      --womb-glow: #4d0a0a;
      --vein-color: #8a1515;
      --text-color: #ffcccc;
      --baby-shadow: rgba(0, 0, 0, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at center, var(--womb-glow) 0%, var(--womb-deep) 100%);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Womb atmosphere layers */
    .womb-layers {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.4;
      background:
        radial-gradient(circle at 30% 30%, transparent 0%, rgba(138, 21, 21, 0.2) 50%, transparent 100%),
        radial-gradient(circle at 70% 70%, transparent 0%, rgba(138, 21, 21, 0.2) 50%, transparent 100%);
      animation: pulse 8s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.3;
      }

      100% {
        transform: scale(1.1);
        opacity: 0.5;
      }
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none;
    }

    .baby-container {
      position: relative;
      z-index: 10;
      animation: float-baby 6s ease-in-out infinite alternate;
    }

    @keyframes float-baby {
      0% {
        transform: translate(0, 0) rotate(-2deg);
      }

      100% {
        transform: translate(0, 15px) rotate(2deg);
      }
    }

    .baby-image {
      max-width: 300px;
      height: auto;
      filter: drop-shadow(0 0 30px var(--baby-shadow)) sepia(0.3) saturate(1.2);
      transition: all 0.4s ease;
    }

    .baby-image:hover {
      filter: drop-shadow(0 0 20px var(--vein-color)) sepia(0);
    }

    .thought-baby {
      position: absolute;
      z-index: 15;
      transition: all 0.4s ease;
    }

    .thought-baby img {
      width: 120px;
      height: auto;
      filter: drop-shadow(0 0 10px var(--baby-shadow)) sepia(0.5);
      transition: all 0.4s ease;
    }

    .thought-baby:hover img {
      filter: drop-shadow(0 0 20px var(--vein-color)) sepia(0);
    }

    @keyframes drift {
      0% {
        transform: translate(0, 0);
      }

      100% {
        transform: translate(20px, 15px);
      }
    }

    #words-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 15;
    }

    .thought-baby {
      pointer-events: auto;
    }
  </style>
</head>

<body>
  <div class="womb-layers"></div>
  <canvas id="connections"></canvas>

  <a href="index.html" class="baby-container" id="baby">
    <img src="baby.png" alt="Fetal Mind" class="baby-image">
  </a>

  <div id="words-container"></div>

  <script src="../../common/CyclicRandomiser.js"></script>
  <script src="../../common/labyrinthPages.js"></script>
  <script>
    const currentPage = "corridors/in-utero/index.html";
    const otherPages = labyrinthPages.filter(p => !p.includes(currentPage));
    const pageRandomiser = new CyclicRandomiser(otherPages);

    const babyCount = 12;

    const container = document.getElementById('words-container');
    const canvas = document.getElementById('connections');
    const ctx = canvas.getContext('2d');
    const baby = document.getElementById('baby');
    const wordElements = [];

    function init() {
      resize();
      createBabies();
      requestAnimationFrame(draw);
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function createBabies() {
      const vh = window.innerHeight;
      const vw = window.innerWidth;
      const radius = Math.min(vw, vh) * 0.35;

      for (let i = 0; i < babyCount; i++) {
        const angle = (i / babyCount) * Math.PI * 2 + Math.random() * 0.2;
        const dist = radius + (Math.random() - 0.5) * 100;

        const xPx = (vw / 2) + Math.cos(angle) * dist - 60;
        const yPx = (vh / 2) + Math.sin(angle) * dist - 40;

        const xPct = (xPx / vw) * 100;
        const yPct = (yPx / vh) * 100;

        const a = document.createElement('a');
        a.className = 'thought-baby';
        a.style.left = `${xPct}%`;
        a.style.top = `${yPct}%`;

        // a.href = pageRandomiser.nextOne();
        // Actually, this is funnier:
        a.href = "../dancing-baby/index.html";

        const img = document.createElement('img');
        img.src = "baby.png";
        img.alt = "Thought Baby";
        a.appendChild(img);

        const duration = 12 + Math.random() * 8;
        const delay = -Math.random() * duration;
        a.style.animation = `drift ${duration}s ease-in-out ${delay}s infinite alternate`;

        container.appendChild(a);
        wordElements.push({
          el: a,
          angle: angle,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const babyRect = baby.getBoundingClientRect();
      const babyX = babyRect.left + babyRect.width / 2;
      const babyY = babyRect.top + babyRect.height / 2;

      ctx.beginPath();
      ctx.strokeStyle = 'rgba(138, 21, 21, 0.4)';
      ctx.lineWidth = 1;

      wordElements.forEach((word, i) => {
        const rect = word.el.getBoundingClientRect();
        const wordX = rect.left + rect.width / 2;
        const wordY = rect.top + rect.height / 2;

        ctx.moveTo(babyX, babyY);

        const cpX = (babyX + wordX) / 2 + Math.sin(Date.now() * 0.001 + i) * 30;
        const cpY = (babyY + wordY) / 2 + Math.cos(Date.now() * 0.001 + i) * 30;

        ctx.quadraticCurveTo(cpX, cpY, wordX, wordY);
      });

      ctx.stroke();
      ctx.shadowBlur = 10;
      ctx.shadowColor = 'rgba(255, 100, 100, 0.2)';

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('load', init);
  </script>
</body>

</html>
