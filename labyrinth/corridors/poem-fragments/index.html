<!DOCTYPE html>
<html lang="en">

<!--
Fragments from poems with no context.
-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="poem fragments">
  <title>poem fragments</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #030405;
      /* Deep nocturnal black */
      color: #b0b0b0;
      font-family: 'Times New Roman', serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    .word-link {
      position: absolute;
      text-decoration: none;
      color: #666;
      font-size: 1.4rem;
      transition: opacity 1.5s, color 0.5s, text-shadow 0.5s, font-size 1.5s ease-in-out;
      z-index: 20;
      white-space: nowrap;
      user-select: none;
      transform-origin: center;
    }

    .word-link:hover {
      color: #fff;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
    }

    .word-link.finished {
      font-size: 3.5rem;
      color: #fff;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.4);
      z-index: 100;
    }

    .dot-element {
      position: absolute;
      text-decoration: none;
      color: #222;
      font-size: 9px;
      font-family: monospace;
      z-index: 5;
      transition: color 0.3s;
      user-select: none;
    }

    .dot-element:hover {
      color: #777;
    }

    .glow {
      position: fixed;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(230, 255, 200, 0.05) 0%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
      mix-blend-mode: screen;
      transform: translate(-50%, -50%);
      left: 50%;
      top: 50%;
    }

    .noise {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44NSIgbnVtT2N0YXZlcz0iMyIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIvPjwvc3ZnPg==');
      opacity: 0.07;
      z-index: 100;
      pointer-events: none;
    }

    #nav-footer {
      position: fixed;
      bottom: 12px;
      width: 100%;
      text-align: center;
      font-size: 14px;
      color: #222;
      letter-spacing: 3px;
      z-index: 50;
      pointer-events: none;
      text-transform: uppercase;
    }

    .flash-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #fff;
      z-index: 200;
      pointer-events: none;
      opacity: 0;
    }

    @keyframes flash {
      0% {
        opacity: 0.2;
      }

      100% {
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div class="noise"></div>
  <div id="flash" class="flash-overlay"></div>
  <div id="glow" class="glow"></div>
  <div id="container"></div>
  <div id="nav-footer"></div>

  <script src="../../common/CyclicRandomiser.js"></script>
  <script src="../../common/labyrinthPages.js"></script>
  <script>
    const currentPage = "corridors/poem-fragments/index.html";
    const otherPages = labyrinthPages.filter(p => !p.includes(currentPage));
    const pageRandomiser = new CyclicRandomiser(otherPages);

    const PHRASE_POOL = [
      {
        poet: "A. Poulin Jr.",
        poem: "Cave Dwellers",
        text: "invent another love that can't destroy".split(" "),
      }, {
        poet: "Barriss Mills",
        poem: "Gone Forever",
        text: "the lost lives I never lived".split(" "),
      }, {
        poet: "Bill Knott",
        poem: "Sonnet",
        text: "of me astonished at you".split(" "),
      }, {
        poet: "Charles Baudelaire",
        poem: "Be Drunk",
        text: "you have to be always drunk".split(" "),
      }, {
        poet: "Charles Bukowski",
        poem: "The Laughing Heart",
        text: "the gods wait to delight in you".split(" "),
      }, {
        poet: "Countee Cullen",
        poem: "From the Dark Tower",
        text: "in the dark we hide the heart that bleeds".split(" "),
      }, {
        poet: "C. P. Cavafy",
        poem: "Ithaka",
        text: "Keep Ithaka always in your mind".split(" "),
      }, {
        poet: "Don Marquis",
        poem: "The Robin and the Worm",
        text: "for you are going to be eaten".split(" "),
      }, {
        poet: "Donald Davie",
        poem: "Remembering The 'Thirties",
        text: "Hearing one saga, we enact the next".split(" "),
      }, {
        poet: "Edna St. Vincent Millay",
        poem: "Conscientious Objector",
        text: "a spy in the land of the living".split(" "),
      }, {
        poet: "Edna St. Vincent Millay",
        poem: "Dirge Without Music",
        text: "more precious was the light in your eyes".split(" "),
      }, {
        poet: "e. e. cummings",
        poem: "somewhere i have never travelled,gladly beyond",
        text: "the voice of your eyes is deeper".split(" "),
      }, {
        poet: "Lisel Mueller",
        poem: "Romantics",
        text: "letting the landscape speak for them".split(" "),
      }, {
        poet: "Martín Espada",
        poem: "The Soldiers in the Garden",
        text: "searching for another incantation".split(" "),
      }, {
        poet: "Miroslav Holub",
        poem: "Ode to Joy",
        text: "You only love when you love in vain".split(" "),
      }, {
        poet: "Ocean Vuong",
        poem: "Someday I'll Love Ocean Vuong",
        text: "loneliness is still time spent with the world".split(" "),
      }, {
        poet: "Philip Larkin",
        poem: "Love Songs in Age",
        text: "the unfailing sense of being young".split(" "),
      }, {
        poet: "Sylvia Plath",
        poem: "Mad Girl's Love Song",
        text: "sung me moon-struck, kissed me quite insane".split(" "),
      }, {
        poet: "Terrance Hayes",
        poem: "American Sonnet For My Past and Future Assassin",
        text: "When the wound is deep, the healing is heroic".split(" "),
      }, {
        poet: "Vladimir Mayakovsky",
        poem: "Listen!",
        text: "able to stand that starless ordeal".split(" "),
      }, {
        poet: "Wendy Cope",
        poem: "Flowers",
        text: "the flowers you nearly brought".split(" "),
      }, {
        poet: "William Butler Yeats",
        poem: "When You Are Old",
        text: "the sorrows of your changing face".split(" "),
      }
    ];
    const phraseRandomiser = new CyclicRandomiser(PHRASE_POOL);

    const container = document.getElementById('container');
    const glow = document.getElementById('glow');
    const flash = document.getElementById('flash');
    let wordActors = [];
    const dots = [];

    function explodeAndReset() {
      if (wordActors.length === 0) return;
      const finishedActor = wordActors[0];
      const items = finishedActor.indices.map(idx => finishedActor.phrase.text[idx]);
      const centerX = finishedActor.x + finishedActor.el.offsetWidth / 2;
      const centerY = finishedActor.y + finishedActor.el.offsetHeight / 2;

      container.removeChild(finishedActor.el);
      wordActors = [];

      // Create temporary fragments for the explosion
      items.forEach((txt, i) => {
        const span = document.createElement('span');
        span.className = 'word-link';
        span.style.color = '#fff';
        span.innerText = txt;
        span.style.transform = `translate(${centerX}px, ${centerY}px)`;
        container.appendChild(span);

        const angle = (i / items.length) * Math.PI * 2 + Math.random();
        const speed = 15 + Math.random() * 20;

        const state = {
          el: span,
          x: centerX,
          y: centerY,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          indices: [],
          finished: false,
          isExplosion: true
        };
        wordActors.push(state);

        setTimeout(() => {
          span.style.transition = "opacity 0.8s, color 0.8s";
          span.style.opacity = "0";
          span.style.color = "#ff0";
        }, 50);
      });

      setTimeout(() => {
        initPoem();
      }, 900);
    }

    function initPoem() {
      // Clear existing word actors (including explosion fragments)
      wordActors.forEach(actor => {
        if (actor.el && actor.el.parentNode === container) {
          container.removeChild(actor.el);
        }
      });
      wordActors = [];

      const phrase = phraseRandomiser.nextOne();

      // Initialise footer
      const navFooter = document.getElementById('nav-footer');
      navFooter.innerHTML = `${phrase.poet} • ${phrase.poem}`;

      // Initialise words
      phrase.text.forEach((word, i) => {
        const a = document.createElement('a');
        a.href = pageRandomiser.nextOne();
        a.className = 'word-link';
        a.innerText = word;
        a.style.opacity = "0";

        const state = {
          el: a,
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          vx: (Math.random() - 0.5) * 1.5,
          vy: (Math.random() - 0.5) * 1.5,
          indices: [i],
          finished: false,
          phrase: phrase
        };

        // Pre-set position to avoid (0,0) flash
        a.style.transform = `translate(${state.x}px, ${state.y}px)`;
        container.appendChild(a);
        wordActors.push(state);

        // Fade in
        setTimeout(() => {
          a.style.opacity = "1";
        }, 100 + i * 50);
      });
    }

    // Initialise dots once
    for (let i = 0; i < 120; i++) {
      const dot = document.createElement('span');
      dot.className = 'dot-element';
      dot.innerText = i % 3 === 0 ? "+" : (i % 3 === 1 ? "·" : "x");

      const state = {
        el: dot,
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * 0.2,
        vy: (Math.random() - 0.5) * 0.2
      };

      container.appendChild(dot);
      dots.push(state);
    }

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let targetX = mouseX;
    let targetY = mouseY;
    let isMouseDown = false;

    document.addEventListener('mousemove', (e) => {
      targetX = e.clientX;
      targetY = e.clientY;
    });

    document.addEventListener('mousedown', () => isMouseDown = true);
    document.addEventListener('mouseup', () => isMouseDown = false);
    document.addEventListener('mouseleave', () => isMouseDown = false);

    function mergeWords(idxA, idxB) {
      const a = wordActors[idxA];
      const b = wordActors[idxB];
      const phrase = a.phrase;

      const newIndices = [...a.indices, ...b.indices].sort((x, y) => x - y);
      const newText = newIndices.map(i => phrase.text[i]).join(" ");

      const newEl = document.createElement('a');
      newEl.className = 'word-link';
      newEl.innerText = newText;

      const isFinished = newIndices.length === phrase.text.length;

      const newState = {
        el: newEl,
        x: (a.x + b.x) / 2,
        y: (a.y + b.y) / 2,
        vx: (a.vx + b.vx) / 2,
        vy: (a.vy + b.vy) / 2,
        indices: newIndices,
        finished: isFinished,
        phrase: phrase
      };

      // Set position immediately to avoid (0,0) flash
      newEl.style.transform = `translate(${newState.x}px, ${newState.y}px)`;

      if (isFinished) {
        newEl.classList.add('finished');
        newEl.href = "javascript:void(0)";
        newEl.style.cursor = "pointer";
        newEl.onclick = (e) => {
          e.preventDefault();
          explodeAndReset();
        };
      } else {
        newEl.href = pageRandomiser.nextOne();
      }

      container.removeChild(a.el);
      container.removeChild(b.el);
      container.appendChild(newEl);

      wordActors.splice(Math.max(idxA, idxB), 1);
      wordActors.splice(Math.min(idxA, idxB), 1);
      wordActors.push(newState);
    }

    function getToroidalDistance(x1, y1, x2, y2) {
      let dx = Math.abs(x1 - x2);
      let dy = Math.abs(y1 - y2);

      if (dx > window.innerWidth / 2) dx = window.innerWidth - dx;
      if (dy > window.innerHeight / 2) dy = window.innerHeight - dy;

      return {
        dist: Math.sqrt(dx * dx + dy * dy),
        dx: (x1 - x2 > window.innerWidth / 2) ? (x1 - x2 - window.innerWidth) : (x1 - x2 < -window.innerWidth / 2 ? x1 - x2 + window.innerWidth : x1 - x2),
        dy: (y1 - y2 > window.innerHeight / 2) ? (y1 - y2 - window.innerHeight) : (y1 - y2 < -window.innerHeight / 2 ? y1 - y2 + window.innerHeight : y1 - y2)
      };
    }

    function update() {
      mouseX += (targetX - mouseX) * 0.1;
      mouseY += (targetY - mouseY) * 0.1;
      glow.style.left = mouseX + 'px';
      glow.style.top = mouseY + 'px';

      // Merging check (with toroidal distance)
      for (let i = 0; i < wordActors.length; i++) {
        for (let j = i + 1; j < wordActors.length; j++) {
          const a = wordActors[i];
          const b = wordActors[j];
          if (a.finished || b.finished || a.isExplosion || b.isExplosion) continue;

          const aMin = a.indices[0];
          const aMax = a.indices[a.indices.length - 1];
          const bMin = b.indices[0];
          const bMax = b.indices[b.indices.length - 1];

          if (aMax + 1 === bMin || bMax + 1 === aMin) {
            const t = getToroidalDistance(a.x, a.y, b.x, b.y);
            if (t.dist < 60) {
              mergeWords(i, j);
              return requestAnimationFrame(update);
            }
          }
        }
      }

      wordActors.forEach(obj => {
        if (obj.finished) {
          // Final centering behavior
          const cx = window.innerWidth / 2 - (obj.el.offsetWidth / 2);
          const cy = window.innerHeight / 2 - (obj.el.offsetHeight / 2);
          obj.x += (cx - obj.x) * 0.05;
          obj.y += (cy - obj.y) * 0.05;
        } else {
          obj.x += obj.vx;
          obj.y += obj.vy;

          // Screen wrap
          const margin = 20;
          if (obj.x < -margin) obj.x += window.innerWidth + margin * 2;
          if (obj.x > window.innerWidth + margin) obj.x -= window.innerWidth + margin * 2;
          if (obj.y < -margin) obj.y += window.innerHeight + margin * 2;
          if (obj.y > window.innerHeight + margin) obj.y -= window.innerHeight + margin * 2;

          if (!obj.isExplosion) {
            const t = getToroidalDistance(obj.x, obj.y, mouseX, mouseY);

            // Global attraction when mouse is down
            if (isMouseDown) {
              obj.vx -= t.dx * 0.00002;
              obj.vy -= t.dy * 0.00002;
            }

            if (t.dist < 250) {
              const force = (250 - t.dist) / 250;
              obj.vx -= t.dx * force * 0.002;
              obj.vy -= t.dy * force * 0.002;
            }
            obj.vx *= 0.992;
            obj.vy *= 0.992;
          }
        }
        obj.el.style.transform = `translate(${obj.x}px, ${obj.y}px)`;
      });

      dots.forEach(obj => {
        obj.x += obj.vx;
        obj.y += obj.vy;

        const margin = 20;
        if (obj.x < -margin) obj.x += window.innerWidth + margin * 2;
        if (obj.x > window.innerWidth + margin) obj.x -= window.innerWidth + margin * 2;
        if (obj.y < -margin) obj.y += window.innerHeight + margin * 2;
        if (obj.y > window.innerHeight + margin) obj.y -= window.innerHeight + margin * 2;

        const t = getToroidalDistance(obj.x, obj.y, mouseX, mouseY);
        if (t.dist < 150) {
          const force = (150 - t.dist) / 150;
          obj.vx += t.dx * force * 0.003;
          obj.vy += t.dy * force * 0.003;
        }
        obj.vx *= 0.995;
        obj.vy *= 0.995;
        obj.el.style.transform = `translate(${obj.x}px, ${obj.y}px)`;
      });

      requestAnimationFrame(update);
    }

    initPoem();
    update();

  </script>
</body>

</html>
