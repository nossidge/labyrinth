<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="An archival collection of verses. Flip through the pages of the silent book.">
  <title>THE POETRY BOOK // LABYRINTH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,200;0,700;1,200&family=Bricolage+Grotesque:wght@300&family=Newsreader:ital,opsz,wght@1,6..72,200;1,6..72,400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --paper-color: #f4f1ea;
      --ink-color: #1a1a1a;
      --cover-color: #3d1f1f;
      --accent-color: #8b0000;
      --gutter-shadow: rgba(0, 0, 0, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #0d0d0d;
      background-image:
        radial-gradient(circle at 50% 50%, #1a1a1a 0%, #000 100%),
        url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44NSIgbnVtT2N0YXZlcz0iMyIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIvPjwvc3ZnPg==');
      background-blend-mode: overlay;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Bricolage Grotesque', sans-serif;
    }

    /* 3D Scene Setup */
    .scene {
      width: 400px;
      /* Half width because we rotate from center */
      height: 500px;
      perspective: 2000px;
      position: relative;
      z-index: 5;
      transform: translateX(0);
      /* Will shift when open */
      transition: transform 1s ease;
    }

    .scene.open {
      transform: translateX(200px);
    }

    .book {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 1s ease;
    }

    /* Page Stacking Elements */
    .page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-origin: left;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
      user-select: none;
      cursor: pointer;
    }

    .page-side {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      background: var(--paper-color);
      padding: 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.05);
      border-radius: 2px 8px 8px 2px;
    }

    /* Front Side of the page */
    .page-front {
      z-index: 2;
      background: linear-gradient(to right, #ddd 0%, var(--paper-color) 4px, var(--paper-color) 100%);
    }

    /* Back Side of the page */
    .page-back {
      transform: rotateY(-180deg);
      background: linear-gradient(to left, #ddd 0%, var(--paper-color) 4px, var(--paper-color) 100%);
      border-radius: 8px 2px 2px 8px;
    }

    /* The Spine Area */
    .gutter {
      position: absolute;
      top: 0;
      left: 0;
      width: 50px;
      height: 100%;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.3) 0%, transparent 100%);
      z-index: 10;
      pointer-events: none;
    }

    .page-back .gutter {
      left: auto;
      right: 0;
      background: linear-gradient(to left, rgba(0, 0, 0, 0.3) 0%, transparent 100%);
    }

    /* Cover Specifics */
    .cover {
      background-color: var(--cover-color) !important;
      border: 2px solid rgba(0, 0, 0, 0.3);
      border-left: 5px solid rgba(0, 0, 0, 0.5);
    }

    .cover-front {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: rgba(255, 255, 255, 0.7);
      text-align: center;
      padding: 20px;
    }

    .cover-front h2 {
      font-family: 'Crimson Pro', serif;
      font-weight: 200;
      font-size: 2.5rem;
      letter-spacing: 0.2rem;
      text-transform: uppercase;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding: 20px 0;
      margin-bottom: 10px;
    }

    .cover-back {
      background-color: #2e1717 !important;
      /* Slightly darker inside cover */
    }

    /* Content Styling */
    .poem-text {
      color: var(--ink-color);
      font-family: 'Newsreader', serif;
      font-size: 1.1rem;
      line-height: 1.6;
      white-space: pre-wrap;
      font-style: italic;
      opacity: 0.9;
    }

    .page-num {
      position: absolute;
      bottom: 20px;
      font-size: 0.7rem;
      opacity: 0.3;
      letter-spacing: 2px;
    }

    .page-front .page-num {
      right: 40px;
    }

    .page-back .page-num {
      left: 40px;
    }

    /* Thickness / Stack Effect */
    .page:nth-child(1) {
      transform: translateZ(1px);
    }

    .page:nth-child(2) {
      transform: translateZ(2px);
    }

    .page:nth-child(3) {
      transform: translateZ(3px);
    }

    .page:nth-child(4) {
      transform: translateZ(4px);
    }

    .page:nth-child(5) {
      transform: translateZ(5px);
    }

    .page.flipped {
      transform: rotateY(-180deg) translateZ(calc(var(--flip-depth, 0) * 1px));
    }

    /* Controls */
    #controls {
      margin-top: 40px;
      display: flex;
      gap: 20px;
      z-index: 20;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }

    #controls.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.5);
      padding: 12px 24px;
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn:hover {
      color: #fff;
      border-color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }

    /* Vignette & Grain */
    #vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.8) 100%);
      pointer-events: none;
      z-index: 10;
    }

    .grain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44NSIgbnVtT2N0YXZlcz0iMyIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIvPjwvc3ZnPg==');
      opacity: 0.1;
      z-index: 15;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="grain"></div>
  <div id="vignette"></div>

  <div class="scene" id="scene">
    <div class="book" id="book">
      <!-- Cover -->
      <div class="page cover" id="page-cover" style="--depth: 10">
        <div class="page-side page-front cover-front">
          <h2>Verses</h2>
          <p
            style="font-family: 'Newsreader', serif; font-size: 0.8rem; letter-spacing: 1px; opacity: 0.5;">
            Collection of the Labyrinth
          </p>
        </div>
        <div class="page-side page-back cover-back"></div>
      </div>

      <!-- Pages will be injected here -->
    </div>
  </div>

  <div id="controls">
    <button class="btn" onclick="prevPage()">Previous</button>
    <button class="btn" onclick="nextPage()">Next</button>
    <button class="btn" onclick="randomPage()">Randomize</button>
  </div>

  <script>
    const poems = [
      `I wandered lonely as a cloud
That floats on high o'er vales and hills,
When all at once I saw a crowd,
A host, of golden daffodils;
Beside the lake, beneath the trees,
Fluttering and dancing in the breeze.`,

      `Nothing Gold Can Stay

Nature’s first green is gold,
Her hardest hue to hold.
Her early leaf’s a flower;
But only so an hour.
Then leaf subsides to leaf.
So Eden sank to grief,
So dawn goes down to day.
Nothing gold can stay.`,

      `The Red Wheelbarrow

so much depends
upon

a red wheel
barrow

glazed with rain
water

beside the white
chickens`,

      `Ozymandias

I met a traveller from an antique land,
Who said—“Two vast and trunkless legs of stone
Stand in the desert. . . Near them, on the sand,
Half sunk a shattered visage lies, whose frown,
And wrinkled lip, and sneer of cold command,
Tell that its sculptor well those passions read
Which yet survive, stamped on these lifeless things,
The hand that mocked them, and the heart that fed.”`,

      `Fire and Ice

Some say the world will end in fire,
Some say in ice.
From what I've tasted of desire
I hold with those who favor fire.
But if it had to perish twice,
I think I know enough of hate
To say that for destruction ice
Is also great
And would suffice.`,

      `Fog

The fog comes
on little cat feet.

It sits looking
over harbor and city
on silent haunches
and then moves on.`,

      `The Tyger

Tyger! Tyger! burning bright
In the forests of the night,
What immortal hand or eye
Could frame thy fearful symmetry?

In what distant deeps or skies
Burnt the fire of thine eyes?
On what wings dare he aspire?
What the hand dare seize the fire?`,

      `Stopping by Woods on a Snowy Evening

Whose woods these are I think I know.
His house is in the village though;
He will not see me stopping here
To watch his woods fill up with snow.

My little horse must think it queer
To stop without a farmhouse near
Between the woods and frozen lake
The darkest evening of the year.`,

      `Dreams

Hold fast to dreams
For if dreams die
Life is a broken-winged bird
That cannot fly.

Hold fast to dreams
For when dreams go
Life is a barren field
Frozen with snow.`,

      `This Is Just To Say

I have eaten
the plums
that were in
the icebox

and which
you were probably
saving
for breakfast

Forgive me
they were delicious
so sweet
and so cold`
    ];

    while (poems.length < 80) {
      poems.push(`Poem No. ${poems.length + 1}\n\n[ Seeking a voice ]\n[ The page remains silent ]\n[ Waiting for your ink ]`);
    }

    const book = document.getElementById('book');
    const scene = document.getElementById('scene');
    const controls = document.getElementById('controls');
    let currentPageIndex = -1; // -1 means cover is front
    const pageElements = [];

    // We create page elements in pairs
    function initBook() {
      // We'll create about 41 physical pages (80 poems / 2 per physical page + cover)
      for (let i = 0; i < 40; i++) {
        const page = document.createElement('div');
        page.className = 'page';
        page.style.zIndex = 100 - i;

        const front = document.createElement('div');
        front.className = 'page-side page-front';
        front.innerHTML = `<div class="gutter"></div><div class="poem-text">${poems[i * 2] || ''}</div><div class="page-num">${i * 2 + 1}</div>`;

        const back = document.createElement('div');
        back.className = 'page-side page-back';
        back.innerHTML = `<div class="gutter"></div><div class="poem-text">${poems[i * 2 + 1] || ''}</div><div class="page-num">${i * 2 + 2}</div>`;

        page.appendChild(front);
        page.appendChild(back);
        book.appendChild(page);
        pageElements.push(page);

        page.onclick = (e) => {
          e.stopPropagation();
          if (currentPageIndex === i) {
            // Current page is flipped, clicking it should maybe do nothing or flip back?
            // Let's use specific controls for clarity but allow clicking next.
            nextPage();
          } else if (currentPageIndex < i) {
            nextPage();
          }
        };
      }
    }

    initBook();

    const cover = document.getElementById('page-cover');
    cover.onclick = openBook;

    function openBook() {
      if (currentPageIndex === -1) {
        cover.classList.add('flipped');
        scene.classList.add('open');
        controls.classList.add('visible');
        currentPageIndex = 0;
      }
    }

    function nextPage() {
      if (currentPageIndex >= 0 && currentPageIndex < pageElements.length) {
        const el = pageElements[currentPageIndex];
        el.classList.add('flipped');
        el.style.setProperty('--flip-depth', currentPageIndex + 1);
        currentPageIndex++;
      }
    }

    function prevPage() {
      if (currentPageIndex === 0) {
        cover.classList.remove('flipped');
        scene.classList.remove('open');
        controls.classList.remove('visible');
        currentPageIndex = -1;
      } else if (currentPageIndex > 0) {
        currentPageIndex--;
        const el = pageElements[currentPageIndex];
        el.classList.remove('flipped');
      }
    }

    function randomPage() {
      const target = Math.floor(Math.random() * pageElements.length);

      // Fast flip forward/backward
      if (currentPageIndex < target) {
        const interval = setInterval(() => {
          if (currentPageIndex < target) nextPage();
          else clearInterval(interval);
        }, 50);
      } else {
        const interval = setInterval(() => {
          if (currentPageIndex > target) prevPage();
          else clearInterval(interval);
        }, 50);
      }
    }

  </script>
</body>

</html>
