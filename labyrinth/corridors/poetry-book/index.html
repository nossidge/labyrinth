<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="An archival collection of verses. Flip through the pages of the silent book.">
  <title>THE POETRY BOOK // LABYRINTH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,200;0,400;0,700;1,200&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:wght@300;800&family=Newsreader:ital,opsz,wght@1,6..72,200;1,6..72,400&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --paper-color: #ffffff;
      --ink-color: #111111;
      --cover-color: #8B4513;
      /* From example */
      --spine-color: rgba(0, 0, 0, 0.5);
      --shadow: rgba(0, 0, 0, 0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1d1f20;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Crimson Pro', serif;
    }

    /* 3D Scene Wrapper */
    #book-wrapper {
      position: relative;
      width: 800px;
      height: 550px;
      perspective: 2000px;
      transition: transform 1s ease;
    }

    /* The actual book structure */
    .book {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 1s ease;
    }

    /* Cover and Spine details from example Pen */
    .book:before {
      content: '';
      position: absolute;
      top: -15px;
      left: -15px;
      right: -15px;
      bottom: -15px;
      background-color: var(--cover-color);
      border-radius: 8px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      z-index: -1;
      transform: translateZ(-20px);
    }

    /* The Spine Shadow */
    .book:after {
      content: '';
      position: absolute;
      top: -15px;
      bottom: -15px;
      left: 50%;
      width: 40px;
      background: linear-gradient(to right, transparent 0%, rgba(0, 0, 0, 0.2) 46%, rgba(0, 0, 0, 0.5) 49%, rgba(0, 0, 0, 0.6) 50%, rgba(0, 0, 0, 0.5) 51%, rgba(0, 0, 0, 0.2) 52%, transparent 100%);
      transform: translateX(-50%) translateZ(10px);
      z-index: 100;
      pointer-events: none;
    }

    /* Page Stacking */
    .page {
      position: absolute;
      top: 0;
      right: 0;
      width: 50%;
      height: 100%;
      transform-origin: left;
      transform-style: preserve-3d;
      transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1);
      cursor: pointer;
      user-select: none;
    }

    .page-side {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      background-color: var(--paper-color);
      padding: 50px;
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.05);
    }

    .page-front {
      z-index: 2;
      border-radius: 0 4px 4px 0;
      /* Curved page effect */
      background: linear-gradient(to right, #eee 0%, #fff 5%, #fff 100%);
    }

    .page-back {
      transform: rotateY(-180deg);
      border-radius: 4px 0 0 4px;
      /* Curved page effect back */
      background: linear-gradient(to left, #eee 0%, #fff 5%, #fff 100%);
    }

    /* Cover Specifics */
    .page.cover {
      z-index: 101 !important;
      /* Always on top when closed */
    }

    .page-front.cover-side {
      background: var(--cover-color);
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      border-left: 5px solid rgba(0, 0, 0, 0.3);
    }

    .cover-side h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      text-transform: uppercase;
      letter-spacing: 0.2rem;
      border-top: 2px solid rgba(255, 255, 255, 0.2);
      border-bottom: 2px solid rgba(255, 255, 255, 0.2);
      padding: 20px 0;
      margin-bottom: 20px;
      text-align: center;
    }

    .cover-side p {
      font-size: 0.9rem;
      letter-spacing: 2px;
      opacity: 0.6;
    }

    /* Content inside pages */
    header {
      font-family: 'Playfair Display', serif;
      font-size: 0.6rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 30px;
      color: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: space-between;
    }

    .poem-container {
      flex-grow: 1;
    }

    .chapter-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.5em;
      padding-bottom: 0.5em;
      background: url(data:image/svg+xml;base64,PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4NCjxzdmcgdmVyc2lvbj0iMS4xIiBpZD0iTGF5ZXJfMSIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIiB4bWxuczp4bGluaz0iaHR0cDovL3d3dy53My5vcmcvMTk5OS94bGluayIgeD0iMHB4IiB5PSIwcHgiDQoJIHZpZXdCb3g9IjAgMCA2NCA2NCIgc3R5bGU9ImVuYWJsZS1iYWNrZ3JvdW5kOm5ldyAwIDAgNjQgNjQ7IiB4bWw6c3BhY2U9InByZXNlcnZlIj4NCiAgICA8Zz4NCiAgICAJPHBhdGggZD0iTTAsMzJMMzIsMGwzMiwzMkwzMiw2NEwwLDMyeiBNOCwzMmwyNCwyNGwyNC0yNEwzMiw4TDgsMzJ6IE0xNiwzMmwxNi0xNmwxNiwxNkwzMiw0OEwxNiwzMnogTTI0LDMybDgsOGw4LThsLTgtOEwyNCwzMnoiIC8+DQogICAgPC9nPg0KPC9zdmc+) bottom center no-repeat;
      background-size: 0.5em 0.5em;
    }

    .poem-text {
      font-family: 'Crimson Pro', serif;
      font-size: 1.1rem;
      line-height: 1.5;
      color: var(--ink-color);
      white-space: pre-wrap;
      font-style: italic;
    }

    footer {
      margin-top: 20px;
      font-family: 'Playfair Display', serif;
      font-size: 0.8rem;
      font-weight: 700;
      color: #000;
      border-top: 1px solid rgba(0, 0, 0, 0.1);
      padding-top: 10px;
    }

    .page-num-left {
      text-align: left;
    }

    .page-num-right {
      text-align: right;
    }

    /* Animation Classes */
    .flipped {
      transform: rotateY(-180deg);
    }

    /* UI Controls */
    #ui-layer {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    #ui-layer.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .nav-btn {
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 12px 24px;
      font-family: 'Bricolage Grotesque', sans-serif;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .nav-btn:hover {
      background: #fff;
      color: #000;
    }

    /* Abstract Details */
    #vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, transparent 40%, rgba(0, 0, 0, 0.6) 100%);
      pointer-events: none;
      z-index: 150;
    }

    .grain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44NSIgbnVtT2N0YXZlcz0iMyIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIvPjwvc3ZnPg==');
      opacity: 0.05;
      z-index: 160;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="grain"></div>
  <div id="vignette"></div>

  <div id="book-wrapper">
    <div class="book" id="book-element">
      <!-- Physical Pages will be injected here -->
    </div>
  </div>

  <div id="ui-layer">
    <button class="nav-btn" onclick="prevPage()">PREV_PAGE</button>
    <button class="nav-btn" onclick="randomPage()">EXPLORE</button>
    <button class="nav-btn" onclick="nextPage()">NEXT_PAGE</button>
  </div>

  <script>
    const poems = [
      `I wandered lonely as a cloud
That floats on high o'er vales and hills,
When all at once I saw a crowd,
A host, of golden daffodils;
Beside the lake, beneath the trees,
Fluttering and dancing in the breeze.`,
      `Nature’s first green is gold,
Her hardest hue to hold.
Her early leaf’s a flower;
But only so an hour.
Then leaf subsides to leaf.
So Eden sank to grief,
So dawn goes down to day.
Nothing gold can stay.`,
      `The Red Wheelbarrow

so much depends
upon

a red wheel
barrow

glazed with rain
water

beside the white
chickens`,
      `I met a traveller from an antique land,
Who said—“Two vast and trunkless legs of stone
Stand in the desert. . . Near them, on the sand,
Half sunk a shattered visage lies, whose frown,
And wrinkled lip, and sneer of cold command,
Tell that its sculptor well those passions read
Which yet survive, stamped on these lifeless things,
The hand that mocked them, and the heart that fed.”`,
      `Some say the world will end in fire,
Some say in ice.
From what I've tasted of desire
I hold with those who favor fire.
But if it had to perish twice,
I think I know enough of hate
To say that for destruction ice
Is also great
And would suffice.`,
      `The fog comes
on little cat feet.

It sits looking
over harbor and city
on silent haunches
and then moves on.`,
      `Tyger! Tyger! burning bright
In the forests of the night,
What immortal hand or eye
Could frame thy fearful symmetry?

In what distant deeps or skies
Burnt the fire of thine eyes?
On what wings dare he aspire?
What the hand dare seize the fire?`,
      `Whose woods these are I think I know.
His house is in the village though;
He will not see me stopping here
To watch his woods fill up with snow.

My little horse must think it queer
To stop without a farmhouse near
Between the woods and frozen lake
The darkest evening of the year.`,
      `Hold fast to dreams
For if dreams die
Life is a broken-winged bird
That cannot fly.

Hold fast to dreams
For when dreams go
Life is a barren field
Frozen with snow.`,
      `I have eaten
the plums
that were in
the icebox

and which
you were probably
saving
for breakfast

Forgive me
they were delicious
so sweet
and so cold`
    ];

    // DEV: Add some random poems
    // while (poems.length < 80) {
    //   poems.push(`Fragment No. ${poems.length + 1}\n\n[ Transcription Error ]\n[ The memory is corrupted ]\n[ Return at a later sequence ]`);
    // }

    const bookEl = document.getElementById('book-element');
    const uiLayer = document.getElementById('ui-layer');
    const pageElements = [];
    let currentPageIndex = -1; // -1 = closed

    function createPage(contentFront, contentBack, index) {
      const page = document.createElement('div');
      page.className = 'page';
      if (index === 0) page.classList.add('cover');

      page.style.zIndex = 100 - index;

      // Front Side
      const front = document.createElement('div');
      front.className = 'page-side page-front';
      if (index === 0) front.classList.add('cover-side');
      front.innerHTML = contentFront;

      // Back Side
      const back = document.createElement('div');
      back.className = 'page-side page-back';
      back.innerHTML = contentBack;

      page.appendChild(front);
      page.appendChild(back);
      bookEl.appendChild(page);
      pageElements.push(page);

      page.onclick = (e) => {
        e.stopPropagation();
        if (currentPageIndex === index - 1 || (index === 0 && currentPageIndex === -1)) {
          nextPage();
        } else if (currentPageIndex === index) {
          // Click the back of a page to go back?
          // prevPage();
        }
      };
    }

    // 1. Create Cover
    createPage(
      `<h1>Verses</h1><p>THE LABYRINTH ARCADE</p>`,
      `<footer><div class="page-num-left">01</div></footer>`,
      0
    );

    // 2. Create Content Pages (40 physical sheets for 80 poems)
    for (let i = 0; i < poems.length / 2; i++) {
      const poemA = poems[i * 2];
      const poemB = poems[i * 2 + 1];

      createPage(
        `<header><span>BOOK_OF_VERSES</span><span>TRANSCRIPTION_v1</span></header>
                 <div class="poem-container"><h2 class="chapter-title">Selection ${i * 2 + 1}</h2><div class="poem-text">${poemA}</div></div>
                 <footer><div class="page-num-right">${i * 2 + 1}</div></footer>`,
        `<header><span>BOOK_OF_VERSES</span><span>TRANSCRIPTION_v1</span></header>
                 <div class="poem-container"><h2 class="chapter-title">Selection ${i * 2 + 2}</h2><div class="poem-text">${poemB}</div></div>
                 <footer><div class="page-num-left">${i * 2 + 2}</div></footer>`,
        i + 1
      );
    }

    function nextPage() {
      if (currentPageIndex < pageElements.length - 1) {
        currentPageIndex++;
        pageElements[currentPageIndex].classList.add('flipped');
        if (currentPageIndex === 0) {
          uiLayer.classList.add('visible');
        }
      } else {
        // Last page flip = close book?
        closeBook();
      }
    }

    function prevPage() {
      if (currentPageIndex >= 0) {
        pageElements[currentPageIndex].classList.remove('flipped');
        currentPageIndex--;
        if (currentPageIndex === -1) {
          uiLayer.classList.remove('visible');
        }
      }
    }

    function closeBook() {
      // Cascade closing
      let i = pageElements.length - 1;
      const interval = setInterval(() => {
        if (i >= 0) {
          pageElements[i].classList.remove('flipped');
          i--;
        } else {
          clearInterval(interval);
          currentPageIndex = -1;
          uiLayer.classList.remove('visible');
        }
      }, 30);
    }

    function randomPage() {
      const target = Math.floor(Math.random() * (pageElements.length - 1));
      if (currentPageIndex < target) {
        const step = () => {
          if (currentPageIndex < target) {
            nextPage();
            setTimeout(step, 100);
          }
        };
        step();
      } else {
        const step = () => {
          if (currentPageIndex > target) {
            prevPage();
            setTimeout(step, 100);
          }
        };
        step();
      }
    }
  </script>
</body>

</html>
