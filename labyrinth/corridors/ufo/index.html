<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="A corridor of unidentified flying objects in the labyrinth. Arty 90s web design exploration.">
  <title>UFO CORRIDOR // THE TRUTH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=VT323&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --neon-green: #00ff41;
      --electric-blue: #00d4ff;
      --signal-red: #ff3e3e;
      --ufo-glow: rgba(0, 255, 65, 0.3);
      --bg-dark: #020202;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--neon-green);
      font-family: 'Space Grotesk', sans-serif;
      overflow: hidden;
      cursor: crosshair;
    }

    #bg-canvas {
      position: fixed;
      top: -10%;
      left: -10%;
      width: 120%;
      height: 120%;
      background-image: url('background.jpg');
      background-size: cover;
      background-position: center;
      opacity: 0.3;
      filter: contrast(180%) brightness(80%) hue-rotate(90deg);
      z-index: -2;
      animation: slowPan 120s linear infinite alternate;
    }

    @keyframes slowPan {
      from {
        transform: translate(0, 0) scale(1);
      }

      to {
        transform: translate(-5%, -5%) scale(1.1);
      }
    }

    #noise {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.1;
      pointer-events: none;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC42NSIgbnVtT2N0YXZlcz0iMyIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIvPjwvc3ZnPg==');
    }

    .corridor-info {
      position: fixed;
      top: 30px;
      left: 30px;
      z-index: 100;
      font-family: 'VT323', monospace;
      font-size: 1.4rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      background: rgba(0, 0, 0, 0.9);
      padding: 15px;
      border: 1px solid var(--neon-green);
      box-shadow: 5px 5px 0px var(--neon-green);
      pointer-events: none;
    }

    .ufo {
      position: absolute;
      width: 150px;
      cursor: pointer;
      transition: filter 0.3s ease;
      filter: drop-shadow(0 0 5px var(--ufo-glow)) brightness(0.8);
      user-select: none;
      mix-blend-mode: screen;
    }

    .ufo:hover {
      filter: drop-shadow(0 0 25px var(--neon-green)) brightness(1.2);
      z-index: 50;
    }

    .ufo-label {
      position: absolute;
      bottom: -30px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'VT323', monospace;
      font-size: 1rem;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease, bottom 0.3s ease;
      color: var(--electric-blue);
      background: black;
      padding: 2px 8px;
    }

    .ufo:hover .ufo-label {
      opacity: 1;
      bottom: -20px;
    }

    #radar {
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.1) 0%, transparent 70%);
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 1;
      border: 1px solid rgba(0, 212, 255, 0.1);
      display: none;
    }

    .text-link {
      position: absolute;
      font-family: 'VT323', monospace;
      text-decoration: none;
      color: var(--neon-green);
      font-size: 1.2rem;
      padding: 5px;
      border: 1px solid transparent;
      transition: all 0.2s;
      z-index: 2;
      opacity: 0.6;
    }

    .text-link:hover {
      background: var(--neon-green);
      color: black;
      opacity: 1;
      box-shadow: 0 0 20px var(--neon-green);
      transform: skewX(-10deg);
    }

    #glitch-flash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--neon-green);
      opacity: 0;
      pointer-events: none;
      z-index: 1000;
    }

    .scanning-line {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 1px;
      background: rgba(0, 255, 65, 0.8);
      box-shadow: 0 0 20px var(--neon-green);
      z-index: 200;
      pointer-events: none;
      animation: scan 8s linear infinite;
    }

    @keyframes scan {
      from {
        top: -10%;
      }

      to {
        top: 110%;
      }
    }

    .abduction-beam {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, 0);
      width: 200px;
      height: 2000px;
      background: linear-gradient(to bottom, rgba(0, 255, 65, 0.3), transparent);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s;
      clip-path: polygon(30% 0%, 70% 0%, 100% 100%, 0% 100%);
    }

    .ufo:hover .abduction-beam {
      opacity: 1;
    }

    .data-stream {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 200px;
      height: 300px;
      overflow: hidden;
      font-family: 'VT323', monospace;
      font-size: 0.8rem;
      color: var(--neon-green);
      opacity: 0.5;
      pointer-events: none;
      text-align: right;
    }

    .ping {
      position: absolute;
      border: 2px solid var(--electric-blue);
      border-radius: 50%;
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: ping-expand 1.5s ease-out forwards;
    }

    @keyframes ping-expand {
      0% {
        width: 0;
        height: 0;
        opacity: 1;
        border-width: 4px;
      }

      100% {
        width: 200px;
        height: 200px;
        opacity: 0;
        border-width: 1px;
      }
    }

    #nav {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      gap: 20px;
    }

    .nav-item {
      color: var(--neon-green);
      text-decoration: none;
      font-family: 'VT323', monospace;
      font-size: 1.5rem;
      border: 1px solid var(--neon-green);
      padding: 5px 15px;
      background: rgba(0, 0, 0, 0.8);
      transition: all 0.3s;
    }

    .nav-item:hover {
      background: var(--neon-green);
      color: black;
      box-shadow: 0 0 30px var(--neon-green);
    }

    .blink {
      animation: blink-anim 1s infinite steps(1);
    }

    @keyframes blink-anim {
      50% {
        opacity: 0;
      }
    }
  </style>
</head>

<body>
  <div id="bg-canvas"></div>
  <div id="noise"></div>
  <div id="radar"></div>
  <div class="scanning-line"></div>
  <div id="glitch-flash"></div>

  <div class="corridor-info">
    CORRIDOR: UFO_09<br>
    COORD: 88.22.11<br>
    <span class="blink">[ BROADCASTING ]</span>
  </div>

  <div class="data-stream" id="data-stream"></div>

  <div id="ufo-container"></div>

  <a href="../../todo.html" class="text-link" style="top: 20%; left: 15%;">ACCESS_DENIED</a>
  <a href="../../todo.html" class="text-link" style="top: 75%; left: 80%;">MEMORY_HOLE</a>
  <a href="../../todo.html" class="text-link" style="top: 10%; left: 70%;">VOID_CORE</a>
  <a href="../../todo.html" class="text-link" style="top: 85%; left: 25%;">BLACK_BOX</a>
  <a href="../../todo.html" class="text-link" style="top: 50%; left: 50%;">REDACTED</a>

  <nav id="nav">
    <a href="../../todo.html" class="nav-item">DESCEND</a>
    <a href="../../todo.html" class="nav-item">EVACUATE</a>
  </nav>

  <script>
    const container = document.getElementById('ufo-container');
    const radar = document.getElementById('radar');
    const flash = document.getElementById('glitch-flash');
    const stream = document.getElementById('data-stream');

    const images = ['1.jpg', '2.jpg', '3.jpg', '4.jpg', '5.jpg', '6.jpg'];
    const linkLabels = [
      'PROXIMITY_ALERT', 'KINETIC_LINK', 'ION_WAKE',
      'THETA_WAVE', 'STATIC_PULSE', 'ZERO_POINT',
      'SUB_SPACE', 'ORBITAL_DECAY', 'DARK_MATTER'
    ];

    function addData(msg) {
      const line = document.createElement('div');
      line.innerText = `> ${msg} [${Math.random().toString(16).substr(2, 4)}]`;
      stream.prepend(line);
      if (stream.children.length > 20) stream.lastChild.remove();
    }

    function createUFO() {
      const wrap = document.createElement('div');
      wrap.className = 'ufo';

      const size = 50 + Math.random() * 150;
      wrap.style.width = `${size}px`;

      const img = document.createElement('img');
      img.src = images[Math.floor(Math.random() * images.length)];
      img.style.width = '100%';
      wrap.appendChild(img);

      const beam = document.createElement('div');
      beam.className = 'abduction-beam';
      wrap.appendChild(beam);

      const label = document.createElement('div');
      label.className = 'ufo-label';
      label.innerText = linkLabels[Math.floor(Math.random() * linkLabels.length)];
      wrap.appendChild(label);

      let x = Math.random() * (window.innerWidth - size);
      let y = Math.random() * (window.innerHeight - size);

      wrap.style.left = `${x}px`;
      wrap.style.top = `${y}px`;

      let vx = (Math.random() - 0.5) * 1.5;
      let vy = (Math.random() - 0.5) * 1.5;
      let angle = 0;
      let da = (Math.random() - 0.5) * 0.02;

      function animate() {
        x += vx;
        y += vy;
        angle += da;

        if (x <= 0 || x >= window.innerWidth - size) vx *= -1;
        if (y <= 0 || y >= window.innerHeight - size) vy *= -1;

        wrap.style.left = `${x}px`;
        wrap.style.top = `${y}px`;
        wrap.style.transform = `rotate(${Math.sin(angle) * 10}deg)`;

        requestAnimationFrame(animate);
      }

      wrap.addEventListener('mouseenter', () => {
        addData(`TRACKING: ${label.innerText}`);
        vx *= 0.2; vy *= 0.2;
      });

      wrap.addEventListener('mouseleave', () => {
        vx = (Math.random() - 0.5) * 2;
        vy = (Math.random() - 0.5) * 2;
      });

      wrap.addEventListener('click', (e) => {
        e.stopPropagation();
        flash.style.opacity = '0.8';
        addData(`CRITICAL_ERROR: ABDUCTION_SEQUENCE_START`);
        setTimeout(() => { flash.style.opacity = '0'; }, 100);
        setTimeout(() => { window.location.href = '../../todo.html'; }, 300);
      });

      container.appendChild(wrap);
      animate();
    }

    for (let i = 0; i < 12; i++) {
      setTimeout(createUFO, i * 200);
    }

    document.addEventListener('mousemove', (e) => {
      radar.style.display = 'block';
      radar.style.left = `${e.clientX}px`;
      radar.style.top = `${e.clientY}px`;
    });

    document.addEventListener('mousedown', (e) => {
      const ping = document.createElement('div');
      ping.className = 'ping';
      ping.style.left = `${e.clientX}px`;
      ping.style.top = `${e.clientY}px`;
      document.body.appendChild(ping);
      setTimeout(() => ping.remove(), 2000);
      addData(`PING_SENT: ${e.clientX},${e.clientY}`);
    });

    setInterval(() => {
      addData(['SCANNING...', 'SIGNAL_NOISE', 'DECRYPTING...', 'BEACON_IDLE'][Math.floor(Math.random() * 4)]);
    }, 3000);

  </script>
</body>

</html>
