<!DOCTYPE html>
<html lang="en">

<!--
https://en.wikipedia.org/wiki/Rose_(mathematics)
In mathematics, a rose or rhodonea curve is a sinusoid specified by either the cosine or sine functions with no phase angle that is plotted in polar coordinates. Rose curves or "rhodonea" were named by the Italian mathematician who studied them, Guido Grandi, between the years 1723 and 1728.
-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>r = cos((row/col) * θ)</title>
  <meta name="description" content="Rose Curves">
  <style>
    :root {
      --bg-color: #000000;
      --card-bg: rgba(102, 51, 153, 0.15);
      --border-color: rgba(102, 51, 153, 0.3);
      --text-primary: #E0B0FF;
      --text-secondary: #663399;
      --accent-color: #E0B0FF;
      --accent-glow: rgba(224, 176, 255, 0.4);
      --font-family: monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .fixed-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 1000;
      backdrop-filter: blur(10px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .fixed-toggle:hover {
      background: var(--accent-color);
      border-color: var(--accent-color);
      box-shadow: 0 0 20px var(--accent-glow);
      transform: scale(1.05);
    }

    .fixed-toggle svg {
      width: 24px;
      height: 24px;
      fill: var(--accent-color);
      transition: fill 0.3s ease;
    }

    .fixed-toggle:hover svg {
      fill: var(--bg-color);
    }

    .matrix-container {
      display: grid;
      grid-template-columns: 50px repeat(10, 1fr);
      gap: 12px;
      padding: 20px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      border: 1px solid var(--border-color);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    .header-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--accent-color);
      font-size: 0.9rem;
    }

    .corner {
      opacity: 0.3;
    }

    .plot-card {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      aspect-ratio: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      cursor: pointer;
    }

    .plot-card:hover {
      transform: scale(1.1);
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent-color);
      box-shadow: 0 0 20px var(--accent-glow);
      z-index: 10;
    }

    .plot-card canvas {
      width: 90%;
      height: 90%;
    }

    .tooltip {
      position: absolute;
      bottom: 5px;
      font-size: 0.6rem;
      color: var(--text-secondary);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .plot-card:hover .tooltip {
      opacity: 1;
    }

    /* Interactive Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(15px);
      z-index: 2000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .overlay.active {
      display: flex;
      opacity: 1;
    }

    .overlay-canvas-container {
      position: relative;
      width: min(80vh, 80vw);
      height: min(80vh, 80vw);
      background: rgba(102, 51, 153, 0.05);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .overlay-canvas {
      width: 90%;
      height: 90%;
    }

    .overlay-controls {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      color: var(--text-primary);
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .overlay-button {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-family: var(--font-family);
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .overlay-button:hover {
      background: var(--accent-color);
      color: #000;
    }

    input[type="range"] {
      cursor: pointer;
      accent-color: var(--accent-color);
      width: 150px;
    }
  </style>
</head>

<body>
  <button id="toggle-order" class="fixed-toggle" title="Toggle Equation Order">
    <!-- https://www.onlinewebfonts.com/icon/176203 -->
    <svg viewBox="0 0 256 256">
      <path
        d="M236,167.3c-5.5,0-10-4.5-10-10l0.3-58.8c0-11.1-8.7-19.7-19.7-19.7H59.2l34.5,31.3l-14.1,14.2L19.8,69l52.1-56.1l13.9,13.9L56,59.2h150.7c22,0,39.3,15.9,39.3,38v60.1C246,162.8,241.5,167.3,236,167.3z M29.7,108.3V128v39.3c0,10.9,8.8,19.7,19.7,19.7h153.2l-32.4-32.4l13.9-13.9l49.2,49.2l-49.2,53.2l-13.9-13.9l22.9-22.5H49.3C27.6,206.7,10,189,10,167.3V128v-9.8v-9.8c0-5.4,4.4-9.8,9.8-9.8C25.3,98.5,29.7,102.9,29.7,108.3z" />
    </svg>
  </button>

  <div id="matrix" class="matrix-container">
    <!-- Grid will be populated by JavaScript -->
  </div>

  <div id="overlay" class="overlay">
    <button id="close-overlay" class="fixed-toggle" title="Close Overlay"
      style="position: absolute;">
      <!-- https://www.onlinewebfonts.com/icon/571489 -->
      <svg viewBox="0 0 256 256">
        <path
          d="M16,11c-4.1,1.8-6.4,6.4-5.5,11.2c0.4,2.1,6.2,8.2,52,54l51.7,51.7l-51.7,51.7c-56,56.1-53.2,52.9-52.1,58.6c0.6,2.9,4.5,6.8,7.4,7.4c5.6,1,2.5,3.9,58.6-52.1l51.7-51.7l51.7,51.7c56,56,52.8,53.2,58.5,52.1c2.9-0.6,6.8-4.5,7.4-7.4c1-5.6,3.9-2.5-52.1-58.6L141.8,128l51.7-51.7c56-56,53.2-52.8,52.1-58.5c-0.6-2.9-4.5-6.8-7.4-7.4c-5.6-1-2.5-3.9-58.6,52.1L128,114.2L76.6,62.8C47.8,34,24.4,11.1,23.5,10.8C21.1,9.9,18.3,10,16,11z" />
      </svg>
    </button>
    <div id="overlay-formula"
      style="font-size: 1.2rem; margin-bottom: 30px; color: var(--accent-color);"></div>
    <div class="overlay-canvas-container" id="overlay-inner">
      <canvas id="anim-canvas" class="overlay-canvas"></canvas>
    </div>
    <div class="overlay-controls">
      <div class="control-row">
        <button id="restart-anim" class="overlay-button">Restart</button>
        <div class="control-row">
          <span>Speed</span>
          <input type="range" id="speed-control" min="0" max="100" value="10">
        </div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const matrix = document.getElementById('matrix');
      const toggleBtn = document.getElementById('toggle-order');
      const cols = 10;
      const rows = 10;
      const cellPixels = 140;
      let isRowColOrder = true;

      function renderMatrix() {
        matrix.innerHTML = '';

        // Update display text
        if (isRowColOrder) {
          document.title = 'r = cos((row/col) * θ)';
        } else {
          document.title = 'r = cos((col/row) * θ)';
        }

        // Create corner cell
        const corner = document.createElement('div');
        corner.className = 'header-cell corner';
        matrix.appendChild(corner);

        // Create column headers
        for (let c = 1; c <= cols; c++) {
          const header = document.createElement('div');
          header.className = 'header-cell';
          header.textContent = c;
          matrix.appendChild(header);
        }

        // Create rows
        for (let r = 1; r <= rows; r++) {
          const rowHeader = document.createElement('div');
          rowHeader.className = 'header-cell';
          rowHeader.textContent = r;
          matrix.appendChild(rowHeader);

          for (let c = 1; c <= cols; c++) {
            const container = document.createElement('div');
            container.className = 'plot-card';

            const canvas = document.createElement('canvas');
            canvas.width = cellPixels;
            canvas.height = cellPixels;
            container.appendChild(canvas);

            const tooltip = document.createElement('div');
            tooltip.className = 'tooltip';
            tooltip.textContent = `r=${r}, c=${c}`;
            container.appendChild(tooltip);

            matrix.appendChild(container);

            const k = isRowColOrder ? (r / c) : (c / r);
            drawRoseCurve(canvas, k);

            container.addEventListener('click', () => {
              openOverlay(r, c, k);
            });
          }
        }
      }

      // Overlay logic
      const overlay = document.getElementById('overlay');
      const closeBtn = document.getElementById('close-overlay');
      const animCanvas = document.getElementById('anim-canvas');
      const restartBtn = document.getElementById('restart-anim');
      const speedControl = document.getElementById('speed-control');
      const formulaDisplay = document.getElementById('overlay-formula');
      let animationId = null;
      let currentK = 1;
      let currentTheta = 0;

      function openOverlay(r, c, k) {
        currentK = k;
        formulaDisplay.textContent = `r = cos((${k.toFixed(2)}) * θ)`;
        overlay.classList.add('active');
        restartAnimation();
      }

      function closeOverlay() {
        overlay.classList.remove('active');
        cancelAnimationFrame(animationId);
      }

      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closeOverlay();
      });

      closeBtn.addEventListener('click', closeOverlay);

      function restartAnimation() {
        cancelAnimationFrame(animationId);
        currentTheta = 0;

        // Match high resolution
        const dpr = window.devicePixelRatio || 1;
        const size = animCanvas.clientWidth * dpr;
        animCanvas.width = size;
        animCanvas.height = size;

        animate();
      }

      function animate() {
        const ctx = animCanvas.getContext('2d');
        const width = animCanvas.width;
        const height = animCanvas.height;
        const centerX = width / 2;
        const centerY = height / 2;
        const radius = width * 0.42;

        const speed = parseInt(speedControl.value);
        const segmentsPerFrame = speed / 10;
        const stepSize = 0.05;

        // Visual setup for each frame
        ctx.strokeStyle = '#E0B0FF';
        ctx.lineWidth = 2 * (width / 400); // Scale line width
        ctx.lineJoin = 'round';
        ctx.shadowBlur = 4;
        ctx.shadowColor = 'rgba(224, 176, 255, 0.6)';

        const maxTheta = 24 * Math.PI;

        for (let s = 0; s < segmentsPerFrame; s++) {
          if (currentTheta > maxTheta) break;

          ctx.beginPath();

          const r1 = Math.cos(currentK * currentTheta) * radius;
          const x1 = centerX + r1 * Math.cos(currentTheta);
          const y1 = centerY + r1 * Math.sin(currentTheta);

          currentTheta += stepSize;

          const r2 = Math.cos(currentK * currentTheta) * radius;
          const x2 = centerX + r2 * Math.cos(currentTheta);
          const y2 = centerY + r2 * Math.sin(currentTheta);

          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }

        if (currentTheta < maxTheta) {
          animationId = requestAnimationFrame(animate);
        }
      }

      restartBtn.addEventListener('click', restartAnimation);

      toggleBtn.addEventListener('click', () => {
        isRowColOrder = !isRowColOrder;
        renderMatrix();
      });

      renderMatrix();
    });

    function drawRoseCurve(canvas, k) {
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      const centerX = width / 2;
      const centerY = height / 2;
      const radius = width * 0.42;

      ctx.clearRect(0, 0, width, height);

      ctx.beginPath();
      ctx.strokeStyle = '#E0B0FF';
      ctx.lineWidth = 1.2;
      ctx.lineJoin = 'round';

      ctx.shadowBlur = 4;
      ctx.shadowColor = 'rgba(224, 176, 255, 0.6)';

      const maxTheta = 24 * Math.PI;
      const steps = 1200;

      for (let i = 0; i <= steps; i++) {
        const theta = (i / steps) * maxTheta;
        const r_val = Math.cos(k * theta) * radius;

        const x = centerX + r_val * Math.cos(theta);
        const y = centerY + r_val * Math.sin(theta);

        if (i === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }

      ctx.stroke();

      ctx.shadowBlur = 0;
      ctx.beginPath();
      ctx.arc(centerX, centerY, 0.8, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(224, 176, 255, 0.2)';
      ctx.fill();
    }
  </script>
</body>

</html>
