<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DOT MATRIX WITHOUT STEREO SOUND">
  <title>1-Bit Dots</title>
  <style>
    :root {
      --bg-color: #222222;
      --dot-white: #ffffff;
      --dot-black: #222222;
      --highlight-bg: #222222;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: var(--bg-color);
      color: var(--dot-white);
    }

    #main {
      display: grid;
      padding: 20px;
    }

    .dot-group {
      display: grid;
      grid-template-columns: repeat(var(--group-size, 3), 1fr);
      grid-template-rows: repeat(var(--group-size, 3), 1fr);
      padding: 2px;
      border: 1px solid transparent;
      text-decoration: none;
    }

    .dot-group:hover {
      background-color: var(--highlight-bg);
      border: 1px solid #444444;
      z-index: 5;
    }

    /* Invert dots on hover */
    .dot-group:hover .dot.white {
      background-color: #000000;
      box-shadow: 0 0 2px #ffffff;
    }

    .dot-group:hover .dot.black {
      background-color: #555555;
    }

    .dot {
      border-radius: 50%;
    }

    .dot.white {
      background-color: var(--dot-white);
    }

    .dot.black {
      background-color: var(--dot-black);
    }

    #crt-scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>

<body>
  <div id="crt-scanlines"></div>
  <main id="main"></main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('1-bit-dots');

    const main = document.getElementById('main');

    // 100% at col 0, decreasing by percentage per column
    const dotPercentageLoss = 1.68;

    let currentLayout = null;

    // Responsive layouts, smallest first
    function getLayout() {
      const w = window.innerWidth;
      if (w >= 1024) {
        return { key: 'lg', groupRoot: 10, groupCols: 6, groupRows: 3, dotSize: 8, dotSpacing: 9 };
      }
      if (w >= 640) {
        return { key: 'md', groupRoot: 5, groupCols: 10, groupRows: 5, dotSize: 7, dotSpacing: 5 };
      }
      return { key: 'sm', groupRoot: 5, groupCols: 6, groupRows: 3, dotSize: 6, dotSpacing: 5 };
    }

    // Scale the left-to-right fade so it still ends near-black on fewer columns
    function getDotPercentageLoss(layout) {
      const dotColumns = layout.groupCols * layout.groupRoot;
      return (dotPercentageLoss * 60) / dotColumns;
    }

    function init() {
      main.replaceChildren();

      currentLayout = getLayout();
      const { groupRoot, groupCols, groupRows, dotSize, dotSpacing } = currentLayout;
      const loss = getDotPercentageLoss(currentLayout);

      // Set CSS variable for dynamic grid layout
      document.documentElement.style.setProperty('--group-size', groupRoot);

      // Grid setup
      main.style.gridTemplateColumns = `repeat(${groupCols}, auto)`;
      main.style.gridTemplateRows = `repeat(${groupRows}, auto)`;

      for (let gr = 0; gr < groupRows; gr++) {
        for (let gc = 0; gc < groupCols; gc++) {
          const group = document.createElement('a');
          group.href = LAB.pageRandomiser.nextOne();
          group.className = 'dot-group';
          group.style.gap = `${dotSpacing}px`;

          for (let r = 0; r < groupRoot; r++) {
            for (let c = 0; c < groupRoot; c++) {
              const actualCol = gc * groupRoot + c;

              const dot = document.createElement('div');
              dot.className = 'dot';
              dot.style.width = `${dotSize}px`;
              dot.style.height = `${dotSize}px`;

              const whiteChance = Math.max(0, 100 - (actualCol * loss));
              const isWhite = (Math.random() * 100) < whiteChance;

              dot.classList.add(isWhite ? 'white' : 'black');
              group.appendChild(dot);
            }
          }
          main.appendChild(group);
        }
      }
    }

    window.addEventListener('resize', () => {
      if (getLayout().key !== currentLayout.key) init();
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a')) init();
    });

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, init);
    });

    init();

  </script>
</body>

</html>
