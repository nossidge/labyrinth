<!DOCTYPE html>
<html lang="en">

<!--
A digital altar to the dead web.
Processions of pilgrims queue to pay respects to defunct websites.
Examples include GeoCities, MySpace, Napster and Yahoo! Answers.
They leave offerings of floppy disks and CD-ROMs before a giant monitor shrine.
Each stick-figure pilgrim has the name of a tilde.town user.
You too can pay your respects to the web that was.
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="for those who served">
  <title>404 Shrine</title>
  <style>
    :root {
      --bg-colour: #000000;
      --primary-colour: #e0b0ff;
      --secondary-colour: #663399;
      --flame-primary-colour: #ffeab0;
      --flame-secondary-colour: #995033;
      --text-shadow: 0 0 5px var(--secondary-colour);
    }

    body {
      display: flex;
      min-height: 100vh;
      margin: 0;
      background-color: var(--bg-colour);
      color: var(--primary-colour);
      font-family: "Courier New", Courier, monospace;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    a {
      text-decoration: none;
    }

    main {
      position: relative;
      display: flex;
      width: 100%;
      height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .shrine-area {
      position: absolute;
      display: flex;
      width: 600px;
      height: 400px;
      bottom: calc(20% + 50px);
      left: 50%;
      align-items: flex-end;
      justify-content: center;
      transform: translateX(-50%);
      perspective: 800px;
      z-index: 10;
    }

    .shrine-frame {
      position: absolute;
      display: flex;
      width: 100%;
      height: 100%;
      padding-bottom: 20px;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
    }

    .shrine-monitor {
      filter: drop-shadow(0 0 15px var(--secondary-colour));
      font-size: 250px;
      z-index: 10;
      animation: floatMonitor 6s ease-in-out infinite;
      transition: font-size 0.3s linear, filter 0.3s linear;
    }

    .shrine-monitor:hover {
      filter: drop-shadow(0 0 15px var(--primary-colour));
      font-size: 260px;
    }

    @keyframes floatMonitor {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .candle-container-back {
      display: flex;
      position: absolute;
      width: 100%;
      height: 100%;
      bottom: 0;
      justify-content: center;
      align-items: flex-end;
      z-index: 5;
    }

    .candle-container-front {
      display: flex;
      position: absolute;
      width: 120%;
      height: 30%;
      bottom: -20px;
      justify-content: center;
      align-items: flex-end;
      z-index: 12;
    }

    .candle {
      position: absolute;
      width: 20px;
      height: 60px;
      background: linear-gradient(to right, #f0f0f0, #ffffff, #e0e0e0);
      border-radius: 2px;
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.2);
      bottom: 0px;
    }

    .flame {
      position: absolute;
      width: 14px;
      height: 30px;
      background-color: var(--flame-primary-colour);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      box-shadow:
        0 0 10px var(--flame-primary-colour),
        0 0 20px var(--flame-primary-colour),
        0 0 30px var(--flame-secondary-colour);
      top: -25px;
      left: 3px;
      opacity: 0.9;
      animation: flicker 1.5s ease-in-out infinite;
    }

    @keyframes flicker {

      0%,
      100% {
        opacity: 0.9;
        transform: scaleY(1) rotate(-2deg);
      }

      50% {
        opacity: 1;
        transform: scaleY(1.1) rotate(2deg) skewX(5deg);
      }
    }

    .ground-layer {
      position: absolute;
      width: 800px;
      height: 100px;
      bottom: 20%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      pointer-events: none;
    }

    .offering {
      position: absolute;
      filter: drop-shadow(0 0 2px var(--secondary-colour));
      font-size: 30px;
      bottom: 0;
      animation: land 0.5s ease-out;
      pointer-events: auto;
      cursor: pointer;
      transition: transform .15s;
    }

    .offering:hover {
      filter: drop-shadow(0 0 6px var(--primary-colour));
      transform: scale(1.2);
    }

    @keyframes land {
      0% {
        opacity: 0;
        transform: translateY(-50px) rotate(0deg);
      }

      100% {
        opacity: 1;
        transform: translateY(0px) rotate(360deg);
      }
    }

    .pilgrim {
      position: absolute;
      color: var(--primary-colour);
      text-shadow: var(--text-shadow);
      font-size: 34px;
      font-weight: bold;
      bottom: 20%;
      white-space: pre;
      transform-origin: bottom center;
      transition: left 0.1s linear, transform 0.1s linear;
      z-index: 20;
    }

    .pilgrim-name {
      position: absolute;
      font-size: 32px;
      top: -90px;
      left: 50%;
      opacity: 0;
      white-space: nowrap;
      transform: translateX(-50%);
      transition: opacity 0.3s;
    }

    .pilgrim:hover .pilgrim-name {
      opacity: 1;
    }

    .pilgrim-body {
      display: inline-block;
      transform: rotate(90deg);
    }

    .pilgrim.is-user .pilgrim-body {
      font-size: 40px;
      font-weight: bold;
    }

    .eulogy-log {
      position: absolute;
      width: 700px;
      height: 200px;
      text-align: center;
      top: 20px;
      mask-image: linear-gradient(to bottom, transparent 0%, #000000 15%, #000000 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000000 15%, #000000 85%, transparent 100%);
      overflow: hidden;
      z-index: 50;
      pointer-events: none;
    }

    .log-entry {
      margin-bottom: 12px;
      font-size: 18px;
      animation: fadeUp 30s forwards;
    }

    .log-entry span.log-site {
      color: #ffffff;
      text-shadow: 0 0 5px #ffffff;
    }

    .log-entry span.log-pilgrim {
      color: #ffffff;
      text-shadow: 0 0 5px #ffffff;
    }

    .log-entry span.log-you {
      color: #ffffff;
      font-weight: bold;
    }

    @keyframes fadeUp {
      0% {
        opacity: 0;
        transform: translateY(20px);
      }

      5% {
        opacity: 1;
        transform: translateY(0px);
      }

      100% {
        transform: translateY(-60px);
      }
    }

    .pay-respects-btn {
      position: absolute;
      padding: 15px 30px;
      background: transparent;
      border: 2px solid var(--secondary-colour);
      color: var(--primary-colour);
      box-shadow: 0 0 10px rgba(102, 51, 153, 0.2);
      font-family: inherit;
      font-size: 18px;
      bottom: 50px;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.3s;
      z-index: 100;
    }

    .pay-respects-btn:hover {
      background: var(--secondary-colour);
      color: #000000;
      box-shadow: 0 0 20px var(--secondary-colour);
    }

    .pay-respects-btn:active {
      transform: scale(0.95);
    }

    .modal-overlay {
      position: fixed;
      display: flex;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      top: 0;
      left: 0;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      z-index: 200;
      pointer-events: none;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
      pointer-events: all;
      transition: opacity 0.3s;
    }

    .modal-box {
      position: relative;
      padding: 14px 20px 20px;
      width: 400px;
      max-width: 90%;
      background: #111111;
      border: 2px solid var(--secondary-colour);
      box-shadow: 0 0 20px var(--secondary-colour);
      color: var(--primary-colour);
      font-family: "Courier New", Courier, monospace;
      text-align: center;
    }

    .modal-close {
      position: absolute;
      display: flex;
      padding: 4px;
      background: transparent;
      border: none;
      color: var(--primary-colour);
      top: 17px;
      right: 17px;
      align-items: center;
      justify-content: center;
      opacity: 0.6;
      cursor: pointer;
      transition: opacity 0.2s, filter 0.2s, color 0.2s;
    }

    .modal-close:hover,
    .modal-close:focus {
      color: #ffffff;
      filter: drop-shadow(0 0 4px var(--primary-colour));
      opacity: 1;
      outline: none;
    }

    .modal-h2 {
      margin-top: 0;
      color: #ffffff;
      text-shadow: 0 0 5px var(--secondary-colour);
    }

    .form-group {
      margin-bottom: 20px;
      text-align: left;
    }

    .form-label {
      display: block;
      margin-bottom: 5px;
      text-align: center;
      font-weight: bold;
    }

    .offering-options {
      display: flex;
      margin-bottom: 10px;
      justify-content: center;
      gap: 10px;
    }

    .offering-option {
      padding: 5px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: inherit;
      font-size: 24px;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .offering-option:hover,
    .offering-option:focus {
      background: rgba(102, 51, 153, 0.3);
      transform: scale(1.2);
      outline: none;
    }

    .modal-buttons {
      display: flex;
      flex-direction: row-reverse;
      justify-content: space-between;
    }

    .modal-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--secondary-colour);
      color: var(--primary-colour);
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }

    .modal-btn:hover {
      background: var(--secondary-colour);
      color: #000000;
    }

    .hidden {
      display: none;
    }

    .input-group-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .input-field {
      height: 32px;
      width: 100%;
      padding: 8px;
      background: #000000;
      border: 1px solid var(--secondary-colour);
      color: #ffffff;
      font-family: inherit;
      box-sizing: border-box;
    }

    .random-btn {
      display: flex;
      padding: 8px;
      height: 32px;
      width: 32px;
      background: transparent;
      border: 1px solid var(--secondary-colour);
      color: var(--primary-colour);
      font-family: inherit;
      font-size: 16px;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      cursor: pointer;
    }

    .random-btn:hover {
      background: var(--secondary-colour);
      color: #000000;
    }
  </style>
</head>

<body>
  <main>
    <div class="eulogy-log" id="eulogy-log"></div>

    <div class="shrine-area">
      <div class="shrine-frame" id="shrine-frame">
        <div class="candle-container-back" id="candle-container-back"></div>
        <a href="../index.html" class="shrine-monitor">🖥️</a>
        <div class="candle-container-front" id="candle-container-front"></div>
      </div>
    </div>

    <div class="ground-layer" id="ground-layer">
      <!-- Offerings drop here -->
    </div>

    <!-- Pilgrims area spans full width visually, handled by absolute pos -->
    <div id="pilgrim-layer"></div>

    <div id="modal-overlay" class="modal-overlay">
      <div class="modal-box">
        <button class="modal-close" id="cancel-btn" aria-label="close">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
            <path d="M1 1 L13 13 M13 1 L1 13" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" />
          </svg>
        </button>
        <h2 class="modal-h2">~ pay respects ~</h2>

        <div class="form-group">
          <label class="form-label">offering:</label>
          <div class="offering-options" id="offering-options">
            <!-- Random offerings injected here -->
          </div>
          <div class="input-group-row">
            <input type="text" id="offering-input" class="input-field"
              placeholder="select or type offering">
            <button class="random-btn" id="random-offering-btn"
              title="randomise offering">🗘</button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">in memory of:</label>
          <div class="input-group-row">
            <input type="text" id="site-input" class="input-field" placeholder="e.g. MySpace">
            <button class="random-btn" id="random-site-btn" title="randomise site">🗘</button>
          </div>
        </div>

        <div class="modal-buttons">
          <button class="modal-btn" id="confirm-btn">pay respects</button>
        </div>
      </div>
    </div>

    <button class="pay-respects-btn" id="respect-btn">~ pay respects ~</button>
  </main>

  <script src="../../common/labyrinth.js"></script>
  <script src="../../common/tilde-town-users.js"></script>
  <script>
    const LAB = new Labyrinth('404-shrine');

    const modal = document.getElementById('modal-overlay');
    const offeringInput = document.getElementById('offering-input');
    const siteInput = document.getElementById('site-input');
    const offeringOptions = document.getElementById('offering-options');
    const pilgrimLayer = document.getElementById('pilgrim-layer');

    const defunctSites = [
      "AddThis",
      "AltaVista",
      "Ask Jeeves",
      "BarrysWorld",
      "Boo.com",
      "Cute Overload",
      "DailyBooth",
      "Delicious",
      "Digg",
      "Dodgeball",
      "Formspring",
      "Fotopedia",
      "Freecode",
      "freeindiegam.es",
      "Friendster",
      "Furl",
      "GameSpy",
      "Gawker",
      "GeoCities",
      "Google Buzz",
      "Google Reader",
      "Google Wave",
      "Grooveshark",
      "isoHunt",
      "Jay is Games",
      "Kazaa",
      "LimeWire",
      "MP3Skull",
      "MSN Messenger",
      "MegaUpload",
      "Memepool",
      "Microsoft Encarta",
      "Mochi Media",
      "MySpace",
      "Napster",
      "Netscape",
      "Nupedia",
      "Orkut",
      "Outpost Gallifrey",
      "Pets.com",
      "Pownce",
      "Rdio",
      "StumbleUpon",
      "Suck.com",
      "Technorati",
      "Vine",
      "Winamp",
      "Yahoo! Answers",
      "Yik Yak",
      "Zune",
    ];

    const offerings = [
      // Tech & Media
      '💾', '💿', '📀', '📼', '🎞️', '📟', '📠', '📺', '📻', '🎙️',
      '📷', '📸', '📹', '📽️', '📞', '🔌', '🔋', '🖱️', '⌨️', '🕹️',
      '🎮', '👾', '📎', '📡', '🛸',

      // Ephemera & Objects
      '🍪', '🗝️', '🔒', '🔓', '⏳', '⌛', '🕰️', '📜', '📝', '💌',
      '🎲', '🧩', '🧶', '🧵', '🖌️', '🖊️', '🔍', '🔔', '🧷',

      // Shrine & Memorial
      '🕯️', '🧸', '🏺', '⚱️', '📿', '🧿', '🎐', '🧧', '🗿', '🔮',

      // Flowers & Nature
      '🥀', '🌹', '💐', '🌻', '🌼', '🌷', '🪷', '🌸', '🏵️', '🌺',
      '🍂', '🍁', '🍄',
    ];

    const peopleFigures = [
      String.raw`o-|-<`,
      String.raw`o-\-<`,
      String.raw`o-/-<`,
      String.raw`o-[-<`,
      String.raw`o-]-<`,
      String.raw`o-+-<`,
      String.raw`o-<-<`,
    ]

    const figureRandomiser = new LAB.CyclicRandomiser(peopleFigures);
    const nameRandomiser = new LAB.CyclicRandomiser(tildeTownUsers);
    const offeringRandomiser = new LAB.CyclicRandomiser(offerings);
    const siteRandomiser = new LAB.CyclicRandomiser(defunctSites);

    const GROUND_Y = window.innerHeight * 0.8;
    const SHRINE_CENTER = window.innerWidth / 2;
    const TARGET_RANGE = 200;

    const pilgrims = [];

    class Pilgrim {
      constructor(isUser = false, customOffering = null, customSite = null) {
        this.isUser = isUser;
        this.element = document.createElement('a');
        this.element.classList.add('pilgrim');
        this.element.href = LAB.pageRandomiser.nextOne();

        if (isUser) {
          this.element.classList.add('is-user');
        }

        const body = document.createElement('div');
        body.classList.add('pilgrim-body');

        body.textContent = figureRandomiser.nextOne();
        this.element.appendChild(body);

        this.offering = customOffering || offeringRandomiser.nextOne();
        this.site = customSite || siteRandomiser.nextOne();

        this.name = isUser ? 'You' : nameRandomiser.nextOne();
        if (this.isUser) {
          this.colour = '#ffffff';
        } else {
          this.colour = this._getRandomColour();
        }
        this.element.style.color = this.colour;

        const nameTag = document.createElement('div');
        nameTag.classList.add('pilgrim-name');
        nameTag.innerText = this.name;
        this.element.appendChild(nameTag);

        this.direction = LAB.chance(0.5) ? 1 : -1; // 1 = right, -1 = left
        this.x = this.direction === 1 ? -50 : window.innerWidth + 50;
        this.y = GROUND_Y;
        this.targetX = SHRINE_CENTER + LAB.rand(-TARGET_RANGE, TARGET_RANGE);

        this.state = 'walking';
        this.bobPhase = LAB.rand(0, Math.PI * 2);

        const baseSpeed = isUser ? 1.2 : 2;
        this.maxSpeed = baseSpeed + LAB.rand(0, 1);
        this.currentSpeed = this.maxSpeed;
        this.slowdownRange = 250;

        pilgrimLayer.appendChild(this.element);
        this.updatePosition();
      }

      update() {
        if (this.state === 'walking') {
          const dist = this.targetX - this.x;

          if (Math.abs(dist) < 5) {
            this.state = 'bowing';
            this.performRitual();
          } else {
            const d = Math.abs(dist);

            if (d < this.slowdownRange) {
              this.currentSpeed = Math.max(0.5, this.maxSpeed * (d / this.slowdownRange));
            } else {
              this.currentSpeed = this.maxSpeed;
            }

            this.x += Math.sign(dist) * this.currentSpeed;
            this.bobPhase += 0.2;
            const bob = Math.sin(this.bobPhase) * 5;
            this.element.style.transform = `translateY(${bob}px)`;
          }
        }
        else if (this.state === 'leaving') {
          const dest = this.direction === 1 ? window.innerWidth + 100 : -100;
          const dist = dest - this.x;

          if (Math.abs(dist) < 5) {
            this.state = 'done';
            this.element.remove();
          } else {
            const timeElapsed = Date.now() - this.leaveStartTime;
            const accelerationDuration = 2000;

            if (timeElapsed < accelerationDuration) {
              const factor = timeElapsed / accelerationDuration;
              this.currentSpeed = Math.max(0.5, this.maxSpeed * (factor * factor));
            } else {
              this.currentSpeed = this.maxSpeed;
            }

            this.x += Math.sign(dist) * this.currentSpeed;
            this.bobPhase += 0.2;
            const bob = Math.sin(this.bobPhase) * 5;
            this.element.style.transform = `translateY(${bob}px)`;
          }
        }

        this.updatePosition();
      }

      updatePosition() {
        this.element.style.left = this.x + 'px';
      }

      performRitual() {
        this.element.style.transform = `translateY(10px) rotate(${this.direction * 15}deg)`;

        setTimeout(() => {
          const offering = (this.offering === 'respects') ? '.' : this.offering;
          this.dropOffering(offering);
          logEulogy(this.name, this.offering, this.site);

          setTimeout(() => {
            this.state = 'leaving';
            this.leaveStartTime = Date.now();
            this.maxSpeed = this.maxSpeed - 0.5;
          }, 1000);
        }, 500);
      }

      dropOffering(item) {
        const el = document.createElement('a');
        el.classList.add('offering');
        el.href = LAB.pageRandomiser.nextOne();
        el.innerText = item;

        const groundLayer = document.getElementById('ground-layer');
        const rect = groundLayer.getBoundingClientRect();

        const offset = (this.direction * 40) + 30;
        const relativeX = (this.x - rect.left) + offset;

        el.style.left = relativeX + 'px';
        groundLayer.appendChild(el);

        setTimeout(() => {
          el.style.transition = 'opacity 2s';
          el.style.opacity = 0;
          el.style.pointerEvents = 'none';
          setTimeout(() => el.remove(), 2000);
        }, 20000 + LAB.rand(0, 5000));
      }

      _getRandomColour() {
        const h = LAB.randInt(260, 320);
        const s = LAB.randInt(50, 100);
        const l = LAB.randInt(60, 90);
        return `hsl(${h}, ${s}%, ${l}%)`;
      }
    }

    function logEulogy(pilgrimName, offering, site) {
      const log = document.getElementById('eulogy-log');
      const entry = document.createElement('div');
      entry.classList.add('log-entry');

      let message = '';
      if (pilgrimName === 'You') {
        message = `<span class="log-you">${pilgrimName}</span> left <span class="log-you">${offering}</span> in memory of <span class="log-you">${site}</span>`;
      } else {
        message = `pilgrim <span class="log-pilgrim">${pilgrimName}</span> left ${offering} in memory of <span class="log-site">${site}</span>`;
      }

      entry.innerHTML = message;

      log.appendChild(entry);

      if (log.children.length > 5) {
        log.firstChild.remove();
      }
    }

    function spawnCandles() {
      const backContainer = document.getElementById('candle-container-back');
      const frontContainer = document.getElementById('candle-container-front');

      const countBack = 10;
      const countFront = 25;

      const spawn = (container, count) => {
        for (let i = 0; i < count; i++) {
          const candle = document.createElement('div');
          candle.classList.add('candle');

          const h = 20 + LAB.rand(0, 60);
          candle.style.height = h + 'px';
          candle.style.left = LAB.rand(0, 100) + '%';
          candle.style.zIndex = LAB.randInt(0, 9);

          const flame = document.createElement('div');
          flame.classList.add('flame');
          flame.style.animationDuration = (0.5 + LAB.rand(0, 1)) + 's';

          candle.appendChild(flame);
          container.appendChild(candle);
        }
      };

      spawn(backContainer, countBack);
      spawn(frontContainer, countFront);
    }

    function tick() {
      pilgrims.forEach((p, i) => {
        p.update();
        if (p.state === 'done') {
          pilgrims.splice(i, 1);
        }
      });

      if (LAB.chance(0.01) && pilgrims.length < 6) {
        pilgrims.push(new Pilgrim());
      }

      requestAnimationFrame(tick);
    }

    function populateOfferingOptions() {
      offeringOptions.replaceChildren();
      const randomOfferings = offeringRandomiser.next(5);
      randomOfferings.forEach(opt => {
        const btn = document.createElement('button');
        btn.classList.add('offering-option');
        btn.innerText = opt;
        btn.onclick = () => { offeringInput.value = opt; };
        offeringOptions.appendChild(btn);
      });
      return randomOfferings[0];
    }

    document.getElementById('random-offering-btn').addEventListener('click', () => {
      offeringInput.value = populateOfferingOptions();
    });

    document.getElementById('random-site-btn').addEventListener('click', () => {
      siteInput.value = siteRandomiser.nextOne();
    });

    document.getElementById('respect-btn').addEventListener('click', () => {
      modal.classList.add('active');
      populateOfferingOptions();
      if (!siteInput.value) {
        siteInput.value = siteRandomiser.nextOne();
      }
      focusFirstModalElement();
    });

    function closeModal() {
      modal.classList.remove('active');
    }

    const FOCUSABLE_SELECTOR = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';

    function getModalFocusableElements() {
      return Array.from(modal.querySelectorAll(FOCUSABLE_SELECTOR)).filter(
        (el) => !el.disabled && el.offsetParent !== null
      );
    }

    function focusFirstModalElement() {
      const focusable = getModalFocusableElements();
      if (focusable.length > 0) {
        focusable[0].focus();
      }
    }

    modal.addEventListener('keydown', (e) => {
      if (e.key !== 'Tab') return;
      const focusable = getModalFocusableElements();
      if (focusable.length === 0) return;
      const first = focusable[0];
      const last = focusable[focusable.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    });

    document.addEventListener('focusin', (e) => {
      if (!modal.classList.contains('active')) return;
      if (modal.contains(e.target)) return;
      const focusable = getModalFocusableElements();
      if (focusable.length > 0) {
        focusable[0].focus();
      }
    });

    document.getElementById('cancel-btn').addEventListener('click', closeModal);

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeModal();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });

    document.getElementById('confirm-btn').addEventListener('click', () => {
      const off = offeringInput.value || 'respects';
      const site = siteInput.value || 'The Lost Web';

      pilgrims.push(new Pilgrim(true, off, site));
      modal.classList.remove('active');
    });

    const confirmBtn = document.getElementById('confirm-btn');
    [offeringInput, siteInput].forEach((input) => {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          confirmBtn.click();
        }
      });
    });

    spawnCandles();
    requestAnimationFrame(tick);

  </script>
</body>

</html>
