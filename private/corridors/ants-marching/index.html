<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Under the table and dreaming">
  <title>Red and black antennae waving</title>
  <style>
    body {
      background-color: #1a0f0a;
      background-image:
        radial-gradient(#2c1e14 0.5px, transparent 0.5px),
        radial-gradient(#2c1e14 0.5px, #1a0f0a 0.5px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      color: #d2b48c;
      font-family: 'Courier New', Courier, monospace;
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #pile {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .item {
      position: absolute;
      font-size: 32px;
      text-decoration: none;
      user-select: none;
      pointer-events: auto;
      transition: transform 0.2s, filter 0.2s, opacity 1s;
      filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.5));
    }

    .item:hover {
      transform: scale(1.5) rotate(0deg) !important;
      filter: drop-shadow(0 0 5px #ffffff);
      z-index: 1000;
    }

    .ant {
      position: absolute;
      font-size: 28px;
      user-select: none;
      pointer-events: none;
      z-index: 10;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .carried-item {
      font-size: 24px;
      text-decoration: none;
      pointer-events: auto;
      transition: transform 0.1s;
    }

    .carried-item:hover {
      transform: scale(1.2);
    }

    #colony-status {
      position: fixed;
      top: 10px;
      left: 10px;
      font-size: 14px;
      background: rgba(0, 0, 0, 0.5);
      padding: 5px;
      border: 1px solid #4a3728;
      color: #8b4513;
    }

    a {
      color: inherit;
    }
  </style>
</head>

<body>
  <div id="colony-status" style="display: none;">
    COLONY STORAGE:
    <span id="count">0</span>
  </div>

  <div id="pile"></div>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('ants-marching');

    const ITEMS_POOL = [
      { emoji: '🍎', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍕', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍃', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍬', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍭', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍓', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🌽', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍇', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍒', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍑', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍐', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍉', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍄', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🌰', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🌾', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🌿', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍂', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍁', link: LAB.pageRandomiser.nextOne() },
    ];
    const itemRandomiser = new LAB.CyclicRandomiser(ITEMS_POOL);

    const statusEl = document.getElementById('colony-status');
    const countEl = document.getElementById('count');
    const pileEl = document.getElementById('pile');
    let itemCount = 0;

    function createAnt() {
      const antData = {
        id: Date.now() + LAB.rand(0, 1),
        side: LAB.randInt(0, 3),
        progress: 0,
        returning: false,
        item: itemRandomiser.nextOne()
      };

      const antEl = document.createElement('div');
      antEl.className = 'ant';

      const antBody = document.createElement('span');
      antBody.textContent = '🐜';

      const carriedLink = document.createElement('a');
      carriedLink.className = 'carried-item';
      carriedLink.textContent = antData.item.emoji;
      carriedLink.href = antData.item.link;

      if (LAB.chance(0.5)) {
        antEl.appendChild(antBody);
        antEl.appendChild(carriedLink);
      } else {
        antEl.appendChild(carriedLink);
        antEl.appendChild(antBody);
      }

      document.body.appendChild(antEl);

      let startX, startY;
      const padding = 100;
      const h = window.innerHeight;
      const w = window.innerWidth;

      switch (antData.side) {
        case 0: startX = LAB.rand(0, w); startY = -padding; break;
        case 1: startX = w + padding; startY = LAB.rand(0, h); break;
        case 2: startX = LAB.rand(0, w); startY = h + padding; break;
        case 3: startX = -padding; startY = LAB.rand(0, h); break;
      }

      // Target is somewhere in the pile area
      const targetX = w / 2 + LAB.rand(-75, 75);
      const targetY = h / 2 + LAB.rand(-75, 75);

      let currentX = startX;
      let currentY = startY;
      const speed = LAB.rand(1.5, 3.5);
      let frame = 0;

      function move() {
        frame++;
        const jitterX = Math.sin(frame * 0.2) * 2;
        const jitterY = Math.cos(frame * 0.2) * 2;

        if (!antData.returning) {
          const dx = targetX - currentX;
          const dy = targetY - currentY;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 10) {
            tossItem(antData.item.emoji, antData.item.link, currentX, currentY, targetX, targetY);
            carriedLink.remove();
            antData.returning = true;
          } else {
            currentX += (dx / dist) * speed;
            currentY += (dy / dist) * speed;
          }
        } else {
          const dx = startX - currentX;
          const dy = startY - currentY;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 10) {
            antEl.remove();
            return;
          } else {
            currentX += (dx / dist) * speed;
            currentY += (dy / dist) * speed;
          }
        }

        const angle = Math.atan2(
          antData.returning ? startY - currentY : targetY - currentY,
          antData.returning ? startX - currentX : targetX - currentX
        );
        const scaleX = (angle > Math.PI / 2 || angle < -Math.PI / 2) ? 1 : -1;

        antEl.style.left = (currentX + jitterX) + 'px';
        antEl.style.top = (currentY + jitterY) + 'px';
        antEl.style.transform = `scaleX(${scaleX})`;

        requestAnimationFrame(move);
      }

      requestAnimationFrame(move);
    }

    function tossItem(emoji, link, startX, startY, targetX, targetY) {
      const item = document.createElement('a');
      item.className = 'item';
      item.textContent = emoji;
      item.href = link;
      item.style.left = startX + 'px';
      item.style.top = startY + 'px';
      item.style.transition = 'all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
      document.body.appendChild(item);

      // Pile relative centering
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const finalX = targetX - centerX;
      const finalY = targetY - centerY;

      setTimeout(() => {
        item.style.left = `calc(50% + ${finalX}px)`;
        item.style.top = `calc(50% + ${finalY}px)`;
        item.style.transform = `rotate(${LAB.rand(0, 360)}deg)`;

        setTimeout(() => {
          item.style.transition = 'transform 0.2s, filter 0.2s, opacity 1s';
          pileEl.appendChild(item);
          itemCount++;
          countEl.textContent = itemCount;

          scheduleFadeAway(item);

          if (pileEl.children.length > 60) {
            const oldest = pileEl.querySelector('.item:not([data-fading])');
            if (oldest) fadeAndRemove(oldest);
          }
        }, 500);
      }, 10);
    }

    function scheduleFadeAway(el) {
      const lifetime = LAB.rand(10000, 30000); // 10-30 seconds
      setTimeout(() => {
        fadeAndRemove(el);
      }, lifetime);
    }

    function fadeAndRemove(el) {
      if (el.dataset.fading) return;
      el.dataset.fading = "true";
      el.style.opacity = '0';
      setTimeout(() => {
        el.remove();
      }, 1000);
    }

    // Initialise the pile with static items that have already been placed by previous ants
    for (let i = 0; i < 20; i++) {
      const itemData = itemRandomiser.nextOne();
      const item = document.createElement('a');
      item.className = 'item';
      item.textContent = itemData.emoji;
      item.href = itemData.link;

      const tx = LAB.rand(-75, 75);
      const ty = LAB.rand(-75, 75);

      item.style.left = `calc(50% + ${tx}px)`;
      item.style.top = `calc(50% + ${ty}px)`;
      item.style.transform = `rotate(${LAB.rand(0, 360)}deg)`;

      pileEl.appendChild(item);
      itemCount++;
      countEl.textContent = itemCount;

      scheduleFadeAway(item);
    }

    setInterval(createAnt, 1500);
    for (let i = 0; i < 4; i++) {
      setTimeout(createAnt, LAB.rand(0, 3000));
    }

    // Dev mode for those who know the secret key
    document.addEventListener('keydown', (e) => {
      if (e.key === '`') {
        statusEl.style.display = statusEl.style.display === 'none' ? 'block' : 'none';
      }
    });

  </script>
</body>

</html>
