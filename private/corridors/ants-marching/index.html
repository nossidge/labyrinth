<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Under the table and dreaming">
  <title>Red and black antennae waving</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: #1a0f0a;
      background-image:
        radial-gradient(#2c1e14 0.5px, transparent 0.5px),
        radial-gradient(#2c1e14 0.5px, #1a0f0a 0.5px);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      color: #d2b48c;
      overflow: hidden;
    }

    main {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
    }

    #pile {
      position: absolute;
      top: 50%;
      left: 50%;
      display: flex;
      width: 200px;
      height: 200px;
      transform: translate(-50%, -50%);
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .item {
      position: absolute;
      filter: drop-shadow(2px 2px 2px rgba(0, 0, 0, 0.5));
      font-size: 32px;
      text-decoration: none;
      user-select: none;
      pointer-events: auto;
      transition: transform 0.2s, filter 0.2s, opacity 1s;
    }

    .item:hover {
      filter: drop-shadow(0 0 5px #ffffff);
      transform: scale(1.5) rotate(0deg) !important;
      z-index: 1000;
    }

    .ant {
      position: absolute;
      display: flex;
      font-size: 28px;
      white-space: nowrap;
      user-select: none;
      pointer-events: none;
      z-index: 10;
      align-items: center;
      gap: 4px;
    }

    .carried-item {
      font-size: 24px;
      text-decoration: none;
      pointer-events: auto;
      transition: transform 0.1s;
    }

    .carried-item:hover {
      transform: scale(1.2);
    }

    a {
      color: inherit;
    }
  </style>
</head>

<body>
  <main id="main">
    <div id="pile"></div>
    <div id="ants"></div>
  </main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('ants-marching');

    const main = document.getElementById('main');
    const pile = document.getElementById('pile');
    const ants = document.getElementById('ants');

    const ITEMS_POOL = [
      { emoji: '🍎', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍕', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍃', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍬', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍭', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍓', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🌽', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍇', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍒', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍑', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍐', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍉', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍄', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🌰', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🌾', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🌿', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍂', link: LAB.pageRandomiser.nextOne() },
      { emoji: '🍁', link: LAB.pageRandomiser.nextOne() },
    ];
    const itemRandomiser = new LAB.CyclicRandomiser(ITEMS_POOL);

    function createAnt() {
      const antData = {
        id: Date.now() + LAB.rand(0, 1),
        side: LAB.randInt(0, 3),
        progress: 0,
        returning: false,
        item: itemRandomiser.nextOne()
      };

      const antEl = document.createElement('div');
      antEl.className = 'ant';

      const antBody = document.createElement('span');
      antBody.textContent = '🐜';

      const carriedLink = document.createElement('a');
      carriedLink.className = 'carried-item';
      carriedLink.textContent = antData.item.emoji;
      carriedLink.href = antData.item.link;

      if (LAB.chance(0.5)) {
        antEl.appendChild(antBody);
        antEl.appendChild(carriedLink);
      } else {
        antEl.appendChild(carriedLink);
        antEl.appendChild(antBody);
      }

      ants.appendChild(antEl);

      let startX, startY;
      const padding = 100;
      const winH = window.innerHeight;
      const winW = window.innerWidth;

      switch (antData.side) {
        case 0: startX = LAB.rand(0, winW); startY = -padding; break;
        case 1: startX = winW + padding; startY = LAB.rand(0, winH); break;
        case 2: startX = LAB.rand(0, winW); startY = winH + padding; break;
        case 3: startX = -padding; startY = LAB.rand(0, winH); break;
      }

      // Each ant has a random offset around the page centre
      const offsetRadius = LAB.rand(0, 85);
      const offsetAngle = LAB.rand(0, Math.PI * 2);

      let currentX = startX;
      let currentY = startY;
      const speed = LAB.rand(1.5, 3.5);
      let frame = 0;

      function move() {
        frame++;
        const jitterX = Math.sin(frame * 0.2) * 2;
        const jitterY = Math.cos(frame * 0.2) * 2;

        // Always track the current page centre, so resizes stay aligned
        const targetX = window.innerWidth / 2 + Math.cos(offsetAngle) * offsetRadius;
        const targetY = window.innerHeight / 2 + Math.sin(offsetAngle) * offsetRadius;

        if (!antData.returning) {
          const dx = targetX - currentX;
          const dy = targetY - currentY;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 10) {
            tossItem(antData.item.emoji, antData.item.link, currentX, currentY, targetX, targetY);
            carriedLink.remove();
            antData.returning = true;
          } else {
            currentX += (dx / dist) * speed;
            currentY += (dy / dist) * speed;
          }
        } else {
          const dx = startX - currentX;
          const dy = startY - currentY;
          const dist = Math.sqrt(dx * dx + dy * dy);

          if (dist < 10) {
            antEl.remove();
            return;
          } else {
            currentX += (dx / dist) * speed;
            currentY += (dy / dist) * speed;
          }
        }

        const angle = Math.atan2(
          antData.returning ? startY - currentY : targetY - currentY,
          antData.returning ? startX - currentX : targetX - currentX
        );
        const scaleX = (angle > Math.PI / 2 || angle < -Math.PI / 2) ? 1 : -1;

        antEl.style.left = (currentX + jitterX) + 'px';
        antEl.style.top = (currentY + jitterY) + 'px';
        antEl.style.transform = `scaleX(${scaleX})`;

        requestAnimationFrame(move);
      }

      requestAnimationFrame(move);
    }

    function tossItem(emoji, link, startX, startY, targetX, targetY) {
      const item = document.createElement('a');
      item.className = 'item';
      item.textContent = emoji;
      item.href = link;
      item.style.left = startX + 'px';
      item.style.top = startY + 'px';
      item.style.transition = 'all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
      main.appendChild(item);

      // Pile relative centring
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const finalX = targetX - centerX;
      const finalY = targetY - centerY;

      setTimeout(() => {
        item.style.left = `calc(50% + ${finalX}px)`;
        item.style.top = `calc(50% + ${finalY}px)`;
        item.style.transform = `rotate(${LAB.rand(0, 360)}deg)`;

        setTimeout(() => {
          item.style.transition = 'transform 0.2s, filter 0.2s, opacity 1s';
          pile.appendChild(item);

          scheduleFadeAway(item);

          if (pile.children.length > 60) {
            const oldest = pile.querySelector('.item:not([data-fading])');
            if (oldest) fadeAndRemove(oldest);
          }
        }, 500);
      }, 10);
    }

    // Tracks each pending fade so each can be frozen while the tab is hidden
    const fadeStates = new Map();

    function startFadeAway(el, delay) {
      const deadline = performance.now() + delay;
      const timerId = setTimeout(() => {
        fadeStates.delete(el);
        fadeAndRemove(el);
      }, delay);
      fadeStates.set(el, { deadline, timerId });
    }

    // Default is 20-30 seconds
    function scheduleFadeAway(el, min = 20000, max = 30000) {
      const lifetime = LAB.rand(min, max);
      startFadeAway(el, lifetime);
    }

    function pauseFades() {
      const now = performance.now();
      for (const [el, state] of fadeStates) {
        clearTimeout(state.timerId);
        state.remaining = Math.max(state.deadline - now, 0);
      }
    }

    function resumeFades() {
      for (const [el, state] of fadeStates) {
        if (state.remaining == null) continue;
        const delay = state.remaining;
        state.remaining = null;
        startFadeAway(el, delay);
      }
    }

    function fadeAndRemove(el) {
      if (el.dataset.fading) return;
      el.dataset.fading = "true";
      el.style.opacity = '0';
      setTimeout(() => {
        el.remove();
      }, 1000);
    }

    // Initialise the pile with static items that have already been placed by previous ants
    for (let i = 0; i < 20; i++) {
      const itemData = itemRandomiser.nextOne();
      const item = document.createElement('a');
      item.className = 'item';
      item.textContent = itemData.emoji;
      item.href = itemData.link;

      const tx = LAB.rand(-75, 75);
      const ty = LAB.rand(-75, 75);

      item.style.left = `calc(50% + ${tx}px)`;
      item.style.top = `calc(50% + ${ty}px)`;
      item.style.transform = `rotate(${LAB.rand(0, 360)}deg)`;

      pile.appendChild(item);

      scheduleFadeAway(item, i * 1000, i * 1500);
    }

    let antTimer = null;

    function startAnts() {
      if (antTimer !== null) return;
      antTimer = setInterval(createAnt, 1500);
    }

    function stopAnts() {
      if (antTimer === null) return;
      clearInterval(antTimer);
      antTimer = null;
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        startAnts();
        resumeFades();
      } else {
        stopAnts();
        pauseFades();
      }
    });

    for (let i = 0; i < 4; i++) {
      setTimeout(createAnt, LAB.rand(0, 3000));
    }
    startAnts();

  </script>
</body>

</html>
