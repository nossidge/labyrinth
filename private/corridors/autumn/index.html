<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="You always loved this time of year">
  <title>Fall back</title>
  <style>
    :root {
      --bg-top: #2c1a1a;
      --bg-bottom: #4d2b1a;
      --leaf-shadow: rgba(0, 0, 0, 0.4);
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, var(--bg-top), var(--bg-bottom));
      overflow: hidden;
    }

    #leaf-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .leaf {
      position: absolute;
      font-size: 2rem;
      user-select: none;
      pointer-events: auto;
      cursor: pointer;
      text-shadow: 2px 2px 4px var(--leaf-shadow);
      transition: transform 0.1s linear, opacity 1s ease-out;
      text-decoration: none;
    }

    .leaf.settled {
      cursor: pointer;
    }

    #ground {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 5px;
    }

    .grain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44NSIgbnVtT2N0YXZlcz0iMyIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIvPjwvc3ZnPg==');
      opacity: 0.08;
      z-index: 100;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="grain"></div>

  <div id="leaf-container"></div>

  <div id="ground"></div>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('autumn');

    const container = document.getElementById('leaf-container');
    const ground = document.getElementById('ground');

    const LEAF_EMOJIS = ['🍂', '🍁', '🍃', '🌿', '🌱'];
    const leaves = [];
    const pile = [];
    const PILE_RESOLUTION = 20; // width of each "slot" in the pile
    const pileHeights = new Array(Math.ceil(window.innerWidth / PILE_RESOLUTION)).fill(0);

    class Leaf {
      constructor() {
        this.el = document.createElement('a');
        this.el.className = 'leaf';
        this.el.innerText = LAB.sample(LEAF_EMOJIS);
        this.el.href = LAB.pageRandomiser.nextOne();

        this.reset();

        container.appendChild(this.el);
      }

      reset() {
        this.x = LAB.rand(0, window.innerWidth);
        this.y = -50 - LAB.rand(0, 200);
        this.rotation = LAB.rand(0, 360);
        this.rotationSpeed = LAB.rand(-2.5, 2.5);
        this.speedY = 1 + LAB.rand(0, 2);
        this.speedX = LAB.rand(-0.5, 0.5);
        this.oscillation = LAB.rand(0, Math.PI * 2);
        this.oscillationSpeed = LAB.rand(0.02, 0.07);
        this.settled = false;
        this.el.style.opacity = 1;
        this.el.style.transform = `translate(${this.x}px, ${this.y}px) rotate(${this.rotation}deg)`;
      }

      update() {
        if (this.settled) return;

        this.oscillation += this.oscillationSpeed;
        this.x += this.speedX + Math.sin(this.oscillation) * 2;
        this.y += this.speedY;
        this.rotation += this.rotationSpeed;

        const slot = Math.floor(this.x / PILE_RESOLUTION);
        const inBounds = slot >= 0 && slot < pileHeights.length;
        const currentPileHeight = inBounds ? (pileHeights[slot] || 0) : 0;
        const targetY = window.innerHeight - 30 - currentPileHeight;

        if (this.y >= targetY) {
          this.y = targetY;
          this.settled = true;
          this.el.classList.add('settled');

          if (inBounds) {
            pileHeights[slot] += 10; // increase pile height

            // Occasionally clear some of the pile if it gets too high
            // if (pileHeights[slot] > window.innerHeight * 0.8) {
            clearOldestLeaves();
            // }
            // TODO: At the moment the leaves that get removed are the ones at the bottom, so it
            // looks like the remaining leaves are floating. It's kind of okay because this is just
            // a little sketch page, but it might be nice to fix this at some point.

          } else {
            // If it settles way off screen, just remove it after a delay to keep the DOM clean
            setTimeout(() => {
              this.el.remove();
              const idx = leaves.indexOf(this);
              if (idx > -1) leaves.splice(idx, 1);
            }, 1000);
          }
        }

        this.el.style.transform = `translate(${this.x}px, ${this.y}px) rotate(${this.rotation}deg)`;
      }
    }

    // Prevent too many elements on screen
    function clearOldestLeaves() {
      const allSettled = document.querySelectorAll('.leaf.settled:not(.fading)');
      if (allSettled.length > 200) {
        for (let i = 0; i < 5; i++) {
          const leafEl = allSettled[i];
          if (!leafEl) continue;

          const xText = leafEl.style.transform.split('(')[1];
          const x = parseFloat(xText);
          const slot = Math.floor(x / PILE_RESOLUTION);
          if (slot >= 0 && slot < pileHeights.length) {
            pileHeights[slot] = Math.max(0, pileHeights[slot] - 10);
          }

          leafEl.classList.add('fading');
          leafEl.style.opacity = '0';
          setTimeout(() => {
            leafEl.remove();
          }, 1000);
        }
      }
    }

    // Spawn pre-settled leaves at the bottom
    for (let i = 0; i < 20; i++) {
      const leaf = new Leaf();
      leaf.x = LAB.rand(0, window.innerWidth);
      const slot = Math.floor(leaf.x / PILE_RESOLUTION);
      const inBounds = slot >= 0 && slot < pileHeights.length;
      const currentPileHeight = inBounds ? (pileHeights[slot] || 0) : 0;

      leaf.y = window.innerHeight - 30 - currentPileHeight;
      leaf.settled = true;
      leaf.el.classList.add('settled');
      leaf.rotation = LAB.rand(0, 360);
      leaf.el.style.transform = `translate(${leaf.x}px, ${leaf.y}px) rotate(${leaf.rotation}deg)`;

      if (inBounds) {
        pileHeights[slot] += 10;
      }
      leaves.push(leaf);
    }

    // Spawn falling leaves
    // Set to random position within the viewport so it looks like the leaves are already falling
    for (let i = 0; i < 10; i++) {
      const leaf = new Leaf();
      leaf.y = LAB.rand(0, window.innerHeight);
      leaf.el.style.transform = `translate(${leaf.x}px, ${leaf.y}px) rotate(${leaf.rotation}deg)`;
      leaves.push(leaf);
    }

    // Spawn more leaves periodically
    setInterval(() => {
      if (leaves.filter(l => !l.settled).length < 20) {
        leaves.push(new Leaf());
      }
    }, 1000);

    function animate() {
      leaves.forEach(leaf => leaf.update());
      requestAnimationFrame(animate);
    }

    animate();

    // Clear the piles on resize
    window.addEventListener('resize', () => {
      pileHeights.length = Math.ceil(window.innerWidth / PILE_RESOLUTION);
      pileHeights.fill(0);
      document.querySelectorAll('.leaf.settled').forEach(l => l.remove());
    });

  </script>
</body>

</html>
