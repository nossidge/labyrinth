<!DOCTYPE html>
<html lang="en">

<!--
These were originally going to all be hexagons, like the Giant's Causeway in Northern Ireland.
But I liked the higgledy-piggledy-ness of the randomised shapes.
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Basalt-N-Pepa">
  <title>Giant's Causeway</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      background-color: #1a1a1a;
      overflow: hidden;
    }

    main {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    .shape {
      position: absolute;
      display: block;
      background: radial-gradient(circle at 50% 50%, var(--c-light) 0%, var(--c-dark) 100%);
      text-decoration: none;
    }

    .shape:hover {
      filter: drop-shadow(0 0 10px var(--c-line));
      scale: 1.3;
      z-index: 5;
    }

    #crt-scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
      background-size: 100% 3px;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>

<body>
  <div id="crt-scanlines"></div>
  <main id="main"></main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('basalt-fields');

    const main = document.getElementById('main');

    const SPACING = 40;
    const COLOURS = [
      [180, 170, 160], [140, 130, 120], [160, 150, 140],
      [120, 110, 100], [200, 190, 180], [100, 90, 80],
      [170, 160, 150], [150, 140, 130], [190, 180, 170],
      [130, 120, 110], [110, 100, 90], [160, 140, 130],
      [140, 120, 110], [180, 160, 150], [100, 110, 100],
      [170, 130, 120], [130, 150, 140], [150, 100, 110],
    ];

    let winW, winH;

    function resize() {
      winW = window.innerWidth;
      winH = window.innerHeight;
      init();
    }

    function clamp(v) {
      return Math.max(0, Math.min(255, v));
    }

    function rgb([r, g, b], light = 0) {
      return `rgb(${clamp(r + light)}, ${clamp(g + light)}, ${clamp(b + light)})`;
    }

    function polygonClip(sides, rotationDegrees) {
      const points = [];
      const radius = rotationDegrees * Math.PI / 180;
      for (let i = 0; i < sides; i++) {
        const angle = radius + (i / sides) * Math.PI * 2 - Math.PI / 2;
        const x = 50 * Math.cos(angle) + 50;
        const y = 50 * Math.sin(angle) + 50;
        points.push(`${x.toFixed(2)}% ${y.toFixed(2)}%`);
      }
      return `polygon(${points.join(', ')})`;
    }

    function init() {
      main.replaceChildren();
      const cols = Math.ceil(winW / SPACING) + 2;
      const rows = Math.ceil(winH / SPACING) + 2;

      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          const x = col * SPACING + LAB.rand(-8, 8);
          const y = row * SPACING + LAB.rand(-8, 8);
          const radius = LAB.rand(12, 28);
          const diameter = radius * 2;
          const sides = LAB.randInt(3, 6);
          const colour = LAB.sample(COLOURS);

          const a = document.createElement('a');
          a.href = LAB.pageRandomiser.nextOne();
          a.className = 'shape';

          a.style.left = (x - radius) + 'px';
          a.style.top = (y - radius) + 'px';
          a.style.width = diameter + 'px';
          a.style.height = diameter + 'px';
          a.style.clipPath = polygonClip(sides, LAB.rand(0, 360));

          a.style.setProperty('--c-dark', rgb(colour));
          a.style.setProperty('--c-light', rgb(colour, 40));
          a.style.setProperty('--c-line', rgb(colour, 60));

          main.appendChild(a);
        }
      }
    }

    window.addEventListener('resize', resize);

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a')) init();
    });

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, init);
    });

    resize();

  </script>
</body>

</html>
