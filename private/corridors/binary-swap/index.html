<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="when they give you the i">
  <title>00000011</title>
  <style>
    :root {
      --bg: #f4f4ee;
      --fg: #111111;
      --hot: #d62828;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Courier New', monospace;
      overflow: hidden;
    }

    #grid {
      position: absolute;
      inset: 0;
      display: grid;
      gap: 0;
    }

    .bit {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      line-height: 1;
      text-decoration: none;
      color: inherit;
      user-select: none;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .bit.on {
      background: var(--fg);
      color: var(--bg);
    }

    .bit.bloom {
      background: var(--hot) !important;
      color: var(--bg) !important;
    }

    .bit.link {
      color: var(--hot);
      font-size: 18px;
    }

    .bit.link.on {
      background: var(--hot);
      color: var(--bg);
    }

    .bit.link:hover {
      background: var(--fg) !important;
      color: var(--hot) !important;
      transform: scale(3);
      z-index: 10;
    }
  </style>
</head>

<body>
  <main id="grid"></main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('binary-swap');

    const grid = document.getElementById('grid');
    const cellSize = 22;
    const TICK_MS = 220;
    const LINK_DENSITY = 0.012;
    const LINK_MIN = 0;
    const INITIAL_ON_CHANCE = 0.5;
    const CLUSTER_R_MIN = 2;
    const CLUSTER_R_MAX = 6;
    const CLUSTER_SKIP_CHANCE = 0.3;
    const BLOOM_RADIUS = 2;
    const BLOOM_MS = 280;

    let cols = 0, rows = 0, cells = [];

    function init() {
      cols = Math.floor(window.innerWidth / cellSize);
      rows = Math.floor(window.innerHeight / cellSize);
      grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      grid.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
      grid.innerHTML = '';
      cells = [];

      const total = cols * rows;
      const linkCount = Math.max(LINK_MIN, Math.floor(total * LINK_DENSITY));
      const linkSlots = new Set();
      while (linkSlots.size < linkCount) {
        linkSlots.add(LAB.randInt(0, total - 1));
      }

      const frag = document.createDocumentFragment();
      for (let i = 0; i < total; i++) {
        const isLink = linkSlots.has(i);
        const el = document.createElement(isLink ? 'a' : 'div');
        el.className = isLink ? 'bit link' : 'bit';
        const on = LAB.chance(INITIAL_ON_CHANCE);
        if (on) el.classList.add('on');
        el.textContent = on ? '1' : '0';
        if (isLink) el.href = LAB.pageRandomiser.nextOne();
        cells.push(el);
        frag.appendChild(el);
      }
      grid.appendChild(frag);
    }

    // Flip a circular cluster of bits, should look like rolling waves
    function tick() {
      const cx = LAB.randInt(0, cols - 1);
      const cy = LAB.randInt(0, rows - 1);
      const r = LAB.randInt(CLUSTER_R_MIN, CLUSTER_R_MAX);
      const r2 = r * r;
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          if (dx * dx + dy * dy > r2) continue;
          const x = cx + dx, y = cy + dy;
          if (x < 0 || x >= cols || y < 0 || y >= rows) continue;
          if (LAB.chance(CLUSTER_SKIP_CHANCE)) continue;
          const el = cells[y * cols + x];
          if (!el) continue;
          const wasOn = el.classList.contains('on');
          el.classList.toggle('on');
          el.textContent = wasOn ? '0' : '1';
        }
      }
    }

    // Mouse cursor makes nearby bits bloom red
    // Throttled to one pass per frame
    let mouseRAF = 0, mouseX = 0, mouseY = 0;
    function bloom() {
      mouseRAF = 0;
      const x = Math.floor(mouseX / cellSize);
      const y = Math.floor(mouseY / cellSize);
      for (let dy = -BLOOM_RADIUS; dy <= BLOOM_RADIUS; dy++) {
        for (let dx = -BLOOM_RADIUS; dx <= BLOOM_RADIUS; dx++) {
          const px = x + dx, py = y + dy;
          if (px < 0 || px >= cols || py < 0 || py >= rows) continue;
          const el = cells[py * cols + px];
          if (!el || el.classList.contains('link')) continue;
          el.classList.add('bloom');
          setTimeout(() => el.classList.remove('bloom'), BLOOM_MS);
        }
      }
    }
    document.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
      if (mouseRAF) return;
      mouseRAF = requestAnimationFrame(bloom);
    });

    let tickTimer = null;
    function startTicking() {
      if (tickTimer === null) tickTimer = setInterval(tick, TICK_MS);
    }
    function stopTicking() {
      if (tickTimer !== null) {
        clearInterval(tickTimer);
        tickTimer = null;
      }
    }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) stopTicking(); else startTicking();
    });

    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(init, 100);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a')) init();
    });

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, init);
    });

    init();
    startTicking();

  </script>
</body>

</html>
