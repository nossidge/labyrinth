<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A little something to make you sweeter">
  <title>Blackout poetry</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000000;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    main {
      max-width: 1399px;
      width: 100%;
      padding: 40px;
      background: #090909;
      border-left: 1px solid #1a1a1a;
      border-right: 1px solid #1a1a1a;
      box-shadow: 4px 0 12px rgba(0, 0, 0, 0.6), -4px 0 12px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    @media (max-width: 1399px) {
      main {
        padding: 20px;
      }
    }

    #image-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }

    #link {
      display: block;
      line-height: 0;
      max-width: 100%;
    }

    #image {
      display: block;
      max-width: 100%;
      max-height: 70vh;
      height: auto;
      width: auto;
      opacity: 0.92;
    }

    #caption {
      margin-top: auto;
      padding-top: 24px;
      padding-bottom: 24px;
      font-size: 14px;
      letter-spacing: 2px;
      color: #6a6a6a;
      text-align: center;
    }

    #caption a {
      color: #8a8a8a;
      text-decoration: none;
      border-bottom: 1px solid #2a2a2a;
    }

    #caption a:hover {
      color: #aaaaaa;
      border-bottom-color: #4a4a4a;
    }

    #nav {
      display: flex;
      gap: 32px;
    }

    @media (max-width: 1399px) {
      #nav {
        gap: 20px;
      }
    }

    #nav button {
      flex: 1;
      background: #111111;
      border: 1px solid #1f1f1f;
      padding: 14px 12px;
      font-size: 14px;
      letter-spacing: 3px;
      color: #888888;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      cursor: pointer;
    }

    #nav button:hover {
      background: #0e0e0e;
      color: #aaaaaa;
      border-color: #333333;
    }

    #nav button:active {
      background: #161616;
    }
  </style>
</head>

    <div id="image-area">

    </div>
    <div id="caption">

      <a href="https://blackout.tilde.town/">

    </div>
    <div id="nav">
      <button id="btn-prev">&#8592; back</button>
      <button id="btn-next">next &#8594;</button>
    </div>
  </main>

    const imageRandomiser = new LAB.CyclicRandomiser(IMAGES);

    const imageElement = document.getElementById('image');
    const linkElement = document.getElementById('link');

    // History of shown images
    // Each entry: { filename: '...', href: '...' }
    let history = [];
    let historyIndex = -1;

    // I'm using PNG for now, but it's nice to be flexible
    function stripExt(filename) {
      const i = filename.lastIndexOf('.');
      return i === -1 ? filename : filename.slice(0, i);
    }

    // If the user passes a dodgy hash, return null
    function findImageByAnchor(anchor) {
      if (!anchor) return null;
      return IMAGES.find(f => stripExt(f) === anchor) || null;
    }

    function showEntry(entry) {
      imageElement.src = 'images/' + entry.filename;
      imageElement.alt = stripExt(entry.filename);
      linkElement.href = entry.href;

      // Update URL anchor without scrolling/adding browser history
      const anchor = stripExt(entry.filename);
      const newUrl = window.location.pathname + window.location.search + '#' + anchor;
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', newUrl);
      } else {
        window.location.hash = anchor;
      }
    }

    function createEntry(filename) {
      return {
        filename: filename,
        href: LAB.pageRandomiser.nextOne(),
      };
    }

    function goToNext() {
      if (historyIndex < history.length - 1) {
        historyIndex++;
      } else {
        history.push(createEntry(imageRandomiser.nextOne()));
        historyIndex = history.length - 1;
      }
      showEntry(history[historyIndex]);
    }

    function goToPrev() {
      if (historyIndex > 0) {
        historyIndex--;
      } else {
        history.unshift(createEntry(imageRandomiser.nextOne()));
        historyIndex = 0;
      }
      showEntry(history[historyIndex]);
    }

    document.getElementById('btn-prev').addEventListener('click', goToPrev);
    document.getElementById('btn-next').addEventListener('click', goToNext);

    // Click anywhere on the page (except anchors and buttons) to go forward
    document.body.addEventListener('click', (e) => {
      if (e.target.closest('a, #btn-prev, #btn-next')) return;
      goToNext();
    });

    // Arrow keys, WASD keys, HJKL keys
    const LEFT_OR_DOWN = new Set(['ArrowLeft', 'ArrowDown', 'h', 'j', 'a', 's']);
    const RIGHT_OR_UP = new Set(['ArrowRight', 'ArrowUp', 'k', 'l', 'd', 'w']);
    function keyLeftOrDown(key) { return LEFT_OR_DOWN.has(key); }
    function keyRightOrUp(key) { return RIGHT_OR_UP.has(key); }

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, () => {
        if (keyLeftOrDown(e.key)) {
          e.preventDefault();
          goToPrev();
        } else if (keyRightOrUp(e.key)) {
          e.preventDefault();
          goToNext();
        }
      });
    });

    // Check URL anchor for a specific image to show first
    function init() {
      const rawHash = window.location.hash.replace(/^#/, '');
      const initialFilename = findImageByAnchor(rawHash) || imageRandomiser.nextOne();

      history.push(createEntry(initialFilename));
      historyIndex = 0;
      showEntry(history[historyIndex]);
    }

    init();
