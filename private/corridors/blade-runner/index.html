<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You look lonely.</title>
  <meta name="description" content="I can fix that.">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-image: url('background.gif');
      background-repeat: no-repeat;
      background-size: 100% 100%;
      background-position: center;
      background-attachment: fixed;
      position: relative;
    }

    .character-link {
      position: absolute;
      width: 140px;
      height: 140px;
      display: block;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 100%;
      transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      z-index: 10;
    }

    .character-link img {
      width: 100%;
      height: 100%;
      object-fit: fill;
      display: block;
    }

    .character-link::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    /* Blue tint for even indexed links */
    .character-link.tint-blue::after {
      background: rgba(5, 10, 118, 0.4);
      box-shadow: inset 0 0 50px rgba(5, 10, 118, 0.8);
    }

    /* Pink/Purple tint for odd indexed links */
    .character-link.tint-pink::after {
      background: rgba(171, 21, 152, 0.4);
      box-shadow: inset 0 0 50px rgba(171, 21, 152, 0.8);
    }

    .character-link:hover {
      transform: scale(1.05);
      z-index: 20;
    }

    /* Pink border for blue tint */
    .character-link.tint-blue:hover {
      border-color: #AB1598;
      box-shadow: 0 0 30px rgba(171, 21, 152, 0.6);
    }

    /* Blue border for pink tint */
    .character-link.tint-pink:hover {
      border-color: #050A76;
      box-shadow: 0 0 30px rgba(5, 10, 118, 0.6);
    }

    .character-link:hover::after {
      opacity: 1;
    }

    /* Positions */
    .pos-tl {
      top: 12px;
      left: 12px;
    }

    .pos-tc {
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
    }

    .pos-tr {
      top: 12px;
      right: 12px;
    }

    .pos-lc {
      top: 50%;
      left: 12px;
      transform: translateY(-50%);
    }

    .pos-rc {
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
    }

    .pos-bl {
      bottom: 12px;
      left: 12px;
    }

    .pos-bc {
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
    }

    .pos-br {
      bottom: 12px;
      right: 12px;
    }

    /* Fix hover transform for centered items */
    .pos-tc:hover {
      transform: translateX(-50%) scale(1.05);
    }

    .pos-lc:hover {
      transform: translateY(-50%) scale(1.05);
    }

    .pos-rc:hover {
      transform: translateY(-50%) scale(1.05);
    }

    .pos-bc:hover {
      transform: translateX(-50%) scale(1.05);
    }

    /* Hide until images are assigned to prevent flicker */
    .character-link {
      visibility: hidden;
    }

    .character-link.ready {
      visibility: visible;
    }
  </style>
</head>

<body>
  <div id="grid">
    <a href="#" class="character-link pos-tl tint-blue"><img></a>
    <a href="#" class="character-link pos-tc tint-pink"><img></a>
    <a href="#" class="character-link pos-tr tint-blue"><img></a>
    <a href="#" class="character-link pos-rc tint-pink"><img></a>
    <a href="#" class="character-link pos-br tint-blue"><img></a>
    <a href="#" class="character-link pos-bc tint-pink"><img></a>
    <a href="#" class="character-link pos-bl tint-blue"><img></a>
    <a href="#" class="character-link pos-lc tint-pink"><img></a>
  </div>

  <script src="../../common/CyclicRandomiser.js"></script>
  <script src="../../common/labyrinthPages.js"></script>
  <script>
    const currentPage = "corridors/blade-runner";
    const otherPages = labyrinthPages.filter(p => !p.includes(currentPage));
    const pageRandomiser = new CyclicRandomiser(otherPages);

    const characters = [
      {
        image: "batty.jpg",
        link: pageRandomiser.nextOne(),
        quote: "I've seen things you people wouldn't believe."
      },
      {
        image: "deckard.jpg",
        link: pageRandomiser.nextOne(),
        quote: "Maybe in those last moments he loved life more than he ever had before."
      },
      {
        image: "leon.jpg",
        link: pageRandomiser.nextOne(),
        quote: "Let me tell you about my mother."
      },
      {
        image: "pris.jpg",
        link: pageRandomiser.nextOne(),
        quote: "I think, Sebastian, therefore I am."
      },
      {
        image: "rachael.jpg",
        link: pageRandomiser.nextOne(),
        quote: "I'm not in the business. I am the business."
      },
      {
        image: "sebastian.jpg",
        link: pageRandomiser.nextOne(),
        quote: "I make friends. They're toys. My friends are toys. I make them. It's a hobby."
      },
      {
        image: "tyrell.jpg",
        link: pageRandomiser.nextOne(),
        quote: "The light that burns twice as bright burns half as long."
      },
      {
        image: "gaff.jpg",
        link: pageRandomiser.nextOne(),
        quote: "It's too bad she won't live! But then again, who does?"
      },
    ];

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    window.addEventListener('DOMContentLoaded', () => {
      const originalTitle = document.title;
      const shuffled = shuffle([...characters]);
      const elements = document.querySelectorAll('.character-link');

      elements.forEach((element, index) => {
        const character = shuffled[index];
        const img = element.querySelector('img');
        img.src = character.image;
        img.alt = character.quote;
        element.addEventListener('mouseenter', () => {
          document.title = img.alt;
        });
        element.addEventListener('mouseleave', () => {
          document.title = originalTitle;
        });
        element.href = character.link;
        element.classList.add('ready');
      });
    });
  </script>
</body>

</html>
