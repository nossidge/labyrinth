<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="garage doors">
  <title>shutter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }

    #bars {
      position: relative;
      z-index: 1;
    }

    .bar {
      display: block;
      width: 100%;
      height: 30px;
      margin-bottom: 2px;
      background-color: #000000;
      border: 1px solid #333333;
      transition: background-color 0.3s ease;
      text-decoration: none;
    }

    .bar--on {
      background-color: #ffffff;
    }

    .bar:hover {
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
    }

    #crt-scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.03));
      background-size: 100% 2px, 3px 100%;
    }
  </style>
</head>

<body>
  <div id="bars"></div>
  <div id="crt-scanlines"></div>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('cascade-bars');

    const container = document.getElementById('bars');
    const barHeight = 30;
    const barGap = 2;
    const delayEach = 36;
    const delayAll = delayEach * 3;

    const bars = [];
    let cascadeTimeout;
    let waveIndex = 0;

    function cascade() {
      const i = waveIndex;
      if (i < bars.length) {
        bars[i].classList.toggle('bar--on');
        waveIndex++;
        cascadeTimeout = setTimeout(cascade, delayEach);
      } else {
        waveIndex = 0;
        cascadeTimeout = setTimeout(cascade, delayAll);
      }
    }

    function init() {
      document.getElementById('bars').innerHTML = '';
      bars.length = 0;
      waveIndex = 0;

      const count = Math.ceil(window.innerHeight / (barHeight + barGap));

      for (let i = 0; i < count; i++) {
        const a = document.createElement('a');
        a.className = 'bar';
        a.href = LAB.pageRandomiser.nextOne();
        container.appendChild(a);
        bars.push(a);
      }

      clearTimeout(cascadeTimeout)
      cascade();
    }

    init()
    window.addEventListener('resize', init);

  </script>
</body>

</html>
