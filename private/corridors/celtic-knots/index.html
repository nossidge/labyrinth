<!DOCTYPE html>
<html lang="en">

<!--
https://en.wikipedia.org/wiki/Celtic_knot

Rewrite of an existing page I made a decade ago:
https://tilde.town/~nossidge/knots/

Concept inspired by Aria Salvatrice
https://genderdruid.neocities.org

Font by Ben Griffin
https://fontlibrary.org/en/font/knots

Background by Brenda Clarke
https://www.flickr.com/photos/brenda-starr/4676651435
https://www.flickr.com/photos/37753256@N08/
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="knot on your nelly">
  <title>celtic knots</title>

  <style>
    @font-face {
      font-family: "KnotsRegular";
      src: url("KnotsRegular.otf") format("opentype");
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      color: rgb(23, 15, 4);
      text-align: center;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background-image: url("https://c1.staticflickr.com/2/1308/4676651435_cfc717b697_b.jpg");
      background-size: 100% 100%;
    }

    #knot-container {
      position: fixed;
      overflow: hidden;
      inset: 0;
    }

    #knot {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: block;
      white-space: nowrap;
      font-family: "KnotsRegular";
      font-size: 40px;
      line-height: 97%;
      text-decoration: none;
    }

    a:link,
    a:visited {
      color: rgb(23, 15, 4);
    }

    a:hover,
    a:active {
      outline: 2px solid rgb(23, 15, 4);
      outline-offset: 2px;
    }

    #knot:focus-visible,
    input[type="range"]:focus-visible {
      outline: 2px solid rgb(23, 15, 4);
      outline-offset: 2px;
    }

    #controls-wrapper {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    #controls-reveal {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.4s ease;
    }

    #controls-wrapper.open #controls-reveal {
      grid-template-rows: 1fr;
    }

    #controls-clip {
      overflow: hidden;
      min-height: 0;
    }

    #controls-panel {
      background: rgba(255, 250, 240, 0.92);
      border: 2px solid rgb(23, 15, 4);
      border-radius: 6px;
      padding: 16px 20px 12px;
      margin-bottom: 10px;
      min-width: 320px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.25);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0s 0.4s;
    }

    #controls-wrapper.open #controls-panel {
      opacity: 1;
      visibility: visible;
      transition: opacity 0.3s ease, visibility 0s 0s;
    }

    .control-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 12px;
    }

    .control-row:last-child {
      margin-bottom: 0;
    }

    .control-label {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      font-weight: bold;
      min-width: 60px;
      text-align: right;
      letter-spacing: 0.5px;
    }

    .control-slider {
      flex: 1;
    }

    .control-value {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 14px;
      min-width: 40px;
      text-align: left;
      font-weight: bold;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: rgb(23, 15, 4);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      background: rgb(255, 250, 240);
      border: 2px solid rgb(23, 15, 4);
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      background: rgb(23, 15, 4);
    }

    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      background: rgb(255, 250, 240);
      border: 2px solid rgb(23, 15, 4);
      border-radius: 50%;
      cursor: pointer;
    }

    input[type="range"]::-moz-range-thumb:hover {
      background: rgb(23, 15, 4);
    }

    #controls-toggle {
      width: 36px;
      height: 36px;
      background: rgba(255, 250, 240, 0.92);
      border: 2px solid rgb(23, 15, 4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s ease;
      user-select: none;
      font-size: 16px;
      line-height: 1;
    }

    #controls-toggle:focus-visible {
      outline: 2px solid rgba(255, 250, 240, 0.5);
      outline-offset: 2px;
    }

    #controls-toggle:hover {
      background: rgba(255, 250, 240, 1);
    }

    #controls-toggle span {
      display: block;
      transition: transform 0.4s ease;
    }

    #controls-wrapper.open #controls-toggle span {
      transform: rotate(-180deg);
    }

    @media (max-width: 600px) {
      #knot {
        font-size: 20px;
      }

      #controls-panel {
        min-width: 0;
        width: calc(100vw - 40px);
        padding: 12px 14px 10px;
      }

      .control-label {
        font-size: 12px;
        min-width: 50px;
      }

      .control-value {
        font-size: 12px;
        min-width: 30px;
      }
    }

    @media (max-height: 500px) {
      #knot {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>
  <div id="knot-container">
    <a id="knot" href="../../index.html"
      aria-label="Follow the knotted path deeper into the labyrinth"></a>
  </div>

  <div id="controls-wrapper">
    <div id="controls-reveal">
      <div id="controls-clip">
        <div id="controls-panel" role="group" aria-label="Knot controls">
          <div class="control-row">
            <label class="control-label" for="height">Height</label>
            <input type="range" class="control-slider" id="height" min="3" max="30" step="1"
              value="9" />
            <span class="control-value" id="height-text" aria-hidden="true">9</span>
          </div>
          <div class="control-row">
            <label class="control-label" for="width">Width</label>
            <input type="range" class="control-slider" id="width" min="3" max="60" step="1"
              value="20" />
            <span class="control-value" id="width-text" aria-hidden="true">20</span>
          </div>
          <div class="control-row">
            <label class="control-label" for="boundaries0">Blocked</label>
            <input type="range" class="control-slider" id="boundaries0" boundaries-no="0" min="0"
              max="4" step="1" value="1" />
            <span class="control-value" id="boundaries0-text" aria-hidden="true">few</span>
          </div>
          <div class="control-row">
            <label class="control-label" for="boundaries1">Crossed</label>
            <input type="range" class="control-slider" id="boundaries1" boundaries-no="1" min="0"
              max="4" step="1" value="3" />
            <span class="control-value" id="boundaries1-text" aria-hidden="true">many</span>
          </div>
          <div class="control-row">
            <label class="control-label" for="boundaries2">Straight</label>
            <input type="range" class="control-slider" id="boundaries2" boundaries-no="2" min="0"
              max="4" step="1" value="2" />
            <span class="control-value" id="boundaries2-text" aria-hidden="true">some</span>
          </div>
        </div>
      </div>
    </div>

    <button id="controls-toggle" type="button" aria-expanded="false" aria-controls="controls-panel"
      aria-label="Show knot controls">
      <span aria-hidden="true">⯅</span>
    </button>
  </div>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('celtic-knots');

    // Class to generate Celtic knots
    class CelticKnot {

      // These are the characters that the Knots font uses
      // The key string represents the boundaries at NESW
      // 0 = Blocked
      // 1 = Crossed
      // 2 = Straight
      static boxChars = {
        '2222': '╋',
        '2122': '╉',
        '2022': '┫',
        '2221': '╊',
        '2121': '╂',
        '2021': '┨',
        '2220': '┣',
        '2120': '┠',
        '2020': '┃',
        '2212': '╇',
        '2112': '╃',
        '2012': '┩',
        '2211': '╄',
        '2111': '╀',
        '2011': '┦',
        '2210': '┡',
        '2110': '┞',
        '2010': '╿',
        '2202': '┻',
        '2102': '┹',
        '2002': '┛',
        '2201': '┺',
        '2101': '┸',
        '2001': '┚',
        '2200': '┗',
        '2100': '┖',
        '2000': '╏',
        '1222': '╈',
        '1122': '╅',
        '1022': '┪',
        '1221': '╆',
        '1121': '╁',
        '1021': '┧',
        '1220': '┢',
        '1120': '┟',
        '1020': '╽',
        '1212': '┿',
        '1112': '┽',
        '1012': '┥',
        '1211': '┾',
        '1111': '┼',
        '1011': '┤',
        '1210': '┝',
        '1110': '├',
        '1010': '│',
        '1202': '┷',
        '1102': '┵',
        '1002': '┙',
        '1201': '┶',
        '1101': '┴',
        '1001': '┘',
        '1200': '┕',
        '1100': '└',
        '1000': '┈',
        '0222': '┳',
        '0122': '┱',
        '0022': '┓',
        '0221': '┲',
        '0121': '┰',
        '0021': '┒',
        '0220': '┏',
        '0120': '┎',
        '0020': '╻',
        '0212': '┯',
        '0112': '┭',
        '0012': '┑',
        '0211': '┮',
        '0111': '┬',
        '0011': '┐',
        '0210': '┍',
        '0110': '┌',
        '0010': '╷',
        '0202': '━',
        '0102': '╾',
        '0002': '╸',
        '0201': '╼',
        '0101': '─',
        '0200': '╺',
        '0100': '╶',
        '0001': '╴',
        '0000': ' ',
      };

      constructor() {
        this.width = 20;
        this.height = 9;
        this.boundaryWeights = [1, 3, 2];
      }

      // Find the box character using the input's n,e,s,w attributes
      boxCharFromDirs(obj) {
        const dir = '' + obj.n + obj.e + obj.s + obj.w;
        return CelticKnot.boxChars[dir];
      }

      // Simple and stupid method for getting a weighted sample
      weightedRandom(values, weights) {
        const arr = [];
        for (let i = 0; i < weights.length; i++) {
          for (let j = 0; j < weights[i]; j++) {
            arr.push(values[i]);
          }
        }
        return arr[Math.floor(Math.random() * arr.length)] || 0;
      }

      // Create an array of the boundaries between characters
      // Horizontal is East and West, vertical is North and South
      // Mirror for symmetry
      boundaries(length) {
        const output = [];
        for (let i = 0; i < length - 1; i++) {
          const mirrorI = length - i - 2;
          if (output[mirrorI] != undefined) {
            output[i] = output[mirrorI];
          } else {
            output[i] = this.weightedRandom([0, 1, 2], this.boundaryWeights);
          }
        }
        return output;
      }

      // Generate a knot based on the instance variables
      gen() {
        const width = this.width;
        const height = this.height;

        // The final array that will be output
        const knotArray = [];
        for (let y = 0; y < height; y++) {
          knotArray[y] = [];
          for (let x = 0; x < width; x++) {
            knotArray[y][x] = { n: 0, e: 0, s: 0, w: 0 };
          }
        }

        // Create an array of the boundaries between characters
        const boundariesHoriz = [];
        for (let i = 0; i < height; i++) {
          const mirrorI = height - i - 1;
          if (boundariesHoriz[mirrorI] != undefined) {
            boundariesHoriz[i] = boundariesHoriz[mirrorI];
          } else {
            boundariesHoriz[i] = this.boundaries(width);
          }
        }

        // Map the boundaries to the knotArray
        for (let y = 0; y < boundariesHoriz.length; y++) {
          for (let x = 0; x < boundariesHoriz[0].length; x++) {
            knotArray[y][x].e = boundariesHoriz[y][x];
            knotArray[y][x + 1].w = boundariesHoriz[y][x];
          }
        }

        // Create an array of the boundaries between rows
        const boundariesVert = [];
        for (let i = 0; i < width; i++) {
          const mirrorI = width - i - 1;
          if (boundariesVert[mirrorI] != undefined) {
            boundariesVert[i] = boundariesVert[mirrorI];
          } else {
            boundariesVert[i] = this.boundaries(height);
          }
        }

        // Map the boundaries to the knotArray
        for (let x = 0; x < boundariesVert.length; x++) {
          for (let y = 0; y < boundariesVert[0].length; y++) {
            knotArray[y][x].s = boundariesVert[x][y];
            knotArray[y + 1][x].n = boundariesVert[x][y];
          }
        }

        // Find the char that matches the directions
        let finalHtml = '';
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            finalHtml += this.boxCharFromDirs(knotArray[y][x]);
          }
          finalHtml += '<br>';
        }

        // Return the html string
        return finalHtml;
      }
    }

    // New CelticKnot instance, and function for displaying in DOM
    // Each new knot links to a new corridor in the labyrinth
    const celticKnot = new CelticKnot();
    const knotElement = document.getElementById('knot');

    function init() {
      knotElement.innerHTML = celticKnot.gen();
      knotElement.href = LAB.pageRandomiser.nextOne();
    }

    // Form control events to change CelticKnot state
    const labelTexts = ['none', 'few', 'some', 'many', 'lots'];

    function changeBoundaries(el) {
      const label = document.getElementById(el.id + '-text');
      const no = el.getAttribute('boundaries-no');
      label.textContent = labelTexts[el.value];
      el.setAttribute('aria-valuetext', labelTexts[el.value]);
      celticKnot.boundaryWeights[no] = parseInt(el.value, 10);
      init();
    }

    function changeSize(el) {
      const label = document.getElementById(el.id + '-text');
      label.textContent = el.value;
      celticKnot[el.id] = parseInt(el.value, 10);
      init();
    }

    // Sync control-value text with input values on load
    // (since browser restores previous input values)
    function syncControlValues() {
      ['height', 'width'].forEach(function (id) {
        const el = document.getElementById(id);
        const label = document.getElementById(id + '-text');
        label.textContent = el.value;
        celticKnot[id] = parseInt(el.value, 10);
      });

      for (let i = 0; i < 3; i++) {
        const el = document.getElementById('boundaries' + i);
        const label = document.getElementById('boundaries' + i + '-text');
        label.textContent = labelTexts[el.value];
        el.setAttribute('aria-valuetext', labelTexts[el.value]);
        celticKnot.boundaryWeights[i] = parseInt(el.value, 10);
      }
    }

    // Wire up slider events
    document.getElementById('height').addEventListener(
      'input', (e) => { changeSize(e.target); });
    document.getElementById('width').addEventListener(
      'input', (e) => { changeSize(e.target); });
    document.getElementById('boundaries0').addEventListener(
      'input', (e) => { changeBoundaries(e.target); });
    document.getElementById('boundaries1').addEventListener(
      'input', (e) => { changeBoundaries(e.target); });
    document.getElementById('boundaries2').addEventListener(
      'input', (e) => { changeBoundaries(e.target); });

    // Controls panel toggle
    const controlsWrapper = document.getElementById('controls-wrapper');
    const controlsToggle = document.getElementById('controls-toggle');

    function setControlsOpen(open) {
      controlsWrapper.classList.toggle('open', open);
      controlsToggle.setAttribute('aria-expanded', open);
      controlsToggle.setAttribute(
        'aria-label', open ? 'Hide knot controls' : 'Show knot controls');
    }

    controlsToggle.addEventListener('click', () => {
      setControlsOpen(!controlsWrapper.classList.contains('open'));
    });

    document.addEventListener('keydown', (e) => {
      // Escape closes the controls panel and returns focus to the toggle
      if (e.key === 'Escape' && controlsWrapper.classList.contains('open')) {
        setControlsOpen(false);
        controlsToggle.focus();
        return;
      }

      // Don't regenerate when pressing Space/Enter on the toggle button
      if (e.target.closest('button')) return;

      LAB.handleKeydown(e, init);
    });

    document.addEventListener('click', (e) => {
      if (e.target.closest('a, #controls-wrapper')) return;
      init();
    });

    syncControlValues();
    init();

  </script>
</body>

</html>
