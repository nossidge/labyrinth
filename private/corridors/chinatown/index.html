    const settlementsRandomiser = new CyclicRandomiser(SETTLEMENTS_POOL);

    const phraseElement = document.getElementById('phrase');

    // History of generated phrases
    // Each entry: { text, href }
    let history = [];
    let historyIndex = -1;

    function createNewEntry() {
      const country = countriesRandomiser.nextOne();
      const settlement = settlementsRandomiser.nextOne();
      return {
        text: `Forget it Jake, it's ${country}${settlement}`,
        href: pageRandomiser.nextOne(),
      };
    }

    function displayEntry(entry) {
      phraseElement.classList.add('fade-out');
      setTimeout(() => {
        phraseElement.textContent = entry.text;
        phraseElement.href = entry.href;
        phraseElement.classList.remove('fade-out');
      }, 300);
    }

    function goToNext() {
      if (historyIndex < history.length - 1) {
        historyIndex++;
      } else {
        history.push(createNewEntry());
        historyIndex = history.length - 1;
      }
      displayEntry(history[historyIndex]);
    }

    function goToPrev() {
      if (historyIndex > 0) {
        historyIndex--;
      } else {
        history.unshift(createNewEntry());
        historyIndex = 0;
      }
      displayEntry(history[historyIndex]);
    }

    // Arrow keys, WASD keys, HJKL keys
    const LEFT_OR_DOWN = new Set(['ArrowLeft', 'ArrowDown', 'h', 'j', 'a', 's']);
    const RIGHT_OR_UP = new Set(['ArrowRight', 'ArrowUp', 'k', 'l', 'd', 'w']);
    function keyLeftOrDown(key) { return LEFT_OR_DOWN.has(key); }
    function keyRightOrUp(key) { return RIGHT_OR_UP.has(key); }

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.altKey || e.shiftKey || e.metaKey) return;
      if (keyLeftOrDown(e.key)) {
        e.preventDefault();
        goToPrev();
      } else if (keyRightOrUp(e.key)) {
        e.preventDefault();
        goToNext();
      }
    });

    phraseElement.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    // Click anywhere on the page (except the phrase link) to go forward
    document.body.addEventListener('click', () => {
      goToNext();
    });

    // Init with the canonical first entry
    history.push({
      text: "Forget it Jake, it's Chinatown",
      href: pageRandomiser.nextOne(),
    });
    historyIndex = 0;
    phraseElement.textContent = history[0].text;
    phraseElement.href = history[0].href;
