<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chromaphilia">
  <title>Chromaphilia</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      color: #777;
      font-family: "Courier New", Courier, monospace;
      overflow: hidden;
      user-select: none;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #mixer {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    .circle {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      mix-blend-mode: screen;
      cursor: grab;
      filter: blur(5px);
    }

    @media (max-width: 1024px) {
      .circle {
        width: 240px;
        height: 240px;
      }
    }

    @media (max-width: 768px) {
      .circle {
        width: 190px;
        height: 190px;
      }
    }

    @media (max-width: 480px) {
      .circle {
        width: 160px;
        height: 160px;
      }
    }

    .circle:active {
      cursor: grabbing;
    }

    #red {
      background-color: #ff0000;
    }

    #green {
      background-color: #00ff00;
    }

    #blue {
      background-color: #0000ff;
    }

    #color-nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      padding: 10px;
      box-sizing: border-box;
      z-index: 100;
    }

    .color-btn {
      pointer-events: auto;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-weight: 900;
      color: #000;
      transition: transform 0.2s, opacity 0.5s, filter 0.5s;
      filter: blur(3px);
      border-radius: 50%;
      font-size: 1.5rem;
      opacity: 0;
      pointer-events: none;
    }

    .color-btn.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .color-btn:hover {
      filter: blur(1px);
      transform: scale(1.1);
    }

    .color-btn:active {
      transform: scale(0.9);
      opacity: 0.8;
    }

    #btn-m {
      background-color: #ff00ff;
      justify-self: start;
      align-self: start;
    }

    #btn-r {
      background-color: #ff0000;
      justify-self: center;
      align-self: start;
    }

    #btn-y {
      background-color: #ffff00;
      justify-self: end;
      align-self: start;
    }

    #btn-b {
      background-color: #0000ff;
      color: #fff;
      justify-self: start;
      align-self: end;
    }

    #btn-c {
      background-color: #00ffff;
      justify-self: center;
      align-self: end;
    }

    #btn-g {
      background-color: #00ff00;
      justify-self: end;
      align-self: end;
    }

    #noise {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    #scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 60;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
      background-size: 100% 4px;
      opacity: 0.2;
    }
  </style>
</head>

<body>
  <div id="noise"></div>
  <div id="scanlines"></div>

  <div id="mixer">
    <div id="red" class="circle"></div>
    <div id="green" class="circle"></div>
    <div id="blue" class="circle"></div>
  </div>

  <div id="color-nav">
    <a href="../index.html" class="color-btn" id="btn-m">M</a>
    <a href="../index.html" class="color-btn" id="btn-r">R</a>
    <a href="../index.html" class="color-btn" id="btn-y">Y</a>
    <a href="../index.html" class="color-btn" id="btn-b">B</a>
    <a href="../index.html" class="color-btn" id="btn-c">C</a>
    <a href="../index.html" class="color-btn" id="btn-g">G</a>
  </div>

  <script src="../../common/labyrinthPages.js"></script>
  <script src="../../common/CyclicRandomiser.js"></script>
  <script>
    const currentPage = "corridors/chromaphilia";
    const otherPages = labyrinthPages.filter(p => !p.includes(currentPage));
    const pageRandomiser = new CyclicRandomiser(otherPages);

    const mixer = document.getElementById('mixer');
    const red = document.getElementById('red');
    const green = document.getElementById('green');
    const blue = document.getElementById('blue');

    const btnR = document.getElementById('btn-r');
    const btnY = document.getElementById('btn-y');
    const btnG = document.getElementById('btn-g');
    const btnM = document.getElementById('btn-m');
    const btnB = document.getElementById('btn-b');
    const btnC = document.getElementById('btn-c');

    // Initial positions
    const centerX = window.innerWidth / 2;
    const centerY = window.innerHeight / 2;

    function getSpacing() {
      const windowWidth = window.innerWidth;
      if (windowWidth <= 480) {
        return 60;
      } else if (windowWidth <= 768) {
        return 70;
      } else if (windowWidth <= 1024) {
        return 90;
      } else {
        return 110;
      }
    }

    function createCircles() {
      const spacing = getSpacing();
      const sqrt3Half = Math.sqrt(3) / 2;
      return [
        { id: 'red', el: red, x: centerX, y: centerY - spacing },
        { id: 'green', el: green, x: centerX + spacing * sqrt3Half, y: centerY + spacing / 2 },
        { id: 'blue', el: blue, x: centerX - spacing * sqrt3Half, y: centerY + spacing / 2 }
      ];
    }

    let circles = createCircles();

    let radius = 150;

    function getRadius() {
      const circleSize = red.offsetWidth;
      return circleSize / 2;
    }

    function updateCirclePositions() {
      radius = getRadius();
      circles.forEach(c => {
        c.el.style.left = (c.x - radius) + 'px';
        c.el.style.top = (c.y - radius) + 'px';
      });
      checkOverlaps();
    }

    function checkOverlaps() {
      const redCircle = circles.find(c => c.id === 'red');
      const greenCircle = circles.find(c => c.id === 'green');
      const blueCircle = circles.find(c => c.id === 'blue');

      const dist = (c1, c2) => Math.sqrt(Math.pow(c1.x - c2.x, 2) + Math.pow(c1.y - c2.y, 2));

      const dRG = dist(redCircle, greenCircle);
      const dRB = dist(redCircle, blueCircle);
      const dGB = dist(greenCircle, blueCircle);

      const overlapThreshold = radius * 2;
      const hideThreshold = radius * 0.1;

      const redGreen = dRG < overlapThreshold;
      const redBlue = dRB < overlapThreshold;
      const greenBlue = dGB < overlapThreshold;

      // Primary buttons hide when another circle is nearly on top of them
      const redHidden = dRG < hideThreshold || dRB < hideThreshold;
      const greenHidden = dRG < hideThreshold || dGB < hideThreshold;
      const blueHidden = dRB < hideThreshold || dGB < hideThreshold;

      btnR.classList.toggle('visible', !redHidden);
      btnG.classList.toggle('visible', !greenHidden);
      btnB.classList.toggle('visible', !blueHidden);

      // Secondary colors visible when their two circles overlap,
      // but hidden when the third circle is piled on either component (making white)
      const bNearR = dRB < hideThreshold;
      const bNearG = dGB < hideThreshold;
      const gNearR = dRG < hideThreshold;
      const gNearB = dGB < hideThreshold;
      const rNearG = dRG < hideThreshold;
      const rNearB = dRB < hideThreshold;
      btnY.classList.toggle('visible', redGreen && !bNearR && !bNearG);
      btnM.classList.toggle('visible', redBlue && !gNearR && !gNearB);
      btnC.classList.toggle('visible', greenBlue && !rNearG && !rNearB);
    }

    updateCirclePositions();

    let activeCircle = null;
    let offsetX = 0;
    let offsetY = 0;

    function handleStart(e) {
      if (e.target.classList.contains('circle')) {
        activeCircle = circles.find(c => c.el === e.target);
        const clientX = e.clientX || e.touches[0].clientX;
        const clientY = e.clientY || e.touches[0].clientY;

        const rect = activeCircle.el.getBoundingClientRect();
        offsetX = clientX - (rect.left + rect.width / 2);
        offsetY = clientY - (rect.top + rect.height / 2);

        // Bring to front while dragging
        activeCircle.el.style.zIndex = 40;
      }
    }

    function handleMove(e) {
      if (activeCircle) {
        const clientX = e.clientX || (e.touches && e.touches[0].clientX);
        const clientY = e.clientY || (e.touches && e.touches[0].clientY);

        if (clientX === undefined) return;

        activeCircle.x = clientX - offsetX;
        activeCircle.y = clientY - offsetY;

        activeCircle.el.style.left = (activeCircle.x - radius) + 'px';
        activeCircle.el.style.top = (activeCircle.y - radius) + 'px';

        checkOverlaps();
      }
    }

    function handleEnd() {
      if (activeCircle) {
        activeCircle.el.style.zIndex = '';
        activeCircle = null;
      }
    }

    mixer.addEventListener('mousedown', handleStart);
    window.addEventListener('mousemove', handleMove);
    window.addEventListener('mouseup', handleEnd);

    mixer.addEventListener('touchstart', handleStart);
    window.addEventListener('touchmove', handleMove);
    window.addEventListener('touchend', handleEnd);

    // Update radius and positions on window resize
    window.addEventListener('resize', () => {
      circles = createCircles();
      updateCirclePositions();
    });

  </script>
</body>

</html>
