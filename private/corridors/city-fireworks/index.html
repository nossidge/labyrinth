<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Remember, remember.">
  <title>It's The Fireworks Talking</title>
  <style>
    :root {
      --night-sky: #01010b;
      --sky-bottom: #1a1b3a;
      --building-color: #000000;
      --window-color: #111100;
      --window-on: #ffeeaa;
    }

    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: white;
      opacity: 0;
      z-index: 5;
      pointer-events: none;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, var(--night-sky), var(--sky-bottom));
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #city-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 38vh;
      display: flex;
      align-items: flex-end;
      z-index: 10;
      pointer-events: none;
    }

    .building {
      background-color: var(--building-color);
      position: relative;
      margin-right: 2px;
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      padding: 8px 4px;
      border-top: 1px solid #111;
    }

    .building.tower::after {
      content: '';
      position: absolute;
      top: -15px;
      left: 20%;
      width: 60%;
      height: 15px;
      background: black;
    }

    .building.antenna::after {
      content: '';
      position: absolute;
      top: -30px;
      left: 50%;
      width: 2px;
      height: 30px;
      background: #222;
    }

    .window {
      width: 4px;
      height: 6px;
      margin: 3px;
      background-color: var(--window-color);
      transition: background-color 0.5s;
    }

    .window.on {
      background-color: var(--window-on);
      box-shadow: 0 0 4px var(--window-on);
    }

    .grain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44NSIgbnVtT2N0YXZlcz0iMyIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIvPjwvc3ZnPg==');
      opacity: 0.15;
      z-index: 100;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="flash-overlay"></div>
  <div class="grain"></div>

  <canvas id="canvas"></canvas>

  <div id="city-container">
    <!-- Buildings will be generated here -->
  </div>

  <script src="../../common/CyclicRandomiser.js"></script>
  <script src="../../common/labyrinthPages.js"></script>
  <script>
    const currentPage = "corridors/city-fireworks/index.html";
    const otherPages = labyrinthPages.filter(p => !p.includes(currentPage));
    const pageRandomiser = new CyclicRandomiser(otherPages);

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const cityContainer = document.getElementById('city-container');

    let width, height;

    // City generation
    function generateCity() {
      cityContainer.innerHTML = '';
      const buildingCount = Math.floor(width / 40);
      for (let i = 0; i < buildingCount; i++) {
        const building = document.createElement('a');
        building.className = 'building';
        building.href = pageRandomiser.nextOne();
        if (Math.random() > 0.8) building.classList.add('tower');
        if (Math.random() > 0.8) building.classList.add('antenna');

        const bHeight = 15 + Math.random() * 80;
        const bWidth = 30 + Math.random() * 60;
        building.style.height = bHeight + '%';
        building.style.width = bWidth + 'px';
        building.style.flex = 'none';

        // Add windows, on/off at random
        const windowCount = Math.floor((bHeight) * (bWidth) / 30);
        for (let j = 0; j < windowCount; j++) {
          const win = document.createElement('div');
          win.className = 'window';
          if (Math.random() > 0.8) win.classList.add('on');
          building.appendChild(win);
        }

        cityContainer.appendChild(building);
      }
    }

    // Window flickering every so often
    function flickerWindows() {
      const windows = document.querySelectorAll('.window');
      if (windows.length > 0) {
        const count = Math.floor(Math.random() * 3);
        for (let i = 0; i < count; i++) {
          const win = windows[Math.floor(Math.random() * windows.length)];
          win.classList.toggle('on');
        }
      }
      setTimeout(flickerWindows, 500 + Math.random() * 200);
    }
    setTimeout(flickerWindows, 200);

    // Firework particle class
    class Particle {
      constructor(x, y, color, velocity) {
        this.x = x;
        this.y = y;
        this.color = color;
        this.velocity = velocity;
        this.friction = 0.95;
        this.gravity = 0.05;
        this.opacity = 1;
        this.life = 100 + Math.random() * 50;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.velocity.x *= this.friction;
        this.velocity.y *= this.friction;
        this.velocity.y += this.gravity;
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.opacity -= 1 / this.life;
      }
    }

    let particles = [];
    const colours = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffffff', '#ffaa00'];

    function createFirework(x, y) {
      const particleCount = 60 + Math.random() * 60;
      const color = colours[Math.floor(Math.random() * colours.length)];
      const type = Math.random();

      // Flash effect
      const flash = document.getElementById('flash-overlay');
      flash.style.backgroundColor = color;
      flash.style.opacity = '0.04';
      setTimeout(() => { flash.style.opacity = '0'; }, 100);

      for (let i = 0; i < particleCount; i++) {
        let vx, vy;
        if (type < 0.3) {
          // Sphere
          const angle = (Math.PI * 2 / particleCount) * i;
          const speed = Math.random() * 5 + 3;
          vx = Math.cos(angle) * speed;
          vy = Math.sin(angle) * speed;
        } else if (type < 0.6) {
          // Ring
          const angle = (Math.PI * 2 / particleCount) * i;
          const speed = Math.random() + 4;
          vx = Math.cos(angle) * speed;
          vy = Math.sin(angle) * speed;
        } else {
          // Chaotic explosion
          vx = (Math.random() - 0.5) * 12;
          vy = (Math.random() - 0.5) * 12;
        }

        particles.push(new Particle(x, y, color, { x: vx, y: vy }));
      }
    }

    function animate() {
      // The translucent color gives a trail effect
      ctx.fillStyle = 'rgba(1, 1, 11, 0.1)';
      ctx.fillRect(0, 0, width, height);

      particles.forEach((p, index) => {
        if (p.opacity > 0) {
          p.update();
          p.draw();
        } else {
          particles.splice(index, 1);
        }
      });

      requestAnimationFrame(animate);
    }

    // Launch random fireworks
    function launchAutoFirework() {
      const x = Math.random() * width;
      const y = Math.random() * (height * 0.6); // Top part of screen
      createFirework(x, y);

      const nextInterval = 500 + Math.random() * 2000;
      setTimeout(launchAutoFirework, nextInterval);
    }

    // On resize, regenerate the city, but not the fireworks
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      generateCity();
    }
    window.addEventListener('resize', resize);

    // Launch on click anywhere on canvas
    canvas.onclick = (e) => {
      createFirework(e.clientX, e.clientY);
    };

    resize();
    animate();
    setTimeout(launchAutoFirework, 1000);

  </script>
</body>

</html>
