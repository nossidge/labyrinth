<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Remember, remember">
  <title>It's The Fireworks Talking</title>
  <style>
    :root {
      --night-sky: #01010b;
      --sky-bottom: #1a1b3a;
      --building-colour: #000000;
      --window-colour: #111100;
      --window-on: #ffeeaa;
    }

    #flash-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: white;
      opacity: 0;
      z-index: 5;
      pointer-events: none;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, var(--night-sky), var(--sky-bottom));
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    #city-container {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 38vh;
      display: flex;
      align-items: flex-end;
      z-index: 10;
      pointer-events: none;
      overflow: hidden;
    }

    .building {
      background-color: var(--building-colour);
      position: relative;
      margin-right: 2px;
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      padding: 8px 4px;
      border-top: 1px solid #111111;
    }

    .building.tower::after {
      content: '';
      position: absolute;
      top: -15px;
      left: 20%;
      width: 60%;
      height: 15px;
      background: black;
    }

    .building.antenna::after {
      content: '';
      position: absolute;
      top: -30px;
      left: 50%;
      width: 2px;
      height: 30px;
      background: #222222;
    }

    .window {
      width: 4px;
      height: 6px;
      margin: 3px;
      background-color: var(--window-colour);
      transition: background-color 0.5s;
    }

    .window.on {
      background-color: var(--window-on);
      box-shadow: 0 0 4px var(--window-on);
    }

    .grain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44NSIgbnVtT2N0YXZlcz0iMyIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIvPjwvc3ZnPg==');
      opacity: 0.15;
      z-index: 100;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="flash-overlay"></div>
  <div class="grain"></div>

  <canvas id="canvas"></canvas>

  <div id="city-container">
    <!-- Buildings will be generated here -->
  </div>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('city-fireworks');

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const cityContainer = document.getElementById('city-container');

    // Maximum number of firework dots allowed on screen at once
    const MAX_FIREWORKS = 1200;

    const COLOURS_POOL = [
      '#0000ff', '#00ff00', '#00ffff', '#ff0000',
      '#ff00ff', '#ffaa00', '#ffff00', '#ffffff',
    ];
    const coloursRandomiser = new LAB.CyclicRandomiser(COLOURS_POOL);

    let winW, winH;
    let particles = [];

    // City generation
    function generateCity() {
      cityContainer.innerHTML = '';
      const buildingCount = Math.floor(winW / 40);
      for (let i = 0; i < buildingCount; i++) {
        const building = document.createElement('a');
        building.className = 'building';
        building.href = i === 0 ? LAB.goto() : LAB.pageRandomiser.nextOne();
        if (LAB.chance(0.2)) building.classList.add('tower');
        if (LAB.chance(0.2)) building.classList.add('antenna');

        const bHeight = LAB.rand(15, 95);
        const bWidth = LAB.rand(30, 90);
        building.style.height = bHeight + '%';
        building.style.width = bWidth + 'px';
        building.style.flex = 'none';

        // Add windows, on/off at random
        const windowCount = Math.floor((bHeight) * (bWidth) / 30);
        for (let j = 0; j < windowCount; j++) {
          const win = document.createElement('div');
          win.className = 'window';
          if (LAB.chance(0.2)) win.classList.add('on');
          building.appendChild(win);
        }

        cityContainer.appendChild(building);
      }
    }

    // Window flickering every so often
    function flickerWindows() {
      const windows = document.querySelectorAll('.window');
      if (windows.length > 0) {
        const count = LAB.randInt(0, 2);
        for (let i = 0; i < count; i++) {
          const win = windows[LAB.randIndex(windows)];
          win.classList.toggle('on');
        }
      }
      setTimeout(flickerWindows, LAB.rand(500, 700));
    }
    setTimeout(flickerWindows, 200);

    function hexToRgb(hex) {
      const h = hex.replace('#', '');
      return [
        parseInt(h.substring(0, 2), 16),
        parseInt(h.substring(2, 4), 16),
        parseInt(h.substring(4, 6), 16)
      ];
    }

    // Firework particle class
    class Particle {
      constructor(x, y, colour, velocity) {
        this.x = x;
        this.y = y;
        this.colour = colour;
        this.velocity = velocity;
        this.friction = 0.95;
        this.gravity = 0.05;
        this.opacity = 1;
        this.life = LAB.rand(100, 150);
        this.trail = [];
        this.trailLength = 20;
      }

      draw() {
        ctx.save();
        const len = this.trail.length;
        if (len > 1) {
          const [r, g, b] = hexToRgb(this.colour);
          const first = this.trail[0];
          const gradient = ctx.createLinearGradient(first.x, first.y, this.x, this.y);
          gradient.addColorStop(0, `rgba(${r},${g},${b},0)`);
          gradient.addColorStop(1, `rgba(${r},${g},${b},${this.opacity})`);
          ctx.strokeStyle = gradient;
          ctx.lineWidth = 1.5;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.beginPath();
          ctx.moveTo(first.x, first.y);
          for (let i = 1; i < len; i++) ctx.lineTo(this.trail[i].x, this.trail[i].y);
          ctx.lineTo(this.x, this.y);
          ctx.stroke();
        }
        // The head dot keeps the crackle
        ctx.globalAlpha = this.opacity;
        ctx.beginPath();
        ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
        ctx.fillStyle = this.colour;
        ctx.fill();
        ctx.restore();
      }

      update() {
        this.velocity.x *= this.friction;
        this.velocity.y *= this.friction;
        this.velocity.y += this.gravity;
        this.x += this.velocity.x;
        this.y += this.velocity.y;
        this.opacity -= 1 / this.life;
        this.trail.push({ x: this.x, y: this.y });
        if (this.trail.length > this.trailLength) this.trail.shift();
      }
    }

    function createFirework(x, y) {
      let particleCount = LAB.rand(60, 120);
      const room = MAX_FIREWORKS - particles.length;
      if (room <= 0) return;
      if (particleCount > room) particleCount = room;
      const colour = coloursRandomiser.nextOne();
      const type = LAB.rand(0, 1);

      // Flash effect
      const flash = document.getElementById('flash-overlay');
      flash.style.backgroundColor = colour;
      flash.style.opacity = '0.04';
      setTimeout(() => { flash.style.opacity = '0'; }, 100);

      for (let i = 0; i < particleCount; i++) {
        let vx, vy;
        if (type < 0.3) {
          // Sphere
          const angle = (Math.PI * 2 / particleCount) * i;
          const speed = LAB.rand(3, 8);
          vx = Math.cos(angle) * speed;
          vy = Math.sin(angle) * speed;
        } else if (type < 0.6) {
          // Ring
          const angle = (Math.PI * 2 / particleCount) * i;
          const speed = LAB.rand(4, 5);
          vx = Math.cos(angle) * speed;
          vy = Math.sin(angle) * speed;
        } else {
          // Chaotic explosion
          vx = LAB.rand(-6, 6);
          vy = LAB.rand(-6, 6);
        }

        particles.push(new Particle(x, y, colour, { x: vx, y: vy }));
      }
    }

    function tick() {
      ctx.clearRect(0, 0, winW, winH);

      particles.forEach(p => {
        if (p.opacity > 0) {
          p.update();
          p.draw();
        }
      });
      particles = particles.filter(p => p.opacity > 0);

      requestAnimationFrame(tick);
    }

    // Launch random fireworks
    function launchAutoFirework() {
      if (!document.hidden) {
        const x = LAB.rand(0, winW);
        const y = LAB.rand(0, winH * 0.6); // Top part of screen
        createFirework(x, y);
      }
    }

    // Clear fireworks when the tab is hidden so nothing bursts on return
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) particles = [];
    });

    // On resize, regenerate the city, but not the fireworks
    function resize() {
      winW = canvas.width = window.innerWidth;
      winH = canvas.height = window.innerHeight;
      generateCity();
    }
    window.addEventListener('resize', resize);

    // Launch on click anywhere on canvas
    document.addEventListener('click', (e) => {
      if (!e.target.closest('a')) {
        createFirework(e.clientX, e.clientY);
      }
    });

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, launchAutoFirework);
    });

    resize();
    tick();
    setInterval(launchAutoFirework, 2000);

  </script>
</body>

</html>
