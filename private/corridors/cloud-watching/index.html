<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Yet what is any ocean, but a multitude of drops?">
  <title>Your Monet or your Strife</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: monospace;
      overscroll-behavior: none;
      touch-action: none;
      position: fixed;
      top: 0;
      left: 0;
    }

    body {
      background: linear-gradient(180deg, #4a90d9 0%, #87ceeb 40%, #b0e0f0 70%, #dceefb 100%);
      overflow: hidden;
    }

    #sky {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    a {
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .cloud {
      position: absolute;
      opacity: 0.85;
      transition: opacity 0.4s ease;
      cursor: pointer;
    }

    .cloud:hover {
      transform: scale(1.05);
    }

    .cloud-blob {
      position: absolute;
      background: #ffffff;
      border-radius: 50%;
    }
  </style>
</head>

<body>
  <main id="sky"></main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('cloud-watching');

    const sky = document.getElementById('sky');
    let W = window.innerWidth;
    let H = window.innerHeight;

    // Cloud shapes: arrays of blob definitions [xOffset%, yOffset%, size%]
    // These are percentages relative to the cloud container's width/height.
    const CLOUD_SHAPES = [
      // Fluffy cumulus
      [
        [0.1, 0.5, 0.35],
        [0.3, 0.2, 0.45],
        [0.55, 0.35, 0.4],
        [0.75, 0.5, 0.3],
        [0.45, 0.1, 0.35],
      ],
      // Wide flat cloud
      [
        [0.0, 0.4, 0.3],
        [0.2, 0.25, 0.4],
        [0.45, 0.3, 0.38],
        [0.7, 0.35, 0.32],
        [0.35, 0.15, 0.3],
        [0.55, 0.15, 0.28],
      ],
      // Small puff
      [
        [0.15, 0.3, 0.45],
        [0.45, 0.2, 0.5],
        [0.3, 0.1, 0.4],
      ],
      // Tall tower
      [
        [0.2, 0.55, 0.4],
        [0.4, 0.3, 0.45],
        [0.25, 0.1, 0.35],
        [0.5, 0.45, 0.35],
        [0.35, 0.0, 0.3],
      ],
      // Wispy stretched
      [
        [0.0, 0.35, 0.28],
        [0.2, 0.25, 0.32],
        [0.4, 0.3, 0.3],
        [0.6, 0.2, 0.34],
        [0.8, 0.3, 0.26],
      ],
      // Anvil top
      [
        [0.15, 0.6, 0.35],
        [0.45, 0.5, 0.4],
        [0.3, 0.25, 0.5],
        [0.0, 0.15, 0.35],
        [0.6, 0.15, 0.35],
        [0.3, 0.05, 0.3],
      ],
      // Lopsided heap
      [
        [0.0, 0.45, 0.4],
        [0.25, 0.2, 0.5],
        [0.5, 0.35, 0.35],
        [0.15, 0.05, 0.3],
      ],
      // Double bump
      [
        [0.05, 0.4, 0.38],
        [0.3, 0.15, 0.4],
        [0.6, 0.15, 0.4],
        [0.5, 0.4, 0.35],
        [0.85, 0.45, 0.3],
      ],
      // Mushroom cap
      [
        [0.3, 0.55, 0.3],
        [0.15, 0.3, 0.4],
        [0.45, 0.3, 0.4],
        [0.3, 0.05, 0.45],
      ],
      // Long shelf
      [
        [0.0, 0.35, 0.25],
        [0.15, 0.3, 0.28],
        [0.3, 0.25, 0.3],
        [0.45, 0.28, 0.28],
        [0.6, 0.3, 0.26],
        [0.75, 0.35, 0.24],
        [0.4, 0.15, 0.25],
      ],
      // Packed six
      [
        [0.05, 0.5, 0.3],
        [0.15, 0.2, 0.32],
        [0.3, 0.5, 0.28],
        [0.35, 0.15, 0.35],
        [0.5, 0.45, 0.3],
        [0.52, 0.2, 0.3],
      ],
      // Bulging bottom
      [
        [0.1, 0.5, 0.42],
        [0.4, 0.45, 0.45],
        [0.7, 0.5, 0.38],
        [0.3, 0.2, 0.35],
        [0.5, 0.15, 0.3],
      ],
      // Fat blob
      [
        [0.1, 0.25, 0.5],
        [0.4, 0.2, 0.55],
        [0.25, 0.05, 0.35],
        [0.55, 0.4, 0.3],
      ],
    ];

    // Depth layers: further = smaller, slower, more transparent, higher on screen.
    const BASE_LAYERS = [
      { scale: 0.5, speed: 0.15, opacity: 0.4, yMin: 0.02, yMax: 0.25, count: 40 },
      { scale: 0.75, speed: 0.3, opacity: 0.6, yMin: 0.15, yMax: 0.45, count: 40 },
      { scale: 1.0, speed: 0.5, opacity: 0.85, yMin: 0.35, yMax: 0.9, count: 30 },
    ];

    // Counts are tuned for my 2400px wide screen, and scaled down for smaller viewports.
    const REFERENCE_WIDTH = 2400;

    const clouds = [];

    function buildClouds() {
      // Clear any existing clouds
      sky.innerHTML = '';
      clouds.length = 0;

      const widthRatio = Math.min(1, W / REFERENCE_WIDTH);
      const scaleCount = base => Math.max(3, Math.round(base * widthRatio));

      BASE_LAYERS.forEach(layer => {
        const count = scaleCount(layer.count);
        for (let i = 0; i < count; i++) {
          const cloudW = LAB.rand(120, 220) * layer.scale;
          const cloudH = cloudW * LAB.rand(0.5, 0.7);
          const shape = LAB.sample(CLOUD_SHAPES);

          const wrapper = document.createElement('a');
          wrapper.href = LAB.pageRandomiser.nextOne();
          wrapper.className = 'cloud';
          wrapper.style.width = cloudW + 'px';
          wrapper.style.height = cloudH + 'px';
          wrapper.style.opacity = layer.opacity;

          shape.forEach(([xOff, yOff, size]) => {
            const blob = document.createElement('div');
            blob.className = 'cloud-blob';
            const blobSize = cloudW * size;
            blob.style.width = blobSize + 'px';
            blob.style.height = blobSize + 'px';
            blob.style.left = (xOff * cloudW) + 'px';
            blob.style.top = (yOff * cloudH) + 'px';
            wrapper.appendChild(blob);
          });

          const x = LAB.rand(-cloudW, W);
          const y = LAB.rand(layer.yMin * H, layer.yMax * H);
          wrapper.style.left = x + 'px';
          wrapper.style.top = y + 'px';

          sky.appendChild(wrapper);

          clouds.push({
            el: wrapper,
            x: x,
            y: y,
            w: cloudW,
            speed: layer.speed * LAB.rand(0.7, 1.3),
          });
        }
      });
    }

    buildClouds();

    // On resize, rebuild clouds
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        W = window.innerWidth;
        H = window.innerHeight;
        buildClouds();
      }, 200);
    });

    // Animation loop
    let tick = 0;

    function animate() {
      tick++;

      // Move clouds
      clouds.forEach(c => {
        c.x += c.speed;
        if (c.x > W + 20) {
          c.x = -c.w - 20;
          c.y = LAB.rand(0.05 * H, 0.75 * H);
          c.el.href = LAB.pageRandomiser.nextOne();
        }
        c.el.style.left = c.x + 'px';
        c.el.style.top = c.y + 'px';
      });

      requestAnimationFrame(animate);
    }

    animate();

  </script>
</body>

</html>
