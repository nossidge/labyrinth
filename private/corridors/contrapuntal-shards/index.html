<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="In this eKonami?">
  <title>Gradiuspuntal Shards</title>
  <style>
    :root {
      --page-bg: #060608;
      --shard-bg: #14141c;
      --shard-border: #2a2a3a;
      --accent1: #ff007f;
      --accent2: #00e5ff;
      --cols: 8;
      --rows: 6;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      display: flex;
      width: 100%;
      height: 100%;
      background-color: var(--page-bg);
      font-family: serif;
      overflow: hidden;
      justify-content: center;
      align-items: center;
      user-select: none
    }

    #main {
      position: relative;
      width: 90vw;
      height: 85vh;
      max-width: 900px;
      max-height: 700px;
    }

    .shard {
      position: absolute;
      display: flex;
      background-color: var(--shard-bg);
      border: 1px solid var(--shard-border);
      color: #888888;
      font-size: 20px;
      text-decoration: none;
      justify-content: center;
      align-items: center;
      transition: transform 0.25s ease, background-color 0.25s ease, color 0.25s ease;
    }

    .shard:hover {
      background-color: var(--accent1);
      color: #ffffff;
      border-color: #ffffff;
      box-shadow: 0 0 20px var(--accent1);
      transform: scale(1.15) rotate(4deg);
      z-index: 50;
    }

    .shard.active-link {
      border-color: var(--accent2);
      color: var(--accent2);
    }

    .shard.active-link:hover {
      background-color: var(--accent2);
      color: #000000;
      box-shadow: 0 0 20px var(--accent2);
    }

    .shard.lit {
      background-color: var(--accent2);
      color: #000000;
      border-color: #ffffff;
      box-shadow: 0 0 25px var(--accent2);
      z-index: 60;
    }

    #main.solved .shard {
      animation: shardSweep 0.9s ease-in-out;
    }

    #main.solved .shard.lit {
      animation: litPulse 0.5s ease-in-out infinite alternate;
    }

    @keyframes shardSweep {
      0% {
        filter: brightness(1) hue-rotate(0deg);
      }

      50% {
        filter: brightness(2.2) hue-rotate(90deg);
      }

      100% {
        filter: brightness(1) hue-rotate(0deg);
      }
    }

    @keyframes litPulse {
      from {
        background-color: var(--accent2);
        box-shadow: 0 0 15px var(--accent2);
      }

      to {
        background-color: #ffffff;
        box-shadow: 0 0 45px var(--accent2);
      }
    }

    #sequence-flash {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center,
          rgba(0, 229, 255, 0.5),
          rgba(255, 0, 127, 0.35) 40%,
          transparent 75%);
      opacity: 0;
      pointer-events: none;
      z-index: 90;
      transform: scale(0.4);
    }

    #sequence-flash.active {
      animation: flashBurst 3s ease forwards;
    }

    @keyframes flashBurst {
      0% {
        opacity: 0;
        transform: scale(0.4);
      }

      25% {
        opacity: 1;
        transform: scale(1);
      }

      70% {
        opacity: 1;
        transform: scale(1.1);
      }

      100% {
        opacity: 0;
        transform: scale(1.3);
      }
    }

    #crt-scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.35) 50%);
      background-size: 100% 3px;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>

<body>
  <div id="sequence-flash"></div>
  <div id="crt-scanlines"></div>
  <main id="main"></main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('contrapuntal-shards');

    const main = document.getElementById('main');
    const flash = document.getElementById('sequence-flash');
    const GLYPHS = ['I', 'V', 'X', 'L', 'C', 'D', 'M', '◇', '◆', '❖'];

    const CSS_STYLE = getComputedStyle(document.documentElement);
    const COLS = Number(CSS_STYLE.getPropertyValue('--cols'));
    const ROWS = Number(CSS_STYLE.getPropertyValue('--rows'));

    const SEQUENCE_GLYPHS = ['▲', '▲', '▼', '▼', '◄', '►', '◄', '►'];
    const GLYPH_TO_DIRECTION = { '▲': 'up', '▼': 'down', '◄': 'left', '►': 'right' };
    const SEQUENCE_DIRECTIONS = SEQUENCE_GLYPHS.map(g => GLYPH_TO_DIRECTION[g]);

    let sequenceShards = [];
    let progress = 0;

    function init() {
      main.replaceChildren();
      main.classList.remove('solved');
      flash.classList.remove('active');
      progress = 0;
      sequenceShards = [];

      const w = 100 / COLS;
      const h = 100 / ROWS;
      const grid = [];

      for (let row = 0; row < ROWS; row++) {
        const rowCells = [];
        for (let col = 0; col < COLS; col++) {
          const isLink = LAB.chance(0.4);
          const shard = document.createElement('a');
          shard.className = 'shard' + (isLink ? ' active-link' : '');
          shard.href = LAB.pageRandomiser.nextOne();

          const left = col * w + LAB.rand(-1.5, 1.5);
          const top = row * h + LAB.rand(-1.5, 1.5);
          const rot = LAB.rand(-8, 8);

          shard.style.left = left + '%';
          shard.style.top = top + '%';
          shard.style.width = (w - 1) + '%';
          shard.style.height = (h - 1) + '%';
          shard.style.transform = `rotate(${rot}deg)`;

          // Random polygonal clip-path variation
          const p1 = LAB.randInt(0, 15);
          const p2 = LAB.randInt(85, 100);
          const p3 = LAB.randInt(85, 100);
          const p4 = LAB.randInt(0, 15);
          shard.style.clipPath = `polygon(${p1}% 0%, 100% ${p4}%, ${p2}% 100%, 0% ${p3}%)`;

          shard.innerText = LAB.sample(GLYPHS);
          main.appendChild(shard);
          rowCells.push(shard);
        }
        grid.push(rowCells);
      }

      // Place the sequence glyph in a random cell of each column
      for (let col = 0; col < Math.min(COLS, SEQUENCE_GLYPHS.length); col++) {
        const row = LAB.randInt(0, ROWS - 1);
        const shard = grid[row][col];
        shard.innerText = SEQUENCE_GLYPHS[col];
        sequenceShards.push(shard);
      }
    }

    // Arrow keys, WASD keys, HJKL keys
    const KEY_LEFT = new Set(['ArrowLeft', 'h', 'a']);
    const KEY_RIGHT = new Set(['ArrowRight', 'l', 'd']);
    const KEY_UP = new Set(['ArrowUp', 'k', 'w']);
    const KEY_DOWN = new Set(['ArrowDown', 'j', 's']);

    function keyDirection(e) {
      if (KEY_UP.has(e.key)) return 'up';
      if (KEY_DOWN.has(e.key)) return 'down';
      if (KEY_LEFT.has(e.key)) return 'left';
      if (KEY_RIGHT.has(e.key)) return 'right';
      return null;
    }

    function checkDirection(direction) {
      if (progress >= sequenceShards.length) return; // already solved

      if (direction === SEQUENCE_DIRECTIONS[progress]) {
        sequenceShards[progress].classList.add('lit');
        progress++;
        if (progress === sequenceShards.length) {
          triggerSequence();
        }
      } else {
        // If they press the wrong key, reset the sequence
        progress = 0;
        sequenceShards.forEach(s => s.classList.remove('lit'));
      }
    }

    function triggerSequence() {
      main.classList.add('solved');
      flash.classList.add('active');
      setTimeout(() => location.assign(LAB.goto()), 800);
    }

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, () => {
        const direction = keyDirection(e);
        if (direction) {
          e.preventDefault();
          checkDirection(direction);
        } else {
          init();
        }
      });
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a')) init();
    });

    init();

  </script>
</body>

</html>
