<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Perchance to dream">
  <title>one two three four...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --field-green: #4ade80;
      --sky-blue: #60a5fa;
      --fence-z: 10;
      --sheep-behind-z: 5;
      --sheep-above-z: 15;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--field-green);
      font-family: 'Bubblegum Sans', cursive;
    }

    #counter-container {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      text-align: center;
    }

    #counter-link {
      display: inline-block;
      font-size: 80px;
      color: #fff;
      text-shadow: 4px 4px 0px #f472b6, 8px 8px 0px #818cf8;
      text-decoration: none;
      transition: transform 0.2s;
      user-select: none;
    }

    #counter-link:hover {
      transform: scale(1.1) rotate(2deg);
    }

    #fence-link {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(15deg);
      z-index: var(--fence-z);
      display: block;
      width: 80%;
      max-width: 1200px;
    }

    #fence-img {
      width: 100%;
      height: auto;
      image-rendering: pixelated;
      display: block;
    }

    .sheep {
      position: absolute;
      font-size: 150px;
      text-decoration: none;
      user-select: none;
      z-index: var(--sheep-behind-z);
      display: inline-block;
      cursor: pointer;
      animation: walk 0.4s infinite alternate ease-in-out;
    }

    .sheep.jumping {
      animation: jump 1.5s ease-in-out forwards;
    }

    .sheep.jumped {
      z-index: var(--sheep-above-z);
    }

    @keyframes walk {
      0% {
        transform: rotate(-4deg);
      }

      100% {
        transform: rotate(4deg);
      }
    }

    @keyframes jump {
      0% {
        transform: translate(0, 0) scale(1) rotate(0deg);
        z-index: var(--sheep-behind-z);
      }

      40% {
        z-index: var(--sheep-above-z);
      }

      50% {
        transform: translate(-100px, -250px) scale(1.4) rotate(-20deg);
        z-index: var(--sheep-above-z);
      }

      100% {
        transform: translate(-200px, 0) scale(1) rotate(0deg);
        z-index: var(--sheep-above-z);
      }
    }

    .bg-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      pointer-events: none;
      z-index: 0;
    }

    .bg-circle.top-left {
      width: 300px;
      height: 300px;
      top: -100px;
      left: -100px;
    }

    .bg-circle.bottom-right {
      width: 500px;
      height: 500px;
      bottom: -200px;
      right: -200px;
      background: rgba(0, 0, 0, 0.05);
    }

    .grain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44NSIgbnVtT2N0YXZlcz0iMyIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIvPjwvc3ZnPg==');
      opacity: 0.2;
      z-index: 100;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="grain"></div>

  <div id="counter-container">
    <a id="counter-link" href="../index.html">0</a>
  </div>

  <div id="field">
    <div class="bg-circle top-left"></div>
    <div class="bg-circle bottom-right"></div>

    <a id="fence-link" href="../index.html">
      <img id="fence-img" src="fence.png" alt="fence">
    </a>

    <div id="sheep-container"></div>
  </div>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('counting-sheep');

    let sheepCount = 0;
    const counterDisplay = document.getElementById('counter-link');
    const sheepContainer = document.getElementById('sheep-container');

    function spawnSheep() {
      const sheep = document.createElement('a');
      sheep.className = 'sheep';
      sheep.textContent = '🐑';
      sheep.href = LAB.pageRandomiser.nextOne();

      // Start position: top right area
      // We want them to cross the fence which is roughly in the middle
      const startX = window.innerWidth + 200;
      const startY = LAB.rand(0, window.innerHeight * 0.4);

      sheep.style.left = startX + 'px';
      sheep.style.top = startY + 'px';

      sheepContainer.appendChild(sheep);

      // Animation logic
      let currentX = startX;
      let currentY = startY;

      const midX = window.innerWidth / 2;
      const midY = window.innerHeight / 2;

      const speedX = 3 + LAB.rand(0, 2);

      // Calculate speedY to ensure sheep crosses at (midX, midY)
      const framesToMid = (startX - midX) / speedX;
      const speedY = (midY - startY) / framesToMid;

      let hasJumped = false;

      function move() {
        currentX -= speedX;
        currentY += speedY;

        sheep.style.left = currentX + 'px';
        sheep.style.top = currentY + 'px';

        // Trigger jump just before it approaches the center fence
        const jumpOffset = 220;
        if (!hasJumped && currentX < midX + jumpOffset) {
          hasJumped = true;
          sheep.classList.add('jumping');

          // Increment count at peak of jump (approx 750ms into 1500ms anim)
          setTimeout(() => {
            sheepCount++;
            counterDisplay.textContent = sheepCount;
            // Add a little pop effect to counter
            counterDisplay.style.transform = 'scale(1.3) rotate(5deg)';
            setTimeout(() => {
              counterDisplay.style.transform = '';
            }, 200);
          }, 750);

          // Return to walking state after jump concludes
          setTimeout(() => {
            // Account for the translate(-200px) in the jump animation
            currentX -= 200;
            sheep.classList.remove('jumping');
            sheep.classList.add('jumped');
          }, 1500);
        }

        // Remove if off screen
        if (currentX < -300 || currentY > window.innerHeight + 300) {
          sheep.remove();
        } else {
          requestAnimationFrame(move);
        }
      }

      requestAnimationFrame(move);
    }

    // Spawn periodically
    setInterval(spawnSheep, LAB.rand(2500, 4500));

    // Initial spawn
    spawnSheep();

  </script>
</body>

</html>
