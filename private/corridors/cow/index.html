<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>moo</title>
  <meta name="description" content="moo">

  <style>
    :root {
      --bg: url('cow-spots.png');
    }

    body {
      background-image: var(--bg);
      background-repeat: repeat;
      background-size: 250px;
      background-color: #fafafa;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: default;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    #central-cow {
      position: absolute;
      top: 50%;
      left: 50%;
      font-size: clamp(250px, 50vh, 700px);
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.2));
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
    }

    #central-cow:hover {
      transform: translate(-50%, -50%) scale(1.3);
    }
  </style>
</head>

<body>
  <a href="../index.html">
    <div id="central-cow" aria-label="Cow Emoji">
      🐄
    </div>
  </a>

  <script src="../../common/labyrinthPages.js"></script>
  <script src="../../common/CyclicRandomiser.js"></script>
  <script>
    const currentPage = "corridors/cow";
    const otherPages = labyrinthPages.filter(p => !p.includes(currentPage));
    const pageRandomiser = new CyclicRandomiser(otherPages);
  </script>
</body>
