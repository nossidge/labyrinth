<!DOCTYPE html>
<html lang="en">

<!--
Cow spot backgrounds:
https://www.istockphoto.com/illustrations/cow-print-background
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="moo">
  <title>moo</title>

  <style>
    :root {
      --bg: url('bg1.jpg');
    }

    body {
      background-image: var(--bg);
      background-repeat: repeat;
      background-size: 250px;
      background-color: #fafafa;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: default;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    #central-cow {
      position: absolute;
      top: 50%;
      left: 50%;
      font-size: clamp(20px, 60vw, 300px);
      transform: translate(-50%, -50%);
      filter:
        drop-shadow(0 20px 40px rgba(0, 0, 0, 0.2)) drop-shadow(0 0 15px rgba(0, 0, 0, 0.6));
      transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      user-select: none;
    }

    #central-cow:hover {
      transform: translate(-50%, -50%) scale(1.15);
    }
  </style>
</head>

<body>
  <a href="../index.html">
    <div id="central-cow" aria-label="Cow emoji">
      🐄
    </div>
  </a>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('cow');

    const bgs = ['bg1.jpg', 'bg2.jpg', 'bg3.jpg', 'bg4.jpg', 'bg5.jpg', 'bg6.jpg'];
    const bgRandomiser = new LAB.CyclicRandomiser(bgs);

    function changeBackground() {
      document.documentElement.style.setProperty('--bg', "url('" + bgRandomiser.nextOne() + "')");
    }

    document.getElementById('central-cow').addEventListener('mouseenter', changeBackground);

    changeBackground();

  </script>
</body>

</html>
