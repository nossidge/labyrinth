<!DOCTYPE html>
<html lang="en">

<!--
https://en.wikipedia.org/wiki/PSR_B1919%2B21
https://en.wikipedia.org/wiki/Unknown_Pleasures
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Jostling Bell">
  <title>Unknown Pleasures</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #main {
      position: relative;
      width: 60vw;
      height: 80vh;
    }

    canvas,
    #passages {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    canvas {
      display: block;
    }

    #links {
      position: fixed;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 700px) {
      #main {
        width: 90vw;
      }
    }
  </style>
</head>

<body>
  <main id="main">
    <canvas id="canvas"></canvas>
    <nav id="links" aria-label="Forty passages"></nav>
  </main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('cp-1919');

    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    const links = document.getElementById('links');
    const lineCount = 40;
    const pointCount = 180;

    let lines = [];
    let width = 0;
    let height = 0;
    let widthStep = 0;

    let focusedIndex = -1;
    let hoveredIndex = -1;
    let mouseX = -1;
    let mouseY = -1;
    let lastInteraction = 'mouse';
    let isProgrammaticFocus = false;

    const envelopes = new Float32Array(pointCount);
    const xCoords = new Float32Array(pointCount);
    const baselines = new Float32Array(lineCount);
    const heightCache = Array.from({ length: lineCount }, () => new Float32Array(pointCount));

    for (let point = 0; point < pointCount; point++) {
      const x = point / (pointCount - 1);
      const distance = (x - 0.5) / 0.205;
      envelopes[point] = Math.exp(-distance * distance * 1.35);
    }

    // Give every ridge a collection of uneven waves
    function init() {
      lines = LAB.integerRange(0, lineCount - 1).map(() => {
        const waves = LAB.integerRange(0, 6).map((_, i) => {
          const frequency = LAB.rand(0.025, 0.15);
          const pointFreqs = new Float32Array(pointCount);
          for (let p = 0; p < pointCount; p++) {
            pointFreqs[p] = p * frequency * (i + 1);
          }
          return {
            phase: LAB.rand(0, Math.PI * 2),
            speed: LAB.randNegToPos(0.00028, 0.00004),
            strength: LAB.rand(0.35, 1),
            pointFreqs
          };
        });

        return {
          waves,
          roughness: LAB.rand(0.75, 1.25),
          drift: LAB.rand(0, Math.PI * 2)
        };
      });
    }

    function makeLinks() {
      links.innerHTML = '';
      for (let i = 0; i < lineCount; i++) {
        const link = document.createElement('a');
        link.href = LAB.pageRandomiser.nextOne();
        link.setAttribute('aria-label', `Link ${i + 1}`);
        link.addEventListener('focus', () => {
          focusedIndex = i;
          if (!isProgrammaticFocus) {
            lastInteraction = 'keyboard';
          }
        });
        link.addEventListener('blur', () => {
          if (focusedIndex === i) focusedIndex = -1;
        });
        links.appendChild(link);
      }
    }

    function resize() {
      const bounds = canvas.getBoundingClientRect();
      const pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
      width = bounds.width;
      height = bounds.height;
      canvas.width = Math.round(width * pixelRatio);
      canvas.height = Math.round(height * pixelRatio);
      context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

      widthStep = width / (pointCount - 1);
      for (let i = 0; i < pointCount; i++) {
        xCoords[i] = i * widthStep;
      }

      const topPadding = height * 0.25;
      const drawHeight = height - topPadding;
      const band = drawHeight / lineCount;
      for (let i = 0; i < lineCount; i++) {
        baselines[i] = topPadding + (i + 0.88) * band;
      }

      init();
    }

    function draw(time) {
      const ctx = context;
      ctx.clearRect(0, 0, width, height);
      const envHeight = height * 0.035;

      for (let line = 0; line < lineCount; line++) {
        const trace = lines[line];
        const cache = heightCache[line];
        const waves = trace.waves;
        const numWaves = waves.length;

        const slowPulse = 0.74 + 0.26 * Math.sin(time * 0.00016 + trace.drift);
        const roughPulse = trace.roughness * slowPulse;

        const currentPhases = new Float32Array(numWaves);
        for (let w = 0; w < numWaves; w++) {
          currentPhases[w] = waves[w].phase + time * waves[w].speed;
        }

        for (let point = 0; point < pointCount; point++) {
          let noise = 0;
          for (let w = 0; w < numWaves; w++) {
            const wave = waves[w];
            const wobble = Math.sin(wave.pointFreqs[point] + currentPhases[w]);
            noise += Math.abs(wobble) * wave.strength;
          }
          cache[point] = (0.7 + noise * roughPulse) * (1.2 + envelopes[point] * envHeight);
        }
      }

      let newHoveredIndex = -1;
      if (mouseX >= 0 && mouseY >= 0 && mouseX <= width && mouseY <= height) {
        let p = Math.round(mouseX / widthStep);
        p = Math.max(0, Math.min(pointCount - 1, p));
        for (let i = lineCount - 1; i >= 0; i--) {
          let y = baselines[i] - heightCache[i][p];
          if (mouseY > y) {
            newHoveredIndex = i;
            break;
          }
        }
      }

      if (lastInteraction === 'mouse') {
        if (newHoveredIndex !== hoveredIndex || (newHoveredIndex !== -1 && document.activeElement !== links.children[newHoveredIndex])) {
          hoveredIndex = newHoveredIndex;
          if (hoveredIndex !== -1) {
            const link = links.children[hoveredIndex];
            if (link && document.activeElement !== link) {
              isProgrammaticFocus = true;
              link.focus({ preventScroll: true });
              isProgrammaticFocus = false;
            }
          } else {
            if (document.activeElement && document.activeElement.parentElement === links) {
              isProgrammaticFocus = true;
              document.activeElement.blur();
              isProgrammaticFocus = false;
            }
          }
        }
      } else {
        hoveredIndex = newHoveredIndex;
      }

      const activeIndex = lastInteraction === 'keyboard' ? focusedIndex : hoveredIndex;
      canvas.style.cursor = (lastInteraction === 'mouse' && hoveredIndex !== -1) ? 'pointer' : 'default';

      ctx.fillStyle = '#000000';
      ctx.strokeStyle = '#ffffff';
      ctx.shadowColor = '#ffffff';

      // Black fills make each nearer ridge conceal the ridges behind it
      for (let index = 0; index < lineCount; index++) {
        const cache = heightCache[index];
        const baseline = baselines[index];
        const isActive = index === activeIndex;

        ctx.beginPath();
        ctx.moveTo(xCoords[0], baseline - cache[0]);
        for (let point = 1; point < pointCount; point++) {
          ctx.lineTo(xCoords[point], baseline - cache[point]);
        }

        ctx.lineWidth = isActive ? 5 : 3;
        ctx.stroke();

        ctx.lineTo(width, height + 2);
        ctx.lineTo(0, height + 2);
        ctx.closePath();
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }

    canvas.addEventListener('mousemove', (e) => {
      const bounds = canvas.getBoundingClientRect();
      mouseX = e.clientX - bounds.left;
      mouseY = e.clientY - bounds.top;
      lastInteraction = 'mouse';
    });

    canvas.addEventListener('mouseleave', () => {
      mouseX = -1;
      mouseY = -1;
    });

    canvas.addEventListener('click', () => {
      lastInteraction = 'mouse';
      if (hoveredIndex !== -1) {
        const link = links.children[hoveredIndex];
        if (link) link.click();
      }
    });

    makeLinks();
    resize();
    requestAnimationFrame(draw);

    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(resize, 100);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a, canvas')) init();
    });

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, init);
    });

  </script>
</body>

</html>
