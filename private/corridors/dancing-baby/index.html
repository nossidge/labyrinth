<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="high on believing">
  <title>calista pop-tart</title>
  <style>
    :root {
      --accent-color: #ff00ff;
      --shadow-color: rgba(0, 0, 0, 0.5);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background-color: #000;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      overflow: hidden;
    }

    #background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      object-fit: fill;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Space Grotesque', sans-serif;
    }

    .baby-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 5;
    }

    .baby-link {
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: block;
      position: relative;
    }

    .baby-link img {
      display: block;
      border-radius: 10px;
      box-shadow: 0 10px 30px var(--shadow-color);
      border: 4px solid #fff;
    }

    /* Side babies sizes */
    .small-baby img {
      width: 12vw;
      min-width: 120px;
    }

    /* Middle baby size - larger than the others */
    .large-baby img {
      width: 22vw;
      min-width: 250px;
      border-color: var(--accent-color);
    }

    /* Hover effect: grow larger */
    .baby-link:hover {
      transform: scale(1.25);
      z-index: 20;
    }

    /* Slightly less growth since it's already big */
    .large-baby:hover {
      transform: scale(1.15);
    }

    @media (max-width: 768px) {
      .baby-container {
        flex-direction: column;
        gap: 15px;
      }

      .small-baby img {
        width: 30vw;
        min-width: 100px;
      }

      .large-baby img {
        width: 50vw;
        min-width: 180px;
      }

      .large-baby:hover {
        transform: scale(1.1);
      }
    }
  </style>
</head>

<body>
  <img src="background.gif" id="background" alt="Ally McBeal in her apartment">

  <main class="baby-container">
    <a href="../index.html" class="baby-link small-baby">
      <img src="sk_baby.max" alt="Dancing Baby Meme">
    </a>

    <a href="../index.html" class="baby-link large-baby">
      <img src="sk_baby.max" alt="The Original Dancing Baby">
    </a>

    <a href="../index.html" class="baby-link small-baby">
      <img src="sk_baby.max" alt="Dancing Baby Meme">
    </a>
  </main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('dancing-baby');
  </script>
</body>

</html>
