<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Girls best friend">
  <title>Diamond Shift</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #111;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #grid {
      position: relative;
    }

    .diamond {
      position: absolute;
      width: 50px;
      height: 50px;
      transform: rotate(45deg);
      border: 1px solid #fff;
      display: block;
      text-decoration: none;
      transition:
        left 0.8s cubic-bezier(0.4, 0, 0.2, 1),
        filter 0.2s ease,
        transform 0.2s ease;
    }

    .diamond.light {
      background-color: #fff;
    }

    .diamond.dark {
      background-color: #111;
    }

    .diamond:hover {
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.6));
      transform: rotate(45deg) scale(1.15);
      z-index: 999 !important;
    }

    #overlays {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.03));
      background-size: 100% 2px, 3px 100%;
    }
  </style>
</head>

<body>
  <div id="overlays"></div>
  <main id="grid"></main>

  <script src="../../common/CyclicRandomiser.js"></script>
  <script src="../../common/labyrinthPages.js"></script>
  <script>
    const currentPage = "corridors/diamond-shift";
    const otherPages = labyrinthPages.filter(p => !p.includes(currentPage));
    const pageRandomiser = new CyclicRandomiser(otherPages);

    const maxCols = 14;
    const maxRows = 10;
    const diamondSize = 50;
    const sidePadding = 100;
    const spacing = diamondSize + 4;
    const grid = document.getElementById('grid');

    let currentCols = maxCols;
    let currentRows = maxRows;
    let diamonds = [];
    let shiftTimer = null;

    // Calculate how many cells fit in a given dimension.
    // Always returns an even number, clamped between 2 and max.
    function calcAxis(viewportSize, max) {
      const rotatedSize = Math.ceil(diamondSize * Math.SQRT2);
      const available = viewportSize - sidePadding - rotatedSize + spacing;
      const wanted = Math.floor(available / spacing);
      return Math.max(2, Math.min(max, wanted % 2 === 0 ? wanted : wanted - 1));
    }

    function calcRowsAndCols() {
      return [calcAxis(window.innerWidth, maxCols), calcAxis(window.innerHeight, maxRows)];
    }

    // Top left should always be at the back.
    // Bottom right should always be at the front.
    function updateZIndices() {
      for (let r = 0; r < currentRows; r++) {
        for (let c = 0; c < currentCols; c++) {
          diamonds[r][c].el.style.zIndex = r * currentCols + c;
        }
      }
    }

    function buildGrid() {
      grid.innerHTML = '';
      diamonds = [];
      [currentCols, currentRows] = calcRowsAndCols();

      const gridWidth = currentCols * spacing;
      const gridHeight = currentRows * spacing;
      grid.style.width = `${gridWidth}px`;
      grid.style.height = `${gridHeight}px`;

      for (let r = 0; r < currentRows; r++) {
        const row = [];
        for (let c = 0; c < currentCols; c++) {
          const a = document.createElement('a');
          a.href = pageRandomiser.nextOne();
          const isLight = (r + c) % 2 === 0;
          a.className = `diamond ${isLight ? 'light' : 'dark'}`;
          a.style.top = `${r * spacing}px`;
          a.style.left = `${c * spacing}px`;
          a.dataset.row = r;
          a.dataset.col = c;
          grid.appendChild(a);
          row.push({ el: a, col: c });
        }
        diamonds.push(row);
      }
      updateZIndices();
    }

    function shiftRow(rowIndex) {
      const row = diamonds[rowIndex];
      const shiftRight = rowIndex % 2 === 0;

      if (shiftRight) {
        const last = row.pop();
        row.unshift(last);
      } else {
        const first = row.shift();
        row.push(first);
      }

      for (let c = 0; c < currentCols; c++) {
        row[c].col = c;
        row[c].el.style.left = `${c * spacing}px`;
      }
    }

    function startShifting() {
      if (shiftTimer) clearInterval(shiftTimer);
      shiftTimer = setInterval(() => {
        for (let r = 0; r < currentRows; r++) {
          shiftRow(r);
        }
        updateZIndices();
      }, 2000);
    }

    function init() {
      buildGrid();
      startShifting();
    }

    window.addEventListener('resize', () => {
      const [newCols, newRows] = calcRowsAndCols();
      if (newCols !== currentCols || newRows !== currentRows) {
        init();
      }
    });

    init();

  </script>
</body>

</html>
