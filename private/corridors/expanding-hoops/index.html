<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="i'm 'aving 'oops">
  <title>Exhalation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #000000;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 0;
    }

    main {
      position: fixed;
      display: flex;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      flex-wrap: wrap;
      align-content: flex-start;
      z-index: 1;
    }

    main a {
      display: block;
      position: relative;
      width: var(--cell-size);
      height: var(--cell-size);
      margin: var(--cell-gap);
      background: transparent;
      text-decoration: none;
      transition: box-shadow 0.2s ease;
    }

    main a:hover {
      background: #ffffff !important;
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.6);
    }

    /* Embiggen to remove dead space between links for mouse */
    main a::before {
      position: absolute;
      inset: calc(var(--cell-gap) * -1);
      content: '';
    }

    #crt-scanlines {
      position: fixed;
      width: 100vw;
      height: 100vh;
      top: 0;
      left: 0;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.03));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>

<body>
  <div id="crt-scanlines"></div>
  <canvas id="canvas"></canvas>
  <main id="main"></main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('expanding-hoops');

    const main = document.getElementById('main');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const cellSize = 12;
    const gap = 2;
    const halfGap = gap / 2;
    const step = cellSize + gap;

    document.documentElement.style.setProperty('--cell-size', cellSize + 'px');
    document.documentElement.style.setProperty('--cell-gap', halfGap + 'px');

    const speed = 0.0015;
    const waveFreq = 0.4;

    let cols, rows, dists, offsetX, offsetY;
    let time = 0;

    function init() {
      main.replaceChildren();

      cols = Math.floor(window.innerWidth / step);
      rows = Math.floor(window.innerHeight / step);
      dists = new Float32Array(cols * rows);

      offsetX = (window.innerWidth - cols * step) / 2;
      offsetY = (window.innerHeight - rows * step) / 2;

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      main.style.left = offsetX + 'px';
      main.style.top = offsetY + 'px';
      main.style.width = (cols * step) + 'px';

      const centerCol = (cols - 1) / 2;
      const centerRow = (rows - 1) / 2;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const a = document.createElement('a');
          a.href = LAB.pageRandomiser.nextOne();
          main.appendChild(a);

          const dx = c - centerCol;
          const dy = r - centerRow;
          dists[r * cols + c] = Math.sqrt(dx * dx + dy * dy);
        }
      }
    }

    function tick(timestamp) {
      time = timestamp * speed;
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let i = 0;
      for (let r = 0; r < rows; r++) {
        const y = offsetY + r * step + halfGap;
        for (let c = 0; c < cols; c++) {
          const val = Math.sin(dists[i] * waveFreq - time);
          if (val > 0) {
            const bright = Math.floor(val * 255);
            ctx.fillStyle = 'rgb(' + bright + ',' + bright + ',' + bright + ')';
            ctx.fillRect(offsetX + c * step + halfGap, y, cellSize, cellSize);
          }
          i++;
        }
      }
      requestAnimationFrame(tick);
    }

    // There was a little bit of a CPU hog here
    // This time out should solve it without being too annoying
    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(init, 200);
    });

    init();
    requestAnimationFrame(tick);

  </script>
</body>

</html>
