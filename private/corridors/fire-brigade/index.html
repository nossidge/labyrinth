<!DOCTYPE html>
<html lang="en">

<!--
This game is not exhaustively tested.
I've no idea if every combination can be won.
Seems to work for the most part though.
Let me know if you find a layout that is impossible to win.
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sam is the hero next door">
  <title>🚒 💦 🔥</title>
  <style>
    :root {
      --outer-pad: 10px;
      --status-h: 40px;
      --border: 3px;
      --pad: 10px;
      --grid-border: 1px;
      --chrome: calc((var(--border) + var(--pad) + var(--grid-border)) * 2);
      --avail-w: calc(100vw - var(--chrome) - var(--outer-pad) * 2);
      --avail-h: calc(100vh - var(--chrome) - var(--outer-pad) - var(--status-h));
      --cell: min(calc(var(--avail-w) / 12), calc(var(--avail-h) / 12));
    }

    body {
      background-color: #000000;
      background-image:
        linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 20px 20px;
      color: #888888;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
      box-sizing: border-box;
    }

    #outer {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: var(--outer-pad) var(--outer-pad) 0;
    }

    #ui-container {
      border: var(--border) solid #444444;
      background: #111111;
      padding: var(--pad);
      position: relative;
    }

    #grid {
      display: grid;
      grid-template-columns: repeat(12, var(--cell));
      grid-template-rows: repeat(12, var(--cell));
      background: #000000;
      border: var(--grid-border) solid #333333;
    }

    .cell {
      width: var(--cell);
      height: var(--cell);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(var(--cell) * 0.8);
      line-height: 1;
      user-select: none;
      position: relative;
    }

    .pipe-cell {
      cursor: pointer;
      transition: background 0.1s;
    }

    .pipe-cell:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .pipe-char {
      display: inline-block;
      transform: scaleX(1.5);
      font-weight: bold;
      pointer-events: none;
      transition: color 0.1s;
    }

    .active .pipe-char {
      color: #00ddee;
      text-shadow: 0 0 8px rgba(0, 221, 238, 0.8);
    }

    .building {
      font-size: calc(var(--cell) * 0.6);
    }

    .building-link {
      text-decoration: none;
      color: inherit;
      display: block;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .building-link:hover {
      filter: brightness(1.5) drop-shadow(0 0 5px rgba(255, 255, 255, 0.5));
    }

    /* The fire engine emoji needs to be flipped */
    .source {
      transform: scaleX(-1);
    }

    #status {
      margin: 10px 0;
      height: 20px;
      font-weight: bold;
      text-align: center;
      visibility: hidden;
      text-decoration: none;
      font-size: 20px;
    }

    #status.success {
      color: #00ff00;
    }

    #status.failure {
      color: #ff0000;
      text-shadow: 0 0 5px #ff0000;
    }

    #status.flooded {
      color: #00ddee;
      text-shadow: 0 0 5px #00ddee;
    }

    .fire-ovl {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      font-size: calc(var(--cell) * 0.6);
      animation: fire-flicker 0.3s infinite alternate;
      z-index: 5;
    }

    @keyframes fire-flicker {
      from {
        transform: scale(0.9) translateY(0);
        filter: drop-shadow(0 0 2px orange);
      }

      to {
        transform: scale(1.1) translateY(-2px);
        filter: drop-shadow(0 0 8px red);
      }
    }

    .building {
      position: relative;
    }
  </style>
</head>

<body>
  <div id="outer">
    <div id="ui-container">
      <div id="grid"></div>
    </div>
    <a id="status"></a>
  </div>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('fire-brigade');

    const statusElement = document.getElementById('status');
    statusElement.href = LAB.goto();

    const PIPES_CONFIG = {
      '─': { n: 0, s: 0, e: 1, w: 1, rotate: '│' },
      '│': { n: 1, s: 1, e: 0, w: 0, rotate: '─' },
      '┌': { n: 0, s: 1, e: 1, w: 0, rotate: '┐' },
      '┐': { n: 0, s: 1, e: 0, w: 1, rotate: '┘' },
      '┘': { n: 1, s: 0, e: 0, w: 1, rotate: '└' },
      '└': { n: 1, s: 0, e: 1, w: 0, rotate: '┌' },
      '├': { n: 1, s: 1, e: 1, w: 0, rotate: '┬' },
      '┬': { n: 0, s: 1, e: 1, w: 1, rotate: '┤' },
      '┤': { n: 1, s: 1, e: 0, w: 1, rotate: '┴' },
      '┴': { n: 1, s: 0, e: 1, w: 1, rotate: '├' }
    };
    const PIPE_CHARS = Object.keys(PIPES_CONFIG);

    const BUILDINGS_POOL = [
      '🏠', '🏢', '🏭', '🏥', '🏤', '🏨', '🏦', '🏪', '🏫', '🏛️', '🏚️', '🏗️'
    ];
    const buildingsRandomiser = new LAB.CyclicRandomiser(BUILDINGS_POOL);

    const GRID_SIZE = 12;
    const INNER_START = 1;
    const INNER_END = GRID_SIZE - 2;

    function randomDestination() {
      const min = (INNER_END / 2) + 2;
      const max = INNER_END;
      const halfWayValue = LAB.randInt(min, max - 1);
      return { r: halfWayValue, c: GRID_SIZE - 1 };
    }

    function randomSource() {
      const min = 1;
      const max = INNER_END / 2;
      const halfWayValue = LAB.randInt(min, max - 1);
      return { r: halfWayValue, c: 0 };
    }

    const sourceEmoji = '🚒';
    const destEmoji = '🔥';

    const TURNS_TO_SPREAD = 8;
    let totalTurns = 0;
    let gridData = [];

    function initGrid() {
      const gridEl = document.getElementById('grid');
      for (let r = 0; r < GRID_SIZE; r++) {
        gridData[r] = [];
        for (let c = 0; c < GRID_SIZE; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';

          if (r === sourcePos.r && c === sourcePos.c) {
            cell.innerHTML = `<a href="${LAB.pageRandomiser.nextOne()}" class="building-link">${sourceEmoji}</a>`;
            cell.classList.add('building', 'source');
            gridData[r][c] = { type: 'source', r, c };
          } else if (r === destPos.r && c === destPos.c) {
            const emoji = buildingsRandomiser.nextOne();
            cell.innerHTML = `<a href="${LAB.pageRandomiser.nextOne()}" class="building-link">${emoji}</a><div class="fire-ovl">🔥</div>`;
            cell.classList.add('building');
            gridData[r][c] = { type: 'building', r, c, onFire: true };
          } else if (r >= INNER_START && r <= INNER_END && c >= INNER_START && c <= INNER_END) {
            let char;
            if (r === sourcePos.r && c === sourcePos.c + 1) {
              // There's a very small edge case that we need to account for.
              // When the source is in the top left we cannot have this pipe be straight.
              // Otherwise it would never be able to hose down the building at right angles to it.
              // So ensure first pipe connects to source (needs 'w').
              let connectingPipes = PIPE_CHARS.filter(p => PIPES_CONFIG[p].w === 1);
              if (r === 1 && c === 1) {
                connectingPipes = connectingPipes.filter(p => p !== '─');
              }
              char = LAB.sample(connectingPipes);
            } else {
              char = LAB.sample(PIPE_CHARS);
            }
            cell.innerHTML = `<span class="pipe-char">${char}</span>`;
            cell.classList.add('pipe-cell');
            gridData[r][c] = { type: 'pipe', r, c, char: char };
            cell.onclick = () => rotatePipe(r, c, cell);
          } else if (r === 0 || r === GRID_SIZE - 1 || c === 0 || c === GRID_SIZE - 1) {
            const isCorner = (r === 0 || r === GRID_SIZE - 1) && (c === 0 || c === GRID_SIZE - 1);
            if (!isCorner) {
              const emoji = buildingsRandomiser.nextOne();
              cell.innerHTML = `<a href="${LAB.pageRandomiser.nextOne()}" class="building-link">${emoji}</a>`;
              cell.classList.add('building');
              gridData[r][c] = { type: 'building', r, c, onFire: false };
            } else {
              gridData[r][c] = { type: 'empty', r, c };
            }
          } else {
            gridData[r][c] = { type: 'empty', r, c };
          }

          gridEl.appendChild(cell);
          gridData[r][c].el = cell;
        }
      }
      updateWaterFlow();
    }

    function rotatePipe(r, c, el) {
      addTurn();
      const pipe = gridData[r][c];
      pipe.char = PIPES_CONFIG[pipe.char].rotate;
      el.querySelector('.pipe-char').innerHTML = pipe.char;
      updateWaterFlow();
    }

    function addTurn() {
      totalTurns++;
      if (totalTurns % TURNS_TO_SPREAD === 0) spreadFire();
    }

    function getNeighbors(r, c) {
      const n = [];
      const deltas = [[-1, 0, 'n', 's'], [1, 0, 's', 'n'], [0, 1, 'e', 'w'], [0, -1, 'w', 'e']];
      for (const [dr, dc, dir, opp] of deltas) {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
          n.push({ r: nr, c: nc, dir, opp });
        }
      }
      return n;
    }

    function spreadFire() {
      const newFires = [];
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cell = gridData[r][c];
          if (cell.type === 'building' && !cell.onFire && !cell.active) {
            // Check 8 neighbors (including diagonals) for fire spread
            let neighborOnFire = false;
            for (let dr = -1; dr <= 1; dr++) {
              for (let dc = -1; dc <= 1; dc++) {
                if (dr === 0 && dc === 0) continue;
                const nr = r + dr, nc = c + dc;
                if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
                  if (gridData[nr][nc].onFire) neighborOnFire = true;
                }
              }
            }

            if (neighborOnFire) {
              newFires.push(cell);
            }
          }
        }
      }

      newFires.forEach(cell => {
        cell.onFire = true;
        if (!cell.el.querySelector('.fire-ovl')) {
          const fire = document.createElement('div');
          fire.className = 'fire-ovl';
          fire.innerHTML = '🔥';
          cell.el.appendChild(fire);
        }
      });

      checkWin();
    }

    function updateWaterFlow() {
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          gridData[r][c].el.classList.remove('active');
          gridData[r][c].active = false;
        }
      }

      const queue = [{ r: sourcePos.r, c: sourcePos.c }];
      gridData[sourcePos.r][sourcePos.c].active = true;
      const visited = new Set();

      while (queue.length > 0) {
        const { r, c } = queue.shift();
        const key = `${r},${c}`;
        if (visited.has(key)) continue;
        visited.add(key);

        const current = gridData[r][c];
        current.active = true;
        current.el.classList.add('active');

        // Extinguish fire if water reaches it
        if (current.onFire && current.active) {
          current.onFire = false;
          const fire = current.el.querySelector('.fire-ovl');
          if (fire) fire.remove();
        }

        const neighbors = getNeighbors(r, c);
        for (const { r: nr, c: nc, dir, opp } of neighbors) {
          const neighbor = gridData[nr][nc];
          let canExit = false;
          if (current.type === 'source' && dir === 'e') canExit = true;
          else if (current.type === 'pipe' && PIPES_CONFIG[current.char][dir]) canExit = true;

          let canEnter = false;
          if (neighbor.type === 'building' && opp === 'w' && neighbor.c === 11) canEnter = true;
          else if (neighbor.type === 'building' && opp === 'e' && neighbor.c === 0) canEnter = true;
          else if (neighbor.type === 'building' && opp === 'n' && neighbor.r === 11) canEnter = true;
          else if (neighbor.type === 'building' && opp === 's' && neighbor.r === 0) canEnter = true;
          else if (neighbor.type === 'pipe' && PIPES_CONFIG[neighbor.char][opp]) canEnter = true;

          if (canExit && canEnter && !neighbor.active) {
            queue.push({ r: nr, c: nc });
          }
        }
      }

      checkWin();
    }

    // Check if the fire is out, or if the fire is citywide
    function checkWin() {
      let anyFire = false;
      let onFireCount = 0;
      let buildingCount = 0;

      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          const cell = gridData[r][c];
          if (cell.type === 'building') {
            buildingCount++;
            if (cell.onFire) {
              anyFire = true;
              onFireCount++;
            }
          }
        }
      }

      if (!anyFire) {
        statusElement.innerHTML = 'FIRE CONTAINED!';
        statusElement.className = 'success';
        statusElement.style.visibility = 'visible';
      } else if (onFireCount === buildingCount && buildingCount > 0) {
        statusElement.innerHTML = 'THE CITY IS IN ASHES. YOU HAVE FAILED UTTERLY.';
        statusElement.className = 'failure';
        statusElement.style.visibility = 'visible';
      } else {
        statusElement.style.visibility = 'hidden';
      }
      checkAllPipesFullOfWater();
    }

    // Check if all pipes are full of water
    function checkAllPipesFullOfWater() {
      let totalPipes = 0;
      let activePipes = 0;
      for (let r = 0; r < GRID_SIZE; r++) {
        for (let c = 0; c < GRID_SIZE; c++) {
          if (gridData[r][c].type === 'pipe') {
            totalPipes++;
            if (gridData[r][c].active) {
              activePipes++;
            }
          }
        }
      }

      if (totalPipes > 0 && activePipes === totalPipes) {
        statusElement.innerHTML = 'YOU FOOL! YOU HAVE FLOODED THE CITY!';
        statusElement.className = 'flooded';
        statusElement.style.visibility = 'visible';
      }
    }

    const sourcePos = randomSource();
    const destPos = randomDestination();

    initGrid();

    // Press the ` key to tick the game once
    document.addEventListener('keydown', (e) => {
      if (e.key === '`') addTurn();
    });

  </script>
</body>

</html>
