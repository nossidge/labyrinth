<!DOCTYPE html>
<html lang="en">

<!--
Oh! joy it was for her, and joy for me!
-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="You would not believe your eyes">
  <title>Among all lovely things</title>
  <style>
    :root {
      --sky-top: #4a2c5e;
      --sky-mid: #7a4a8a;
      --sky-bottom: #d97e3d;
      --water-dark: #1a3a4a;
      --water-light: #3a5a6a;
      --water-reflect: #8a6a3d;
      --grain-opacity: 0.06;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-mid) 40%, var(--sky-bottom) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .grain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44NSIgbnVtT2N0YXZlcz0iMyIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIvPjwvc3ZnPg==');
      opacity: var(--grain-opacity);
      z-index: 100;
      pointer-events: none;
    }

    #scene {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #water {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: linear-gradient(to bottom, var(--water-light), var(--water-dark));
      opacity: 0.9;
    }

    #water::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        repeating-linear-gradient(90deg,
          transparent,
          transparent 2px,
          rgba(255, 255, 255, 0.05) 2px,
          rgba(255, 255, 255, 0.05) 4px),
        repeating-linear-gradient(0deg,
          transparent,
          transparent 3px,
          rgba(255, 255, 255, 0.03) 3px,
          rgba(255, 255, 255, 0.03) 6px);
      pointer-events: none;
    }

    #reflection {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 45%;
      background: linear-gradient(to bottom, var(--sky-bottom) 0%, var(--sky-mid) 50%, transparent 100%);
      opacity: 0.3;
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .firefly {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      cursor: pointer;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: filter 0.3s ease, transform 0.1s ease;
    }

    .firefly::before {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 200, 0.9), rgba(255, 220, 100, 0.6));
      animation: glow var(--glow-duration, 2s) ease-in-out infinite;
      box-shadow:
        0 0 8px rgba(255, 240, 150, 0.8),
        0 0 15px rgba(255, 200, 50, 0.5),
        inset -1px -1px 3px rgba(0, 0, 0, 0.3);
    }

    .firefly::after {
      content: '';
      position: absolute;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 200, 0.3), transparent);
      animation: glow-outer var(--glow-duration, 2s) ease-in-out infinite;
      filter: blur(2px);
    }

    .firefly:hover::before {
      animation-play-state: paused;
      box-shadow:
        0 0 15px rgba(255, 240, 150, 1),
        0 0 25px rgba(255, 200, 50, 0.8),
        inset -1px -1px 3px rgba(0, 0, 0, 0.5);
    }

    .firefly:hover::after {
      animation-play-state: paused;
      width: 20px;
      height: 20px;
    }

    @keyframes glow {

      0%,
      100% {
        opacity: 0.3;
        box-shadow:
          0 0 6px rgba(255, 240, 150, 0.5),
          0 0 12px rgba(255, 200, 50, 0.2),
          inset -1px -1px 3px rgba(0, 0, 0, 0.3);
      }

      50% {
        opacity: 1;
        box-shadow:
          0 0 12px rgba(255, 240, 150, 1),
          0 0 20px rgba(255, 200, 50, 0.6),
          inset -1px -1px 3px rgba(0, 0, 0, 0.3);
      }
    }

    @keyframes glow-outer {

      0%,
      100% {
        opacity: 0.2;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(1.3);
      }
    }

    @keyframes drift {

      0%,
      100% {
        transform: translate(0, 0);
      }

      25% {
        transform: translate(var(--drift-x1), var(--drift-y1));
      }

      50% {
        transform: translate(var(--drift-x2), var(--drift-y2));
      }

      75% {
        transform: translate(var(--drift-x3), var(--drift-y3));
      }
    }

    .firefly.drifting {
      animation: drift var(--drift-duration, 15s) ease-in-out infinite;
    }

    #foreground {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50%;
      z-index: 20;
      pointer-events: none;
    }

    .plant {
      position: absolute;
      bottom: 0;
      cursor: pointer;
      text-decoration: none;
      display: block;
      pointer-events: auto;
      transition: filter 0.3s ease;
    }

    .plant:hover {
      filter: brightness(1.3) drop-shadow(0 0 8px rgba(100, 150, 100, 0.8));
    }

    .bulrush {
      width: var(--plant-width, 8px);
      height: var(--plant-height, 180px);
      background: linear-gradient(to top, #2a3a2a 0%, #3a5a3a 50%, #4a6a4a 100%);
      border-radius: 50% 50% 0 0;
      box-shadow:
        inset -1px 0 2px rgba(255, 255, 255, 0.1),
        inset 1px 0 2px rgba(0, 0, 0, 0.3),
        0 0 4px rgba(0, 0, 0, 0.4);
      transform-origin: bottom center;
    }

    .bulrush::before {
      content: '';
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 12px;
      height: 64px;
      background: #3a4a3a;
      border-radius: 50%;
      box-shadow:
        inset -1px -1px 2px rgba(0, 0, 0, 0.4),
        0 0 3px rgba(0, 0, 0, 0.5);
    }

    .bulrush::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(90deg,
          transparent,
          transparent 1px,
          rgba(255, 255, 255, 0.05) 1px,
          rgba(255, 255, 255, 0.05) 2px);
      pointer-events: none;
    }

    .reed {
      width: var(--plant-width, 3px);
      height: var(--plant-height, 140px);
      background: linear-gradient(to top, #2a4a2a 0%, #3a6a3a 100%);
      transform-origin: bottom center;
      box-shadow:
        inset -0.5px 0 1px rgba(255, 255, 255, 0.1),
        0 0 2px rgba(0, 0, 0, 0.3);
    }

    .reed::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 5px;
      height: 8px;
      background: #3a5a3a;
      border-radius: 50%;
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.4);
    }

    .reed::after {
      content: '';
      position: absolute;
      top: -8px;
      left: -1px;
      width: 2px;
      height: 6px;
      background: #2a4a2a;
      border-radius: 50%;
      opacity: 0.7;
    }

    .cattail {
      width: var(--plant-width, 6px);
      height: var(--plant-height, 160px);
      background: linear-gradient(to top, #2a3a2a 0%, #3a5a3a 80%, transparent 100%);
      transform-origin: bottom center;
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.4);
    }

    .cattail::before {
      content: '';
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 14px;
      background: linear-gradient(to top, #3a4a3a 0%, #4a5a4a 100%);
      border-radius: 50%;
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
    }

    @keyframes sway {

      0%,
      100% {
        transform: rotate(0deg);
      }

      50% {
        transform: rotate(var(--sway-angle, 2deg));
      }
    }

    .plant.sway {
      animation: sway var(--sway-duration, 4s) ease-in-out infinite;
    }
  </style>
</head>

<body>
  <div class="grain"></div>

  <div id="scene">
    <div id="reflection"></div>
    <div id="water"></div>
    <div id="foreground"></div>
  </div>

  <script src="../../common/CyclicRandomiser.js"></script>
  <script src="../../common/labyrinthPages.js"></script>
  <script>
    const currentPage = "corridors/fireflies";
    const otherPages = labyrinthPages.filter(p => !p.includes(currentPage));
    const pageRandomiser = new CyclicRandomiser(otherPages);

    const scene = document.getElementById('scene');
    const foreground = document.getElementById('foreground');
    const NUM_FIREFLIES = 35;
    const NUM_PLANTS = 118;

    const PLANT_TYPES = ['bulrush', 'reed', 'cattail'];

    class Plant {
      constructor(index) {
        this.index = index;
        this.el = document.createElement('a');
        this.el.href = pageRandomiser.nextOne();
        this.el.className = 'plant sway';

        // Random plant type
        const plantType = PLANT_TYPES[Math.floor(Math.random() * PLANT_TYPES.length)];
        this.el.classList.add(plantType);

        // Position along the bottom
        const xPercent = (index / NUM_PLANTS) * 100 + (Math.random() - 0.5) * 8;
        this.el.style.left = xPercent + '%';

        // Size variation
        const sizeVariation = 0.7 + Math.random() * 0.6;
        const height = (120 + Math.random() * 120) * sizeVariation;
        const width = (3 + Math.random() * 8) * sizeVariation;
        this.el.style.setProperty('--plant-height', height + 'px');
        this.el.style.setProperty('--plant-width', width + 'px');

        // Sway animation
        const swayDuration = 3 + Math.random() * 3;
        const swayAngle = 1 + Math.random() * 3;
        this.el.style.setProperty('--sway-duration', swayDuration + 's');
        this.el.style.setProperty('--sway-angle', swayAngle + 'deg');

        // Stagger the animation start
        const delay = Math.random() * (swayDuration * 2);
        this.el.style.animationDelay = delay + 's';

        // Depth (z-index for layering)
        const depth = Math.floor((xPercent / 100) * 30) + 10 + Math.floor(Math.random() * 5);
        this.el.style.zIndex = depth;

        foreground.appendChild(this.el);
      }
    }

    class Firefly {
      constructor(index) {
        this.index = index;
        this.el = document.createElement('a');
        this.el.className = 'firefly drifting';
        this.el.href = pageRandomiser.nextOne();

        // Random initial position
        this.baseX = Math.random() * window.innerWidth;
        this.baseY = Math.random() * (window.innerHeight * 0.7);

        // Glow animation timing
        const glowDuration = 1.5 + Math.random() * 2;
        this.el.style.setProperty('--glow-duration', glowDuration + 's');

        // Drift animation
        const driftDuration = 12 + Math.random() * 12;
        const driftRange = 40 + Math.random() * 60;
        this.el.style.setProperty('--drift-duration', driftDuration + 's');
        this.el.style.setProperty('--drift-x1', (Math.random() - 0.5) * driftRange + 'px');
        this.el.style.setProperty('--drift-y1', (Math.random() - 0.5) * driftRange * 0.6 + 'px');
        this.el.style.setProperty('--drift-x2', (Math.random() - 0.5) * driftRange + 'px');
        this.el.style.setProperty('--drift-y2', (Math.random() - 0.5) * driftRange * 0.6 + 'px');
        this.el.style.setProperty('--drift-x3', (Math.random() - 0.5) * driftRange + 'px');
        this.el.style.setProperty('--drift-y3', (Math.random() - 0.5) * driftRange * 0.6 + 'px');

        // Position
        this.el.style.left = this.baseX + 'px';
        this.el.style.top = this.baseY + 'px';

        // Color variation (warm yellowish greens)
        const hueVariation = Math.random() * 30 - 15; // -15 to 15
        const saturationVariation = Math.random() * 20 - 10; // -10 to 10
        this.el.style.filter = `hue-rotate(${hueVariation}deg) saturate(${100 + saturationVariation}%)`;

        scene.appendChild(this.el);
      }
    }

    // Create plants first (so they appear behind fireflies)
    for (let i = 0; i < NUM_PLANTS; i++) {
      new Plant(i);
    }

    // Create fireflies
    for (let i = 0; i < NUM_FIREFLIES; i++) {
      new Firefly(i);
    }
  </script>
</body>

</html>
