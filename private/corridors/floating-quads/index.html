<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="▭ just kinda floating ▭">
  <title>▬ dust in the spotlights ▬</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
    }

    #main {
      position: absolute;
      inset: 0;
      mix-blend-mode: screen;
    }

    .quad {
      position: absolute;
      display: block;
      text-decoration: none;
      opacity: 0.45;
      will-change: transform;
      cursor: pointer;
      transition: opacity 0.3s, box-shadow 0.3s;
    }

    .quad:hover {
      opacity: 0.85;
      box-shadow: 0 0 30px currentColor;
    }

    #crt-scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
      background-size: 100% 3px;
    }
  </style>
</head>

<body>
  <main id="main"></main>
  <div id="crt-scanlines"></div>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('floating-quads');

    const main = document.getElementById('main');
    const quads = [];
    let W, H;

    const PALETTES = [
      ['#ff0044', '#00ff88', '#4488ff', '#ffaa00', '#cc44ff'],
      ['#ff2266', '#22ffaa', '#66aaff', '#ffdd44', '#dd66ff'],
      ['#ff4488', '#44ffcc', '#88ccff', '#ffee66', '#ee88ff'],
    ];

    function init() {
      main.innerHTML = '';
      quads.length = 0;
      W = window.innerWidth;
      H = window.innerHeight;

      const area = W * H;
      const count = Math.max(20, Math.min(80, Math.round(area / 40000)));
      const palette = LAB.sample(PALETTES);

      for (let i = 0; i < count; i++) {
        const w = LAB.rand(80, 250);
        const h = LAB.rand(60, 200);
        const el = document.createElement('a');
        el.className = 'quad';
        el.href = LAB.pageRandomiser.nextOne();
        el.style.width = w + 'px';
        el.style.height = h + 'px';
        el.style.backgroundColor = LAB.sample(palette);
        el.style.color = el.style.backgroundColor;
        main.appendChild(el);

        quads.push({
          el,
          x: LAB.rand(0, W - w),
          y: LAB.rand(0, H - h),
          vx: LAB.rand(-0.3, 0.3),
          vy: LAB.rand(-0.3, 0.3),
          w,
          h,
          phase: LAB.rand(0, Math.PI * 2),
          speed: LAB.rand(0.002, 0.008),
        });
      }
    }

    function tick(time) {
      for (const q of quads) {
        q.phase += q.speed;
        q.x += q.vx + Math.sin(q.phase) * 0.4;
        q.y += q.vy + Math.cos(q.phase * 0.7) * 0.3;

        if (q.x < 0) { q.x = 0; q.vx *= -1; }
        if (q.x > W - q.w) { q.x = W - q.w; q.vx *= -1; }
        if (q.y < 0) { q.y = 0; q.vy *= -1; }
        if (q.y > H - q.h) { q.y = H - q.h; q.vy *= -1; }

        q.el.style.transform = `translate(${q.x}px, ${q.y}px)`;
      }
      requestAnimationFrame(tick);
    }

    function changePalette() {
      const palette = LAB.sample(PALETTES);
      for (const q of quads) {
        const c = LAB.sample(palette);
        q.el.style.backgroundColor = c;
        q.el.style.color = c;
      }
    }

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, changePalette);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a')) changePalette();
    });

    window.addEventListener('resize', init);

    init();
    requestAnimationFrame(tick);

  </script>
</body>

</html>
