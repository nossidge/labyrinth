<!DOCTYPE html>
<html lang="en">

<!--
Some sort of line dance or square dancey thing?
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="That's 3 in the corner">
  <title>O body swayed to music</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      overflow: hidden;
    }

    body {
      position: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      background-color: #0d0d13;
      touch-action: none;
    }

    #main {
      display: grid;
    }

    .cell {
      position: relative;
      text-decoration: none;
    }

    .dancer {
      position: absolute;
      background-color: #f2c14e;
      border-radius: 50%;
      transition: transform 0.7s cubic-bezier(0.5, 0, 0.15, 1);
    }

    .cell:hover .dancer {
      background-color: #ffffff;
      box-shadow: 0 0 10px rgba(242, 193, 78, 0.9);
    }

    #crt-scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>

<body>
  <div id="crt-scanlines"></div>
  <main id="main"></main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('four-corners');

    const main = document.getElementById('main');

    let dancers = [];

    const cell = 56;
    const dotSize = 18;
    const pad = 4;
    const far = cell - dotSize - pad;
    const corners = [
      [pad, pad],
      [far, pad],
      [far, far],
      [pad, far]
    ];

    function place(h) {
      const [x, y] = corners[h.index % 4];
      h.el.style.transform = `translate(${x}px, ${y}px)`;
    }

    function init() {
      main.replaceChildren();
      dancers.length = 0;

      const cols = Math.max(3, Math.floor(window.innerWidth / cell));
      const rows = Math.max(3, Math.floor(window.innerHeight / cell));
      main.style.gridTemplateColumns = `repeat(${cols}, ${cell}px)`;
      main.style.gridTemplateRows = `repeat(${rows}, ${cell}px)`;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const link = document.createElement('a');
          link.href = LAB.pageRandomiser.nextOne();
          link.className = 'cell';

          const dot = document.createElement('div');
          dot.className = 'dancer';
          dot.style.width = `${dotSize}px`;
          dot.style.height = `${dotSize}px`;

          const h = {
            el: dot,
            index: (r + c) % 4,
            dir: (r + c) % 2 === 0 ? 1 : 3
          };
          place(h);
          link.appendChild(dot);
          main.appendChild(link);
          dancers.push(h);
        }
      }
    }

    function tick() {
      for (const h of dancers) {
        h.index += h.dir;
        place(h);
      }
    }

    window.addEventListener('resize', init);

    init();
    setInterval(tick, 1000);

  </script>
</body>

</html>
