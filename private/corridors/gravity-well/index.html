<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Black Holes and Emulations">
  <title>Event horizon</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    #links {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    #links a {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      pointer-events: all;
      display: block;
      text-decoration: none;
      transform: translate(-50%, -50%);
    }

    #links a:hover {
      box-shadow: 0 0 20px 8px rgba(255, 255, 255, 0.4);
      z-index: 10;
      cursor: pointer;
    }

    #crt {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
      background-size: 100% 2px, 3px 100%;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <div id="links"></div>
  <div id="crt"></div>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('gravity-well');

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const linksContainer = document.getElementById('links');

    let W, H;

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    // Colour palettes - one chosen at random per session
    const palettes = [
      ['#00ffff', '#ff00ff', '#ffff00'],
      ['#ff0055', '#ff6600', '#ffcc00', '#ff0088'],
      ['#00ffcc', '#0088ff', '#cc00ff', '#00ff66'],
      ['#ff00ff', '#8800ff', '#0044ff', '#ff0044'],
      ['#ffff00', '#ff8800', '#ff0044', '#ffcc00'],
      ['#00ff88', '#00ccff', '#8855ff', '#00ffdd'],
    ];
    const palette = palettes[LAB.randIndex(palettes)];

    // Gravity wells (attractors)
    const wellCount = 10;
    const wells = [];

    function calculateWellMass() {
      return LAB.rand(800, 120800);
    }

    for (let i = 0; i < wellCount; i++) {
      wells.push({
        x: LAB.rand(W * 0.2, W * 0.8),
        y: LAB.rand(H * 0.2, H * 0.8),
        mass: calculateWellMass(),
        drift: {
          ax: LAB.rand(0.0001, 0.0004),
          ay: LAB.rand(0.0001, 0.0004),
          px: LAB.rand(0, Math.PI * 2),
          py: LAB.rand(0, Math.PI * 2),
          rx: LAB.rand(W * 0.05, W * 0.2),
          ry: LAB.rand(H * 0.05, H * 0.2),
        },
        ox: 0,
        oy: 0,
      });
    }

    // Create link elements for each well
    const wellLinks = [];
    for (let i = 0; i < wellCount; i++) {
      const a = document.createElement('a');
      a.href = LAB.pageRandomiser.nextOne();
      linksContainer.appendChild(a);
      wellLinks.push(a);
    }

    // Particles
    const particleCount = 200;
    const particles = [];

    function spawnParticle() {
      const edge = LAB.randInt(0, 3);
      let x, y;
      if (edge === 0) { x = LAB.rand(0, W); y = -10; }
      else if (edge === 1) { x = W + 10; y = LAB.rand(0, H); }
      else if (edge === 2) { x = LAB.rand(0, W); y = H + 10; }
      else { x = -10; y = LAB.rand(0, H); }

      return {
        x, y,
        vx: LAB.rand(-0.75, 0.75),
        vy: LAB.rand(-0.75, 0.75),
        color: palette[LAB.randIndex(palette)],
        radius: LAB.rand(2, 5),
        trail: [],
        maxTrail: LAB.randInt(15, 34),
        life: 1,
        alive: true,
      };
    }

    for (let i = 0; i < particleCount; i++) {
      const p = spawnParticle();
      // Start scattered across screen for initial appearance
      p.x = LAB.rand(0, W);
      p.y = LAB.rand(0, H);
      particles.push(p);
    }

    let time = 0;

    function update() {
      time++;

      // Drift the wells slowly
      for (const well of wells) {
        const d = well.drift;
        well.ox = Math.sin(time * d.ax + d.px) * d.rx;
        well.oy = Math.cos(time * d.ay + d.py) * d.ry;
      }

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        if (!p.alive) {
          // Respawn
          const np = spawnParticle();
          Object.assign(p, np);
          continue;
        }

        // Store trail
        p.trail.push({ x: p.x, y: p.y });
        if (p.trail.length > p.maxTrail) p.trail.shift();

        // Gravity from each well
        for (const well of wells) {
          const wx = well.x + well.ox;
          const wy = well.y + well.oy;
          const dx = wx - p.x;
          const dy = wy - p.y;
          const distSq = dx * dx + dy * dy;
          const dist = Math.sqrt(distSq);

          if (dist < 8) {
            p.alive = false;
            break;
          }

          const softening = 500;
          const force = well.mass / (distSq + softening);
          p.vx += (dx / dist) * force * 0.02;
          p.vy += (dy / dist) * force * 0.02;
        }

        // Speed limit
        const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        if (speed > 6) {
          p.vx = (p.vx / speed) * 6;
          p.vy = (p.vy / speed) * 6;
        }

        p.x += p.vx;
        p.y += p.vy;

        // Kill if far offscreen
        if (p.x < -100 || p.x > W + 100 || p.y < -100 || p.y > H + 100) {
          p.alive = false;
        }
      }

      // Update well link positions
      for (let i = 0; i < wells.length; i++) {
        const well = wells[i];
        wellLinks[i].style.left = (well.x + well.ox) + 'px';
        wellLinks[i].style.top = (well.y + well.oy) + 'px';
      }
    }

    function draw() {
      // Fade effect - semi-transparent black overlay
      ctx.fillStyle = 'rgba(0, 0, 0, 0.12)';
      ctx.fillRect(0, 0, W, H);

      // Draw particles with trails
      for (const p of particles) {
        if (!p.alive) continue;

        // Trail
        if (p.trail.length > 1) {
          ctx.beginPath();
          ctx.moveTo(p.trail[0].x, p.trail[0].y);
          for (let t = 1; t < p.trail.length; t++) {
            ctx.lineTo(p.trail[t].x, p.trail[t].y);
          }
          ctx.lineTo(p.x, p.y);
          ctx.strokeStyle = p.color;
          ctx.lineWidth = p.radius * 0.6;
          ctx.globalAlpha = 0.4;
          ctx.stroke();
        }

        // Particle body
        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();

        // Glow
        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius * 3, 0, Math.PI * 2);
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 3);
        grad.addColorStop(0, p.color);
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.fill();
      }

      ctx.globalAlpha = 1;

      // Draw well cores
      const wellInnerRadius = 5;
      const wellOuterRadius = 12;
      for (const well of wells) {
        const wx = well.x + well.ox;
        const wy = well.y + well.oy;
        ctx.beginPath();
        ctx.arc(wx, wy, wellInnerRadius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
        ctx.fill();

        // Faint ring
        ctx.beginPath();
        ctx.arc(wx, wy, wellOuterRadius + Math.sin(time * 0.05) * 3, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Rearrange the wells every 8 seconds
    setInterval(() => {
      for (let i = 0; i < wells.length; i++) {
        wells[i].x = LAB.rand(W * 0.15, W * 0.85);
        wells[i].y = LAB.rand(H * 0.15, H * 0.85);
        wells[i].mass = calculateWellMass();
        wellLinks[i].href = LAB.pageRandomiser.nextOne();
      }
    }, 8000);

    loop();

  </script>
</body>

</html>
