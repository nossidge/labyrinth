<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="take it from me">
  <title>hip to be</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      overflow: hidden;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000000;
    }

    #container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .ring {
      position: absolute;
      border: 2px solid #ffffff;
      display: block;
    }

    .ring.dark {
      border-color: #444444;
    }

    .ring.light {
      border-color: #ffffff;
    }

    #crt-scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.03));
      background-size: 100% 2px, 3px 100%;
    }
  </style>
</head>

<body>
  <div id="crt-scanlines"></div>
  <div id="container"></div>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('growing-squares');

    const container = document.getElementById('container');
    const rings = [];
    const maxRings = 21;
    const spacing = 30;
    const speed = 0.4;
    const spawnInterval = spacing / speed;
    let frameCount = 0;
    let cx, cy, maxDist;

    function measure() {
      cx = window.innerWidth / 2;
      cy = window.innerHeight / 2;
      maxDist = Math.max(cx, cy) + spacing * 2;
    }

    measure();

    let ringsSpawned = 0;
    function spawnRing() {
      const a = document.createElement('a');
      a.href = LAB.pageRandomiser.nextOne();
      a.className = 'ring ' + (ringsSpawned % 2 === 0 ? 'light' : 'dark');
      ringsSpawned++;

      a.dataset.size = '0';
      container.appendChild(a);
      rings.push({ el: a, size: 0, born: frameCount });
    }

    function animate() {
      frameCount++;

      if (frameCount % Math.round(spawnInterval) === 0) {
        spawnRing();
      }

      for (let i = 0; i < rings.length; i++) {
        const ring = rings[i];
        ring.size += speed;

        const half = ring.size / 2;
        ring.el.style.left = (cx - half) + 'px';
        ring.el.style.top = (cy - half) + 'px';
        ring.el.style.width = ring.size + 'px';
        ring.el.style.height = ring.size + 'px';

        const fade = Math.max(0, 1 - (ring.size / (maxDist * 2)));
        ring.el.style.opacity = fade;

        if (ring.size > maxDist * 2) {
          ring.el.remove();
          rings.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }

    for (let i = 0; i < maxRings; i++) {
      spawnRing();
      rings[i].size = i * spacing;
    }

    requestAnimationFrame(animate);

    window.addEventListener('resize', measure);

  </script>
</body>

</html>
