<!DOCTYPE html>
<html lang="en">

<!--
Also see `halftone-pulse`
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Halftone Wave">
  <title>Halftone Wave</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f0f0e8;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
    }

    #crt-scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.06) 50%);
      background-size: 100% 2px;
    }
  </style>
</head>

<body>
  <div id="crt-scanlines"></div>
  <a href="../index.html">
    <canvas id="canvas"></canvas>
  </a>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('halftone-wave');

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const SPACING = 18;
    const MIN_R = 1;

    let dots = [];
    let mouseX = -1;
    let mouseY = -1;
    let hoverEl = null;
    let hoveredDot = null;

    // Wave parameters that shift over time
    let waveAngle = LAB.rand(0, Math.PI * 2);
    let waveFreq = 0.08;
    let waveSpeed = 2.5;

    function init() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      hideHoverLink();

      // Grid is centred on the screen so there is always a dot in the middle
      // The extra + 1 row/column each side makes sure there are no dotless gaps at the edges
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const maxIx = Math.ceil(cx / SPACING) + 1;
      const maxIy = Math.ceil(cy / SPACING) + 1;

      dots = [];
      for (let iy = -maxIy; iy <= maxIy; iy++) {
        for (let ix = -maxIx; ix <= maxIx; ix++) {
          dots.push({
            x: cx + ix * SPACING,
            y: cy + iy * SPACING,
            ix: ix,
            iy: iy,
            maxR: SPACING * 0.42,
            url: LAB.pageRandomiser.nextOne()
          });
        }
      }
    }

    // Create a temporary anchor at the point where the user is hovering
    // This is so that the browser's status bar will show the redirect URL
    function showHoverLink(dot) {
      if (hoveredDot === dot) return;
      if (hoverEl) hoverEl.remove();
      hoveredDot = dot;
      hoverEl = document.createElement('a');
      hoverEl.href = dot.url;
      hoverEl.style.position = 'fixed';
      hoverEl.style.zIndex = '90';
      hoverEl.style.left = (dot.x - SPACING / 2) + 'px';
      hoverEl.style.top = (dot.y - SPACING / 2) + 'px';
      hoverEl.style.width = SPACING + 'px';
      hoverEl.style.height = SPACING + 'px';
      document.body.appendChild(hoverEl);
    }

    function hideHoverLink() {
      if (hoverEl) hoverEl.remove();
      hoverEl = null;
      hoveredDot = null;
    }

    function tick(time) {
      const t = time * 0.0005;

      ctx.fillStyle = '#f0f0e8';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#222222';

      // Slowly drift the wave direction
      waveAngle += 0.003;
      const dirX = Math.cos(waveAngle);
      const dirY = Math.sin(waveAngle);

      let hovered = null;

      for (let i = 0; i < dots.length; i++) {
        const d = dots[i];

        // Project position onto wave direction, then sample a travelling sine
        const proj = d.ix * dirX + d.iy * dirY;
        const wave = Math.sin(proj * waveFreq - t * waveSpeed);

        // Map sine (-1..1) to a dot radius between MIN_R and maxR
        const normalised = (wave + 1) / 2; // 0..1
        const r = MIN_R + normalised * (d.maxR - MIN_R);

        if (r > 0.5) {
          // Uncomment this back in to add an alpha to the colour
          // This looks good, but it kind of ruins the halftone effect
          // ctx.globalAlpha = 0.3 + normalised * 0.7;

          ctx.beginPath();
          ctx.arc(d.x, d.y, r, 0, Math.PI * 2);
          ctx.fill();
        }

        // Hover region is the cell of the dot (not just its animated size)
        if (mouseX >= d.x - SPACING / 2 && mouseX < d.x + SPACING / 2 &&
          mouseY >= d.y - SPACING / 2 && mouseY < d.y + SPACING / 2) {
          hovered = d;
        }
      }

      // See above for why this is commented out
      // ctx.globalAlpha = 1;

      // Create or destroy the hover link anchor element
      if (hovered) {
        showHoverLink(hovered);
      } else {
        hideHoverLink();
      }

      requestAnimationFrame(tick);
    }

    window.addEventListener('mousemove', function (e) {
      mouseX = e.clientX;
      mouseY = e.clientY;
    });

    document.addEventListener('mouseleave', function () {
      mouseX = -1;
      mouseY = -1;
    });

    window.addEventListener('resize', init);

    init();
    requestAnimationFrame(tick);

  </script>
</body>

</html>
