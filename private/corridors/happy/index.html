<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Clap your hands">
  <title>Have a nice day!</title>
  <style>
    :root {
      --bg-color: #0a0a0c;
      --accent-color: #F4B24F;
      --hover-color: #ff9d00;
      --text-color: #4a4a4f;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg-color);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Space Grotesk', sans-serif;
    }

    .container {
      position: relative;
      z-index: 20;
      filter: drop-shadow(0 0 30px rgba(244, 178, 79, 0.2));
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .container:hover {
      transform: scale(1.02);
    }

    svg {
      max-width: 90vw;
      max-height: 70vh;
      border-radius: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .face-element {
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .eye:hover {
      fill: #fff;
      filter: drop-shadow(0 0 10px #fff);
    }

    .blush:hover {
      opacity: 1;
      fill: #ff7b00;
    }

    .mouth-path {
      transition: all 0.3s ease;
    }

    .mouth-link:hover .mouth-path {
      stroke: #fff;
      stroke-width: 8;
      filter: drop-shadow(0 0 10px #fff);
    }

    /* CRT scanline */
    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      right: 0;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      z-index: 10;
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
    }

    /* Grainy noise */
    body::after {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.05;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      z-index: 5;
    }
  </style>
</head>

<body>
  <div class="container">
    <svg width="600" height="300" viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg">

      <!-- background -->
      <rect x="0" y="0" width="200" height="100" rx="18" fill="#F4B24F" />

      <!-- blush -->
      <a href="../index.html" title="Left blush">
        <circle class="face-element blush" cx="55" cy="58" r="16" fill="#E9A23B" opacity="0.6" />
      </a>
      <a href="../index.html" title="Right blush">
        <circle class="face-element blush" cx="145" cy="58" r="16" fill="#E9A23B" opacity="0.6" />
      </a>

      <!-- eyes -->
      <a href="../index.html" title="Left eye">
        <circle class="face-element eye" cx="70" cy="40" r="9" fill="#1A120C" />
      </a>
      <a href="../index.html" title="Right eye">
        <circle class="face-element eye" cx="130" cy="40" r="9" fill="#1A120C" />
      </a>

      <!-- mouth -->
      <a href="../index.html" class="mouth-link" title="Good nice smile">
        <path class="face-element mouth-path" d="M85 55 Q100 70 115 55" fill="none" stroke="#1A120C"
          stroke-width="6" stroke-linecap="round" />
      </a>
    </svg>
  </div>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('happy');
  </script>
</body>

</html>
