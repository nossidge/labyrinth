<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Melville Munster">
  <title>Hermann Grid</title>
  <style>
    :root {
      --half-gap: 5px;
      --ghost-size: 12px;
      --ghost-offset: calc(var(--ghost-size) / 2);
      --colour-fore: #000000;
      --colour-back: #f0f0f0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
    }

    #squares {
      display: grid;
    }

    .square {
      position: relative;
      display: block;
      padding: var(--half-gap);
      background-color: var(--colour-fore);
      background-clip: content-box;
      text-decoration: none;
      transition: background-color 0.1s ease;
    }

    .square:hover {
      background-color: var(--colour-fore);
    }

    .ghost {
      position: absolute;
      width: var(--ghost-size);
      height: var(--ghost-size);
      border-radius: 50%;
      background-color: rgba(150, 150, 150, 0.32);
      opacity: 0;
      transition: opacity 0.15s ease;
      pointer-events: none;
    }

    .ghost.tl {
      top: calc(var(--ghost-offset) * -1);
      left: calc(var(--ghost-offset) * -1);
    }

    .ghost.tr {
      top: calc(var(--ghost-offset) * -1);
      right: calc(var(--ghost-offset) * -1);
    }

    .ghost.bl {
      bottom: calc(var(--ghost-offset) * -1);
      left: calc(var(--ghost-offset) * -1);
    }

    .ghost.br {
      right: calc(var(--ghost-offset) * -1);
      bottom: calc(var(--ghost-offset) * -1);
    }

    .square:hover .ghost {
      opacity: 1;
    }
  </style>
</head>

<body>
  <main id="main"></main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('hermann-grid');

    const main = document.getElementById('main');

    const SIZE = 48;
    const GAP = 10;

    function init() {
      main.replaceChildren();

      const cols = Math.max(4, Math.floor((window.innerWidth + GAP) / (SIZE + GAP))) + 1;
      const rows = Math.max(4, Math.floor((window.innerHeight + GAP) / (SIZE + GAP))) + 1;

      const squares = document.createElement('div');
      squares.id = 'squares';
      squares.style.gridTemplateColumns = `repeat(${cols}, ${SIZE + GAP}px)`;
      squares.style.gridTemplateRows = `repeat(${rows}, ${SIZE + GAP}px)`;
      squares.style.setProperty('--half-gap', (GAP / 2) + 'px');

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const square = document.createElement('a');
          square.href = LAB.pageRandomiser.nextOne();
          square.className = 'square';

          for (const corner of ['tl', 'tr', 'bl', 'br']) {
            const ghost = document.createElement('div');
            ghost.className = 'ghost ' + corner;
            square.appendChild(ghost);
          }

          squares.appendChild(square);
        }
      }

      main.appendChild(squares);
    }

    window.addEventListener('resize', init);

    init();

  </script>
</body>

</html>
