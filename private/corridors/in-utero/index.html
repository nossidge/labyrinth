<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ex uno plures">
  <title>Umbilical thoughts</title>
  <style>
    :root {
      --womb-deep: #1a0505;
      --womb-glow: #4d0a0a;
      --vein-color: #8a1515;
      --text-color: #ffcccc;
      --baby-shadow: rgba(0, 0, 0, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(circle at center, var(--womb-glow) 0%, var(--womb-deep) 100%);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Newsreader', serif;
    }

    .womb-layers {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      opacity: 0.4;
      background:
        radial-gradient(circle at 30% 30%, transparent 0%, rgba(138, 21, 21, 0.2) 50%, transparent 100%),
        radial-gradient(circle at 70% 70%, transparent 0%, rgba(138, 21, 21, 0.2) 50%, transparent 100%);
      animation: pulse 8s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        opacity: 0.3;
      }

      100% {
        transform: scale(1.1);
        opacity: 0.5;
      }
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 2;
      pointer-events: none;
    }

    #baby-container {
      position: relative;
      z-index: 10;
      animation: float-baby 6s ease-in-out infinite alternate;
    }

    @keyframes float-baby {
      0% {
        transform: translate(0, 0) rotate(-2deg);
      }

      100% {
        transform: translate(0, 15px) rotate(2deg);
      }
    }

    .baby-image {
      max-width: 300px;
      height: auto;
      filter: drop-shadow(0 0 30px var(--baby-shadow)) sepia(0.3) saturate(1.2);
      transition: all 0.4s ease;
    }

    .baby-image:hover {
      filter: drop-shadow(0 0 20px var(--vein-color)) sepia(0);
    }

    .thought-word {
      position: absolute;
      z-index: 15;
      color: var(--text-color);
      text-decoration: none;
      font-size: 1.5rem;
      font-weight: 200;
      font-style: italic;
      white-space: nowrap;
      padding: 5px 15px;
      transition: all 0.4s ease;
      text-shadow: 0 0 10px rgba(255, 204, 204, 0.5);
    }

    .thought-word:hover {
      text-shadow: 0 0 20px #fff;
      font-weight: 500;
      transform: scale(1.2);
      letter-spacing: 2px;
    }

    .thought-word {
      pointer-events: auto;
    }

    .thought-baby {
      position: absolute;
      z-index: 15;
      transition: all 0.4s ease;
      pointer-events: auto;
    }

    .thought-baby img {
      width: 120px;
      height: auto;
      filter: drop-shadow(0 0 10px var(--baby-shadow)) sepia(0.5);
      transition: all 0.4s ease;
    }

    .thought-baby:hover img {
      filter: drop-shadow(0 0 20px var(--vein-color)) sepia(0);
    }

    #words-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 15;
    }

    /* This is applied using JS with a random duration in the script tag */
    @keyframes drift {
      0% {
        transform: translate(0, 0);
      }

      100% {
        transform: translate(20px, 15px);
      }
    }
  </style>
</head>

<body>
  <div class="womb-layers"></div>
  <canvas id="connections"></canvas>

  <a href="#" id="baby-container">
    <img src="baby.png" alt="Fetal Mind" class="baby-image">
  </a>

  <div id="words-container"></div>

  <script src="../../common/CyclicRandomiser.js"></script>
  <script src="../../common/labyrinthPages.js"></script>
  <script>
    const currentPage = "corridors/in-utero";
    const otherPages = labyrinthPages.filter(p => !p.includes(currentPage));
    const pageRandomiser = new CyclicRandomiser(otherPages);

    const thoughts = [
      "Becoming", "Connection", "Floating", "Growth", "Heartbeat", "Love",
      "Mother", "Possibility", "Rhythm", "Safe", "Soft", "Warmth",
    ];

    const wordsContainer = document.getElementById('words-container');
    const babyContainer = document.getElementById('baby-container');
    const canvas = document.getElementById('connections');
    const ctx = canvas.getContext('2d');
    let elements = [];
    let mode = 'words';

    function init() {
      resize();
      createWords();
      requestAnimationFrame(draw);
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function clearWordsContainer() {
      wordsContainer.innerHTML = '';
      elements = [];
    }

    function createWords() {
      document.title = 'Umbilical thoughts';

      clearWordsContainer();
      mode = 'words';
      const vh = window.innerHeight;
      const vw = window.innerWidth;
      const radius = Math.min(vw, vh) * 0.35;

      shuffle(thoughts).forEach((thought, i) => {
        const angle = (i / thoughts.length) * Math.PI * 2 + Math.random() * 0.2;
        const dist = radius + (Math.random() - 0.5) * 100;

        const xPx = (vw / 2) + Math.cos(angle) * dist - 50;
        const yPx = (vh / 2) + Math.sin(angle) * dist;

        const xPct = (xPx / vw) * 100;
        const yPct = (yPx / vh) * 100;

        const a = document.createElement('a');
        a.className = 'thought-word';
        a.innerText = thought;
        a.href = pageRandomiser.nextOne();
        a.style.left = `${xPct}%`;
        a.style.top = `${yPct}%`;

        const duration = 10 + Math.random() * 10;
        const delay = -Math.random() * duration;
        a.style.animation = `drift ${duration}s ease-in-out ${delay}s infinite alternate`;

        wordsContainer.appendChild(a);
        elements.push({
          el: a,
          angle: angle,
          phase: Math.random() * Math.PI * 2
        });
      });
    }

    function createBabies() {
      document.title = 'Umbilical multiplicity';

      clearWordsContainer();
      mode = 'babies';
      const vh = window.innerHeight;
      const vw = window.innerWidth;
      const radius = Math.min(vw, vh) * 0.35;
      const babyCount = thoughts.length;

      for (let i = 0; i < babyCount; i++) {
        const angle = (i / babyCount) * Math.PI * 2 + Math.random() * 0.2;
        const dist = radius + (Math.random() - 0.5) * 100;

        const xPx = (vw / 2) + Math.cos(angle) * dist - 60;
        const yPx = (vh / 2) + Math.sin(angle) * dist - 40;

        const xPct = (xPx / vw) * 100;
        const yPct = (yPx / vh) * 100;

        const a = document.createElement('a');
        a.className = 'thought-baby';
        a.style.left = `${xPct}%`;
        a.style.top = `${yPct}%`;
        a.href = pageRandomiser.nextOne();

        const img = document.createElement('img');
        img.src = 'baby.png';
        img.alt = 'Thought Baby';
        a.appendChild(img);

        const duration = 12 + Math.random() * 8;
        const delay = -Math.random() * duration;
        a.style.animation = `drift ${duration}s ease-in-out ${delay}s infinite alternate`;

        wordsContainer.appendChild(a);
        elements.push({
          el: a,
          angle: angle,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    babyContainer.addEventListener('click', (e) => {
      e.preventDefault();
      if (mode === 'words') {
        createBabies();
      } else {
        createWords();
      }
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const babyRect = babyContainer.getBoundingClientRect();
      const babyX = babyRect.left + babyRect.width / 2;
      const babyY = babyRect.top + babyRect.height / 2;

      ctx.beginPath();
      ctx.strokeStyle = 'rgba(138, 21, 21, 0.4)';
      ctx.lineWidth = 1;

      elements.forEach((word, i) => {
        const rect = word.el.getBoundingClientRect();
        const wordX = rect.left + rect.width / 2;
        const wordY = rect.top + rect.height / 2;

        ctx.moveTo(babyX, babyY);

        const cpX = (babyX + wordX) / 2 + Math.sin(Date.now() * 0.001 + i) * 30;
        const cpY = (babyY + wordY) / 2 + Math.cos(Date.now() * 0.001 + i) * 30;

        ctx.quadraticCurveTo(cpX, cpY, wordX, wordY);
      });

      ctx.stroke();
      ctx.shadowBlur = 10;
      ctx.shadowColor = 'rgba(255, 100, 100, 0.2)';

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', resize);
    window.addEventListener('load', init);

  </script>
</body>

</html>
