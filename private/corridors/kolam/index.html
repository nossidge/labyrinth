<!DOCTYPE html>
<html lang="en">

<!--
https://en.wikipedia.org/wiki/Kolam
I don't know much about this South Indian practice.
But I saw one and thought I might be able to do something similar in code.
This one is way more basic than the complicated real ones though.
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Kolam">
  <title>Kolam</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 50% 50%, #7a4526 0%, #46250f 85%);
    }

    svg {
      width: 92vmin;
      height: 92vmin;
    }

    .curve {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .dot {
      fill: #f7f0df;
      transform-box: fill-box;
      transform-origin: center;
      transition: transform 0.2s ease, fill 0.2s ease;
      pointer-events: none;
    }

    .hit-area {
      fill: transparent;
      pointer-events: all;
    }

    a:hover .dot {
      fill: #ffd54f;
      transform: scale(1.9);
    }
  </style>
</head>

<body>
  <svg id="svg" viewBox="-50 -50 100 100"></svg>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('kolam');

    const svg = document.getElementById('svg');

    // Closed smooth curve through all points
    // https://en.wikipedia.org/wiki/Catmull%E2%80%93Rom_spline
    function loopPath(pts) {
      const n = pts.length;
      let d = `M ${pts[0].x.toFixed(2)} ${pts[0].y.toFixed(2)} `;
      for (let i = 0; i < n; i++) {
        const p0 = pts[(i - 1 + n) % n];
        const p1 = pts[i];
        const p2 = pts[(i + 1) % n];
        const p3 = pts[(i + 2) % n];
        const c1x = p1.x + (p2.x - p0.x) / 6;
        const c1y = p1.y + (p2.y - p0.y) / 6;
        const c2x = p2.x - (p3.x - p1.x) / 6;
        const c2y = p2.y - (p3.y - p1.y) / 6;
        d += `C ${c1x.toFixed(2)} ${c1y.toFixed(2)} `
          + `${c2x.toFixed(2)} ${c2y.toFixed(2)} `
          + `${p2.x.toFixed(2)} ${p2.y.toFixed(2)} `;
      }
      return d + 'Z';
    }

    function init() {
      svg.replaceChildren();

      const rings = LAB.randInt(5, 7);
      const spacing = 44 / rings;

      // Draw one looping curve per diamond ring
      for (let k = 1; k <= rings; k++) {
        // Leave some rings bare with no loops
        if (k < rings && LAB.chance(0.2)) continue;

        const ringDots = [];
        for (let gx = -k; gx <= k; gx++) {
          const gy = k - Math.abs(gx);
          ringDots.push({ x: gx * spacing, y: gy * spacing });
          if (gy !== 0) ringDots.push({ x: gx * spacing, y: -gy * spacing });
        }
        ringDots.sort((a, b) => Math.atan2(a.y, a.x) - Math.atan2(b.y, b.x));

        const bulge = LAB.rand(0.28, 0.5) * spacing;
        const dent = LAB.rand(0.15, 0.45) * spacing;
        const pts = [];
        const n = ringDots.length;

        for (let i = 0; i < n; i++) {
          const d1 = ringDots[i];
          const d2 = ringDots[(i + 1) % n];

          // Go outward, looping around the dot
          const len = Math.hypot(d1.x, d1.y);
          pts.push({
            x: d1.x + (d1.x / len) * bulge + LAB.rand(-0.12, 0.12),
            y: d1.y + (d1.y / len) * bulge + LAB.rand(-0.12, 0.12),
          });

          // Go inward, between the dots
          const mx = (d1.x + d2.x) / 2;
          const my = (d1.y + d2.y) / 2;
          const ml = Math.hypot(mx, my) || 1;
          pts.push({
            x: mx - (mx / ml) * dent + LAB.rand(-0.12, 0.12),
            y: my - (my / ml) * dent + LAB.rand(-0.12, 0.12),
          });
        }

        // Mostly white, but with occasional yellow and orange
        const colour = LAB.chance(0.4)
          ? LAB.sample(['#f2b134', '#e2725b'])
          : '#f7f0df';

        LAB.svgElement('path', {
          d: loopPath(pts),
          class: 'curve',
          stroke: colour,
          'stroke-width': LAB.rand(0.5, 1.0).toFixed(2),
          'stroke-opacity': 0.95,
        }, svg);
      }

      // Draw the dots last so they are on the topmost level
      for (let gx = -rings; gx <= rings; gx++) {
        const span = rings - Math.abs(gx);
        for (let gy = -span; gy <= span; gy++) {
          const a = LAB.svgElement('a', { href: LAB.pageRandomiser.nextOne() }, svg);
          LAB.svgElement('circle', {
            cx: (gx * spacing).toFixed(2),
            cy: (gy * spacing).toFixed(2),
            r: 4,
            class: 'hit-area',
          }, a);
          LAB.svgElement('circle', {
            cx: (gx * spacing).toFixed(2),
            cy: (gy * spacing).toFixed(2),
            r: 0.9,
            class: 'dot',
          }, a);
        }
      }
    }

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a')) init();
    });

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, init);
    });

    init();

  </script>
</body>

</html>
