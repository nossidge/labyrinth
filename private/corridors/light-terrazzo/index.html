<!DOCTYPE html>
<html lang="en">

<!--
See also `dark-terrazzo`.
In this version, we draw to an SVG.
This lets the chips be links to other pages.
But it means we can't draw as many of them to the DOM.
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A Chip off the old Delany">
  <title>Light Terrazzo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    svg {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    .chip {
      stroke: rgba(0, 0, 0, 0.15);
      stroke-width: 1;
      transition: transform 0.15s ease, filter 0.15s ease;
      transform-box: fill-box;
      transform-origin: center;
    }

    a:hover .chip {
      transform: scale(1.6) rotate(8deg);
      filter: drop-shadow(2px 3px 3px rgba(0, 0, 0, 0.35));
    }

    .speck {
      fill: rgba(255, 255, 255, 0.35);
    }
  </style>
</head>

<body>
  <svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('light-terrazzo');

    const svg = document.getElementById('svg');

    const BED_COLOURS = ['#d6d1c6', '#cfc9bc', '#d8d4cc', '#ccc6b8'];
    const CHIP_COLOURS = [
      '#c44e3f', '#8f3a34', '#e08a4f', '#d9b04a',
      '#3f7a5e', '#3f5e8c', '#5e4a86', '#a04a6a',
      '#8a8578', '#2a2a30', '#d8cfc0', '#4a9a8c',
    ];

    function chipPolygon(cx, cy, size) {
      const sides = LAB.randInt(4, 7);
      const startAngle = LAB.rand(0, Math.PI * 2);
      const points = [];

      for (let i = 0; i < sides; i++) {
        const angle = startAngle + (i / sides) * Math.PI * 2 + LAB.rand(-0.25, 0.25);
        const radius = size * LAB.rand(0.55, 1.0);
        points.push(`${(cx + Math.cos(angle) * radius).toFixed(1)},${(cy + Math.sin(angle) * radius).toFixed(1)}`);
      }

      return points.join(' ');
    }

    function init() {
      svg.replaceChildren();
      document.body.style.backgroundColor = LAB.sample(BED_COLOURS);
      const w = window.innerWidth;
      const h = window.innerHeight;

      // Small white specks
      const speckCount = Math.floor((w * h) / 9000);
      for (let i = 0; i < speckCount; i++) {
        const speck = LAB.svgElement('circle');

        speck.setAttribute('class', 'speck');
        speck.setAttribute('cx', LAB.rand(0, w));
        speck.setAttribute('cy', LAB.rand(0, h));
        speck.setAttribute('r', LAB.rand(1.5, 3.5));
        svg.appendChild(speck);
      }

      // Fine chips
      const fineCount = Math.floor((w * h) / 3000);
      for (let i = 0; i < fineCount; i++) {
        const size = LAB.rand(2, 7);
        const cx = LAB.rand(0, w);
        const cy = LAB.rand(0, h);

        const chip = LAB.svgElement('polygon');
        chip.setAttribute('class', 'chip');
        chip.setAttribute('points', chipPolygon(cx, cy, size));
        chip.setAttribute('fill', LAB.sample(CHIP_COLOURS));
        svg.appendChild(chip);
      }

      // Big chips
      const cellSize = 140;
      const cols = Math.ceil(w / cellSize);
      const rows = Math.ceil(h / cellSize);
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const size = LAB.rand(18, 46);
          const offset = (size + cellSize) / 2;
          const cx = c * cellSize + LAB.rand(-offset, offset);
          const cy = r * cellSize + LAB.rand(-offset, offset);

          const anchor = LAB.svgElement('a');
          anchor.setAttribute('href', LAB.pageRandomiser.nextOne());

          const chip = LAB.svgElement('polygon');
          chip.setAttribute('class', 'chip');
          chip.setAttribute('points', chipPolygon(cx, cy, size));
          chip.setAttribute('fill', LAB.sample(CHIP_COLOURS));

          anchor.appendChild(chip);
          svg.appendChild(anchor);
        }
      }
    }

    window.addEventListener('resize', init);

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a')) init();
    });

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, init);
    });

    init();

  </script>
</body>

</html>
