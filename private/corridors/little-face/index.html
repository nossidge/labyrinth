<!DOCTYPE html>
<html lang="en">

<!--
These pages don't need to be big or complicated.
Why can't they just be a cute little unicode fella?
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="up and off">
  <title>little face</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #2c3e50;
    }

    #face {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 150px;
      height: 150px;
      background-color: #ecf0f1;
      border-radius: 12px;
      color: #000000;
      font-size: 80px;
      text-decoration: none;
      transition: transform 0.1s ease-out;
    }

    #face:hover {
      transform: scale(2);
      transition: transform 0.4s ease-out;
    }

    #face::before {
      content: "⸚";
    }

    #face:hover::before {
      content: "⍨";
    }
  </style>
</head>

<body>
  <a id="face" href="../index.html"></a>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('little-face');
  </script>
</body>

</html>
