<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="mah lovely lady longs (check it out)">
  <title>Mahjong</title>
  <style>
    :root {
      --cols: 16;
      --rows: 5;
    }

    @media (orientation: portrait) {
      :root {
        --cols: 6;
        --rows: 12;
      }
    }

    body {
      margin: 0;
      padding: 0;
      background: #0d2818;
      color: #e9e0c8;
      font-family: "Courier New", monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #main {
      display: grid;
      grid-template-columns: repeat(var(--cols), 38px);
      grid-auto-rows: 50px;
      gap: 1px;
      background: #1c4028;
      padding: 6px;
      border: 2px solid #c9b878;
      box-shadow: 0 0 0 6px #0d2818, 0 0 0 7px #c9b878;
    }

    .tile {
      background: #f5ecd0;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      text-decoration: none;
      transition: all .15s;
      box-shadow: inset -2px -2px 0 #b8a878, inset 2px 2px 0 #fffaf0;
    }

    a.tile:hover {
      background: #c41e1e;
      color: #f5ecd0;
      transform: translateY(-3px);
      box-shadow: inset -2px -2px 0 #6a0a0a, inset 2px 2px 0 #ff6060, 0 4px 0 #0d2818;
    }

    a.tile {
      cursor: pointer;
    }
  </style>
</head>

<body>
  <main id="main"></main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('mahjong');

    // Use CSS to set these values, as the orientation calculation will be automatic
    function getCssVarCols() {
      return getComputedStyle(document.documentElement).getPropertyValue('--cols');
    }

    function getCssVarRows() {
      return getComputedStyle(document.documentElement).getPropertyValue('--rows');
    }

    // Mahjong tiles: U+1F000 to U+1F02B, except for the emoji 🀄
    const tiles = [];
    for (let codePoint = 0x1F000; codePoint <= 0x1F02B; codePoint++) {
      if (codePoint === 0x1F004) continue;
      tiles.push(String.fromCodePoint(codePoint));
    }

    const main = document.getElementById('main');

    function init() {
      main.innerHTML = '';
      const cols = getCssVarCols();
      const rows = getCssVarRows();
      for (let i = 0; i < cols * rows; i++) {
        const char = LAB.sample(tiles);
        let el;
        el = document.createElement('a');
        el.href = LAB.pageRandomiser.nextOne();
        el.className = 'tile';
        el.textContent = char;
        main.appendChild(el);
      }
    }

    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(init, 100);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a')) init();
    });

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, init);
    });

    init();

  </script>
</body>

</html>
