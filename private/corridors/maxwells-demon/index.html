<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Maxwell's silver demon">
  <title>Maxwell's Demon</title>
  <style>
    :root {
      --colour-hot: #ff0000;
      --colour-cold: #0088ff;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0a0a0a;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
      user-select: none;
    }

    #chamber {
      position: relative;
      width: 100vw;
      height: 100vh;
      border: 10px solid #333333;
      box-sizing: border-box;
    }

    #wall {
      position: absolute;
      left: 50%;
      top: 0;
      width: 10px;
      height: 100%;
      background: #444444;
      transform: translateX(-50%);
      z-index: 10;
    }

    #gate-zone {
      position: absolute;
      left: 0;
      top: 33.33%;
      width: 100%;
      height: 33.33%;
      background: #0a0a0a;
      /* Gap in the wall */
    }

    #gate {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: #ffaa00;
      transition: transform 0.1s ease-in-out;
      transform-origin: top;
      z-index: 11;
    }

    #gate.open {
      transform: scaleY(0);
    }

    .semicircle {
      position: absolute;
      top: 50%;
      width: 80px;
      height: 160px;
      border: 2px dashed #555555;
      transform: translateY(-50%);
      z-index: 5;
      pointer-events: none;
    }

    #semi-left {
      right: 5px;
      /* On the left side of the wall */
      border-radius: 80px 0 0 80px;
    }

    #semi-right {
      left: 5px;
      /* On the right side of the wall */
      border-radius: 0 80px 80px 0;
    }

    .molecule {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      z-index: 50;
      transform: translate(-50%, -50%);
    }

    .molecule.hot {
      background: var(--colour-hot);
      box-shadow: 0 0 10px var(--colour-hot);
    }

    .molecule.cold {
      background: var(--colour-cold);
      box-shadow: 0 0 10px var(--colour-cold);
    }

    #labels .hot {
      font-size: 28px;
      color: var(--colour-hot);
      text-shadow: 0 0 2px var(--colour-hot);
    }

    #labels .cold {
      font-size: 28px;
      color: var(--colour-cold);
      text-shadow: 0 0 2px var(--colour-cold);
    }

    .trail {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      opacity: 0.3;
      z-index: 40;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .trail.hot {
      background: var(--colour-hot);
    }

    .trail.cold {
      background: var(--colour-cold);
    }

    #info-panel {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 2000;
      background: rgba(0, 0, 0, 0.8);
      padding: 10px;
      border: 1px solid #00ff00;
      font-size: 14px;
      pointer-events: none;
    }

    #labels {
      position: fixed;
      bottom: 20px;
      width: 100%;
      display: flex;
      justify-content: space-around;
      font-size: 24px;
      font-weight: bold;
      opacity: 0.5;
      z-index: 1;
    }

    #labels a {
      text-decoration: none;
    }

    #labels a:hover {
      transform: scale(1.15);
    }

    #message {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #00ff00;
      padding: 10px;
      text-align: right;
      display: none;
      z-index: 3000;
      cursor: pointer;
      font-size: 14px;
    }

    #message h1 {
      margin: 0;
      color: #ff00ff;
      font-size: 20px;
    }

    #message p {
      margin: 4px 0 0 0;
    }

    .grain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44NSIgbnVtT2N0YXZlcz0iMyIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIvPjwvc3ZnPg==');
      opacity: 0.15;
      z-index: 1000;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="grain"></div>

  <div id="info-panel">
    DETECTOR: <span id="detector-status">IDLE</span>
    <br>
    ENTROPY: <span id="entropy-lvl">HIGH</span>
  </div>

  <div id="labels">
    <a class="cold">COLD</a>
    <a class="hot">HOT</a>
  </div>

  <div id="chamber">
    <div id="wall">
      <div id="gate-zone">
        <div id="gate"></div>
        <div id="semi-left" class="semicircle"></div>
        <div id="semi-right" class="semicircle"></div>
      </div>
    </div>
  </div>

  <div id="message">
    <h1>Congratulations!</h1>
    <p>You have disproved the second law of thermodynamics!</p>
    <p>Chaos has been eliminated and order reigns supreme.</p>
    <p>As a consequence, everything is now too boring to function.</p>
    <p>Click to depart this reality for one that is more fun.</p>
  </div>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('maxwells-demon');

    const chamber = document.getElementById('chamber');
    const gate = document.getElementById('gate');
    const detectorStatus = document.getElementById('detector-status');
    const entropyLvl = document.getElementById('entropy-lvl');
    const message = document.getElementById('message');
    const labels = document.getElementById('labels');

    const moleculeCount = 30;
    const molecules = [];
    const trailLength = 5;

    let mouseX = -1000, mouseY = -1000;
    window.onmousemove = (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;
    };

    let width = window.innerWidth;
    let height = window.innerHeight;
    let wallX, gateTop, gateBottom;
    const gateWidth = 10;

    const semiRadius = 80;

    class Molecule {
      constructor(type) {
        this.type = type; // 'hot' or 'cold'
        this.radius = 6;

        // Random start position, avoiding the wall
        this.x = LAB.chance(0.5) ? LAB.rand(20, wallX - 20) : LAB.rand(wallX + 20, width - 20);
        this.y = LAB.rand(20, height - 20);

        this.speedBase = type === 'hot' ? 5 : 1.5;
        const angle = LAB.rand(0, Math.PI * 2);
        this.vx = Math.cos(angle) * this.speedBase;
        this.vy = Math.sin(angle) * this.speedBase;

        this.el = document.createElement('div');
        this.el.className = `molecule ${type}`;
        chamber.appendChild(this.el);

        this.trails = [];
        for (let i = 0; i < trailLength; i++) {
          const t = document.createElement('div');
          t.className = `trail ${type}`;
          chamber.appendChild(t);
          this.trails.push({ el: t, x: this.x, y: this.y });
        }
      }

      update() {
        // Update trails
        for (let i = this.trails.length - 1; i > 0; i--) {
          this.trails[i].x = this.trails[i - 1].x;
          this.trails[i].y = this.trails[i - 1].y;
        }
        this.trails[0].x = this.x;
        this.trails[0].y = this.y;

        // Mouse interaction
        const dx = this.x - mouseX;
        const dy = this.y - mouseY;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const minDist = 120;

        if (dist < minDist) {
          // Calculate push vector
          const force = (minDist - dist) / minDist;
          const pushX = (dx / dist) * force * 2;
          const pushY = (dy / dist) * force * 2;

          this.vx += pushX;
          this.vy += pushY;

          // Clamp speed slightly so they don't go infinite
          const currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
          const maxSpeed = this.speedBase * 2.5;
          if (currentSpeed > maxSpeed) {
            this.vx = (this.vx / currentSpeed) * maxSpeed;
            this.vy = (this.vy / currentSpeed) * maxSpeed;
          }
        } else {
          // Gently return to base speed if not being pushed
          const currentSpeed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
          if (currentSpeed > this.speedBase) {
            this.vx *= 0.98;
            this.vy *= 0.98;
          } else if (currentSpeed < this.speedBase * 0.8) {
            this.vx *= 1.02;
            this.vy *= 1.02;
          }
        }

        // Move
        this.x += this.vx;
        this.y += this.vy;

        // Bounds
        if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -1; }
        if (this.x + this.radius > width) { this.x = width - this.radius; this.vx *= -1; }
        if (this.y - this.radius < 0) { this.y = this.radius; this.vy *= -1; }
        if (this.y + this.radius > height) { this.y = height - this.radius; this.vy *= -1; }

        // Wall collision
        const inGateRange = this.y > gateTop && this.y < gateBottom;
        const pushingGate = (this.vx > 0 && Math.abs(this.x + this.radius - wallX) < 5) ||
          (this.vx < 0 && Math.abs(this.x - this.radius - wallX) < 5);

        if (pushingGate) {
          if (!inGateRange || !gate.classList.contains('open')) {
            // Bounce off wall
            this.vx *= -1;
            // Push away from wall to prevent stuck
            this.x += this.vx * 2;
          }
        }

        // Draw
        this.el.style.left = `${this.x}px`;
        this.el.style.top = `${this.y}px`;

        this.trails.forEach((t, i) => {
          t.el.style.left = `${t.x}px`;
          t.el.style.top = `${t.y}px`;
          t.el.style.opacity = (1 - (i / trailLength)) * 0.4;
          t.el.style.transform = `translate(-50%, -50%) scale(${1 - (i / trailLength)})`;
        });
      }
    }

    function init() {
      for (let i = 0; i < moleculeCount / 2; i++) {
        molecules.push(new Molecule('hot'));
        molecules.push(new Molecule('cold'));
      }
      requestAnimationFrame(loop);
    }

    let solved = false;
    let gateShouldOpen = false;
    let gateTimer = 0; // Timer to keep gate open

    function loop() {

      let detected = false;
      let leftHotCount = 0;
      let rightColdCount = 0;

      molecules.forEach(m => {
        m.update();

        // Check semicircles
        const dy = m.y - (gateTop + (gateBottom - gateTop) / 2);
        const dxFromWall = m.x - wallX;
        const distToGateCenter = Math.sqrt(dxFromWall * dxFromWall + dy * dy);

        if (distToGateCenter < semiRadius) {
          // Rule:
          // Hot molecules want to go Left -> Right
          // Cold molecules want to go Right -> Left
          if (m.type === 'hot' && m.x < wallX && m.vx > 0) {
            detected = true;
          }
          if (m.type === 'cold' && m.x > wallX && m.vx < 0) {
            detected = true;
          }
        }

        // Check progress
        if (m.type === 'hot' && m.x < wallX) leftHotCount++;
        if (m.type === 'cold' && m.x > wallX) rightColdCount++;
      });

      if (detected && !solved) {
        gateShouldOpen = true;
        gateTimer = 10; // Keep open for ~10 frames (approx 160ms) or until 0
      } else {
        if (gateTimer > 0) {
          gateTimer--;
        } else {
          gateShouldOpen = false;
        }
      }

      if (gateShouldOpen) {
        gate.classList.add('open');
        detectorStatus.innerText = 'ACTIVE';
        detectorStatus.style.color = '#ffaa00';
      } else {
        gate.classList.remove('open');
        detectorStatus.innerText = 'IDLE';
        detectorStatus.style.color = '#00ff00';
      }

      const totalIncorrect = leftHotCount + rightColdCount;
      if (totalIncorrect === 0) {
        entropyLvl.innerText = 'ZERO';
        entropyLvl.style.color = '#ff00ff';
        solved = true;
        showMessage();
      } else if (totalIncorrect < 4) {
        entropyLvl.innerText = 'LOW';
        entropyLvl.style.color = '#ffff00';
      } else {
        entropyLvl.innerText = 'HIGH';
        entropyLvl.style.color = '#ff0000';
      }

      requestAnimationFrame(loop);
    }

    function showMessage() {
      message.style.display = 'block';
    }

    message.onclick = () => {
      window.location.href = LAB.pageRandomiser.nextOne();
    };

    labels.childNodes.forEach(element => {
      element.href = LAB.pageRandomiser.nextOne();
    });

    window.onresize = () => {
      width = window.innerWidth;
      height = window.innerHeight;
      updateBoundaries();
    };

    function updateBoundaries() {
      wallX = width / 2;
      gateTop = height / 3;
      gateBottom = (2 * height) / 3;
    }

    updateBoundaries();
    init();

  </script>
</body>

</html>
