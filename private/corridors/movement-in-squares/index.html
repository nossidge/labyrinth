<!DOCTYPE html>
<html lang="en">

<!--
Op-art grid of squares that compress in width as they are approached by a moving vertical line.
This animation is entirely ripped off from Bridget Riley's "Movement in Squares" (1961).
https://en.wikipedia.org/wiki/Bridget_Riley
https://artscouncilcollection.org.uk/artwork/movement-squares
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Please don't sue me">
  <title>Movement in Squares</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
    }

    #main {
      position: fixed;
      inset: 0;
      display: grid;
    }

    #main a {
      display: block;
      transition: box-shadow 0.15s ease;
    }

    #main a.dark {
      background: #0a0a0a;
    }

    #main a.light {
      background: #f4f4f4;
    }
  </style>
</head>

<body>
  <main id="main"></main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('movement-in-squares');

    const main = document.getElementById('main');

    let cols, rows;
    let t = 0;

    function init() {
      cols = Math.max(12, Math.round(window.innerWidth / 32));
      rows = Math.max(8, Math.round(window.innerHeight / 50));
      main.innerHTML = '';
      main.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const a = document.createElement('a');
          a.href = LAB.pageRandomiser.nextOne();
          a.className = (r + c) % 2 === 0 ? 'dark' : 'light';
          main.appendChild(a);
        }
      }
    }

    function draw() {
      const center = 0.5 + 0.42 * Math.sin(t);
      const weights = [];
      let total = 0;
      for (let i = 0; i < cols; i++) {
        const p = i / (cols - 1);
        const w = 0.06 + Math.pow(Math.abs(p - center), 0.8);
        weights.push(w);
        total += w;
      }
      main.style.gridTemplateColumns = weights.map(w => `${(w / total) * 100}%`).join(' ');

      t += 0.01;
      requestAnimationFrame(draw);
    }

    let resizeTimeout = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(init, 200);
    });

    init();
    draw();

  </script>
</body>

</html>
