<!DOCTYPE html>
<html lang="en">

<!--
https://en.wikipedia.org/wiki/Munching_squares
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Monster Squad">
  <title>München</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000000;
      overflow: hidden;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
    }

    #crt-scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 3px;
    }
  </style>
</head>

<body>
  <div id="crt-scanlines"></div>

  <a id="link" href="../index.html">
    <canvas id="canvas"></canvas>
  </a>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('munching-squares');

    const link = document.getElementById('link');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // Smaller offscreen canvas.
    // Calculations happen here, and are then drawn to the main canvas.
    const off = document.createElement('canvas');
    const offCtx = off.getContext('2d');

    const GRID = 128;
    off.width = GRID;
    off.height = GRID;
    const imageData = offCtx.createImageData(GRID, GRID);

    // Each palette is 8 shades, dark to bright.
    // The names are not used by the code, they're just for my own reference.
    const palettes = [
      { name: 'green', shades: ['#001500', '#003300', '#005500', '#007700', '#009900', '#00bb00', '#00dd22', '#66ff66'] },
      { name: 'orange', shades: ['#150a00', '#331800', '#552800', '#773800', '#994c00', '#bb6600', '#dd8811', '#ffbb44'] },
      { name: 'cyan', shades: ['#001015', '#002533', '#003a55', '#005077', '#006899', '#0084bb', '#11a4dd', '#55ddff'] },
      { name: 'grey', shades: ['#0a0a0a', '#222222', '#3a3a3a', '#555555', '#737373', '#959595', '#bbbbbb', '#eeeeee'] },
      { name: 'pink', shades: ['#150010', '#330026', '#55003e', '#770055', '#99006e', '#bb1188', '#dd33aa', '#ff77dd'] },
    ];

    let paletteIndex = 0;
    let paletteRGB = [];
    let t = 0;

    function parseHex(hex) {
      return [
        parseInt(hex.slice(1, 3), 16),
        parseInt(hex.slice(3, 5), 16),
        parseInt(hex.slice(5, 7), 16),
      ];
    }

    function setPalette(index) {
      paletteIndex = index % palettes.length;
      const palette = palettes[paletteIndex];
      paletteRGB = palette.shades.map(parseHex);
    }

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      ctx.imageSmoothingEnabled = false;
    }

    function render() {
      const data = imageData.data;
      let i = 0;
      for (let y = 0; y < GRID; y++) {
        for (let x = 0; x < GRID; x++) {
          const v = ((x ^ y) + t) & 127;
          const shade = paletteRGB[v >> 4];
          data[i] = shade[0];
          data[i + 1] = shade[1];
          data[i + 2] = shade[2];
          data[i + 3] = 255;
          i += 4;
        }
      }
      offCtx.putImageData(imageData, 0, 0);
      ctx.drawImage(off, 0, 0, canvas.width, canvas.height);
    }

    function tick() {
      t = (t + 1) & 127;
      render();
    }

    window.addEventListener('resize', () => {
      resize();
      render();
    });

    // Pressing a key swaps the colours.
    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, () => {
        link.href = LAB.pageRandomiser.nextOne();
        setPalette(paletteIndex + 1);
        render();
      });
    });

    resize();
    setPalette(0);
    setInterval(tick, 60);

  </script>
</body>

</html>
