<!DOCTYPE html>
<html lang="en">

<!--
"Oblique Strategies" (subtitled "Over One Hundred Worthwhile Dilemmas") is a
card-based method for promoting creativity jointly created by musician/artist
Brian Eno and multimedia artist Peter Schmidt, first published in 1975.

Physically, it takes the form of a deck of 7-by-9-centimetre (2.8 in × 3.5 in)
printed cards in a black box.

Each card offers a challenging constraint intended to help artists (particularly
musicians) break creative blocks by encouraging lateral thinking.
-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Over One Hundred Worthwhile Dilemmas">
  <title>Oblique Strategies</title>
  <style>
    body {
      background-color: #050505;
      color: #d0d0d0;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: "Courier New", Courier, monospace;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 60px;
      /* Simulated grain */
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3BaseFilter id='noiseFilter'%3BfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
    }

    #deck-container {
      position: relative;
      width: 320px;
      height: 100px;
      perspective: 1000px;
      z-index: 1000000;
    }

    .deck {
      position: absolute;
      width: 100%;
      height: 100%;
      background: #000;
      border: 1px solid #999;
      border-radius: 4px;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
      user-select: none;
      display: flex;
      justify-content: center;
      align-items: center;
      outline: none;
    }

    .deck:focus {
      border-color: #fff;
      transform: scale(1.02);
    }

    .deck:hover {
      transform: scale(1.02) translateY(-2px);
    }

    .deck:active {
      transform: scale(0.98) translateY(1px);
    }

    .deck::after {
      content: "OBLIQUE STRATEGIES";
      font-size: 24px;
      letter-spacing: 4px;
      color: #ccc;
      text-align: center;
      width: 80%;
    }

    .card {
      position: absolute;
      width: 400px;
      height: 286px;
      background: #e8e8e8;
      color: #111;
      border-radius: 4px;
      box-shadow: 2px 2px 15px rgba(0, 0, 0, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px;
      box-sizing: border-box;
      text-align: center;
      font-size: 1.2rem;
      line-height: 1.4;
      pointer-events: auto;
      text-decoration: none;
      transition: transform 0.8s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.5s ease;
      z-index: 1;
    }

    .card.revealed {
      cursor: pointer;
    }

    .card.revealed:hover {
      filter: brightness(1.1);
      z-index: 1000;
    }

    .card::before {
      content: "";
      position: absolute;
      top: 10px;
      left: 10px;
      right: 10px;
      bottom: 10px;
      border: 1px solid #ccc;
      pointer-events: none;
    }
  </style>
</head>

<body>

  <div id="deck-container">
    <div class="deck" id="deck" tabindex="0" title="Click or press any key to draw a card"></div>
  </div>

  <script src="../../common/CyclicRandomiser.js"></script>
  <script src="../../common/labyrinthPages.js"></script>

      "What wouldn't you do? Do that",
      "When is it for?",
      "Where is the edge?",

      "You are an engineer",
      "You can only make one dot at a time",

      "Your mistake was a hidden intention",
      " ",

    const strategyRandomiser = new CyclicRandomiser(STRATEGIES_POOL);

    const container = document.body;
    const deck = document.getElementById('deck');
    let maxZ = 1;

    function drawCard() {
      const phrase = strategyRandomiser.nextOne();
      const card = document.createElement('a');
      card.className = 'card';
      card.href = pageRandomiser.nextOne();
      card.innerText = phrase;

      // Initial strategy: newly created cards go on top of old ones
      card.style.zIndex = `${maxZ++}`;

      // Bring to front on hover and keep it there
      card.addEventListener('mouseenter', () => {
        card.style.zIndex = `${maxZ++}`;
      });

      // Random end position (anywhere on the screen, independent of deck location)
      const targetX = Math.random() * (window.innerWidth - 400);
      const targetY = Math.random() * (window.innerHeight - 300);
      const rotate = (Math.random() - 0.5) * 40;

      // Start at deck position
      const deckRect = deck.getBoundingClientRect();
      const startX = deckRect.left + deckRect.width / 2 - 200;
      const startY = deckRect.top + deckRect.height / 2 - 150;

      card.style.left = `${startX}px`;
      card.style.top = `${startY}px`;
      card.style.transform = `translate(0, 0) rotate(0deg) scale(0.2)`;
      card.style.opacity = '0';

      // Calculate final translation delta
      const x = targetX - startX;
      const y = targetY - startY;

      container.appendChild(card);

      // Use nested requestAnimationFrame (double rAF) to ensure the browser paints the
      // card's initial state at the deck before applying the transformation. Without
      // this, the browser might batch the styles and skip the transition animation.
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          card.style.opacity = '1';
          card.style.transform = `translate(${x}px, ${y}px) rotate(${rotate}deg) scale(0.8)`;
          card.classList.add('revealed');
        });
      });
    }

    deck.addEventListener('click', drawCard);

    // Draw card on any key press (except when interacting with the deck specifically)
    window.addEventListener('keydown', (e) => {
      // Ignore if user is tabbing
      if (e.key === 'Tab') {
        return;
      }
      // Ignore if a modifier key is pressed (e.g., Ctrl, Alt, Meta, Shift)
      if (e.ctrlKey || e.altKey || e.metaKey || e.shiftKey) {
        return;
      }
      drawCard();
    });

  </script>
</body>

</html>
