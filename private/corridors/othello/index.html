<!DOCTYPE html>
<html lang="en">

<!--
I should have named this "Reversi", since that's the non-brand name.
But then I couldn't make a dumb Shakespeare reference.
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Othello board flipping simulation">
  <title>I am not what I am</title>
  <style>
    :root {
      --board-green: #1a4d2e;
      --felt-green: #245e3a;
      --wood-trim: #3d2b1f;
      --piece-white: #f0f0f0;
      --piece-black: #111111;
      --ui-padding: 40px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      background-color: #0a0a0a;
      overflow: hidden;
    }

    body {
      display: flex;
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: #0a0a0a;
      justify-content: center;
      align-items: center;
      overflow: visible;
    }

    main {
      position: relative;
      padding: var(--ui-padding);
      background: var(--wood-trim);
      box-shadow: 0 50px 100px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      transform: translate(var(--dx, 0px), var(--dy, 0px)) perspective(1000px) rotateX(20deg);
      animation: movement 10s ease-in-out infinite alternate;
    }

    @keyframes movement {
      from {
        transform: translate(var(--dx, 0px), var(--dy, 0px)) perspective(1000px) rotateX(15deg) rotateY(-2deg);
      }

      to {
        transform: translate(var(--dx, 0px), var(--dy, 0px)) perspective(1000px) rotateX(25deg) rotateY(2deg);
      }
    }

    #board {
      display: grid;
      width: 600px;
      height: 600px;
      background-color: var(--piece-black);
      border: 2px solid var(--piece-black);
      grid-template-columns: repeat(8, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 2px;
    }

    .square {
      position: relative;
      display: flex;
      background-color: var(--board-green);
      background-image: radial-gradient(circle, var(--felt-green) 0%, var(--board-green) 100%);
      justify-content: center;
      align-items: center;
      cursor: pointer;
      overflow: hidden;
    }

    .piece-anchor {
      position: relative;
      width: 80%;
      height: 80%;
      text-decoration: none;
      perspective: 600px;
    }

    .piece {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .piece div {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      backface-visibility: hidden;
    }

    .side-white {
      background: radial-gradient(circle at 30% 30%, #ffffff, #cccccc);
    }

    .side-black {
      background: radial-gradient(circle at 30% 30%, #444444, #111111);
      transform: rotateY(180deg);
    }

    .piece.flipped {
      transform: rotateY(180deg);
    }

    #dust {
      position: fixed;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44NSIgbnVtT2N0YXZlcz0iMyIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIvPjwvc3ZnPg==');
      opacity: 0.15;
      z-index: 50;
      pointer-events: none;
    }

    #vignette {
      position: fixed;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle, transparent 30%, rgba(0, 0, 0, 0.7) 100%);
      top: 0;
      left: 0;
      z-index: 60;
      pointer-events: none;
    }

    #ui-overlay {
      position: fixed;
      width: 100%;
      height: 100%;
      border: var(--ui-padding) solid #000000;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 100;
    }

    @media (max-width: 900px) {
      :root {
        --ui-padding: 20px;
      }
    }

    @media (max-width: 700px) {
      :root {
        --ui-padding: 10px;
      }
    }
  </style>
</head>

<body>
  <div id="dust"></div>
  <div id="vignette"></div>
  <div id="ui-overlay"></div>

  <main id="main">
    <div id="board">
      <!-- 64 squares -->
    </div>
  </main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('othello');

    const board = document.getElementById('board');
    const main = document.getElementById('main');
    const overlay = document.getElementById('ui-overlay');
    const pieces = [];
    const boardMaxSize = 600;
    const screenMargin = 8;

    //  need to match the CSS (perspective() and @keyframes movement)
    const PERSPECTIVE = 1000;
    const TILT_X = [15, 25]; // rotateX range in degrees
    const TILT_Y = [-2, 2];  // rotateY range in degrees

    // Initialise board
    for (let i = 0; i < 64; i++) {
      const square = document.createElement('div');
      square.className = 'square';

      const anchor = document.createElement('a');
      anchor.className = 'piece-anchor';
      anchor.href = LAB.pageRandomiser.nextOne();

      const piece = document.createElement('div');
      piece.className = 'piece';

      // Random initial colour for each piece
      const isWhite = LAB.chance(0.5);
      if (!isWhite) {
        piece.classList.add('flipped');
      }

      const whiteSide = document.createElement('div');
      whiteSide.className = 'side-white';

      const blackSide = document.createElement('div');
      blackSide.className = 'side-black';

      piece.appendChild(whiteSide);
      piece.appendChild(blackSide);
      anchor.appendChild(piece);
      square.appendChild(anchor);
      board.appendChild(square);

      pieces.push(piece);
    }

    function checkGoto() {
      for (let row = 0; row < 8; row++) {
        for (let col = 0; col < 8; col++) {
          const isBlack = pieces[row * 8 + col].classList.contains('flipped');
          if (isBlack !== (row + col >= 8)) return false;
        }
      }
      setTimeout(() => location.assign(LAB.goto()), 800);
    }

    // Flip every piece to a single colour
    function flipAll(toBlack) {
      pieces.forEach((p) => p.classList.toggle('flipped', toBlack));
    }

    // Re-randomise every piece's colour
    function randomiseAll() {
      pieces.forEach((p) => p.classList.toggle('flipped', !LAB.chance(0.5)));
      checkGoto();
    }

    // Where the corners of a square of side `m` end up on screen after
    // perspective(P) rotateX(a) rotateY(b), relative to the square's centre.
    // CSS applies the functions right to left: rotateY first, then rotateX,
    // then the perspective divide.
    function projectedBounds(m, aDeg, bDeg) {
      const a = aDeg * Math.PI / 180;
      const b = bDeg * Math.PI / 180;
      const h = m / 2;
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

      for (const [x, y] of [[-h, -h], [h, -h], [h, h], [-h, h]]) {
        const x1 = x * Math.cos(b);
        const z1 = -x * Math.sin(b);
        const y2 = y * Math.cos(a) - z1 * Math.sin(a);
        const z2 = y * Math.sin(a) + z1 * Math.cos(a);
        const w = 1 - z2 / PERSPECTIVE;
        const sx = x1 / w;
        const sy = y2 / w;
        minX = Math.min(minX, sx);
        maxX = Math.max(maxX, sx);
        minY = Math.min(minY, sy);
        maxY = Math.max(maxY, sy);
      }
      return { minX, maxX, minY, maxY };
    }

    // The outline swept out by the whole sway animation (it interpolates both
    // angles together, so sampling along that line covers every frame).
    // We need this to make sure the board fits on screen responsively.
    function swayBounds(m) {
      const steps = 12;
      let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const a = TILT_X[0] + (TILT_X[1] - TILT_X[0]) * t;
        const b = TILT_Y[0] + (TILT_Y[1] - TILT_Y[0]) * t;
        const bounds = projectedBounds(m, a, b);
        minX = Math.min(minX, bounds.minX);
        maxX = Math.max(maxX, bounds.maxX);
        minY = Math.min(minY, bounds.minY);
        maxY = Math.max(maxY, bounds.maxY);
      }
      return { minX, maxX, minY, maxY };
    }

    function computeSizes() {
      // The visible area is the viewport minus the black frame and a small margin
      const frame = parseFloat(getComputedStyle(overlay).borderTopWidth) || 0;
      const pad = parseFloat(getComputedStyle(main).paddingLeft) || 0;
      const availW = Math.max(0, window.innerWidth - 2 * (frame + screenMargin));
      const availH = Math.max(0, window.innerHeight - 2 * (frame + screenMargin));

      const fits = (m) => {
        const bounds = swayBounds(m);
        return (bounds.maxX - bounds.minX) <= availW && (bounds.maxY - bounds.minY) <= availH;
      };

      // The projected size grows monotonically with m, so bisect for the largest fit
      let lo = 0;
      let hi = boardMaxSize + 2 * pad;
      if (fits(hi)) {
        lo = hi;
      } else {
        for (let i = 0; i < 40; i++) {
          const mid = (lo + hi) / 2;
          if (fits(mid)) lo = mid; else hi = mid;
        }
      }

      const size = Math.max(0, lo - 2 * pad);
      board.style.width = `${size}px`;
      board.style.height = `${size}px`;

      const bounds = swayBounds(size + 2 * pad);
      main.style.setProperty('--dx', `${-(bounds.minX + bounds.maxX) / 2}px`);
      main.style.setProperty('--dy', `${-(bounds.minY + bounds.maxY) / 2}px`);
    }

    // Mouse interaction to flip pieces
    board.addEventListener('mousemove', (e) => {
      const rect = board.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      // Find nearest square
      const col = Math.floor(x / (rect.width / 8));
      const row = Math.floor(y / (rect.height / 8));
      const index = row * 8 + col;

      const target = pieces[index];
      if (target) {
        const now = Date.now();
        const cooldown = 800; // Match the CSS transition duration

        if (!target.lastFlip || (now - target.lastFlip) > cooldown) {
          target.classList.toggle('flipped');
          target.lastFlip = now;
          checkGoto();
        }
      }
    });

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, () => {
        const k = e.key.toLowerCase();
        if (k === 'w') {
          flipAll(false);
        } else if (k === 'b') {
          flipAll(true);
        } else {
          randomiseAll();
        }
      });
    });

    window.addEventListener('resize', computeSizes);
    window.addEventListener('orientationchange', computeSizes);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', computeSizes);
    }

    computeSizes();

  </script>
</body>

</html>
