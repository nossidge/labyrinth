<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="brewer's droop">
  <title>morning soup</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Lora:wght@700&family=Oswald:wght@600&display=swap"
    rel="stylesheet">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background-color: #7a7a7a;
      background-image:
        linear-gradient(45deg, #888 25%, transparent 25%),
        linear-gradient(-45deg, #888 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #888 75%),
        linear-gradient(-45deg, transparent 75%, #888 75%);
      background-size: 4px 4px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Libre Baskerville", serif;
      overflow: hidden;
    }

    .card {
      width: 540px;
      height: 310px;
      background: #fdfdfd;
      box-shadow:
        10px 10px 0px rgba(0, 0, 0, 0.2),
        0 15px 35px rgba(0, 0, 0, 0.3);
      border-radius: 1px;
      padding: 22px 28px;
      box-sizing: border-box;
      position: relative;
      border: 1px solid #ddd;
    }

    .top-banner {
      background: #111;
      padding: 8px 0px 2px 10px;
      text-align: left;
      margin-bottom: 22px;
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.1);
    }

    .top-banner a {
      font-family: "Lora", serif;
      font-weight: 700;
      font-size: 42px;
      letter-spacing: -1px;
      color: white;
      text-decoration: none;
      display: inline-block;
      transform: scale(1.1, 1.3);
      transform-origin: left;
    }

    .names {
      margin-bottom: 10px;
    }

    .names a {
      font-weight: 700;
      font-size: 22px;
      text-decoration: none;
      color: #111;
    }

    .tagline a {
      font-style: italic;
      font-size: 17px;
      color: #222;
      text-decoration: none;
    }

    .bottom {
      position: absolute;
      bottom: 22px;
      left: 28px;
      right: 28px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .address a,
    .contact a {
      display: block;
      font-size: 17px;
      color: #111;
      text-decoration: none;
      line-height: 1.3;
    }

    .address {
      text-align: left;
    }

    .contact {
      text-align: right;
    }

    a {
      transition: color 0.1s ease;
    }

    a:hover {
      color: #555;
    }

    .top-banner a:hover {
      color: #ccc;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="top-banner">
      <a href="../../todo.html">AMAZING GLAZING</a>
    </div>

    <div class="names">
      <a href="../../todo.html">Phil & Damon</a>
    </div>

    <div class="tagline">
      <a href="../../todo.html">“Always completely transparent”</a>
    </div>

    <div class="bottom">
      <div class="address">
        <a href="../../todo.html">82 SKYLARK'S WAY,</a>
        <a href="../../todo.html">LONDON, E17.</a>
      </div>
      <div class="contact">
        <a href="../../todo.html">Tel: 415 875 8463</a>
        <a href="../../todo.html">Fax: 823 876 8431</a>
        <a href="../../todo.html">Mobile: 0956 394333</a>
      </div>
    </div>
  </div>
</body>

</html>
