<head>

  <style>
    /*
      Everything inside the card is sized in multiples of --u
      Where 1 --u = 1 "pixel" of the original 540x310 design
      This is so that the whole cards scale as one image
    */
    :root {
      --h: 100vh;
      --w: min(540px, 100vw, calc(var(--h) * 540 / 310));
      --u: calc(var(--w) / 540);
    }

    @supports (height: 100dvh) {
      :root {
        --h: 100dvh;
      }
    }

    html,
    body {
      margin: 0;
      height: 100%;
    }

    body {
      display: flex;
      height: var(--h);
      background-color: #7a7a7a;
      background-image:
        linear-gradient(45deg, #888888 25%, transparent 25%),
        linear-gradient(-45deg, #888888 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #888888 75%),
        linear-gradient(-45deg, transparent 75%, #888888 75%);
      background-size: 4px 4px;
      font-family: "Libre Baskerville", serif;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .card {
      position: relative;
      flex: none;
      width: var(--w);
      aspect-ratio: 540 / 310;
      padding: calc(22 * var(--u)) calc(28 * var(--u));
      box-sizing: border-box;
      background: #fdfdfd;
      box-shadow:
        calc(10 * var(--u)) calc(10 * var(--u)) 0 rgba(0, 0, 0, 0.2),
        0 calc(15 * var(--u)) calc(35 * var(--u)) rgba(0, 0, 0, 0.3);
      border-radius: calc(1 * var(--u));
      border: calc(1 * var(--u)) solid #dddddd;
      white-space: nowrap;
    }

    .top-banner {
      padding: calc(8 * var(--u)) 0 calc(2 * var(--u)) calc(10 * var(--u));
      margin-bottom: calc(22 * var(--u));
      background: #111111;
      box-shadow: calc(3 * var(--u)) calc(3 * var(--u)) 0 rgba(0, 0, 0, 0.1);
      text-align: left;
    }

    .top-banner a {
      display: inline-block;
      color: white;
      font-family: "Lora", serif;
      font-weight: 700;
      font-size: calc(42 * var(--u));
      letter-spacing: calc(-1 * var(--u));
      text-decoration: none;
      transform: scale(1.1, 1.3);
      transform-origin: left;
    }

    .names {
      margin-bottom: calc(10 * var(--u));
    }

    .names a {
      color: #111111;
      font-weight: 700;
      font-size: calc(22 * var(--u));
      text-decoration: none;
    }

    .tagline a {
      color: #222222;
      font-style: italic;
      font-size: calc(17 * var(--u));
      text-decoration: none;
    }

    .bottom {
      position: absolute;
      display: flex;
      bottom: calc(22 * var(--u));
      left: calc(28 * var(--u));
      right: calc(28 * var(--u));
      justify-content: space-between;
      align-items: flex-end;
    }

    .address a,
    .contact a {
      display: block;
      color: #111111;
      font-size: calc(17 * var(--u));
      text-decoration: none;
      line-height: 1.3;
    }

    .address {
      text-align: left;
    }

    .contact {
      text-align: right;
    }

    a {
      transition: color 0.1s ease;
    }

    a:hover {
      color: #555555;
    }

    .top-banner a:hover {
      color: #cccccc;
    }
  </style>
</head>

<body>
  <div class="card">

    <div class="bottom">

      <div class="contact">

        <a href="../index.html">Mobile: 0956 394333</a>
      </div>
    </div>
  </div>
