<!DOCTYPE html>
<html lang="en">

<!--
This is based on those pendulum wave demonstrations.
Each pendulum from left to right has a slightly increasing swing period.
So it gives pretty emergent wave patterns from just really simple motion.
-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Granite">
  <title>The Pit</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0c;
    }

    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Good old faithful CRT scanline overlay */
    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.03));
      background-size: 100% 2px, 3px 100%;
    }
  </style>
</head>

<body>
  <a href="../index.html">
    <canvas id="canvas"></canvas>
  </a>

  <script src="../../common/CyclicRandomiser.js"></script>
  <script src="../../common/labyrinthPages.js"></script>
  <script>
    const currentPage = "corridors/pendula";
    const otherPages = labyrinthPages.filter(p => !p.includes(currentPage));
    const pageRandomiser = new CyclicRandomiser(otherPages);

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const BASE_PERIOD = 4.0;
    const PERIOD_INCREMENT = 0.02;
    const BOB_RADIUS = 16;
    const MAX_ANGLE = 0.85;
    const IDEAL_SPACING = 75;
    const MIN_SPACING = 40;

    let showStrings = true;

    // I think I prefer it pure white, but leave this in case I change my mind.
    const PALETTES = [
      // ['#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff', '#ff6b9d'],
      // ['#f72585', '#b5179e', '#7209b7', '#560bad', '#480ca8'],
      // ['#00f5d4', '#00bbf9', '#fee440', '#f15bb5', '#9b5de5'],
      // ['#ff595e', '#ffca3a', '#8ac926', '#1982c4', '#6a4c93'],
      ['#cccccc'],
    ];

    let palette;
    let pendulums = [];
    let startTime;
    let W, H;

    function init() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;

      palette = PALETTES[Math.floor(Math.random() * PALETTES.length)];

      const pivotY = H * 0.08;

      // Scale spacing: use IDEAL_SPACING on wide screens, down to MIN_SPACING on narrow
      const spacing = Math.max(MIN_SPACING, Math.min(IDEAL_SPACING, W / 20));
      const numPendulums = Math.max(2, Math.floor((W - spacing) / spacing));

      pendulums = [];

      for (let i = 0; i < numPendulums; i++) {
        const period = BASE_PERIOD + i * PERIOD_INCREMENT;
        const pivotX = spacing * (i + 1);
        const length = H * 0.55;
        const color = palette[i % palette.length];

        pendulums.push({
          pivotX, pivotY, length, period, color,
          bobX: pivotX, bobY: pivotY + length,
        });
      }

      startTime = performance.now();
    }

    function update(now) {
      const t = (now - startTime) / 1000;

      ctx.clearRect(0, 0, W, H);

      // Draw the beam at the top
      if (showStrings) {
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(0, H * 0.08);
        ctx.lineTo(W, H * 0.08);
        ctx.stroke();
      }

      // Draw faint previous positions to make a trail effect
      for (let trail = 3; trail >= 1; trail--) {
        const trailT = t - trail * 0.03;
        const alpha = 0.06 * (4 - trail);

        pendulums.forEach(p => {
          const omega = (2 * Math.PI) / p.period;
          const angle = MAX_ANGLE * Math.sin(omega * trailT);
          const bx = p.pivotX + p.length * Math.sin(angle);
          const by = p.pivotY + p.length * Math.cos(angle);

          ctx.beginPath();
          ctx.arc(bx, by, BOB_RADIUS * 0.6, 0, Math.PI * 2);
          ctx.fillStyle = p.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');

          // Handle hex colours
          const r = parseInt(p.color.slice(1, 3), 16);
          const g = parseInt(p.color.slice(3, 5), 16);
          const b = parseInt(p.color.slice(5, 7), 16);
          ctx.fillStyle = `rgba(${r}, ${g}, ${b}, ${alpha})`;
          ctx.fill();
        });
      }

      // Main pendulums
      pendulums.forEach(p => {
        const omega = (2 * Math.PI) / p.period;
        const angle = MAX_ANGLE * Math.sin(omega * t);
        p.bobX = p.pivotX + p.length * Math.sin(angle);
        p.bobY = p.pivotY + p.length * Math.cos(angle);

        // String
        if (showStrings) {
          ctx.beginPath();
          ctx.moveTo(p.pivotX, p.pivotY);
          ctx.lineTo(p.bobX, p.bobY);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }

        // Glow
        const gradient = ctx.createRadialGradient(
          p.bobX, p.bobY, 0, p.bobX, p.bobY, BOB_RADIUS * 3
        );
        const r = parseInt(p.color.slice(1, 3), 16);
        const g = parseInt(p.color.slice(3, 5), 16);
        const b = parseInt(p.color.slice(5, 7), 16);
        gradient.addColorStop(0, `rgba(${r}, ${g}, ${b}, 0.3)`);
        gradient.addColorStop(1, `rgba(${r}, ${g}, ${b}, 0)`);
        ctx.beginPath();
        ctx.arc(p.bobX, p.bobY, BOB_RADIUS * 3, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();

        // Bob
        ctx.beginPath();
        ctx.arc(p.bobX, p.bobY, BOB_RADIUS, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      });

      requestAnimationFrame(update);
    }

    // Toggle strings on keydown
    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.altKey || e.shiftKey || e.metaKey) return;
      if (e.key === 'Tab' || e.key === 'F5') return;

      showStrings = !showStrings;
    });

    window.addEventListener('resize', init);

    init();

    requestAnimationFrame(update);

  </script>
</body>

</html>
