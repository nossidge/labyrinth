<!DOCTYPE html>
<html lang="en">

<!--
This page took two weeks to finish.
But a bad pun is always worth my time.
And this page has 21 bad puns!

- achromatic:    The periodic table is in black and white
- acrobatic:     The table container flips around every so often, to simulate a backflip
- alphabetic:    The elements of the normal periodic table are in alphabetic order
- automatic:     The hoverover highlight effect happens automatically every so often
- demographic:   Table of the countries of the world in population count order
- energetic:     The table container is animated to move erratically
- enigmatic:     The chemical element HTML tags are hidden, and only visible on hover over
- episodic:      Each day shows only one chemical element, which changes each day
- futuristic:    Flashy CSS, and each element has a prefix or suffix like "cyber" or "mega"
- gastronomic:   Instead of listing the chemical elements, it lists types of food
- Hellenistic:   The entire periodic table is in Greek
- hieroglyphic:  The entire periodic table is in Unicode Egyptian Hieroglyphs
- hyperbolic:    Each element ends in an exclamation mark, and the hoverover is twice as big
- inauthentic:   The elements are replaced with nonsense ones, such as "Music" and "Wood"
- microscopic:   The periodic table is 25% of the normal size
- philharmonic:  The periodic table is replaced by a orchestra concert seating table
- pianistic:     The elements are coloured white or black as on a keyboard
- pointillistic: The periodic table is in a pointillistic artistic technique
- pre-Socratic:  A table containing the four classical elements: earth, water, air, and fire
- psychedelic:   The periodic table is in animated psychedelic colours
- realistic:     The periodic table is replaced with a JPEG of a literal wooden table

The "Alphabetic Table" is ordered by chemical symbol, not element name.
I think this looks better visually, which helps to sell the joke.

The "Demographic Table" uses 2023 population estimates.
Actual populations have probably changed since then.

The "Episodic Table" uses 1834-02-08 as the epoch.
Because that's Dmitri Mendeleev's birthday :-)

The "Gastronomic Table" is heavily European, since I am from England.
I'm sure other cultures would have very different entries.
Don't read too much into the selections and ordering, it's just a bit of fun.

The "Hellenistic Table" was auto-translated by a foolish machine.
If any actual Greek person wants me to make changes, please let me know:
[my user name, hopefully you can figure this out]@gmail.com

Source for the "Inauthentic Table" is Look Around You:
https://www.bbc.co.uk/comedy/lookaroundyou/series1/periodic.shtml
https://lookaroundyou.fandom.com/wiki/List_of_chemical_symbols
https://agaveweb.com/blog/manganesium-and-americum/
https://agaveweb.com/images/lookaroundyouelementtable.gif

The "Philharmonic Table" is just an example I cobbled together.
Obviously every orchestra, and every concert, is different.

Source for the "Realistic Table" image:
https://cane-line.co.uk/cdn/shop/files/50804T_P144COT_8532.png?v=1771838543
https://cane-line.co.uk/products/aspect-dining-table-dia-144-cm
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="My dear Watson">
  <title>Elementary</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
    }

    body {
      font-family: Georgia, 'Times New Roman', serif;
      background-color: #f3e9d0;
      background-size: 200px 200px;
      color: #3a2a16;
      padding: 16px;
      min-height: 100vh;
    }

    h1 {
      text-align: center;
      font-size: 28px;
      letter-spacing: 4px;
      margin-bottom: 16px;
      font-variant: small-caps;
      color: #4a3318;
    }

    h1::before,
    h1::after {
      content: ' ~ ';
      color: #8a6a3a;
    }

    .top-bar {
      width: 100%;
    }

    /* Side nav panels for moving between table modes */
    .nav-panel {
      position: fixed;
      top: 0;
      height: 100%;
      width: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 40;
      cursor: pointer;
    }

    #nav-left {
      left: 0;
      background: linear-gradient(to right, rgba(58, 42, 22, 0.05), transparent);
    }

    #nav-left:hover {
      background: linear-gradient(to right, rgba(58, 42, 22, 0.14), transparent);
    }

    #nav-right {
      right: 0;
      background: linear-gradient(to left, rgba(58, 42, 22, 0.05), transparent);
    }

    #nav-right:hover {
      background: linear-gradient(to left, rgba(58, 42, 22, 0.14), transparent);
    }

    .nav-button {
      background: transparent;
      border: none;
      color: rgba(58, 42, 22, 0.8);
      font-family: 'Courier New', monospace;
      font-size: 28px;
      padding: 12px 16px;
      cursor: pointer;
      line-height: 1;
      pointer-events: none;
    }

    .nav-panel:hover .nav-button {
      color: rgba(58, 42, 22, 1);
    }

    /* Side nav panels become header buttons on mobile/tablet */
    @media (max-width: 1399px) {
      .top-bar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      h1 {
        flex: 1;
        margin-bottom: 0;
      }

      .nav-panel {
        position: static;
        top: auto;
        height: auto;
        width: auto;
        display: block;
        flex: 0 0 auto;
        z-index: auto;
        background: none;
      }

      #nav-left,
      #nav-left:hover,
      #nav-right,
      #nav-right:hover {
        background: none;
      }

      .nav-button {
        border: 1.5px solid #3a2a16;
        background: rgba(255, 250, 230, 0.35);
        box-shadow: inset 0 0 0 1px rgba(255, 250, 230, 0.35);
        color: rgba(58, 42, 22, 0.9);
        padding: 8px 12px;
        pointer-events: auto;
      }

      .nav-panel:hover .nav-button {
        background: rgba(255, 250, 230, 0.55);
      }
    }

    /* Most table modes share the same style */
    #content {
      transform-origin: top center;
      transition: transform 0.4s ease;
    }

    .table {
      display: grid;
      grid-template-columns: repeat(18, minmax(0, 1fr));
      grid-template-rows: repeat(7, auto);
      gap: 3px;
      max-width: 1180px;
      margin: 0 auto;
    }

    .lanth-actin {
      display: grid;
      grid-template-columns: repeat(18, minmax(0, 1fr));
      grid-template-rows: repeat(2, auto);
      gap: 3px;
      max-width: 1180px;
      margin: 14px auto 0 auto;
    }

    .cell {
      position: relative;
      aspect-ratio: 1 / 1;
      border: 1.5px solid #3a2a16;
      box-shadow: inset 0 0 0 1px rgba(255, 250, 230, 0.35);
      text-decoration: none;
      color: #1c1006;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 3px 4px 4px 4px;
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
      overflow: visible;
      font-family: Georgia, serif;
    }

    .cell .num {
      font-size: 9px;
      font-weight: bold;
      line-height: 1;
      text-align: left;
      opacity: 0.85;
    }

    .cell .num.num-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 2px;
    }

    .cell .num.num-row span {
      white-space: nowrap;
    }

    .cell .num.num-row span.num-mid {
      flex: 1;
      text-align: center;
    }

    .cell .num.num-row span.num-right {
      text-align: right;
    }

    .cell .sym {
      font-size: 22px;
      font-weight: 900;
      text-align: center;
      line-height: 1;
      letter-spacing: 0.5px;
      flex: 0 0 auto;
      margin: 1px 0;
    }

    .cell .name {
      font-size: 8px;
      text-align: center;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Hover lift (also applied when a legend item is hovered) */
    .cell:hover,
    .cell.highlight {
      transform: translate(-2px, -3px);
      box-shadow:
        4px 5px 0 rgba(0, 0, 0, 0.35),
        inset 0 0 0 1px rgba(255, 250, 230, 0.5);
      filter: brightness(1.08);
      z-index: 30;
    }

    /* Tooltip */
    .cell .tip {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translate(-50%, -6px);
      background: #1c1006;
      color: #f3e9d0;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      padding: 6px 8px;
      border: 1px solid #f3e9d0;
      box-shadow: 3px 3px 0 rgba(0, 0, 0, 0.5);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
      z-index: 100;
      line-height: 1.4;
    }

    .cell .tip b {
      color: #e6c97a;
    }

    .cell:hover .tip,
    body.view-automatic .cell.auto-highlight .tip {
      opacity: 1;
    }

    /* Edge tooltip flip helpers */
    .cell.tip-left .tip {
      left: auto;
      right: 100%;
      bottom: 50%;
      transform: translate(-6px, 50%);
    }

    .cell.tip-right .tip {
      left: 100%;
      right: auto;
      bottom: 50%;
      transform: translate(6px, 50%);
    }

    .cell.tip-below .tip {
      bottom: auto;
      top: 100%;
      transform: translate(-50%, 6px);
    }

    /* Placeholder cells for the lanthanide/actinide gaps in the main table */
    .placeholder {
      aspect-ratio: 1 / 1;
      border: 1.5px dashed #8a6a3a;
      background: rgba(255, 250, 230, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 14px;
      color: #6a4a22;
      font-style: italic;
    }

    /* Legend */
    .legend {
      max-width: 1180px;
      margin: 24px auto 12px auto;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 14px;
      justify-content: center;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      color: #3a2a16;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      padding: 2px 4px;
      border: 1px solid transparent;
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .legend-item:hover {
      border-color: #3a2a16;
      background-color: rgba(255, 250, 230, 0.4);
    }

    .swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 1px solid #3a2a16;
    }

    /* "Periodic Table" categories */
    .cat-alkali {
      background-color: #d28080;
    }

    .cat-alkaline {
      background-color: #e0a872;
    }

    .cat-transition {
      background-color: #d4b25a;
    }

    .cat-posttrans {
      background-color: #a3b89a;
    }

    .cat-metalloid {
      background-color: #b9a4c4;
    }

    .cat-nonmetal {
      background-color: #8eb5c4;
    }

    .cat-halogen {
      background-color: #88b070;
    }

    .cat-noble {
      background-color: #a878b8;
    }

    .cat-lanthanide {
      background-color: #d99a8b;
    }

    .cat-actinide {
      background-color: #c890a8;
    }

    .cat-unknown {
      background-color: #9c9a92;
    }

    /* "Demographic Table" categories (continents) */
    .cat-africa {
      background-color: #e0a872;
    }

    .cat-asia {
      background-color: #d4b25a;
    }

    .cat-europe {
      background-color: #8eb5c4;
    }

    .cat-namerica {
      background-color: #d28080;
    }

    .cat-samerica {
      background-color: #88b070;
    }

    .cat-oceania {
      background-color: #a878b8;
    }

    /* "Inauthentic Table" categories (use colours as a ref, as there's no names) */
    .cat-muted_apricot {
      background-color: #eec490;
    }

    .cat-heather_purple {
      background-color: #cb9cd5;
    }

    .cat-soft_lavender {
      background-color: #c39bd4;
    }

    .cat-orchid_pink {
      background-color: #df9ad5;
    }

    .cat-washed_lime {
      background-color: #ccdb91;
    }

    .cat-mint_wash {
      background-color: #b5dfbe;
    }

    .cat-powdered_teal {
      background-color: #b6d0d6;
    }

    .cat-grey_lilac {
      background-color: #b4aad5;
    }

    .cat-pale_blush {
      background-color: #f6ded6;
    }

    .cat-buttercream_yellow {
      background-color: #fee79b;
    }

    .cat-bubblegum_rose {
      background-color: #f39acb;
    }

    .cat-dusty_coral {
      background-color: #f49ba2;
    }

    .cat-peach_clay {
      background-color: #f2a793;
    }

    .cat-golden_mango {
      background-color: #fbc86b;
    }

    .cat-warm_sandstone {
      background-color: #e7c5b4;
    }

    .cat-dusty_mauve {
      background-color: #b88b9f;
    }

    /* "Pre-Socratic Table" categories (the four classical qualities) */
    /* A bit of a weird way of doing this, but it does work. */
    /* A cell belongs to two of these at once e.g. "Fire" is "hot" and "dry". */
    /* The legend swatches use the solo colours below, and the cells themselves */
    /* use compound selectors, so each classical element has its own colour. */
    .cat-hot {
      background-color: #D08F7F;
    }

    .cat-cold {
      background-color: #858B85;
    }

    .cat-dry {
      background-color: #B46242;
    }

    .cat-wet {
      background-color: #A1B8C2;
    }

    .cat-hot.cat-dry {
      background-color: #c84a3a;
    }

    .cat-hot.cat-wet {
      background-color: #d8d4c4;
    }

    .cat-cold.cat-dry {
      background-color: #a07a4a;
    }

    .cat-cold.cat-wet {
      background-color: #6a9bbf;
    }

    /* "Philharmonic Table" categories (instrument groups) */
    .cat-strings {
      background-color: #c89b6a;
    }

    .cat-woodwind {
      background-color: #8eb098;
    }

    .cat-brass {
      background-color: #d4a050;
    }

    .cat-percussion {
      background-color: #a890b8;
    }

    .cat-conductor {
      background-color: #4a3318;
      color: #f3e9d0;
    }

    /* "Achromatic Table" view: greyscale */
    body.view-achromatic {
      filter: grayscale(1);
    }

    /* "Acrobatic Table" view: occasional backflips */
    body.view-acrobatic {
      perspective: 1400px;
      overflow: hidden;
    }

    body.view-acrobatic #content {
      transform-origin: center center;
      animation: acrobatic-flip 6s ease-in-out infinite;
    }

    @keyframes acrobatic-flip {

      0%,
      15% {
        transform: rotateX(0deg);
      }

      50% {
        transform: rotateX(180deg);
      }

      50%,
      100% {
        transform: rotateX(360deg);
      }
    }

    /* "Energetic Table" view: jiggly movement */
    body.view-energetic #content {
      animation: energetic-jitter 1.6s steps(1, end) infinite;
    }

    @keyframes energetic-jitter {
      0% {
        transform: translate(0, 0) rotate(0deg);
      }

      8% {
        transform: translate(-6px, 4px) rotate(-1.2deg);
      }

      16% {
        transform: translate(2px, -6px) rotate(1.2deg);
      }

      24% {
        transform: translate(-3px, -2px) rotate(0.6deg);
      }

      32% {
        transform: translate(6px, 7px) rotate(-0.2deg);
      }

      40% {
        transform: translate(-4px, 2px) rotate(1deg);
      }

      48% {
        transform: translate(4px, -4px) rotate(-0.4deg);
      }

      56% {
        transform: translate(2px, 5px) rotate(1.1deg);
      }

      64% {
        transform: translate(-2px, -3px) rotate(-1.1deg);
      }

      72% {
        transform: translate(2px, 8px) rotate(0.9deg);
      }

      80% {
        transform: translate(-4px, -5px) rotate(-1.2deg);
      }

      88% {
        transform: translate(5px, 3px) rotate(0.8deg);
      }

      100% {
        transform: translate(0, 0) rotate(0deg);
      }
    }

    /* "Enigmatic Table" view: hide content until hover */
    body.view-enigmatic .cell .num,
    body.view-enigmatic .cell .sym,
    body.view-enigmatic .cell .name {
      visibility: hidden;
    }

    body.view-enigmatic .cell:hover .num,
    body.view-enigmatic .cell:hover .sym,
    body.view-enigmatic .cell:hover .name,
    body.view-enigmatic .cell.highlight .num,
    body.view-enigmatic .cell.highlight .sym,
    body.view-enigmatic .cell.highlight .name {
      visibility: visible;
    }

    body.view-enigmatic .placeholder {
      color: transparent;
    }

    body.view-enigmatic .placeholder:hover {
      color: #6a4a22;
    }

    body.view-enigmatic .legend-item {
      color: transparent;
    }

    body.view-enigmatic .legend-item:hover {
      color: #3a2a16;
    }

    /* "Episodic Table" view: one giant card per day */
    body.view-episodic #table-main {
      display: grid;
      grid-template-columns: 1fr;
      grid-template-rows: 1fr;
      max-width: 540px;
      margin: 30px auto;
    }

    body.view-episodic #table-lanth-actin,
    body.view-episodic .legend {
      display: none;
    }

    body.view-episodic .cell {
      aspect-ratio: auto;
      border-width: 4px;
      padding: 26px 32px 32px 32px;
      justify-content: flex-start;
      box-shadow:
        10px 12px 0 rgba(0, 0, 0, 0.45),
        inset 0 0 0 2px rgba(255, 250, 230, 0.55);
    }

    body.view-episodic .cell:hover,
    body.view-episodic .cell.highlight {
      transform: none;
      box-shadow:
        10px 12px 0 rgba(0, 0, 0, 0.45),
        inset 0 0 0 2px rgba(255, 250, 230, 0.55);
      filter: none;
    }

    body.view-episodic .cell .num {
      font-size: 38px;
      opacity: 0.9;
    }

    body.view-episodic .cell .sym {
      font-size: 220px;
      letter-spacing: 2px;
      margin: 16px 0;
    }

    body.view-episodic .cell .name {
      font-size: 32px;
      letter-spacing: 6px;
    }

    body.view-episodic .cell .tip {
      display: block;
      position: static;
      transform: none;
      opacity: 1;
      background: transparent;
      border: none;
      box-shadow: none;
      color: inherit;
      white-space: normal;
      text-align: center;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 16px;
      line-height: 1.5;
      padding: 0;
      margin-top: 18px;
      pointer-events: auto;
    }

    body.view-episodic .cell .tip b {
      color: inherit;
      font-size: 20px;
    }

    .episodic-header {
      max-width: 540px;
      margin: 24px auto 0 auto;
      text-align: center;
      color: #3a2a16;
    }

    .episodic-date {
      font-size: 22px;
      letter-spacing: 1px;
      font-variant: small-caps;
    }

    .episodic-label {
      font-size: 16px;
      font-style: italic;
      margin-top: 4px;
      font-family: 'Courier New', monospace;
    }

    .episodic-footer {
      max-width: 540px;
      margin: 32px auto 0 auto;
      text-align: center;
      font-size: 18px;
      font-style: italic;
      color: #3a2a16;
      font-family: 'Courier New', monospace;
    }

    body.view-episodic sup {
      font-size: 12px;
    }

    /* "Futuristic Table" view: cyberpunk neon */
    body.view-futuristic {
      background-color: #07021a;
      background-image: linear-gradient(135deg,
          rgba(255, 0, 170, 0.35),
          rgba(120, 0, 220, 0.35) 40%,
          rgba(0, 220, 255, 0.35) 80%,
          rgba(0, 255, 180, 0.35));
      background-size: 100% 100%;
      font-family: 'Courier New', monospace;
      color: #00ffea;
    }

    body.view-futuristic h1 {
      color: #ff00aa;
      letter-spacing: 8px;
      text-shadow:
        0 0 6px #ff00aa,
        0 0 14px rgba(0, 240, 255, 0.7);
    }

    body.view-futuristic h1::before,
    body.view-futuristic h1::after {
      content: ' // ';
      color: #00ffea;
    }

    body.view-futuristic .nav-button {
      color: rgba(0, 255, 234, 0.8);
    }

    body.view-futuristic .nav-panel:hover .nav-button {
      color: rgba(0, 255, 234, 1);
    }

    body.view-futuristic .cell {
      border: 1px solid #00ffea;
      box-shadow:
        0 0 6px rgba(255, 0, 170, 0.7),
        0 0 14px rgba(0, 240, 255, 0.4),
        inset 0 0 6px rgba(255, 255, 255, 0.25);
      font-family: 'Courier New', monospace;
      color: #fff;
    }

    /* Futuristic per-category gradients */
    /* This applies to both cells and legend swatches */
    body.view-futuristic .cat-alkali {
      background-image: linear-gradient(135deg,
          rgba(255, 0, 102, 0.9),
          rgba(255, 78, 193, 0.9) 50%,
          rgba(184, 0, 255, 0.9));
    }

    body.view-futuristic .cat-alkaline {
      background-image: linear-gradient(135deg,
          rgba(0, 245, 255, 0.9),
          rgba(0, 179, 255, 0.9) 50%,
          rgba(67, 97, 238, 0.9));
    }

    body.view-futuristic .cat-transition {
      background-image: linear-gradient(135deg,
          rgba(255, 0, 255, 0.9),
          rgba(138, 43, 226, 0.9) 50%,
          rgba(0, 245, 255, 0.9));
    }

    body.view-futuristic .cat-posttrans {
      background-image: linear-gradient(135deg,
          rgba(110, 255, 182, 0.9),
          rgba(0, 212, 255, 0.9) 50%,
          rgba(95, 61, 196, 0.9));
    }

    body.view-futuristic .cat-metalloid {
      background-image: linear-gradient(135deg,
          rgba(161, 141, 255, 0.9),
          rgba(255, 122, 217, 0.9) 50%,
          rgba(111, 66, 193, 0.9));
    }

    body.view-futuristic .cat-nonmetal {
      background-image: linear-gradient(135deg,
          rgba(255, 122, 0, 0.9),
          rgba(255, 209, 102, 0.9) 50%,
          rgba(255, 0, 170, 0.9));
    }

    body.view-futuristic .cat-halogen {
      background-image: linear-gradient(135deg,

    }

    body.view-futuristic .cell .sym,
    body.view-futuristic .cell .name {
      color: #ffffff;
      text-shadow:
        0 0 4px rgba(255, 255, 255, 0.9),
        1px 0 0 rgba(255, 0, 170, 0.85),
        -1px 0 0 rgba(0, 240, 255, 0.85);
    }

      font-size: 7px;
      letter-spacing: 0;
    }

    body.view-futuristic .legend-item {
      color: #00ffea;
    }

      font-family: Georgia, serif;
      border-color: rgba(0, 240, 255, 0.6);
      color: #00ffea;
      background-image: linear-gradient(135deg,
          rgba(255, 0, 170, 0.4),
          rgba(120, 0, 220, 0.4) 40%,
          rgba(0, 220, 255, 0.4) 80%,
          rgba(0, 255, 180, 0.4));
      background-size: 100% 100%;
    }

    body.view-hellenistic .cell .name {
      font-size: 7px;
    }

    body.view-hieroglyphic .cell .sym {
      font-size: 20px;
    }

    body.view-hieroglyphic .cell .name {
      font-size: 11px;
      letter-spacing: 0;
    }

    body.view-hieroglyphic .cell .num {
      font-size: 11px;
    }

    body.view-hieroglyphic .legend,
    body.view-hieroglyphic .cell .tip {
      font-size: 13px;
    }

    body.view-hyperbolic .cell:hover,
    body.view-hyperbolic .cell.highlight {
      transform: translate(-2px, -3px) scale(2.4);
      z-index: 50;
    }

    body.view-hyperbolic .cell .sym {
      letter-spacing: 0;
    }

    body.view-inauthentic h1::before,
    body.view-inauthentic h1::after {
      content: ' ≈ ';
    }

    body.view-inauthentic h1,

    body.view-inauthentic .legend,
    body.view-inauthentic .legend-item,

    body.view-inauthentic .cell .sym {
      font-size: 19px;
    }

    body.view-inauthentic .cell .name {
      letter-spacing: 0;
    }

    body.view-microscopic #content {
      transform: scale(0.25);
    }

    body.view-philharmonic #table-main {
      grid-template-columns: repeat(13, minmax(0, 1fr));
      grid-template-rows: repeat(8, auto);
      max-width: 860px;

    }

      color: #fafafa;

    body.view-pianistic .cell.cat-pianoBlack .name {
      color: #fafafa;
    }

    /* "Psychedelic Table" view: groovy colour animations */
    /* Use prime number offsets so it's more higgeldy-piggeldy */
    body.view-psychedelic #content {
      animation: psych-hue 4s linear infinite;
    }

    body.view-psychedelic .cell {
      animation: psych-cell 3s ease-in-out infinite;
    }

    @keyframes psych-hue {
      0% {
        filter: hue-rotate(0deg) saturate(1.6);
      }

      100% {
        filter: hue-rotate(360deg) saturate(1.6);
      }
    }

    @keyframes psych-cell {
      0% {
        background-color: #ff2d95;
      }

      14% {
        background-color: #ff7b00;
      }

      28% {
        background-color: #ffe600;
      }

      42% {
        background-color: #00e676;
      }

      57% {
        background-color: #00d4ff;
      }

      71% {
        background-color: #6a4cff;
      }

      85% {
        background-color: #d500f9;
      }

      100% {
        background-color: #ff2d95;
      }
    }

    body.view-psychedelic .cell:nth-child(2n) {
      animation-delay: -0.4s;
    }

    body.view-psychedelic .cell:nth-child(3n) {
      animation-delay: -0.9s;
    }

    body.view-psychedelic .cell:nth-child(5n) {
      animation-delay: -1.5s;
    }

    body.view-psychedelic .cell:nth-child(7n) {
      animation-delay: -2.1s;
    }

    body.view-psychedelic .cell:nth-child(11n) {
      animation-delay: -2.7s;
    }

    body.view-psychedelic .swatch {
      animation: psych-cell 3s ease-in-out infinite;
      border-color: rgba(0, 0, 0, 0.55);
    }

    body.view-psychedelic .legend-item:nth-child(2n) .swatch {
      animation-delay: -0.4s;
    }

    body.view-psychedelic .legend-item:nth-child(3n) .swatch {
      animation-delay: -0.9s;
    }

    body.view-psychedelic .legend-item:nth-child(5n) .swatch {
      animation-delay: -1.5s;
    }

    body.view-psychedelic .legend-item:nth-child(7n) .swatch {
      animation-delay: -2.1s;
    }

    body.view-psychedelic .legend-item:nth-child(11n) .swatch {
      animation-delay: -2.7s;
    }

    /* "Pointillistic Table" view: dotted overlay across the table */
    body.view-pointillistic #content {
      mask-image:
        radial-gradient(circle at 20% 30%, black 30%, transparent 31%),
        radial-gradient(circle at 70% 60%, black 30%, transparent 31%);
      mask-size: 2px 2px, 3px 3px;
      mask-position: 0 0, 4px 4px;
    }

    body.view-realistic #table-lanth-actin,
    body.view-realistic .legend {
      display: none;
    }

    body.view-realistic #table-main {
      display: block;
      max-width: 1180px;
      margin: 12px auto;
      text-align: center;
    }

    body.view-realistic #table-main a {
      display: inline-block;
      max-width: 100%;
    }

    body.view-realistic #table-main img {
      display: block;
      max-width: 100%;
      max-height: 78vh;
      border: 2px solid #3a2a16;
      box-shadow: 6px 8px 0 rgba(0, 0, 0, 0.35);
    }
  </style>
</head>

      const ord = (now % 100 >= 11 && now % 100 <= 13)
        ? 'th'
        : ['th', 'st', 'nd', 'rd', 'th', 'th', 'th', 'th', 'th', 'th'][now % 10];
      const day = days[d.getDay()];
      const month = months[d.getMonth()];
      const year = d.getFullYear();
      return `${day}, ${now}<sup>${ord}</sup> of ${month}, ${year}`;
    }

    // Modes are declared as one entry here. A mode may define any of:
    //   title             - text shown in the H1 and page title
    //   dataset()         - return { items, categoryNames } to swap the whole data source
    //                       (e.g. demographic, gastronomic, philharmonic, preSocratic)
    //   transformItem(it) - per-item tweak applied after dataset()
    //                       (e.g. futuristic adds prefixes, hyperbolic adds "!")
    //   layout({items})   - return [{item, period, group}, ...] to reposition cells
    //                       (e.g. alphabetic, demographic, episodic, gastronomic)
    //   enter() / exit()  - function fired when mode is entered/exited
    //                       used to make and clear up large changes to the layout
    //                       (e.g. alphabetic, episodic, preSocratic, realistic)
    //   placeholders      - set to false to suppress the dashed lanthanide / actinide gap markers
    //                       (e.g. episodic, inauthentic, philharmonic, preSocratic, realistic)
    //
    // For every mode the body gets the class `view-<key>` while it is active.
    // So pure-CSS modes (achromatic, psychedelic, etc.) need no JS at all.
    // We can just add CSS rules scoped to that class.
    //
    // If adding a new mode here, make sure to add to `MODE_ORDER` too.
    const MODES = {
      periodic: {
        title: 'Periodic Table'
      },

      achromatic: {
        title: 'Achromatic Table'
      },

      acrobatic: {
        title: 'Acrobatic Table'
      },

      alphabetic: {
        title: 'Alphabetic Table',
        dataset: () => ({
          items: baseDataset.items,
          categoryNames: Object.fromEntries(
            Object.entries(baseDataset.categoryNames)
              .sort((a, b) => a[1].localeCompare(b[1]))
          )
        }),
        layout: ({ items }) => {
          const sorted = items.slice().sort((a, b) => a.sym.localeCompare(b.sym));
          return flowLayout({ items: sorted });
        }
      },

      automatic: {
        title: 'Automatic Table',
        enter() {
          const cells = Array.from(document.querySelectorAll('.cell'))
            .sort((a, b) => Number(a.dataset.num) - Number(b.dataset.num));
          if (!cells.length) return;
          let i = 0;
          let prev = null;
          const step = () => {
            if (prev) prev.classList.remove('highlight', 'auto-highlight');
            const c = cells[i % cells.length];
            c.classList.add('highlight', 'auto-highlight');
            prev = c;
            i++;
          };
          step();
          this._timer = setInterval(step, 1000);
          this._prev = () => prev;
        },
        exit() {
          clearInterval(this._timer);
          document.querySelectorAll('.cell.highlight, .cell.auto-highlight').forEach(c =>
            c.classList.remove('highlight', 'auto-highlight')
          );
        }
      },

      demographic: {
        title: 'Demographic Table',
        dataset: () => demographicDataset,
        layout: flowLayout
      },

      energetic: {
        title: 'Energetic Table'
      },

      enigmatic: {
        title: 'Enigmatic Table'
      },

      episodic: {
        title: 'Episodic Table',
        placeholders: false,
        dataset: () => {
          const item = baseItems[episodicIndex(0)];
          return {
            items: [item],
            categoryNames: { [item.cat]: categoryNames[item.cat] }
          };
        },
        layout: ({ items }) => items.map(it => ({ item: it, period: 1, group: 1 })),
        enter() {
          const today = new Date();
          const tomorrowItem = baseItems[episodicIndex(1)];

          const header = document.createElement('div');
          header.className = 'episodic-header';
          header.innerHTML =
            `<div class="episodic-date">${formatEpisodicDate(today)}</div>` +
            `<div class="episodic-label">Element of the day</div>`;

          const footer = document.createElement('div');
          footer.className = 'episodic-footer';
          footer.textContent =
            `Stay tuned for tomorrow's element of the day: ${tomorrowItem.name}!`;

          const content = document.getElementById('content');
          content.insertBefore(header, tableMain);
          tableMain.parentNode.insertBefore(footer, tableMain.nextSibling);
        },
        exit() {
          document.querySelectorAll('.episodic-header, .episodic-footer')
            .forEach(el => el.remove());
        }
      },

      futuristic: {
        title: 'Futuristic Table',
        transformItem: (it) => ({
          ...it,
          name: futuristicPrefixes[(it.num - 1) % futuristicPrefixes.length] + it.name
        })
      },

      gastronomic: {
        title: 'Gastronomic Table',
        dataset: () => gastronomicDataset,
        layout: flowLayout
      },

      hellenistic: {
        title: 'Hellenistic Table',
        dataset: () => hellenisticDataset
      },

      hieroglyphic: {
        title: 'Hieroglyphic Table',
        dataset: () => hieroglyphicDataset
      },

      hyperbolic: {
        title: 'Hyperbolic Table',
        transformItem: (it) => ({ ...it, sym: it.sym + '!' })
      },

      inauthentic: {
        title: 'Inauthentic Table',
        placeholders: false,
        dataset: () => inauthenticDataset
      },

      microscopic: {
        title: 'Microscopic Table'
      },

      philharmonic: {
        title: 'Philharmonic Table',
        placeholders: false,
        mainPeriods: 8,
        columns: 13,
        dataset: () => philharmonicDataset
      },

      pianistic: {
        title: 'Pianistic Table',
        dataset: () => pianisticDataset
      },

      pointillistic: {
        title: 'Pointillistic Table'
      },

      preSocratic: {
        title: 'Pre-Socratic Table',
        dataset: () => preSocraticDataset,
        placeholders: false,
        enter() {
          // Override the default edge-based tooltip placement
          // Fire/Earth (left column) push the tip leftward
          // Air/Water (right column) push the tip rightward
          document.querySelectorAll('.cell').forEach(cell => {
            cell.classList.remove('tip-right', 'tip-left', 'tip-below');
            const name = cell.dataset.name;
            if (name === 'Fire' || name === 'Earth') {
              cell.classList.add('tip-left');
            } else if (name === 'Air' || name === 'Water') {
              cell.classList.add('tip-right');
            }
          });
        }
      },

      psychedelic: {
        title: 'Psychedelic Table'
      },

      realistic: {
        title: 'Realistic Table',
        placeholders: false,
        dataset: () => ({ items: [], categoryNames: {} }),
        enter() {
          const a = document.createElement('a');
          a.href = LAB.pageRandomiser.nextOne();
          const img = document.createElement('img');
          img.src = 'table.png';
          img.alt = 'a literal table, made of wood';
          a.appendChild(img);
          tableMain.innerHTML = '';
          tableLA.innerHTML = '';
          tableMain.appendChild(a);
        }
      },
    };

    // Order in which the H1 cycles through modes.
    // These are alphabetic, except for the default 'periodic' which always appears first.
    const MODE_ORDER = [
      'periodic',
      'achromatic',
      'acrobatic',
      'alphabetic',
      'automatic',
      'demographic',
      'energetic',
      'enigmatic',
      'episodic',
      'futuristic',
      'gastronomic',
      'hellenistic',
      'hieroglyphic',
      'hyperbolic',
      'inauthentic',
      'microscopic',
      'philharmonic',
      'pianistic',
      'pointillistic',
      'preSocratic',
      'psychedelic',
      'realistic',
    ];

    // DOM refs
    const tableMain = document.getElementById('table-main');
    const tableLA = document.getElementById('table-lanth-actin');
    const legend = document.getElementById('legend');
    const h1 = document.querySelector('h1');
    const navLeft = document.getElementById('nav-left');
    const navRight = document.getElementById('nav-right');

    // Cell / placeholder / legend builders
    function makePlaceholder(row, text) {
      const div = document.createElement('div');
      div.className = 'placeholder';
      div.style.gridRow = row;
      div.style.gridColumn = 3;
      div.textContent = text;
      return div;
    }

    // Create an anchor tag cell for an element
    function makeCell(el, period, group, mainPeriods = 7, columns = 18) {
      const a = document.createElement('a');
      a.dataset.name = el.name;

      // `cat` may be a single string or an array of strings, so a cell can belong to several
      // categories at once. e.g. Pre-Socratic "Fire" is both "hot" and "dry".
      // Each category becomes a `cat-X` class and is also stored space-separated in `data-cats`,
      // so the legend hover handler can match cells by any of their categories.
      // Only used in the pre-Socratic view at the moment, but I might add more table modes later.
      const cats = Array.isArray(el.cat) ? el.cat : [el.cat];
      a.className = 'cell ' + cats.map(c => `cat-${c}`).join(' ');
      a.dataset.cats = cats.join(' ');
      a.dataset.num = el.num;
      a.href = el.href;

      const hasMultiNum = el.numMid !== undefined || el.numRight !== undefined;
      const showNum = el.showNum !== false;
      const midSpan = (el.numMid !== undefined && el.numMid !== '')
        ? `<span class="num-mid">${el.numMid}</span>`
        : '';
      const numHtml = !showNum
        ? '<div class="num"></div>'
        : hasMultiNum
          ? `<div class="num num-row">
             <span class="num-left">${el.numLeft || ''}</span>
             ${midSpan}
             <span class="num-right">${el.numRight || ''}</span>
           </div>`
          : `<div class="num">${el.num}</div>`;
      const tipNumLines = hasMultiNum
        ? [el.numLeft, el.numMid, el.numRight]
          .filter(n => n !== '' && n !== undefined && n !== null)
          .map(n => `<div>${n}</div>`)
          .join('')
        : '';
      const massHtml = (el.mass) ? `${el.massLabel || 'Mass'}: ${el.mass}<br>` : '';
      const tipHtml = hasMultiNum
        ? `<b>${el.name}</b> &middot; ${el.sym}${tipNumLines}`
        : `<b>${el.name}</b> &middot; ${el.sym}${showNum ? ` &middot; ${el.num}` : ''}<br>
           ${massHtml}
           ${el.conf}`;

      a.innerHTML = `
        ${numHtml}
        <div class="sym">${el.sym}</div>
        <div class="name">${el.name}</div>
        <div class="tip">
          ${tipHtml}
        </div>
      `;

      // Tooltip edge handling based on rendered position
      if (group <= 2) {
        a.classList.add('tip-right');
      } else if (group >= columns - 1) {
        a.classList.add('tip-left')
      } else if (period <= 3) {
        a.classList.add('tip-below');
      };

      a.style.gridRow = period <= mainPeriods ? period : period - mainPeriods;
      a.style.gridColumn = group;
      return a;
    }

    function clearTables(showPlaceholders) {
      tableMain.innerHTML = '';
      tableLA.innerHTML = '';
      if (showPlaceholders) {
        tableMain.appendChild(makePlaceholder(6, '57 - 71'));
        tableMain.appendChild(makePlaceholder(7, '89 - 103'));
      }
    }

    function renderLegend(cats) {
      legend.innerHTML = '';
      Object.entries(cats).forEach(([key, label]) => {
        const item = document.createElement('div');
        item.className = 'legend-item';
        item.dataset.cat = key;
        item.innerHTML = `<span class="swatch cat-${key}"></span>${label}`;
        legend.appendChild(item);
      });
    }

    // Mode pipeline: dataset => per-item transform => layout => DOM
    function renderMode(mode) {
      const source = mode.dataset ? mode.dataset() : baseDataset;
      const items = mode.transformItem
        ? source.items.map(mode.transformItem)
        : source.items;
      const placed = (mode.layout || defaultLayout)({ items });

      clearTables(mode.placeholders !== false);
      const mainPeriods = mode.mainPeriods || 7;
      const columns = mode.columns || 18;
      placed.forEach(({ item, period, group }) => {
        const cell = makeCell(item, period, group, mainPeriods, columns);
        if (period <= mainPeriods) tableMain.appendChild(cell);
        else tableLA.appendChild(cell);
      });
      renderLegend(source.categoryNames);
    }

    // When a legend item is hovered, highlight all cells of that category.
    // Delegated on the legend container so it survives re-renders.
    function setHighlight(cat, on) {
      // `~=` matches whitespace-separated tokens, so a cell with
      // `data-cats="hot dry"` is highlighted by either "hot" or "dry"
      document.querySelectorAll(`.cell[data-cats~="${cat}"]`).forEach(c => {
        c.classList.toggle('highlight', on);
      });
    }
    legend.addEventListener('mouseover', e => {
      const item = e.target.closest('.legend-item');
      if (item) setHighlight(item.dataset.cat, true);
    });
    legend.addEventListener('mouseout', e => {
      const item = e.target.closest('.legend-item');
      if (item) setHighlight(item.dataset.cat, false);
    });

    // Mode switching
    let activeKey = null;
    let modeIdx = 0;

    function setMode(key) {
      const mode = MODES[key];
      if (!mode) return;

      if (activeKey) {
        MODES[activeKey].exit && MODES[activeKey].exit();
        document.body.classList.remove(`view-${activeKey}`);
      }
      activeKey = key;
      modeIdx = MODE_ORDER.indexOf(key);
      document.body.classList.add(`view-${key}`);
      h1.textContent = mode.title;
      document.title = mode.title;
      renderMode(mode);
      mode.enter && mode.enter();

      const newHash = '#' + modeToHash(key);
      if (location.hash !== newHash) {
        history.replaceState(null, '', newHash);
      }
    }

    // Arrow keys, WASD keys, HJKL keys
    const LEFT_OR_DOWN = new Set(['ArrowLeft', 'ArrowDown', 'h', 'j', 'a', 's']);
    const RIGHT_OR_UP = new Set(['ArrowRight', 'ArrowUp', 'k', 'l', 'd', 'w']);
    function keyLeftOrDown(key) { return LEFT_OR_DOWN.has(key); }
    function keyRightOrUp(key) { return RIGHT_OR_UP.has(key); }

    function goToPrevMode() {
      modeIdx = (modeIdx - 1 + MODE_ORDER.length) % MODE_ORDER.length;
      setMode(MODE_ORDER[modeIdx]);
    }

    function goToNextMode() {
      modeIdx = (modeIdx + 1) % MODE_ORDER.length;
      setMode(MODE_ORDER[modeIdx]);
    }

    navLeft.addEventListener('click', goToPrevMode);
    navRight.addEventListener('click', goToNextMode);

    document.addEventListener('keydown', (e) => {
      if (keyLeftOrDown(e.key)) {
        e.preventDefault();
        goToPrevMode();

      } else if (keyRightOrUp(e.key)) {
        e.preventDefault();
        goToNextMode();
      }
    });

    // Hash routing, accepts kebab-case or concatenated lowercase.
    // e.g. `MODES['preSocratic']` can be accessed by "#pre-socratic" or "#presocratic"
    function modeToHash(key) {
      return key.replace(/([A-Z])/g, '-$1').toLowerCase();
    }

    function hashToModeKey(hash) {
      const h = (hash || '').replace(/^#/, '').toLowerCase();
      if (!h) return null;
      return MODE_ORDER.find(k =>
        modeToHash(k) === h || k.toLowerCase() === h
      );
    }

    window.addEventListener('hashchange', () => {
      const key = hashToModeKey(location.hash);
      if (key && key !== activeKey) setMode(key);
    });

    // Initial render, honour the URL hash if it names a known mode
    const initialKey = hashToModeKey(location.hash) || MODE_ORDER[0];
    setMode(initialKey);

  </script>
</body>

</html>
