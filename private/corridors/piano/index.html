<!DOCTYPE html>
<html lang="en">

<!--
Do Re Mi Ti La
Do Re Mi So Fa Do Re Do
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="In tune with the tuneless">
  <title>Ebony and ivory</title>
  <style>
    :root {
      --piano-body: #2c1a12;
      --white-key: #fdfdfd;
      --white-key-shadow: #e0e0e0;
      --black-key: #111111;
      --black-key-shadow: #222222;
      --gold-accent: #d4af37;
      --bg-color: #0d0d0d;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at top, #1a1a1a 0%, #000000 100%);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      font-family: 'Bricolage Grotesque', sans-serif;
    }

    body.portrait-layout {
      align-items: stretch;
      justify-content: flex-start;
    }

    #stage {
      flex-grow: 1;
      width: 100%;
      position: relative;
      perspective: 1000px;
      overflow: visible;
    }

    .note-bubble {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      padding: 10px 20px;
      border-radius: 50px;
      text-decoration: none;
      font-size: 1.5rem;
      font-weight: 800;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, background 0.3s ease;
      pointer-events: auto;
      z-index: 100;
      user-select: none;
    }

    .note-bubble:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.1);
      border-color: var(--gold-accent);
    }

    #piano-container {
      width: 100%;
      max-width: 1200px;
      background: var(--piano-body);
      padding: 40px 20px 20px;
      border-radius: 10px 10px 0 0;
      position: relative;
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.8), inset 0 2px 10px rgba(255, 255, 255, 0.1);
      border: 2px solid #3d2b1f;
      z-index: 10;
    }

    #piano-brand {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--gold-accent);
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.2rem;
      letter-spacing: 2px;
      opacity: 0.6;
      text-decoration: none;
    }

    #keyboard {
      display: flex;
      position: relative;
      height: 300px;
      background: #000000;
      border: 5px solid #111111;
    }

    .white-key {
      flex: 1;
      background: linear-gradient(to bottom, #eeeeee 0%, var(--white-key) 5%, var(--white-key) 95%, #999999 100%);
      border: 1px solid #cccccc;
      border-radius: 0 0 5px 5px;
      position: relative;
      cursor: pointer;
      transition: transform 0.1s;
      transform-origin: top;
      z-index: 1;
    }

    .white-key:active,
    .white-key.pressed {
      transform: rotateX(-5deg) scaleY(0.98);
      background: linear-gradient(to bottom, #dddddd 0%, #eeeeee 90%, #777777 100%);
    }

    .black-key {
      width: 4%;
      height: 60%;
      background: linear-gradient(to bottom, #444444 0%, var(--black-key) 10%, var(--black-key) 90%, #000000 100%);
      position: absolute;
      z-index: 2;
      border-radius: 0 0 3px 3px;
      cursor: pointer;
      transition: transform 0.1s;
      transform-origin: top;
      box-shadow: 2px 5px 10px rgba(0, 0, 0, 0.5);
    }

    .black-key:active,
    .black-key.pressed {
      transform: rotateX(-10deg) scaleY(0.95);
      background: linear-gradient(to bottom, #222222 0%, #000000 100%);
    }

    .white-key,
    .black-key {
      touch-action: manipulation;
    }

    body.portrait-layout #stage {
      display: none;
    }

    body.portrait-layout #piano-container {
      width: 100%;
      max-width: none;
      height: 100vh;
      padding: 48px 12px 12px;
      border-radius: 0;
      display: flex;
      flex-direction: column;
    }

    body.portrait-layout #keyboard {
      flex: 1;
      width: 100%;
      height: auto;
      flex-direction: column-reverse;
      overflow: hidden;
    }

    body.portrait-layout .white-key {
      width: 100%;
      border-radius: 0 6px 6px 0;
      transform-origin: left;
    }

    body.portrait-layout .white-key:active,
    body.portrait-layout .white-key.pressed {
      transform: translateX(-6px) scaleX(0.99);
    }

    body.portrait-layout .black-key {
      width: 58%;
      height: 4.75%;
      left: 0;
      border-radius: 0 4px 4px 0;
      transform-origin: left;
      box-shadow: 4px 2px 10px rgba(0, 0, 0, 0.5);
    }

    body.portrait-layout .black-key:active,
    body.portrait-layout .black-key.pressed {
      transform: translateX(-4px) scaleX(0.98);
    }

    @keyframes popOut {
      0% {
        transform: translate(0, 0) scale(0);
        opacity: 0;
      }

      50% {
        transform: translate(var(--tx), var(--ty)) scale(1.2);
        opacity: 1;
      }

      100% {
        transform: translate(var(--fx), var(--fy)) scale(1);
        opacity: 1;
      }
    }

    @keyframes drift {
      from {
        transform: translate(var(--fx), var(--fy));
      }

      to {
        transform: translate(calc(var(--fx) + 10px), calc(var(--fy) - 20px));
      }
    }
  </style>
</head>

<body>
  <div id="stage"></div>
  <div id="piano-container">
    <a id="piano-brand" href="../index.html">Tilde & Sons</a>
    <div id="keyboard">
      <!-- Keys will be generated by JS -->
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('piano');

    const stage = document.getElementById('stage');
    const keyboard = document.getElementById('keyboard');
    const pageBody = document.body;

    const whiteKeysCount = 15; // 2 octaves + C
    const notes = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
    const isBlackKey = (noteName) => noteName.includes('#') || noteName.includes('b');
    const sequencePattern = [2, 2, 7, 10, 3, 2, 2, 3, 10, 7, 2, 10];
    const recentPitchClasses = [];
    let portraitLayout = false;

    // Initialise Tone.js synth
    // Give it a simple lo-fi square wave sound
    let synth;
    function initSynth() {
      if (!synth) {
        synth = new Tone.PolySynth(Tone.Synth, {
          oscillator: {
            type: 'square',
            width: 0.2
          },
          envelope: {
            attack: 0.01,
            decay: 0.2,
            sustain: 0.2,
            release: 1.2
          }
        }).toDestination();
      }
    }

    function createKeyboard() {
      let whiteKeyIndex = 0;
      for (let i = 0; i < 25; i++) { // roughly 2 octaves
        const noteIndex = i % 12;
        const noteName = notes[noteIndex];
        const isBlack = isBlackKey(noteName);
        const octave = Math.floor(i / 12) + 4; // Start at middle C (C4)

        if (!isBlack) {
          const key = document.createElement('div');
          key.className = 'white-key';
          key.dataset.noteBase = noteName;
          key.dataset.noteFull = noteName + octave;
          key.addEventListener('pointerdown', () => playNote(key));
          keyboard.appendChild(key);

          // Check if black key follows
          const nextNoteIndex = (i + 1) % 12;
          const blackNoteName = notes[nextNoteIndex] ? isBlackKey(notes[nextNoteIndex]) : false;
          if (blackNoteName && whiteKeyIndex < whiteKeysCount - 1) {
            const blackKey = document.createElement('div');
            blackKey.className = 'black-key';
            const blackKeyNote = notes[nextNoteIndex];
            blackKey.dataset.noteBase = blackKeyNote;
            blackKey.dataset.noteFull = blackKeyNote + octave;

            // Position black key
            const offset = (whiteKeyIndex * (100 / whiteKeysCount)) + (100 / whiteKeysCount * 0.7);
            if (portraitLayout) {
              blackKey.style.bottom = `${offset}%`;
            } else {
              blackKey.style.left = `${offset}%`;
            }

            blackKey.addEventListener('pointerdown', (e) => {
              e.stopPropagation();
              playNote(blackKey);
            });
            keyboard.appendChild(blackKey);
          }
          whiteKeyIndex++;
        }

        if (whiteKeyIndex >= whiteKeysCount) break;
      }
    }

    async function playNote(keyEl) {
      // Ensure audio context is started on user interaction
      await Tone.start();
      initSynth();

      const noteBase = keyEl.dataset.noteBase;
      const noteFull = keyEl.dataset.noteFull;

      keyEl.classList.add('pressed');
      setTimeout(() => keyEl.classList.remove('pressed'), 200);

      // Play sound
      synth.triggerAttackRelease(noteFull, '8n');

      recordNote(noteBase);
      if (!portraitLayout) {
        spawnNoteBubble(noteBase, keyEl);
      }
    }

    function clearNoteBubbles() {
      stage.replaceChildren();
    }

    // Sideways keyboard if on mobile
    function applyLayoutMode() {
      const nextPortraitLayout = window.matchMedia('(orientation: portrait)').matches;
      pageBody.classList.toggle('portrait-layout', nextPortraitLayout);

      if (portraitLayout === nextPortraitLayout && keyboard.childElementCount > 0) {
        return;
      }

      portraitLayout = nextPortraitLayout;
      keyboard.replaceChildren();
      createKeyboard();

      if (portraitLayout) {
        clearNoteBubbles();
      }
    }

    function recordNote(noteBase) {
      const pitchClass = notes.indexOf(noteBase);
      recentPitchClasses.push(pitchClass);
      if (recentPitchClasses.length > sequencePattern.length + 1) recentPitchClasses.shift();
      if (recentPitchClasses.length !== sequencePattern.length + 1) return;
      for (let i = 0; i < sequencePattern.length; i++) {
        const interval = (recentPitchClasses[i + 1] - recentPitchClasses[i] + 12) % 12;
        if (interval !== sequencePattern[i]) return;
      }

      setTimeout(() => location.assign(LAB.goto()), 800);
    }

    function spawnNoteBubble(noteText, keyEl) {
      const bubble = document.createElement('a');
      bubble.className = 'note-bubble';
      bubble.innerText = noteText;
      bubble.href = LAB.pageRandomiser.nextOne();

      const rect = keyEl.getBoundingClientRect();
      const startX = rect.left + rect.width / 2;
      const startY = rect.top;

      bubble.style.left = `${startX}px`;
      bubble.style.top = `${startY}px`;

      // Random landing position in the stage
      const tx = LAB.rand(-200, 200);
      const ty = LAB.rand(-500, -200);
      const fx = tx + LAB.rand(-50, 50);
      const fy = ty + LAB.rand(-25, 25);

      bubble.style.setProperty('--tx', `${tx}px`);
      bubble.style.setProperty('--ty', `${ty}px`);
      bubble.style.setProperty('--fx', `${fx}px`);
      bubble.style.setProperty('--fy', `${fy}px`);

      bubble.style.animation = 'popOut 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards';

      stage.appendChild(bubble);

      // Floaty effect after landing
      bubble.addEventListener('animationend', () => {
        bubble.style.animation = `drift ${LAB.rand(5, 10)}s ease-in-out infinite alternate`;
      });
    }

    applyLayoutMode();
    window.addEventListener('resize', applyLayoutMode);

  </script>
</body>

</html>
