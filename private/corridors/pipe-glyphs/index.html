<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Peter Glyphin">
  <title>pipe glyphs</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #04060a;
      color: #2f6a55;
      font-family: "Courier New", monospace;
      min-height: 100vh;
      overflow: hidden;
    }

    #main {
      width: 100vw;
      height: 100vh;
      font-size: 22px;
      line-height: 1;
      white-space: pre;
      padding: 6px;
      box-sizing: border-box;
    }

    #main span,
    #main a {
      display: inline-block;
      width: 15px;
      text-align: center;
    }

    #main a {
      color: #e7b24a;
      text-decoration: none;
      text-shadow: 0 0 8px #e7b24a;
      transition: transform .15s, color .15s;
    }

    #main a:hover {
      color: #04060a;
      background: #e7b24a;
      transform: scale(1.8);
      z-index: 10;
      position: relative;
    }

    .crt-scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0 1px, transparent 1px 3px),
        radial-gradient(circle at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.55));
      z-index: 100;
    }
  </style>
</head>

<body>
  <main id="main"></main>
  <div class="crt-scanlines"></div>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('pipe-glyphs');

    const main = document.getElementById('main');
    const pipes = '─│┌┐└┘├┤┬┴┼╴╵╶╷╱╲╳'.split('');
    const colours = ['#1f4a3c', '#276152', '#2f6a55', '#3a8a6e', '#46a888'];
    const doors = '◈◇◆⬡⬢'.split('');
    const cellW = 15, cellH = 22;

    function init() {
      main.replaceChildren();
      const cols = Math.floor((window.innerWidth - 12) / cellW);
      const rows = Math.floor((window.innerHeight - 12) / cellH);
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let el;
          if (LAB.chance(0.06)) {
            el = document.createElement('a');
            el.href = LAB.pageRandomiser.nextOne();
            el.textContent = LAB.sample(doors);
          } else {
            el = document.createElement('span');
            el.style.color = LAB.sample(colours);
            el.textContent = LAB.sample(pipes);
          }
          main.appendChild(el);
        }
        main.appendChild(document.createTextNode('\n'));
      }
    }

    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(init, 100);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a')) init();
    });

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, init);
    });

    init();

  </script>
</body>

</html>
