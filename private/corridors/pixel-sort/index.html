<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="See it. Say it. Sorted.">
  <title>sort it out</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #links {
      position: absolute;
      overflow: hidden;
      overscroll-behavior: none;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    #links a {
      position: absolute;
      text-decoration: none;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.10s ease;
    }

    #links a:hover,
    #links a:focus {
      opacity: 1;
      z-index: 20;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <div id="links"></div>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('pixel-sort');

    const links = document.getElementById('links');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const palette = [
      '#e63946', '#f1a208', '#2a9d8f', '#264653',
      '#e76f51', '#5f0f40', '#0f4c5c', '#fb8b24',
      '#9a031e', '#4361ee', '#b5e48c', '#ff70a6',
    ];
    const rectCount = 255;
    const speed = 20;

    let rects = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      init();
    }

    // For the base image, just draw a bunch of rectangles
    function init() {
      rects = [];
      ctx.fillStyle = LAB.sample(palette);
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < rectCount; i++) {
        const rx = LAB.rand(-100, canvas.width);
        const ry = LAB.rand(-100, canvas.height);
        const rw = LAB.rand(40, 400);
        const rh = LAB.rand(40, 400);
        const colour = LAB.sample(palette);
        ctx.fillStyle = colour;
        ctx.fillRect(rx, ry, rw, rh);
        rects.push({ x: rx, y: ry, w: rw, h: rh, colour: colour });
      }
      buildLinks();
    }

    // Links to other pages
    function buildLinks() {
      links.replaceChildren();
      rects.forEach(rect => {
        const a = document.createElement('a');
        a.href = LAB.pageRandomiser.nextOne();
        a.style.backgroundColor = rect.colour;
        a.style.left = rect.x + 'px';
        a.style.top = rect.y + 'px';
        a.style.width = rect.w + 'px';
        a.style.height = rect.h + 'px';
        links.appendChild(a);
      });
    }

    // Sort a strip of pixels by brightness
    function sortStrip(vertical) {
      const span = LAB.randInt(40, 400);
      let img, count;

      if (vertical) {
        const x = LAB.randInt(0, canvas.width - 1);
        const y = LAB.randInt(0, Math.max(0, canvas.height - span));
        count = Math.min(span, canvas.height - y);
        img = ctx.getImageData(x, y, 1, count);
        sortPixels(img.data, count);
        ctx.putImageData(img, x, y);
      } else {
        const y = LAB.randInt(0, canvas.height - 1);
        const x = LAB.randInt(0, Math.max(0, canvas.width - span));
        count = Math.min(span, canvas.width - x);
        img = ctx.getImageData(x, y, count, 1);
        sortPixels(img.data, count);
        ctx.putImageData(img, x, y);
      }
    }

    function sortPixels(data, count) {
      const pixels = [];
      for (let i = 0; i < count; i++) {
        pixels.push([data[i * 4], data[i * 4 + 1], data[i * 4 + 2]]);
      }
      pixels.sort((a, b) => (a[0] + a[1] + a[2]) - (b[0] + b[1] + b[2]));
      for (let i = 0; i < count; i++) {
        data[i * 4] = pixels[i][0];
        data[i * 4 + 1] = pixels[i][1];
        data[i * 4 + 2] = pixels[i][2];
      }
    }

    function tick() {
      for (let i = 0; i < speed; i++) {
        sortStrip(LAB.chance(0.5));
      }
      requestAnimationFrame(tick);
    }

    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(resize, 100);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a')) init();
    });

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, init);
    });

    resize();
    tick();

  </script>
</body>

</html>
