<!DOCTYPE html>

<!--
Pride and Prejudice by Jane Austen, 1813
Illustrations by George Allen, 1894

Text and illustrations from this Project Gutenberg ebook:
http://www.gutenberg.org/ebooks/1342

The nonsense text was generated from a simple markov chain.
I used key size 2 and value size 1 & 2 evenly weighted:
- "it is" => "a"
- "it is" => "a truth"
- "is a" => "truth"
- "is a" => "truth universally"
- "a truth" => "universally"
- "a truth" => "universally acknowledged"
- "truth universally" => "acknowledged"

In order to make the images smaller for the web,
I shrank them, reduced the palette, and made the background transparent.
Here's the ImageMagick script I used:
```sh
mkdir -p images
for img in images-orig/*.jpg; do
  filename="$(basename "$img" .jpg)"
  target="images/${filename}.png"
  convert "$img" \
    -resize 30% \
    -colors 16 \
    -fuzz 10% -transparent white \
    -strip \
    -define png:compression-level=9 \
    PNG8:"$target"
done
```
-->

    const imagesRandomiser = new LAB.CyclicRandomiser(IMAGES_POOL);
    const sentencesRandomiser = new LAB.CyclicRandomiser(SENTENCES_POOL);

    function makeParagraph() {
      const picked = [];
      let length = 0;
      while (length < 200) {
        const s = sentencesRandomiser.nextOne();
        picked.push(s);
        length += s.length;
      }
      return picked.join(' ');
    }

    // History of generated pages
    // Each entry: { image, paragraphs: [p1, p2, p3], href }
    let history = [];
    let historyIndex = -1;

    // ROMAN_NUMERALS index for the `history[0]` element.
    // We only need to store this for the first element in the array,
    // since the actual chapter can be calucated using `historyIndex`.
    let chapterStart = 0;

    function chapterForIndex(i) {
      const n = ROMAN_NUMERALS.length;
      return ROMAN_NUMERALS[((chapterStart + i) % n + n) % n];
    }

    function createNewEntry() {
      return {
        image: imagesRandomiser.nextOne(),
        paragraphs: [makeParagraph(), makeParagraph(), makeParagraph()],
        href: LAB.pageRandomiser.nextOne(),
      };
    }

    function applyEntry(entry, index) {
      document.getElementById('chapter-image').src = entry.image;
      document.getElementById('chapter-heading').textContent = 'Chapter ' + chapterForIndex(index);
      document.getElementById('chapter-text-1').textContent = entry.paragraphs[0];
      document.getElementById('chapter-text-2').textContent = entry.paragraphs[1];
      document.getElementById('chapter-text-3').textContent = entry.paragraphs[2];
      document.getElementById('labyrinth-link').href = entry.href;
      window.scrollTo({ top: 0, behavior: 'instant' });
    }

    function goToNext() {
      if (historyIndex < history.length - 1) {
        historyIndex++;
      } else {
        history.push(createNewEntry());
        historyIndex = history.length - 1;
      }
      applyEntry(history[historyIndex], historyIndex);
    }

    function goToPrev() {
      if (historyIndex > 0) {
        historyIndex--;
      } else {
        chapterStart = (chapterStart - 1 + ROMAN_NUMERALS.length) % ROMAN_NUMERALS.length;
        history.unshift(createNewEntry());
        historyIndex = 0;
      }
      applyEntry(history[historyIndex], historyIndex);
    }

    // Initialise with first entry (Chapter I)
    history.push(createNewEntry());
    historyIndex = 0;
    applyEntry(history[0], 0);

    // Chapter nav buttons
    document.getElementById('btn-prev').addEventListener('click', goToPrev);
    document.getElementById('btn-next').addEventListener('click', goToNext);

    // Arrow keys, WASD keys, HJKL keys
    const LEFT_OR_DOWN = new Set(['ArrowLeft', 'ArrowDown', 'h', 'j', 'a', 's']);
    const RIGHT_OR_UP = new Set(['ArrowRight', 'ArrowUp', 'k', 'l', 'd', 'w']);
    function keyLeftOrDown(key) { return LEFT_OR_DOWN.has(key); }
    function keyRightOrUp(key) { return RIGHT_OR_UP.has(key); }

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.altKey || e.shiftKey || e.metaKey) return;
      if (keyLeftOrDown(e.key)) {
        e.preventDefault();
        goToPrev();
      } else if (keyRightOrUp(e.key)) {
        e.preventDefault();
        goToNext();
      }
    });
