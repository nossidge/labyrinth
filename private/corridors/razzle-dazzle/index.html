<!DOCTYPE html>
<html lang="en">

<!--
https://en.wikipedia.org/wiki/Dazzle_camouflage
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="How can they see with sequins in their eyes?">
  <title>the old razzle dazzle</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body,
    svg {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    svg {
      display: block;
    }

    .panel polygon {
      stroke: #000000;
      stroke-width: 2;
    }

    .panel:hover polygon {
      filter: invert(1);
    }
  </style>
</head>

<body>
  <svg id="dazzle" xmlns="http://www.w3.org/2000/svg"></svg>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('razzle-dazzle');

    const svg = document.getElementById('dazzle');
    const ns = 'http://www.w3.org/2000/svg';
    const cols = 6;
    const rows = 4;

    // SVG element helper
    function element(name, attributes, parent) {
      const node = document.createElementNS(ns, name);
      Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
      if (parent) parent.appendChild(node);
      return node;
    }

    function init() {
      svg.replaceChildren();
      svg.setAttribute('viewBox', `0 0 ${innerWidth} ${innerHeight}`);
      const defs = element('defs', {}, svg);

      const points = [];
      for (let y = 0; y <= rows; y++) {
        points[y] = [];
        for (let x = 0; x <= cols; x++) {
          const edgeX = x === 0 || x === cols;
          const edgeY = y === 0 || y === rows;
          points[y][x] = [
            x * innerWidth / cols + (edgeX ? 0 : LAB.randNegToPos(innerWidth / 28, 0)),
            y * innerHeight / rows + (edgeY ? 0 : LAB.randNegToPos(innerHeight / 18, 0))
          ];
        }
      }

      for (let x = 0; x < cols; x++) {
        for (let y = 0; y < rows; y++) {
          const patternId = `stripe-${x}-${y}`;
          const stripeWidth = LAB.randInt(10, 40);
          const size = stripeWidth * 2;
          const pattern = element('pattern', {
            id: patternId,
            width: size,
            height: size,
            patternUnits: 'userSpaceOnUse',
            patternTransform: `rotate(${LAB.randInt(-75, 75)})`
          }, defs);
          const palette = ['#000000', '#ffffff'];
          element('rect', { width: size, height: size, fill: palette[0] }, pattern);
          element('rect', { width: stripeWidth, height: size, fill: palette[1] }, pattern);
          const link = element('a', { href: LAB.pageRandomiser.nextOne(), class: 'panel' }, svg);
          const corners = [points[y][x], points[y][x + 1], points[y + 1][x + 1], points[y + 1][x]];
          element('polygon', {
            points: corners.map((point) => point.join(',')).join(' '),
            fill: `url(#${patternId})`
          }, link);
        }
      }
    }

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, init);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a')) init();
    });

    window.addEventListener('resize', init);

    init();

  </script>
</body>

</html>
