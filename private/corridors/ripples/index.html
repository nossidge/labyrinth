<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ripple Galaxy">
  <title>Ripple in still water</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000;
      overflow: hidden;
      user-select: none;
    }

    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      image-rendering: pixelated;
    }
  </style>
</head>

<body>
  <div id="canvas-container">
    <canvas id="liquidCanvas"></canvas>
  </div>

  <script src="../../common/CyclicRandomiser.js"></script>
  <script src="../../common/labyrinthPages.js"></script>
  <script>
    const canvas = document.getElementById('liquidCanvas');
    const ctx = canvas.getContext('2d');

    const currentPage = "corridors/ripples/index.html";
    const otherPages = labyrinthPages.filter(p => !p.includes(currentPage));
    const pageRandomiser = new CyclicRandomiser(otherPages);

    // More pixelation means more lo-fi
    const scale = 6;
    const damping = 0.98;

    let width, height;
    let cols, rows;
    let buffer1, buffer2;

    const lilyPads = [];
    const numLilyPads = 7;

    class LilyPad {
      constructor() {
        this.x = Math.random() * (width / scale);
        this.y = Math.random() * (height / scale);
        this.vx = (Math.random() - 0.5) * 0.1;
        this.vy = (Math.random() - 0.5) * 0.1;
        this.size = 4 + Math.random() * 6;
        this.color = '#1b4d1b';
        this.rotation = Math.random() * Math.PI * 2;
      }

      update() {
        const ix = Math.floor(this.x);
        const iy = Math.floor(this.y);

        if (ix > 1 && ix < cols - 2 && iy > 1 && iy < rows - 2) {
          // Drifting due to gradient force
          const f = 0.02;
          const fx = (buffer1[(ix - 1) + iy * cols] - buffer1[(ix + 1) + iy * cols]) * f;
          const fy = (buffer1[ix + (iy - 1) * cols] - buffer1[ix + (iy + 1) * cols]) * f;

          this.vx += fx;
          this.vy += fy;
        }

        this.x += this.vx;
        this.y += this.vy;

        this.vx *= 0.96;
        this.vy *= 0.96;

        // Bounce off walls
        if (this.x < this.size) { this.x = this.size; this.vx *= -0.5; }
        if (this.x > cols - this.size) { this.x = cols - this.size; this.vx *= -0.5; }
        if (this.y < this.size) { this.y = this.size; this.vy *= -0.5; }
        if (this.y > rows - this.size) { this.y = rows - this.size; this.vy *= -0.5; }
      }

      draw(ctx) {
        const ix = Math.max(0, Math.min(cols - 1, Math.floor(this.x)));
        const iy = Math.max(0, Math.min(rows - 1, Math.floor(this.y)));
        const z = buffer1[ix + iy * cols] || 0;
        const bob = z * 0.03;

        ctx.save();
        ctx.translate(this.x, this.y - bob);
        ctx.rotate(this.rotation);
        ctx.fillStyle = this.color;
        ctx.beginPath();

        // A lily pad should look like a circle with a small wedge cut out
        ctx.arc(0, 0, this.size, 0.5, Math.PI * 2 - 0.5);
        ctx.lineTo(0, 0);
        ctx.fill();

        // Subtle detail
        ctx.strokeStyle = '#2d6a2d';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(this.size, 0);
        ctx.stroke();

        ctx.restore();
      }

      isClicked(mx, my) {
        const dx = this.x * scale - mx;
        const dy = this.y * scale - my;
        return Math.sqrt(dx * dx + dy * dy) < this.size * scale * 1.5;
      }
    }

    function init() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width / scale;
      canvas.height = height / scale;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';

      cols = canvas.width;
      rows = canvas.height;

      buffer1 = new Float32Array(cols * rows);
      buffer2 = new Float32Array(cols * rows);
    }

    window.addEventListener('resize', init);
    init();

    // Spawn lily pads
    for (let i = 0; i < numLilyPads; i++) {
      lilyPads.push(new LilyPad());
    }

    function dropAt(x, y, strength) {
      x = Math.floor(x / scale);
      y = Math.floor(y / scale);

      if (x > 0 && x < cols - 1 && y > 0 && y < rows - 1) {
        buffer1[x + y * cols] = strength;
      }
    }

    canvas.addEventListener('mousedown', (e) => {
      const mx = e.clientX;
      const my = e.clientY;

      // Check lily pad clicks
      for (const lp of lilyPads) {
        if (lp.isClicked(mx, my)) {
          window.location.href = pageRandomiser.nextOne();
          return;
        }
      }

      dropAt(mx, my, 512);
    });

    canvas.addEventListener('mousemove', (e) => {
      const mx = e.clientX;
      const my = e.clientY;

      let isHovering = false;
      for (const lp of lilyPads) {
        if (lp.isClicked(mx, my)) {
          isHovering = true;
          break;
        }
      }

      canvas.style.cursor = isHovering ? 'pointer' : 'default';

      if (e.buttons === 1) {
        dropAt(mx, my, 256);
      }
    });

    function update() {
      for (let i = cols; i < cols * rows - cols; i++) {
        // Skip edges
        if (i % cols === 0 || i % cols === cols - 1) continue;

        buffer2[i] = (
          buffer1[i - 1] +
          buffer1[i + 1] +
          buffer1[i - cols] +
          buffer1[i + cols]
        ) / 2 - buffer2[i];
        buffer2[i] *= damping;
      }

      // Swap buffers
      let temp = buffer1;
      buffer1 = buffer2;
      buffer2 = temp;

      // Update lily pads
      lilyPads.forEach(lp => lp.update());
    }

    function draw() {
      const imageData = ctx.createImageData(cols, rows);
      const data = imageData.data;

      for (let i = 0; i < cols * rows; i++) {
        let val = Math.abs(buffer1[i]);

        let r, g, b;
        if (val > 0.1) {
          // Map height to a hue
          // Hue shifts from blue (200) to cyan (180) to magenta (300)
          let hue = (200 + val * 0.5) % 360;
          let sat = 80;
          let light = Math.min(val * 0.5 + 5, 80);

          // Simple HSL to RGB conversion
          const h = hue / 60;
          const s = sat / 100;
          const l = light / 100;
          const c = (1 - Math.abs(2 * l - 1)) * s;
          const x = c * (1 - Math.abs(h % 2 - 1));
          const m = l - c / 2;
          let r1 = 0,
            g1 = 0,
            b1 = 0;
          if (h >= 0 && h < 1) {
            r1 = c;
            g1 = x;
          } else if (h >= 1 && h < 2) {
            r1 = x;
            g1 = c;
          } else if (h >= 2 && h < 3) {
            g1 = c;
            b1 = x;
          } else if (h >= 3 && h < 4) {
            g1 = x;
            b1 = c;
          } else if (h >= 4 && h < 5) {
            r1 = x;
            b1 = c;
          } else if (h >= 5 && h < 6) {
            r1 = c;
            b1 = x;
          }
          r = (r1 + m) * 255;
          g = (g1 + m) * 255;
          b = (b1 + m) * 255;
        } else {
          r = 0;
          g = 10;
          b = 20; // Deep water background
        }

        const px = i * 4;
        data[px] = r;
        data[px + 1] = g;
        data[px + 2] = b;
        data[px + 3] = 255;
      }

      ctx.putImageData(imageData, 0, 0);
    }

    function loop() {
      update();
      draw();
      lilyPads.forEach(lp => lp.draw(ctx));
      requestAnimationFrame(loop);
    }

    loop();

  </script>
</body>

</html>
