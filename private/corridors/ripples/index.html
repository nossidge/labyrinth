<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ripple Galaxy">
  <title>Ripple in still water</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #000000;
      overflow: hidden;
      user-select: none;
    }

    main {
      position: fixed;
      width: 100vw;
      height: 100vh;
    }

    canvas {
      image-rendering: pixelated;
    }

    .lily-link {
      position: fixed;
      display: block;
      border-radius: 50%;
      background: transparent;
      text-decoration: none;
      z-index: 90;
    }
  </style>
</head>

<body>
  <main>
    <canvas id="canvas"></canvas>
  </main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('ripples');

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    // More pixelation means more lo-fi
    const scale = 6;
    const damping = 0.98;

    let width, height;
    let cols, rows;
    let buffer1, buffer2;

    const lilyPads = [];
    const numLilyPads = 7;

    class LilyPad {
      constructor() {
        this.x = LAB.rand(0, width / scale);
        this.y = LAB.rand(0, height / scale);
        this.vx = LAB.rand(-0.05, 0.05);
        this.vy = LAB.rand(-0.05, 0.05);
        this.size = LAB.rand(4, 10);
        this.rotation = LAB.rand(0, Math.PI * 2);
        this.color = '#1b4d1b';
        this.url = LAB.pageRandomiser.nextOne();
      }

      update() {
        const ix = Math.floor(this.x);
        const iy = Math.floor(this.y);

        if (ix > 1 && ix < cols - 2 && iy > 1 && iy < rows - 2) {
          // Drifting due to gradient force
          const f = 0.02;
          const fx = (buffer1[(ix - 1) + iy * cols] - buffer1[(ix + 1) + iy * cols]) * f;
          const fy = (buffer1[ix + (iy - 1) * cols] - buffer1[ix + (iy + 1) * cols]) * f;

          this.vx += fx;
          this.vy += fy;
        }

        this.x += this.vx;
        this.y += this.vy;

        this.vx *= 0.96;
        this.vy *= 0.96;

        // Bounce off walls
        if (this.x < this.size) { this.x = this.size; this.vx *= -0.5; }
        if (this.x > cols - this.size) { this.x = cols - this.size; this.vx *= -0.5; }
        if (this.y < this.size) { this.y = this.size; this.vy *= -0.5; }
        if (this.y > rows - this.size) { this.y = rows - this.size; this.vy *= -0.5; }
      }

      draw(ctx) {
        const ix = Math.max(0, Math.min(cols - 1, Math.floor(this.x)));
        const iy = Math.max(0, Math.min(rows - 1, Math.floor(this.y)));
        const z = buffer1[ix + iy * cols] || 0;
        const bob = z * 0.03;

        ctx.save();
        ctx.translate(this.x, this.y - bob);
        ctx.rotate(this.rotation);
        ctx.fillStyle = this.color;
        ctx.beginPath();

        // A lily pad should look like a circle with a small wedge cut out
        ctx.arc(0, 0, this.size, 0.5, Math.PI * 2 - 0.5);
        ctx.lineTo(0, 0);
        ctx.fill();

        // Subtle detail
        ctx.strokeStyle = '#2d6a2d';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(this.size, 0);
        ctx.stroke();

        ctx.restore();
      }
    }

    function init() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width / scale;
      canvas.height = height / scale;
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';

      cols = canvas.width;
      rows = canvas.height;

      buffer1 = new Float32Array(cols * rows);
      buffer2 = new Float32Array(cols * rows);
    }

    window.addEventListener('resize', init);
    init();

    // Spawn lily pads
    for (let i = 0; i < numLilyPads; i++) {
      lilyPads.push(new LilyPad());
    }

    // Give each lily pad an invisible anchor element so that it is a real,
    // focusable link (Tab + Enter) and the browser can show its URL on hover.
    lilyPads.forEach((lp) => {
      const a = document.createElement('a');
      a.href = lp.url;
      a.className = 'lily-link';
      a.setAttribute('aria-label', 'lily pad');
      document.body.appendChild(a);
      lp.anchor = a;
    });

    // Keep the anchors tracking their lily pads
    function updateAnchors() {
      for (const lp of lilyPads) {
        const r = lp.size * scale;
        const cx = lp.x * scale;
        const cy = lp.y * scale;
        lp.anchor.style.left = (cx - r) + 'px';
        lp.anchor.style.top = (cy - r) + 'px';
        lp.anchor.style.width = (r * 2) + 'px';
        lp.anchor.style.height = (r * 2) + 'px';
      }
    }

    function dropAt(x, y, strength) {
      x = Math.floor(x / scale);
      y = Math.floor(y / scale);

      if (x > 0 && x < cols - 1 && y > 0 && y < rows - 1) {
        buffer1[x + y * cols] = strength;
      }
    }

    // Lily pad navigation is handled by their anchor elements;
    // the canvas only drops ripples in open water.
    canvas.addEventListener('mousedown', (e) => {
      dropAt(e.clientX, e.clientY, 512);
    });

    canvas.addEventListener('mousemove', (e) => {
      if (e.buttons === 1) {
        dropAt(e.clientX, e.clientY, 256);
      }
    });

    function update() {
      for (let i = cols; i < cols * rows - cols; i++) {
        // Skip edges
        if (i % cols === 0 || i % cols === cols - 1) continue;

        buffer2[i] = (
          buffer1[i - 1] +
          buffer1[i + 1] +
          buffer1[i - cols] +
          buffer1[i + cols]
        ) / 2 - buffer2[i];
        buffer2[i] *= damping;
      }

      // Swap buffers
      let temp = buffer1;
      buffer1 = buffer2;
      buffer2 = temp;

      // Update lily pads
      lilyPads.forEach(lp => lp.update());
    }

    function draw() {
      const imageData = ctx.createImageData(cols, rows);
      const data = imageData.data;

      for (let i = 0; i < cols * rows; i++) {
        let val = Math.abs(buffer1[i]);

        let r, g, b;
        if (val > 0.1) {
          // Map height to a hue
          // Hue shifts from blue (200) to cyan (180) to magenta (300)
          let hue = (200 + val * 0.5) % 360;
          let sat = 80;
          let light = Math.min(val * 0.5 + 5, 80);

          // Simple HSL to RGB conversion
          const h = hue / 60;
          const s = sat / 100;
          const l = light / 100;
          const c = (1 - Math.abs(2 * l - 1)) * s;
          const x = c * (1 - Math.abs(h % 2 - 1));
          const m = l - c / 2;
          let r1 = 0,
            g1 = 0,
            b1 = 0;
          if (h >= 0 && h < 1) {
            r1 = c;
            g1 = x;
          } else if (h >= 1 && h < 2) {
            r1 = x;
            g1 = c;
          } else if (h >= 2 && h < 3) {
            g1 = c;
            b1 = x;
          } else if (h >= 3 && h < 4) {
            g1 = x;
            b1 = c;
          } else if (h >= 4 && h < 5) {
            r1 = x;
            b1 = c;
          } else if (h >= 5 && h < 6) {
            r1 = c;
            b1 = x;
          }
          r = (r1 + m) * 255;
          g = (g1 + m) * 255;
          b = (b1 + m) * 255;
        } else {
          r = 0;
          g = 10;
          b = 20; // Deep water background
        }

        const px = i * 4;
        data[px] = r;
        data[px + 1] = g;
        data[px + 2] = b;
        data[px + 3] = 255;
      }

      ctx.putImageData(imageData, 0, 0);
    }

    function tick() {
      update();
      draw();
      lilyPads.forEach(lp => lp.draw(ctx));
      updateAnchors();
      requestAnimationFrame(tick);
    }

    tick();

  </script>
</body>

</html>
