<!DOCTYPE html>
<html lang="en">

<!--
This was originally going to be a kaleidoscope.
You'd be able to move the mouse to rotate the circle.
Then it would reflect one segment across the entire circle.
But I couldn't get it working!
So this is what you get instead :-)
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Rotary Interfractional">
  <title>Rotational imagery</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      background-color: #0a0a0a;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #link {
      display: block;
      line-height: 0;
    }

    canvas {
      display: block;
    }

    .nav-panel {
      position: fixed;
      top: 0;
      height: 100%;
      width: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      cursor: pointer;
    }

    #nav-left {
      left: 0;
      background: linear-gradient(to right, rgba(255, 255, 255, 0.02), transparent);
    }

    #nav-left:hover {
      background: linear-gradient(to right, rgba(255, 255, 255, 0.06), transparent);
    }

    #nav-right {
      right: 0;
      background: linear-gradient(to left, rgba(255, 255, 255, 0.02), transparent);
    }

    #nav-right:hover {
      background: linear-gradient(to left, rgba(255, 255, 255, 0.06), transparent);
    }

    .nav-button {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.25);
      font-size: 28px;
      padding: 12px 16px;
      cursor: pointer;
      line-height: 1;
      pointer-events: none;
    }

    .nav-panel:hover .nav-button {
      border-color: rgba(255, 255, 255, 0.5);
      color: rgba(255, 255, 255, 0.8);
    }

    #controls {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 8;
      font-family: monospace;
    }

    #symmetry-label {
      color: rgba(255, 255, 255, 0.4);
      font-size: 12px;
      user-select: none;
    }

    #symmetry-input {
      width: 150px;
      height: 24px;
      cursor: pointer;
      accent-color: rgba(255, 255, 255, 0.5);
    }

    #symmetry-value {
      color: rgba(255, 255, 255, 0.6);
      font-size: 12px;
      width: 30px;
      text-align: center;
    }

    #select-symmetry-btn {
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.25);
      font-size: 11px;
      padding: 6px 12px;
      cursor: pointer;
      font-family: monospace;
      transition: all 0.3s ease;
    }

    #select-symmetry-btn:hover {
      border-color: rgba(255, 255, 255, 0.5);
      color: rgba(255, 255, 255, 0.8);
    }

    #select-symmetry-btn:active {
      border-color: rgba(255, 255, 255, 0.8);
      color: rgba(255, 255, 255, 1);
    }

    /* CRT scanline overlay */
    body::after {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.03));
      background-size: 100% 2px, 3px 100%;
    }
  </style>
</head>

<body>
  <div id="nav-left" class="nav-panel">
    <button id="prev-btn" class="nav-button">&larr;</button>
  </div>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 0;">
    <a id="link" href="#">
      <canvas id="kaleidoscope"></canvas>
    </a>

    <div id="controls">
      <label id="symmetry-label">Symmetry:</label>
      <input id="symmetry-input" type="range" min="3" max="32" value="6" step="1">
      <div id="symmetry-value">12</div>
      <button id="select-symmetry-btn" title="This will clear all history">
        Select this symmetry level
      </button>
    </div>
  </div>

  <div id="nav-right" class="nav-panel">
    <button id="next-btn" class="nav-button">&rarr;</button>
  </div>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('rotational-imagery');

    const linkElement = document.getElementById('link');
    const canvas = document.getElementById('kaleidoscope');
    const ctx = canvas.getContext('2d');
    const symmetryInput = document.getElementById('symmetry-input');
    const symmetryValue = document.getElementById('symmetry-value');
    const selectSymmetryBtn = document.getElementById('select-symmetry-btn');

    // Kaleidoscope parameters
    let currentSymmetry = 12; // 6-fold rotational symmetry

    // History of generated patterns
    // Each entry: { shapes: [...], href: '...', symmetry: number }
    let history = [];
    let historyIndex = -1;

    // Dynamic values recalculated on resize
    let canvasSize = 0;
    let centerX = 0;
    let centerY = 0;
    let radius = 0;

    class Shape {
      constructor(x, y, size, type) {
        this.x = x;
        this.y = y;
        this.size = size;
        this.type = type; // 'circle', 'triangle', 'square', 'star', 'polygon'
        this.color = this.randomColour();
        this.rotation = LAB.rand(0, Math.PI * 2);
        this.opacity = LAB.rand(0.3, 0.7);
      }

      randomColour() {
        const hue = LAB.rand(0, 360);
        const sat = LAB.rand(50, 80);
        const light = LAB.rand(40, 60);
        return `hsla(${hue}, ${sat}%, ${light}%, ${this.opacity})`;
      }

      draw(ctx, offsetX, offsetY) {
        ctx.save();
        ctx.translate(offsetX + this.x, offsetY + this.y);
        ctx.rotate(this.rotation);
        ctx.fillStyle = this.color;
        ctx.strokeStyle = this.color;
        ctx.lineWidth = this.size * 0.15;

        switch (this.type) {
          case 'circle':
            ctx.beginPath();
            ctx.arc(0, 0, this.size, 0, Math.PI * 2);
            ctx.fill();
            break;
          case 'triangle':
            ctx.beginPath();
            ctx.moveTo(0, -this.size);
            ctx.lineTo(this.size, this.size);
            ctx.lineTo(-this.size, this.size);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            break;
          case 'square':
            ctx.fillRect(-this.size / 2, -this.size / 2, this.size, this.size);
            ctx.strokeRect(-this.size / 2, -this.size / 2, this.size, this.size);
            break;
          case 'star':
            this.drawStar(ctx, this.size);
            break;
          case 'polygon':
            this.drawPolygon(ctx, this.size, LAB.randInt(5, 7));
            break;
          case 'line':
            ctx.beginPath();
            ctx.moveTo(-this.size, 0);
            ctx.lineTo(this.size, 0);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(0, -this.size);
            ctx.lineTo(0, this.size);
            ctx.stroke();
            break;
          case 'hexagon':
            this.drawPolygon(ctx, this.size, 6);
            break;
        }

        ctx.restore();
      }

      drawStar(ctx, size) {
        const points = 5;
        const outerRadius = size;
        const innerRadius = size * 0.4;

        ctx.beginPath();
        for (let i = 0; i < points * 2; i++) {
          const radius = i % 2 === 0 ? outerRadius : innerRadius;
          const angle = (i * Math.PI) / points - Math.PI / 2;
          const x = radius * Math.cos(angle);
          const y = radius * Math.sin(angle);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }

      drawPolygon(ctx, size, sides) {
        ctx.beginPath();
        for (let i = 0; i < sides; i++) {
          const angle = (i * Math.PI * 2) / sides - Math.PI / 2;
          const x = size * Math.cos(angle);
          const y = size * Math.sin(angle);
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
      }
    }

    function calcCanvasSize() {
      const vmin = Math.min(window.innerWidth, window.innerHeight);
      return Math.floor(vmin * 0.85);
    }

    function updateDimensions() {
      const newSize = calcCanvasSize();
      if (newSize === canvasSize) return;
      canvasSize = newSize;
      canvas.width = canvasSize;
      canvas.height = canvasSize;
      centerX = canvasSize / 2;
      centerY = canvasSize / 2;
      radius = Math.min(canvasSize, canvasSize) / 2.2;
      return true; // dimensions changed
    }

    function generateShapes(symmetry) {
      const shapes = [];
      const segmentAngle = (Math.PI * 2) / symmetry;

      // Fill one wedge segment with intricate shapes
      const density = 150; // Dense for intricacy
      for (let i = 0; i < density; i++) {
        // Random angle within one segment (0 to segmentAngle)
        const angle = LAB.rand(0, segmentAngle);
        const r = LAB.rand(0, radius);
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        const size = LAB.rand(1, 11);
        const types = ['circle', 'triangle', 'square', 'star', 'polygon', 'line', 'hexagon'];
        const type = LAB.sample(types);
        shapes.push(new Shape(x, y, size, type));
      }

      return shapes;
    }

    function drawOneSegment(shapes) {
      for (const shape of shapes) {
        shape.draw(ctx, centerX, centerY);
      }
    }

    function drawFromHistory(entry) {
      const symmetry = entry.symmetry;
      const segmentAngle = (Math.PI * 2) / symmetry;

      // Update the symmetry input and display value
      currentSymmetry = symmetry;
      symmetryInput.value = symmetry;
      symmetryValue.textContent = symmetry;

      // Clear canvas
      ctx.fillStyle = '#0a0a0a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Setup stroke
      ctx.strokeStyle = '#999999';

      // Create the full kaleidoscope by rotating the segment
      for (let i = 0; i < symmetry; i++) {
        // Apply transformation for this segment
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(i * segmentAngle);
        ctx.translate(-centerX, -centerY);

        // Draw normal segment
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius + 10, 0, segmentAngle, false);
        ctx.lineTo(centerX, centerY);
        ctx.closePath();
        ctx.clip();
        drawOneSegment(entry.shapes);
        ctx.restore();

        // Draw mirrored segment (flip around the bisector line)
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.scale(-1, 1); // Flip horizontally
        ctx.translate(-centerX, -centerY);

        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius + 10, 0, segmentAngle, false);
        ctx.lineTo(centerX, centerY);
        ctx.closePath();
        ctx.clip();
        drawOneSegment(entry.shapes);
        ctx.restore();

        ctx.restore();
      }

      // Draw decorative circle at center
      ctx.fillStyle = '#0a0a0a';
      ctx.beginPath();
      ctx.arc(centerX, centerY, 8, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#555555';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(centerX, centerY, 8, 0, Math.PI * 2);
      ctx.stroke();

      linkElement.href = entry.href;
    }

    function createNewEntry() {
      return {
        shapes: generateShapes(currentSymmetry),
        href: LAB.pageRandomiser.nextOne(),
        symmetry: currentSymmetry,
      };
    }

    function goToNext() {
      if (historyIndex < history.length - 1) {
        historyIndex++;
      } else {
        history.push(createNewEntry());
        historyIndex = history.length - 1;
      }
      drawFromHistory(history[historyIndex]);
    }

    function goToPrev() {
      if (historyIndex > 0) {
        historyIndex--;
      } else {
        history.unshift(createNewEntry());
        historyIndex = 0;
      }
      drawFromHistory(history[historyIndex]);
    }

    function init() {
      updateDimensions();
      const first = createNewEntry();
      history.push(first);
      historyIndex = 0;
      drawFromHistory(first);
    }

    function resize() {
      if (updateDimensions()) {
        drawFromHistory(history[historyIndex]);
      }
    }

    // Symmetry input change - clear future history
    symmetryInput.addEventListener('change', (e) => {
      currentSymmetry = parseInt(e.target.value, 10);
      symmetryValue.textContent = currentSymmetry;

      // Delete all future history records
      history = history.slice(0, historyIndex + 1);
    });

    // Select this symmetry - keep only current entry, clear all history
    selectSymmetryBtn.addEventListener('click', () => {
      history = [history[historyIndex]];
      historyIndex = 0;
    });

    document.getElementById('nav-left').addEventListener('click', goToPrev);
    document.getElementById('nav-right').addEventListener('click', goToNext);

    // Click anywhere on the page (except canvas, anchors, or nav panels) to go forward
    document.body.addEventListener('click', (e) => {
      if (e.target.matches('canvas, a, .nav-panel, #select-symmetry-btn')) return;
      goToNext();
    });

    // Arrow keys, WASD keys, HJKL keys
    const LEFT_OR_DOWN = new Set(['ArrowLeft', 'ArrowDown', 'h', 'j', 'a', 's']);
    const RIGHT_OR_UP = new Set(['ArrowRight', 'ArrowUp', 'k', 'l', 'd', 'w']);
    function keyLeftOrDown(key) { return LEFT_OR_DOWN.has(key); }
    function keyRightOrUp(key) { return RIGHT_OR_UP.has(key); }

    document.addEventListener('keydown', (e) => {
      if (document.activeElement === symmetryInput) {
        goToNext();
      } else if (keyLeftOrDown(e.key)) {
        e.preventDefault();
        goToPrev();
      } else if (keyRightOrUp(e.key)) {
        e.preventDefault();
        goToNext();
      }
    });

    window.addEventListener('resize', resize);

    init();

  </script>
</body>

</html>
