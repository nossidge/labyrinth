<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="The mirror crack'd from side to side">
  <title>The curse is come upon me</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(120, 156, 190, 0.12), transparent 24%),
        radial-gradient(circle at 50% 50%, #121921 0%, #040608 70%);
      font-family: Georgia, serif;
      color: #dfe6ef;
    }

    #mirror {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    .piece {
      stroke: rgba(224, 236, 255, 0.88);
      stroke-width: 2;
      transition: transform 0.16s ease, filter 0.16s ease;
      transform-box: fill-box;
      transform-origin: center;
    }

    a:hover .piece,
    .piece.flash {
      transform: scale(1.05);
      filter: brightness(1.3);
    }
  </style>
</head>

<body>
  <svg id="mirror" aria-label="A broken mirror mandala of clickable shards"></svg>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('shattered-glass');

    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.getElementById('mirror');
    const palette = ['#8ca6bf', '#b7cbe2', '#90b6d0', '#6e879f', '#c6d7e7', '#7298b5', '#95a0b0'];

    function polar(radius, angle) {
      return {
        x: 500 + Math.cos(angle) * radius,
        y: 500 + Math.sin(angle) * radius,
      };
    }

    function createShard(points) {
      const a = document.createElementNS(ns, 'a');
      a.setAttribute('href', LAB.pageRandomiser.nextOne());

      const polygon = document.createElementNS(ns, 'polygon');
      polygon.setAttribute('class', 'piece');
      polygon.setAttribute('points', points.map(point => `${point.x},${point.y}`).join(' '));
      polygon.setAttribute('fill', LAB.sample(palette));
      polygon.setAttribute('opacity', LAB.rand(0.74, 0.94).toFixed(2));
      a.appendChild(polygon);
      svg.appendChild(a);
      return polygon;
    }

    function init() {
      svg.innerHTML = '';
      svg.setAttribute('viewBox', '0 0 1000 1000');

      const steps = [120, 220, 330, 450];
      const counts = [10, 18, 26];

      for (let ring = 0; ring < counts.length; ring++) {
        const inner = steps[ring];
        const outer = steps[ring + 1];
        const count = counts[ring];
        const step = (Math.PI * 2) / count;

        for (let i = 0; i < count; i++) {
          const a1 = (i * step) + LAB.rand(-0.05, 0.05);
          const a2 = ((i + 1) * step) + LAB.rand(-0.05, 0.05);
          const p1 = polar(inner + LAB.rand(-18, 18), a1);
          const p2 = polar(outer + LAB.rand(-20, 20), a1 + LAB.rand(-0.04, 0.04));
          const p3 = polar(outer + LAB.rand(-20, 20), a2 + LAB.rand(-0.04, 0.04));
          const p4 = polar(inner + LAB.rand(-18, 18), a2);
          createShard([p1, p2, p3, p4]);
        }
      }

      const core = document.createElementNS(ns, 'circle');
      core.setAttribute('cx', '500');
      core.setAttribute('cy', '500');
      core.setAttribute('r', '96');
      core.setAttribute('fill', '#05080c');
      core.setAttribute('stroke', '#dfe9f7');
      core.setAttribute('stroke-width', '2');
      svg.appendChild(core);
    }

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.altKey || e.shiftKey || e.metaKey) return;
      if (e.key === 'Tab' || e.key === 'F5') return;

      init();
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a')) init();
    });

    init();

  </script>
</body>

</html>
