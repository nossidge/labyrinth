<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TVGoHome">
  <title>Please stand by</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      text-align: center;
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      overflow: hidden;
      font-family: monospace;
    }

    #scene {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
    }

    /* Colour bars */
    #bars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: row;
      z-index: 1;
    }

    .bar-link {
      flex: 1;
      display: block;
      text-decoration: none;
      position: relative;
      transition: filter 0.3s ease;
    }

    .bar-link:hover {
      filter: brightness(1.6) saturate(1.4);
    }

    /* Static noise canvas */
    #static-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
      image-rendering: pixelated;
    }

    /* Horizontal glitchy slice things */
    .glitch-slice {
      position: absolute;
      left: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
      z-index: 3;
      pointer-events: none;
      opacity: 0;
    }

    /* Black band, rolling from top to bottom of screen */
    #rolling-band {
      position: absolute;
      left: 0;
      width: 100%;
      height: 60px;
      background: linear-gradient(to bottom,
          transparent 0%,
          rgba(0, 0, 0, 0.7) 30%,
          rgba(0, 0, 0, 0.9) 50%,
          rgba(0, 0, 0, 0.7) 70%,
          transparent 100%);
      z-index: 4;
      pointer-events: none;
    }

    /* "NO SIGNAL" text */
    #no-signal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 48px;
      font-weight: bold;
      color: #ccc;
      letter-spacing: 12px;
      text-transform: uppercase;
      z-index: 5;
      opacity: 0;
      pointer-events: none;
      text-shadow: 0 0 20px rgba(200, 200, 200, 0.5);
    }

    /* Melt distortion on bars */
    .bar-link .melt {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: inherit;
      filter: blur(8px) saturate(0.3);
      opacity: 0.6;
      pointer-events: none;
    }

    /* Lovely old CRT scanline */
    #crt {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.04), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.04));
      background-size: 100% 2px, 3px 100%;
    }

    /* Rectangle with rounded corners, like the rounded edges of an old TV */
    #vignette {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
      border-radius: 0;
      box-shadow:
        inset 0 0 80px 40px rgba(0, 0, 0, 0.6),
        inset 0 0 200px 100px rgba(0, 0, 0, 0.3);
    }
  </style>
</head>

<body>
  <div id="scene">
    <div id="bars"></div>
    <canvas id="static-canvas"></canvas>
    <div id="rolling-band"></div>
    <div id="no-signal">NO SIGNAL</div>
  </div>
  <div id="vignette"></div>
  <div id="crt"></div>

  <script src="../../common/CyclicRandomiser.js"></script>
  <script src="../../common/labyrinthPages.js"></script>
  <script>
    const currentPage = "corridors/signal-loss";
    const otherPages = labyrinthPages.filter(p => !p.includes(currentPage));
    const pageRandomiser = new CyclicRandomiser(otherPages);

    // Useful randomisation helpers
    function rand(min, max) { return Math.random() * (max - min) + min; }
    function randInt(min, max) { return Math.floor(rand(min, max + 1)); }
    function randIndex(array) { return randInt(0, array.length - 1); }
    function sample(array) { return array[randIndex(array)]; }

    // SMPTE colour bar colours, from their logo:
    // https://en.wikipedia.org/wiki/Society_of_Motion_Picture_and_Television_Engineers
    const barColours = [
      '#c0c0c0', // white
      '#c0c000', // yellow
      '#00c0c0', // cyan
      '#00c000', // green
      '#c000c0', // magenta
      '#c00000', // red
      '#0000c0', // blue
    ];

    const barsContainer = document.getElementById('bars');
    const staticCanvas = document.getElementById('static-canvas');
    const ctx = staticCanvas.getContext('2d');
    const rollingBand = document.getElementById('rolling-band');
    const noSignal = document.getElementById('no-signal');

    // Create colour bars as links
    barColours.forEach(colour => {
      const link = document.createElement('a');
      link.href = pageRandomiser.nextOne();
      link.className = 'bar-link';
      link.style.backgroundColor = colour;

      const melt = document.createElement('div');
      melt.className = 'melt';
      melt.style.backgroundColor = colour;
      link.appendChild(melt);

      barsContainer.appendChild(link);
    });

    // Render noise at 1:2 resolution and let CSS scale up (`image-rendering: pixelated;`)
    // Needed, because it was using way too much CPU at 1:1 scale
    const SCALE = 2;
    let staticImageData = null;

    function resizeCanvas() {
      staticCanvas.width = Math.ceil(window.innerWidth / SCALE);
      staticCanvas.height = Math.ceil(window.innerHeight / SCALE);
      staticImageData = ctx.createImageData(staticCanvas.width, staticCanvas.height);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // Draw static noise into the small canvas
    function drawStatic() {
      const data = staticImageData.data;
      for (let i = 0; i < data.length; i += 4) {
        const v = rand(0, 255);
        data[i] = v;
        data[i + 1] = v;
        data[i + 2] = v;
        data[i + 3] = rand(0, 120);
      }
      ctx.putImageData(staticImageData, 0, 0);
    }

    // State machine for the broadcast cycle
    // bars -> dissolving -> static -> reforming -> bars
    let phase = 'bars';
    let phaseTime = 0;
    let dissolveProgress = 0;
    const BARS_DURATION = 6000;
    const DISSOLVE_DURATION = 4000;
    const STATIC_DURATION = 3000;
    const REFORM_DURATION = 3000;

    // Rolling band position
    let bandY = -60;
    const bandSpeed = 1.2;

    // Glitch slices
    const glitchSlices = [];
    for (let i = 0; i < 8; i++) {
      const slice = document.createElement('div');
      slice.className = 'glitch-slice';
      document.getElementById('scene').appendChild(slice);
      glitchSlices.push(slice);
    }

    function triggerGlitch() {
      glitchSlices.forEach(slice => {
        if (rand(0, 1) > 0.5) {
          const y = rand(0, window.innerHeight);
          const h = rand(1, 7);
          const shift = rand(-20, 20);
          slice.style.top = y + 'px';
          slice.style.height = h + 'px';
          slice.style.transform = `translateX(${shift}px)`;
          slice.style.opacity = rand(0.3, 0.8);
          slice.style.background = rand(0, 1) > 0.7
            ? `rgba(${rand(0, 255)}, ${rand(0, 255)}, ${rand(0, 255)}, 0.3)`
            : `rgba(255, 255, 255, 0.15)`;

          setTimeout(() => {
            slice.style.opacity = 0;
          }, rand(50, 150));
        }
      });
    }

    // Colour shift on bars
    function shiftBarColours(amount) {
      const links = document.querySelectorAll('.bar-link');
      links.forEach((link, i) => {
        const base = barColours[i];
        const r = parseInt(base.slice(1, 3), 16);
        const g = parseInt(base.slice(3, 5), 16);
        const b = parseInt(base.slice(5, 7), 16);

        const shift = Math.sin(Date.now() * 0.002 + i) * amount * 60;
        const nr = Math.min(255, Math.max(0, r + shift));
        const ng = Math.min(255, Math.max(0, g + shift * 0.7));
        const nb = Math.min(255, Math.max(0, b + shift * 0.5));

        link.style.backgroundColor = `rgb(${nr}, ${ng}, ${nb})`;
      });
    }

    // Update melt effect on bars
    function updateMelt(progress) {
      const melts = document.querySelectorAll('.melt');
      melts.forEach((melt, i) => {
        const offset = Math.sin(Date.now() * 0.001 + i * 1.5) * 10;
        const h = progress * 100 + offset;
        melt.style.height = Math.min(100, Math.max(0, h)) + '%';
      });
    }

    let lastTime = 0;

    function animate(timestamp) {
      const dt = timestamp - lastTime;
      lastTime = timestamp;
      phaseTime += dt;

      // Rolling band
      bandY += bandSpeed;
      if (bandY > window.innerHeight) bandY = -60;
      rollingBand.style.top = bandY + 'px';

      // Random glitch bursts
      if (rand(0, 1) > 0.92) {
        triggerGlitch();
      }

      switch (phase) {
        case 'bars':
          staticCanvas.style.opacity = 0.05;
          noSignal.style.opacity = 0;
          barsContainer.style.opacity = 1;
          drawStatic();

          // Colour drift
          shiftBarColours(0.2);
          updateMelt(0);

          if (phaseTime > BARS_DURATION) {
            phase = 'dissolving';
            phaseTime = 0;
          }
          break;

        case 'dissolving':
          dissolveProgress = Math.min(1, phaseTime / DISSOLVE_DURATION);

          // Static fades in
          staticCanvas.style.opacity = dissolveProgress * 0.7;
          drawStatic();

          // Bars desaturate and shift
          shiftBarColours(dissolveProgress * 2);
          updateMelt(dissolveProgress);

          // Bars fade
          barsContainer.style.opacity = 1 - dissolveProgress * 0.8;

          // Glitches intensify
          if (rand(0, 1) > 0.7) triggerGlitch();

          if (phaseTime > DISSOLVE_DURATION) {
            phase = 'static';
            phaseTime = 0;
          }
          break;

        case 'static':
          staticCanvas.style.opacity = 0.8;
          barsContainer.style.opacity = 0;
          drawStatic();

          // Flash "NO SIGNAL"
          noSignal.style.opacity = Math.sin(phaseTime * 0.005) > 0 ? 0.8 : 0;

          if (rand(0, 1) > 0.85) triggerGlitch();

          if (phaseTime > STATIC_DURATION) {
            phase = 'reforming';
            phaseTime = 0;

            // Reassign links on reform
            document.querySelectorAll('.bar-link').forEach(link => {
              link.href = pageRandomiser.nextOne();
            });
          }
          break;

        case 'reforming':
          const reformProgress = Math.min(1, phaseTime / REFORM_DURATION);

          staticCanvas.style.opacity = 0.8 - reformProgress * 0.75;
          drawStatic();

          barsContainer.style.opacity = reformProgress;
          noSignal.style.opacity = 0;

          // Restore colours
          shiftBarColours((1 - reformProgress) * 1.5);
          updateMelt((1 - reformProgress) * 0.5);

          if (phaseTime > REFORM_DURATION) {
            phase = 'bars';
            phaseTime = 0;
          }
          break;
      }

      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);

  </script>
</body>

</html>
