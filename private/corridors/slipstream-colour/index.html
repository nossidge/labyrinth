<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="stream of unconciousness">
  <title>Slipstream Colour</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: #14162e;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #link {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <a id="link" href="../index.html">
    <canvas id="canvas"></canvas>
  </a>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('slipstream-colour');

    const link = document.getElementById('link');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const PAPER = '#14162e';

    const PALETTES = [
      ['#2f3fd1', '#5b6bff', '#e4577a', '#171a3d'],
      ['#f2a900', '#e4577a', '#c2410c', '#7a1f3d'],
      ['#2e7d5b', '#8fbf6a', '#e0b84a', '#1c3d34'],
    ];

    let particles = [];
    let pointerDown = false;
    let paletteIndex = 0;
    let seed = 1;
    let raf = 0;

    function hash(x, y) {
      const h = Math.sin(x * 127.1 + y * 311.7 + seed * 74.7) * 43758.5453;
      return h - Math.floor(h);
    }

    function noise(x, y) {
      const xi = Math.floor(x);
      const yi = Math.floor(y);
      const xf = x - xi;
      const yf = y - yi;
      const u = xf * xf * (3 - 2 * xf);
      const v = yf * yf * (3 - 2 * yf);
      return hash(xi, yi) * (1 - u) * (1 - v)
        + hash(xi + 1, yi) * u * (1 - v)
        + hash(xi, yi + 1) * (1 - u) * v
        + hash(xi + 1, yi + 1) * u * v;
    }

    function fieldAngle(x, y) {
      const s = 0.0022;
      return (noise(x * s, y * s) + 0.5 * noise(x * s * 2.3, y * s * 2.3)) * Math.PI * 2.6;
    }

    function spawn(x, y, life) {
      particles.push({
        x: x,
        y: y,
        life: life,
        colour: LAB.sample(PALETTES[paletteIndex]),
        width: LAB.rand(0.6, 2.4),
      });
    }

    function step() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        const angle = fieldAngle(p.x, p.y);
        const nx = p.x + Math.cos(angle) * 1.6;
        const ny = p.y + Math.sin(angle) * 1.6;
        ctx.globalAlpha = 0.16;
        ctx.strokeStyle = p.colour;
        ctx.lineWidth = p.width;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(nx, ny);
        ctx.stroke();
        p.x = nx;
        p.y = ny;
        if (--p.life <= 0 || nx < -20 || ny < -20 || nx > canvas.width + 20 || ny > canvas.height + 20) {
          particles.splice(i, 1);
        }
      }
    }

    function tick() {
      step();
      raf = particles.length ? requestAnimationFrame(tick) : 0;
    }

    function kick() {
      if (!raf) raf = requestAnimationFrame(tick);
    }

    function paint() {
      cancelAnimationFrame(raf);
      raf = 0;
      particles.length = 0;
      ctx.globalAlpha = 1;
      ctx.fillStyle = PAPER;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.lineCap = 'round';

      const count = Math.min(1400, Math.floor(canvas.width * canvas.height / 450));
      for (let i = 0; i < count; i++) {
        spawn(LAB.rand(0, canvas.width), LAB.rand(0, canvas.height), LAB.randInt(250, 700));
      }
      kick();
    }

    function init() {
      link.href = LAB.pageRandomiser.nextOne();
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      paint();
    }

    function trail(e) {
      if (!pointerDown && e.pointerType !== 'mouse') return;
      for (let i = 0; i < 5; i++) {
        spawn(e.clientX + LAB.rand(-15, 15), e.clientY + LAB.rand(-15, 15), LAB.rand(160, 340));
      }
      kick();
    }

    canvas.addEventListener('pointerdown', (e) => {
      pointerDown = true;
      trail(e);
    });

    document.addEventListener('pointerup', () => {
      pointerDown = false;
    });

    canvas.addEventListener('pointermove', trail);

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, () => {
        paletteIndex = (paletteIndex + 1) % PALETTES.length;
        LAB.handleKeydown(e, () => {
          seed = LAB.rand(0, 1000);
          paint();
        });
      });
    });

    window.addEventListener('resize', init);

    init();

  </script>
</body>

</html>
