<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="I got to be your friend now, baby">
  <title>Move out of my way</title>
  <style>
    :root {
      --track: rgba(33, 41, 53, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #d7d7d7;
    }

    body {
      display: flex;
      align-items: stretch;
      justify-content: stretch;
    }

    #field {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
    }

    .tile {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border-radius: 2px;
      transition: transform 0.2s ease, background-color 0.2s ease, filter 0.2s ease;
    }

    .tile:hover {
      transform: scale(1.06);
      background-color: rgba(255, 255, 255, 0.35);
      filter: brightness(1.05);
    }

    .spinner {
      position: relative;
      width: var(--size);
      height: var(--size);
    }

    .spinner::before,
    .spinner::after {
      content: "";
      position: absolute;
      border-radius: 50%;
    }

    .spinner.ring::before {
      inset: 0;
      border: var(--stroke) solid var(--track);
      border-top-color: var(--ink);
      border-right-color: var(--ink);
      animation: spin var(--duration) linear infinite;
    }

    .spinner.dual::before {
      inset: 0;
      border: var(--stroke) solid var(--track);
      border-top-color: var(--ink);
      border-left-color: var(--ink);
      animation: spin var(--duration) linear infinite;
    }

    .spinner.dual::after {
      inset: calc(var(--stroke) * 1.9);
      border: calc(var(--stroke) * 0.82) solid transparent;
      border-bottom-color: var(--ink);
      border-right-color: var(--ink);
      animation: spin-back calc(var(--duration) * 0.82) linear infinite;
    }

    .spinner.arc::before {
      inset: 0;
      border: var(--stroke) solid transparent;
      border-top-color: var(--ink);
      border-right-color: rgba(58, 72, 92, 0.38);
      border-radius: 50%;
      animation: spin calc(var(--duration) * 0.92) linear infinite;
    }

    .spinner.dotted::before {
      inset: 0;
      border: var(--stroke) dotted var(--ink);
      opacity: 0.9;
      animation: spin calc(var(--duration) * 1.45) linear infinite;
    }

    .spinner.segments::before {
      inset: 0;
      background: repeating-conic-gradient(var(--ink) 0 22.5deg, transparent 22.5deg 45deg);
      -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - var(--stroke) - 1px), #000000 calc(100% - var(--stroke)));
      mask: radial-gradient(farthest-side, transparent calc(100% - var(--stroke) - 1px), #000000 calc(100% - var(--stroke)));
      animation: spin calc(var(--duration) * 0.88) linear infinite;
      opacity: 0.95;
    }

    .spinner.segments::after {
      inset: calc(var(--stroke) * 1.3);
      border: 1px solid rgba(58, 72, 92, 0.08);
    }

    .spinner.orbit {
      animation: spin calc(var(--duration) * 1.08) linear infinite;
    }

    .spinner.orbit::before {
      inset: calc(var(--size) * 0.23);
      border: 1px solid rgba(58, 72, 92, 0.14);
    }

    .spinner.orbit .dot,
    .spinner.beads .bead {
      position: absolute;
      top: 50%;
      left: 50%;
      border-radius: 50%;
      background: var(--ink);
    }

    .spinner.orbit .dot {
      width: var(--dot);
      height: var(--dot);
      margin-left: calc(var(--dot) / -2);
      margin-top: calc(var(--dot) / -2);
    }

    .spinner.orbit .one {
      transform: rotate(0deg) translateY(calc(var(--size) / -2.15));
    }

    .spinner.orbit .two {
      transform: rotate(180deg) translateY(calc(var(--size) / -2.15));
      opacity: 0.4;
    }

    .spinner.beads {
      animation: spin calc(var(--duration) * 1.1) steps(8) infinite;
    }

    .spinner.beads .bead {
      width: var(--bead);
      height: var(--bead);
      margin-left: calc(var(--bead) / -2);
      margin-top: calc(var(--bead) / -2);
      opacity: var(--alpha);
      transform: rotate(var(--angle)) translateY(calc(var(--size) / -2.2));
    }

    @keyframes spin {
      to {
        transform: rotate(1turn);
      }
    }

    @keyframes spin-back {
      to {
        transform: rotate(-1turn);
      }
    }
  </style>
</head>

<body>
  <main id="field"></main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('spinners');

    const field = document.getElementById('field');

    const colours = ['#4f5c6f', '#5d6a7f', '#6d7891', '#3d6db4', '#5278aa', '#4b5563'];
    const variants = ['ring', 'dual', 'arc', 'dotted', 'segments', 'orbit', 'beads'];

    function createSpinner(cellSide) {
      const variant = LAB.sample(variants);
      const spinner = document.createElement('span');
      const size = Math.floor(LAB.rand(cellSide * 0.34, cellSide * 0.68));
      const stroke = Math.max(3, Math.round(size / 7));

      spinner.className = 'spinner ' + variant;
      spinner.style.setProperty('--size', size + 'px');
      spinner.style.setProperty('--stroke', stroke + 'px');
      spinner.style.setProperty('--dot', Math.max(5, Math.round(size / 5.5)) + 'px');
      spinner.style.setProperty('--bead', Math.max(4, Math.round(size / 7.5)) + 'px');
      spinner.style.setProperty('--ink', LAB.sample(colours));
      spinner.style.setProperty('--duration', LAB.rand(0.7, 1.9).toFixed(2) + 's');

      if (variant === 'orbit') {
        const first = document.createElement('span');
        first.className = 'dot one';
        spinner.appendChild(first);

        const second = document.createElement('span');
        second.className = 'dot two';
        spinner.appendChild(second);
      }

      if (variant === 'beads') {
        for (let i = 0; i < 8; i++) {
          const bead = document.createElement('span');
          bead.className = 'bead';
          bead.style.setProperty('--angle', (i * 45) + 'deg');
          bead.style.setProperty('--alpha', (0.2 + (i / 8) * 0.75).toFixed(2));
          spinner.appendChild(bead);
        }
      }

      return spinner;
    }

    function init() {
      const gutter = window.innerWidth < 700 ? 6 : 10;
      const targetCell = window.innerWidth < 700 ? 70 : 92;
      const cols = Math.max(4, Math.floor((window.innerWidth - gutter * 2) / targetCell));
      const rows = Math.max(5, Math.floor((window.innerHeight - gutter * 2) / targetCell));
      const cellWidth = (window.innerWidth - gutter * (cols + 1)) / cols;
      const cellHeight = (window.innerHeight - gutter * (rows + 1)) / rows;
      const cellSide = Math.min(cellWidth, cellHeight);
      const count = cols * rows;
      const fragment = document.createDocumentFragment();

      field.style.padding = gutter + 'px';
      field.style.gap = gutter + 'px';
      field.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      field.style.gridTemplateRows = `repeat(${rows}, 1fr)`;

      for (let i = 0; i < count; i++) {
        const link = document.createElement('a');
        link.className = 'tile';
        link.href = LAB.pageRandomiser.nextOne();
        link.appendChild(createSpinner(cellSide));
        fragment.appendChild(link);
      }

      field.replaceChildren(fragment);
    }

    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(init, 20);
    });

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey || e.altKey || e.shiftKey || e.metaKey) return;
      if (e.key === 'Tab' || e.key === 'F5') return;

      init();
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a')) init();
    });

    init();

  </script>
</body>

</html>
