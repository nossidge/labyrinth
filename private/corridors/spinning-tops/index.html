<!DOCTYPE html>
<html lang="en">

<!--
I wasn't really sure what I was doing with this one.
Just trying to make a 3d model of something or other.
Hacking stuff together until it looked okay.
I think it works though.
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Spinsalabim">
  <title>Topsy-turvy</title>
  <style>
    :root {
      --bg: #000000;
      --spinningTop: #8888cc;
      --vertex: #aaaaff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      overflow: hidden;
    }

    canvas {
      display: block;
    }

    #crt-scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
      background-size: 100% 3px;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>

<body>
  <div id="crt-scanlines"></div>
  <a id="link" href="../index.html">
    <canvas id="canvas"></canvas>
  </a>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('spinning-tops');

    const link = document.getElementById('link');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const maxSpinningTops = 10;

    let winW, winH;
    let spinningTops = [];
    let vertexLinks = [];

    class SpinningTop {
      constructor(cx, cy) {
        this.cx = cx;
        this.cy = cy;
        this.rotation = { x: 0, y: 0, z: 0 };
        this.rotSpeed = {
          x: LAB.rand(-0.005, 0.005),
          y: LAB.rand(0.008, 0.02),
          z: LAB.rand(-0.003, 0.003),
        };
        this.vertices = [];
        this.edges = [];
        this.scale = 0;
        this.targetScale = LAB.rand(80, 200);
        this.growing = true;
        this.buildStructure();
      }

      buildStructure() {
        const layers = LAB.randInt(5, 10);
        const sides = LAB.randInt(10, 20);

        for (let layer = 0; layer <= layers; layer++) {
          const y = (layer - layers / 2) * 40;
          const r = (1 - Math.abs(layer - layers / 2) / (layers / 2 + 0.5)) * 30;
          for (let i = 0; i < sides; i++) {
            const angle = (Math.PI * 2 / sides) * i + (layer % 2) * Math.PI / sides;
            this.vertices.push({
              x: Math.cos(angle) * r * 3,
              y: y,
              z: Math.sin(angle) * r * 3,
              layer: layer,
            });
          }
        }

        for (let i = 0; i < this.vertices.length; i++) {
          for (let j = i + 1; j < this.vertices.length; j++) {
            const a = this.vertices[i];
            const b = this.vertices[j];
            const dist = Math.sqrt(
              (a.x - b.x) ** 2 + (a.y - b.y) ** 2 + (a.z - b.z) ** 2
            );
            if (dist < 60) {
              this.edges.push([i, j]);
            }
          }
        }
      }

      rotatePoint(px, py, pz) {
        let { x, y, z } = { x: px, y: py, z: pz };

        const cy = Math.cos(this.rotation.y);
        const sy = Math.sin(this.rotation.y);
        const tmpX = x * cy - z * sy;
        let tmpZ = x * sy + z * cy;
        x = tmpX;
        z = tmpZ;

        const cx = Math.cos(this.rotation.x);
        const sx = Math.sin(this.rotation.x);
        let tmpY = y * cx - z * sx;
        tmpZ = y * sx + z * cx;
        y = tmpY;
        z = tmpZ;

        const cz = Math.cos(this.rotation.z);
        const sz = Math.sin(this.rotation.z);
        const tmpX2 = x * cz - y * sz;
        tmpY = x * sz + y * cz;
        x = tmpX2;
        y = tmpY;

        return { x, y, z };
      }

      project(px, py, pz) {
        const perspective = 500;
        const dz = pz + perspective;
        const scale = perspective / Math.max(1, dz);
        return {
          sx: this.cx + px * scale * this.scale / 100,
          sy: this.cy + py * scale * this.scale / 100,
          depth: dz,
        };
      }

      update() {
        this.rotation.x += this.rotSpeed.x;
        this.rotation.y += this.rotSpeed.y;
        this.rotation.z += this.rotSpeed.z;

        if (this.growing) {
          this.scale += (this.targetScale - this.scale) * 0.03;
          if (Math.abs(this.scale - this.targetScale) < 1) {
            this.growing = false;
          }
        }
      }

      draw(ctx) {
        const projected = this.vertices.map(v => {
          const rotated = this.rotatePoint(v.x, v.y, v.z);
          return { ...this.project(rotated.x, rotated.y, rotated.z), layer: v.layer };
        });

        this.edges.forEach(([i, j]) => {
          const a = projected[i];
          const b = projected[j];
          const avgDepth = (a.depth + b.depth) / 2;
          const alpha = Math.min(1, Math.max(0.15, (avgDepth - 200) / 400));

          const hue = 230 + (a.layer * 15) % 60;
          ctx.beginPath();
          ctx.moveTo(a.sx, a.sy);
          ctx.lineTo(b.sx, b.sy);
          ctx.strokeStyle = `hsla(${hue}, 40%, 60%, ${alpha})`;
          ctx.lineWidth = 1;
          ctx.stroke();
        });

        projected.forEach((p, idx) => {
          const alpha = Math.min(1, Math.max(0.2, (p.depth - 200) / 400));
          const size = 2 + alpha * 2;
          ctx.beginPath();
          ctx.arc(p.sx, p.sy, size, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(170, 170, 255, ${alpha})`;
          ctx.fill();
        });

        return projected;
      }
    }

    function randomSpinningTop() {
      spinningTops.push(new SpinningTop(
        LAB.rand(100, winW - 100),
        LAB.rand(100, winH - 100)
      ));

      // Too many spinningTops uses too much CPU
      // If there are too many spinningTops, then remove the second one in the array
      // This is so we always keep the first one, in the dead centre
      if (spinningTops.length > maxSpinningTops) {
        spinningTops.splice(1, 1);
      }

      link.href = LAB.pageRandomiser.nextOne();
    }

    function init() {
      spinningTops = [];
      vertexLinks = [];

      winW = canvas.width = window.innerWidth;
      winH = canvas.height = window.innerHeight;

      ctx.clearRect(0, 0, winW, winH);
      spinningTops.push(new SpinningTop(winW / 2, winH / 2));
    }

    function tick() {
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
      ctx.fillRect(0, 0, winW, winH);
      ctx.globalCompositeOperation = 'source-over';

      spinningTops.forEach((spinningTop) => {
        spinningTop.update();
        spinningTop.draw(ctx);
      });

      requestAnimationFrame(tick);
    }

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, randomSpinningTop);
    });

    init();
    tick();

  </script>
</body>

</html>
