<!DOCTYPE html>
<html lang="en">

<!--
https://en.wikipedia.org/wiki/Hypotrochoid
A small gear rolling inside a big gear, with a pen poked through a hole.
https://en.wikipedia.org/wiki/Spirograph
A classic toy that makes use of this.
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="gearheads">
  <title>Whorlwind</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #060606;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #link {
      position: relative;
      width: 80vmin;
      height: 80vmin;
      animation: spin 60s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .bead {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: block;
      text-decoration: none;
      transform: translate(-50%, -50%);
      /* Long transition makes the pattern morph between gear settings */
      transition: left 2.4s ease-in-out, top 2.4s ease-in-out,
        background 2.4s ease-in-out, color 2.4s ease-in-out,
        box-shadow 0.18s ease, width 0.18s ease, height 0.18s ease;
      will-change: left, top;
    }

    .bead:hover,
    #link:hover .bead {
      width: 12px;
      height: 12px;
      box-shadow: 0 0 6px currentColor;
      z-index: 99;
    }

    #crt-scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
      background-size: 100% 2px;
    }
  </style>
</head>

<body>
  <div id="crt-scanlines"></div>
  <a id="link" href="../index.html">
    <div id="main"></div>
  </a>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('spiro-dots');

    const link = document.getElementById('link');
    const main = document.getElementById('main');
    const BEADS = 240;
    const beads = [];

    for (let i = 0; i < BEADS; i++) {
      const a = document.createElement('a');
      a.className = 'bead';
      a.href = LAB.pageRandomiser.nextOne();
      main.appendChild(a);
      beads.push(a);
    }

    // Greatest common divisor
    function gcd(a, b) {
      return b === 0 ? a : gcd(b, a % b);
    }

    // Pick fresh gear settings and slide every bead to its new spot
    // CSS transitions handle the morph between shapes
    function reshape() {
      const minDim = Math.min(window.innerWidth, window.innerHeight);
      const scale = minDim * 0.42;
      const offset = minDim * 0.4;

      const R = LAB.randInt(5, 9);
      let r = LAB.randInt(2, R - 1);
      while (gcd(R, r) === R) {
        r = LAB.randInt(2, R - 1);
      }
      const d = LAB.rand(0.4, 1.0) * r;

      // One full closed curve needs t to sweep r / gcd revolutions
      const turns = r / gcd(R, r);
      const norm = (R - r) + d;
      const hueBase = LAB.rand(0, 360);

      for (let i = 0; i < BEADS; i++) {
        const t = (i / BEADS) * Math.PI * 2 * turns;
        const k = (R - r) / r;
        const x = ((R - r) * Math.cos(t) + d * Math.cos(k * t)) / norm * scale + offset;
        const y = ((R - r) * Math.sin(t) - d * Math.sin(k * t)) / norm * scale + offset;
        const hue = (hueBase + (i / BEADS) * 360) % 360;
        beads[i].style.left = x + 'px';
        beads[i].style.top = y + 'px';
        beads[i].style.background = `hsl(${hue}, 85%, 58%)`;
        beads[i].style.color = `hsl(${hue}, 85%, 58%)`;
      }

      link.href = LAB.pageRandomiser.nextOne();
    }

    let scheduleTimer = null;
    function scheduleNext() {
      clearTimeout(scheduleTimer);
      scheduleTimer = setTimeout(init, 4500);
    }

    function init() {
      reshape();
      scheduleNext();
    }

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, init);
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a')) init();
    });

    window.addEventListener('resize', init);

    init();

  </script>
</body>

</html>
