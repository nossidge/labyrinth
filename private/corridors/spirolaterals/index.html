<!DOCTYPE html>
<html lang="en">

<!--
https://en.wikipedia.org/wiki/Spirolateral

See also `harmonograph`
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="I Like Turtles">
  <title>Spirolaterals</title>
  <style>
    :root {
      --cell-size: 220px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #050507;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 16px;
      font-family: monospace;
    }

    #main {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .square {
      width: var(--cell-size);
      height: var(--cell-size);
      background: #0c0c0c;
      border: 1px solid #1f1f2a;
      text-decoration: none;
      display: block;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .square:hover {
      border-color: #ffcc66;
      box-shadow: 0 0 20px rgba(255, 204, 102, 0.4);
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    polyline {
      fill: none;
      stroke-width: 1;
      stroke-linecap: square;
      stroke-linejoin: miter;
    }

    /* On narrow screens, hide the 3rd column: cells 3, 6, 9 */
    @media (max-width: 760px) {
      #main {
        grid-template-columns: repeat(2, 1fr);
      }

      .square:nth-child(3n) {
        display: none;
      }
    }

    /* On very narrow screens, hide the 2nd column: cells 2, 5, 8 */
    @media (max-width: 520px) {
      #main {
        grid-template-columns: 1fr;
      }

      .square:nth-child(3n - 1) {
        display: none;
      }
    }

    /* On short screens, hide the 3rd row: cells 7, 8, 9 */
    @media (max-height: 760px) {
      .square:nth-child(n + 7) {
        display: none;
      }
    }

    /* On very short screens, also hide the 2nd row: cells 4, 5, 6 */
    @media (max-height: 520px) {
      .square:nth-child(n + 4) {
        display: none;
      }
    }

    #crt-scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
      background-size: 100% 2px;
    }
  </style>
</head>

<body>
  <div id="crt-scanlines"></div>
  <main id="main"></main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('spirolaterals');

    const main = document.getElementById('main');

    const PALETTE = [
      '#ff66cc', '#66ffcc', '#ffcc66',
      '#cc66ff', '#66ccff', '#ff8866',
      '#aaff66', '#66ff88', '#ffaaff',
    ];
    const paletteRandomiser = new LAB.CyclicRandomiser(PALETTE);

    const NUMBERS = [0, 1, 2, 3, 4, 5, 6, 7, 8];
    const numbersRandomiser = new LAB.CyclicRandomiser(NUMBERS);

    const cells = [];

    // Not multiples of 18°, because those are really boring.
    const angles = Array
      .from({ length: 360 }, (_, i) => i)
      .filter(a => a % 18 !== 0);

    // Walk 1, 2, 3... n steps, turning by the same angle after each.
    // Repeat until the path closes, or until we give up.
    function spiroPoints(n, angleDeg) {
      const pts = [[0, 0]];
      let x = 0;
      let y = 0;
      let heading = 0;
      for (let rep = 0; rep < 40; rep++) {
        for (let i = 1; i <= n; i++) {
          const rad = heading * Math.PI / 180;
          x += Math.cos(rad) * i * 10;
          y += Math.sin(rad) * i * 10;
          pts.push([x, y]);
          heading = ((heading + angleDeg) % 360 + 360) % 360;
        }
        if (Math.abs(x) < 0.001 && Math.abs(y) < 0.001 && heading === 0) break;
      }
      return pts;
    }

    // Build a single cell (anchor + SVG) once and return a controller
    // that can blank and redraw a fresh spirolateral on the same SVG.
    function createCell() {
      const svg = LAB.svgElement('svg');
      const line = LAB.svgElement('polyline', { 'vector-effect': 'non-scaling-stroke' });
      svg.appendChild(line);

      const a = document.createElement('a');
      a.href = LAB.pageRandomiser.nextOne();
      a.className = 'square';
      a.appendChild(svg);
      main.appendChild(a);

      function draw() {
        const number = 20;
        const angle = LAB.sample(angles);
        const pts = spiroPoints(number, angle);

        const xs = pts.map(p => p[0]);
        const ys = pts.map(p => p[1]);
        const minX = Math.min(...xs);
        const minY = Math.min(...ys);
        const w = Math.max(...xs) - minX;
        const h = Math.max(...ys) - minY;
        const pad = Math.max(w, h, 10) * 0.1;

        const box = Math.max(w, h) + pad * 2;
        const cx = minX + w / 2;
        const cy = minY + h / 2;
        svg.setAttribute('viewBox', `${cx - box / 2} ${cy - box / 2} ${box} ${box}`);

        line.setAttribute('points', pts.map(p => p.join(',')).join(' '));
        line.setAttribute('stroke', paletteRandomiser.nextOne());

        // Draw the turtle walking path.
        const len = line.getTotalLength();
        line.style.transition = 'none';
        line.style.strokeDasharray = len;
        line.style.strokeDashoffset = len;
        line.getBoundingClientRect();
        line.style.transition = `stroke-dashoffset ${LAB.rand(1.5, 3.5)}s ease-out`;
        line.style.strokeDashoffset = 0;
      }

      // Draw a new one on hover.
      svg.addEventListener('mouseenter', draw);

      return { draw };
    }

    function init() {
      main.replaceChildren();
      cells.length = 0;
      for (let i = 0; i < 9; i++) cells.push(createCell());
      cells.forEach(cell => cell.draw());
    }

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, () => {
        // Pressing 1-9 redraws that particular cell.
        const n = parseInt(e.key, 10);
        if (n >= 1 && n <= 9) cells[n - 1].draw();

        // Else, pick a random cell and redraw it.
        else cells[numbersRandomiser.nextOne()].draw();
      });
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a')) init();
    });

    init();

  </script>
</body>

</html>
