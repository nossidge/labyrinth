<!DOCTYPE html>
<html lang="en">

<!--
https://en.wikipedia.org/wiki/Superellipse

See also: `caustics`, `harmonography`, `spirolaterals`
See also also: `superellipses`
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="I Like Squircles">
  <title>Squircles</title>
  <style>
    :root {
      --cell-size: 220px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #050507;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 16px;
      font-family: monospace;
    }

    #main {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .square {
      width: var(--cell-size);
      height: var(--cell-size);
      background: #0c0c0c;
      border: 1px solid #1f1f2a;
      text-decoration: none;
      display: block;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .square:hover {
      border-color: #ffcc66;
      box-shadow: 0 0 20px rgba(255, 204, 102, 0.4);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* On narrow screens, hide the 3rd column: cells 3, 6, 9 */
    @media (max-width: 760px) {
      #main {
        grid-template-columns: repeat(2, 1fr);
      }

      .square:nth-child(3n) {
        display: none;
      }
    }

    /* On very narrow screens, hide the 2nd column: cells 2, 5, 8 */
    @media (max-width: 520px) {
      #main {
        grid-template-columns: 1fr;
      }

      .square:nth-child(3n - 1) {
        display: none;
      }
    }

    /* On short screens, hide the 3rd row: cells 7, 8, 9 */
    @media (max-height: 760px) {
      .square:nth-child(n + 7) {
        display: none;
      }
    }

    /* On very short screens, also hide the 2nd row: cells 4, 5, 6 */
    @media (max-height: 520px) {
      .square:nth-child(n + 4) {
        display: none;
      }
    }

    #crt-scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
      background-size: 100% 2px;
    }
  </style>
</head>

<body>
  <div id="crt-scanlines"></div>
  <main id="main"></main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('squircles');

    const main = document.getElementById('main');

    const NUMBERS = [0, 1, 2, 3, 4, 5, 6, 7, 8];
    const numbersRandomiser = new LAB.CyclicRandomiser(NUMBERS);

    const cells = [];

    // Oscillate between a star and a square
    function randomShape() {
      return {
        hue: LAB.randInt(0, 360),
        lo: LAB.rand(0.4, 1.0),
        hi: LAB.rand(3.5, 8),
        speed: LAB.rand(0.0003, 0.0008),
        phase: LAB.rand(0, Math.PI * 2),
        spin: LAB.rand(-0.0004, 0.0004),
      };
    }

    // Build a single cell (anchor + canvas) once and return a controller
    // that can regenerate a fresh superellipse on the same canvas.
    function createCell() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');

      const a = document.createElement('a');
      a.href = LAB.pageRandomiser.nextOne();
      a.className = 'square';
      a.appendChild(canvas);

      const cell = { canvas, ctx, shape: randomShape() };

      cell.resize = function () {
        if (this.canvas.clientWidth === 0) return;

        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        this.canvas.width = Math.max(1, Math.round(this.canvas.clientWidth * dpr));
        this.canvas.height = Math.max(1, Math.round(this.canvas.clientHeight * dpr));
      };

      cell.regenerate = function () {
        this.shape = randomShape();
      };

      cell.draw = function (t) {
        if (this.canvas.clientWidth === 0) return;

        const ctx = this.ctx;
        const w = this.canvas.width;
        const h = this.canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const R = Math.min(w, h) * 0.40;
        const s = this.shape;

        ctx.fillStyle = '#0c0c0c';
        ctx.fillRect(0, 0, w, h);

        // Exponent morphs smoothly between lo and hi
        const u = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
        const n = s.lo + (s.hi - s.lo) * u;
        const rot = t * s.spin;

        // Draw a few nested superellipses for depth.
        const layers = 4;
        ctx.lineWidth = Math.max(1, w * 0.004);
        for (let L = 0; L < layers; L++) {
          const scale = 1 - L * 0.22;
          ctx.beginPath();
          for (let deg = 0; deg <= 360; deg += 3) {
            const rad = deg * Math.PI / 180;
            const ct = Math.cos(rad);
            const st = Math.sin(rad);
            const ex = 2 / n;
            let x = Math.sign(ct) * Math.pow(Math.abs(ct), ex) * R * scale;
            let y = Math.sign(st) * Math.pow(Math.abs(st), ex) * R * scale;
            const xr = x * Math.cos(rot) - y * Math.sin(rot);
            const yr = x * Math.sin(rot) + y * Math.cos(rot);
            if (deg === 0) ctx.moveTo(cx + xr, cy + yr);
            else ctx.lineTo(cx + xr, cy + yr);
          }
          ctx.closePath();
          const hue = (s.hue + L * 22) % 360;
          ctx.strokeStyle = `hsla(${hue}, 90%, 64%, ${0.85 - L * 0.16})`;
          ctx.stroke();
        }
      };

      // Regenerate with a new animation on hover.
      a.addEventListener('mouseenter', () => cell.regenerate());

      main.appendChild(a);
      return cell;
    }

    function sizeAll() {
      cells.forEach(cell => cell.resize());
    }

    function init() {
      main.replaceChildren();
      cells.length = 0;
      for (let i = 0; i < 9; i++) cells.push(createCell());
      sizeAll();
    }

    function frame(t) {
      cells.forEach(cell => cell.draw(t));
      requestAnimationFrame(frame);
    }

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, () => {
        // Pressing 1-9 regenerates that particular cell.
        const n = parseInt(e.key, 10);
        if (n >= 1 && n <= 9) cells[n - 1].regenerate();

        // Else, pick a random cell and regenerate it.
        else cells[numbersRandomiser.nextOne()].regenerate();
      });
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a')) init();
    });

    let resizeTimer = null;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(sizeAll, 200);
    });

    init();
    requestAnimationFrame(frame);

  </script>
</body>

</html>
