<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A 7x7 grid of white and black circles that swap places">
  <title>Swapping Circles</title>
  <style>
    :root {
      --bg-color: #222;
      --circle-white: #ffffff;
      --circle-black: #222;
      --outline-color: #ffffff;
      --grid-size: 7;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      color: var(--circle-white);
      font-family: 'Space Grotesk', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #grid-container {
      display: block;
      position: relative;
    }

    .circle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid var(--outline-color);
      display: block;
      transition:
        left 0.6s cubic-bezier(0.4, 0, 0.2, 1),
        top 0.6s cubic-bezier(0.4, 0, 0.2, 1),
        transform 0.3s ease;
      position: absolute;
      text-decoration: none;
      z-index: 1;
    }

    .circle.white {
      background-color: var(--circle-white);
    }

    .circle.filled-black {
      background-color: var(--circle-black);
    }

    .circle:hover {
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5));
      z-index: 10;
      transform: scale(1.1);
    }

    /* CRT Effect from 1-bit-dots */
    #overlays {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.03));
      background-size: 100% 2px, 3px 100%;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }
  </style>
</head>

<body>
  <div id="overlays"></div>
  <main id="grid-container"></main>
  <h1 class="sr-only">Swapping Circles</h1>

  <script src="../../common/CyclicRandomiser.js"></script>
  <script src="../../common/labyrinthPages.js"></script>
  <script>
    const currentPage = "corridors/swapping-circles";
    const otherPages = labyrinthPages.filter(p => !p.includes(currentPage));
    const pageRandomiser = new CyclicRandomiser(otherPages);

    const gridSize = 7;
    const container = document.getElementById('grid-container');

    const circles = [];
    const cellSide = 80;
    const gap = 1;
    const circleSize = 60;
    const offset = (cellSide - circleSize) / 2;

    function getPos(index) {
      const col = index % gridSize;
      const row = Math.floor(index / gridSize);
      return {
        x: col * (cellSide + gap),
        y: row * (cellSide + gap)
      };
    }

    function createGrid() {
      const containerSize = (gridSize * cellSide) + ((gridSize - 1) * gap);
      container.style.width = `${containerSize}px`;
      container.style.height = `${containerSize}px`;

      const whiteHomeIndices = [];
      const blackHomeIndices = [];

      for (let i = 0; i < gridSize * gridSize; i++) {
        const row = Math.floor(i / gridSize) + 1;
        const col = (i % gridSize) + 1;
        if (row + col <= 8) {
          whiteHomeIndices.push(i);
        } else {
          blackHomeIndices.push(i);
        }
      }

      // Create all circles with their home assignments
      const allCirclesData = [];
      whiteHomeIndices.forEach(home => {
        allCirclesData.push({ type: 'white', homeIndex: home });
      });
      blackHomeIndices.forEach(home => {
        allCirclesData.push({ type: 'filled-black', homeIndex: home });
      });

      // Shuffle their starting positions
      const startIndices = Array.from({ length: 49 }, (_, i) => i);
      for (let i = startIndices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [startIndices[i], startIndices[j]] = [startIndices[j], startIndices[i]];
      }

      allCirclesData.forEach((data, i) => {
        const circle = document.createElement('a');
        circle.href = pageRandomiser.nextOne();
        circle.className = `circle ${data.type}`;
        const startIdx = startIndices[i];
        circle.dataset.index = startIdx;
        circle.dataset.home = data.homeIndex;

        const pos = getPos(startIdx);
        circle.style.left = `${pos.x + offset}px`;
        circle.style.top = `${pos.y + offset}px`;

        container.appendChild(circle);
        circles.push(circle);
      });
    }

    function swapRandom() {
      const homeless = circles.filter(c => parseInt(c.dataset.index) !== parseInt(c.dataset.home));
      if (homeless.length === 0) return;

      // Pick a random homeless circle
      const c1 = homeless[Math.floor(Math.random() * homeless.length)];
      const idx1 = parseInt(c1.dataset.index);
      const h1 = parseInt(c1.dataset.home);

      const r1 = Math.floor(idx1 / gridSize);
      const col1 = idx1 % gridSize;
      const rh = Math.floor(h1 / gridSize);
      const ch = h1 % gridSize;

      const moves = [];
      if (col1 < ch) moves.push(idx1 + 1);
      if (col1 > ch) moves.push(idx1 - 1);
      if (r1 < rh) moves.push(idx1 + gridSize);
      if (r1 > rh) moves.push(idx1 - gridSize);

      if (moves.length === 0) return;

      // Move toward target
      const idx2 = moves[Math.floor(Math.random() * moves.length)];
      const c2 = circles.find(c => parseInt(c.dataset.index) === idx2);

      // This shouldn't happen in a full grid, but best to be sure
      if (!c2) return;

      const pos1 = getPos(idx1);
      const pos2 = getPos(idx2);

      c1.style.left = `${pos2.x + offset}px`;
      c1.style.top = `${pos2.y + offset}px`;
      c1.dataset.index = idx2;

      c2.style.left = `${pos1.x + offset}px`;
      c2.style.top = `${pos1.y + offset}px`;
      c2.dataset.index = idx1;
    }

    createGrid();
    setInterval(swapRandom, 60);

  </script>
</body>

</html>
