<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A 8x8 grid of white and black circles that swap places">
  <title>Swapping Circles</title>
  <style>
    :root {
      --bg-colour: #222222;
      --circle-white: #ffffff;
      --circle-black: #222222;
      --outline-colour: #ffffff;
      --grid-size: 8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      background-color: var(--bg-colour);
      overflow: hidden;
    }

    #grid-container {
      position: relative;
      display: block;
    }

    .circle {
      position: absolute;
      display: block;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid var(--outline-colour);
      text-decoration: none;
      transition:
        left 0.6s cubic-bezier(0.4, 0, 0.2, 1),
        top 0.6s cubic-bezier(0.4, 0, 0.2, 1),
        transform 0.3s ease;
      z-index: 1;
    }

    .circle.white {
      background-color: var(--circle-white);
    }

    .circle.filled-black {
      background-color: var(--circle-black);
    }

    .circle:hover {
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5));
      transform: scale(1.1);
      z-index: 10;
    }

    .no-transition .circle {
      transition: none !important;
    }

    #crt-scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.03));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>

<body>
  <div id="crt-scanlines"></div>
  <main id="grid-container"></main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('swapping-circles');

    const container = document.getElementById('grid-container');
    const circles = [];
    const gridSize = 8;
    const gap = 1;
    const circleRatio = 0.75;
    const gridMaxSize = 660;
    let circleSize;
    let cellSide;
    let offset;

    function computeSizes() {
      const winDim = Math.min(window.innerWidth, window.innerHeight);
      const availableSize = Math.max(0, winDim - 16);
      const size = Math.min(availableSize, gridMaxSize);
      cellSide = (size - (gridSize - 1) * gap) / gridSize;
      circleSize = cellSide * circleRatio;
      offset = (cellSide - circleSize) / 2;
      container.style.width = `${size}px`;
      container.style.height = `${size}px`;
      container.classList.add('no-transition');
      circles.forEach(circle => {
        circle.style.width = `${circleSize}px`;
        circle.style.height = `${circleSize}px`;
        const pos = getPos(parseInt(circle.dataset.index));
        circle.style.left = `${pos.x + offset}px`;
        circle.style.top = `${pos.y + offset}px`;
      });
      void container.offsetWidth;
      container.classList.remove('no-transition');
    }

    function getPos(index) {
      const col = index % gridSize;
      const row = Math.floor(index / gridSize);
      return {
        x: col * (cellSide + gap),
        y: row * (cellSide + gap)
      };
    }

    function createGrid() {
      const whiteHomeIndices = [];
      const blackHomeIndices = [];

      for (let i = 0; i < gridSize * gridSize; i++) {
        const row = Math.floor(i / gridSize) + 1;
        const col = (i % gridSize) + 1;
        if (row + col <= (gridSize + 1)) {
          whiteHomeIndices.push(i);
        } else {
          blackHomeIndices.push(i);
        }
      }

      // Create all circles with their home assignments
      const allCirclesData = [];
      whiteHomeIndices.forEach(home => {
        allCirclesData.push({ type: 'white', homeIndex: home });
      });
      blackHomeIndices.forEach(home => {
        allCirclesData.push({ type: 'filled-black', homeIndex: home });
      });

      // Shuffle their starting positions
      const startIndices = Array.from({ length: gridSize ** 2 }, (_, i) => i);
      for (let i = startIndices.length - 1; i > 0; i--) {
        const j = LAB.randInt(0, i);
        [startIndices[i], startIndices[j]] = [startIndices[j], startIndices[i]];
      }

      allCirclesData.forEach((data, i) => {
        const circle = document.createElement('a');
        circle.href = LAB.pageRandomiser.nextOne();
        circle.className = `circle ${data.type}`;
        const startIdx = startIndices[i];
        circle.dataset.index = startIdx;
        circle.dataset.home = data.homeIndex;

        container.appendChild(circle);
        circles.push(circle);
      });
    }

    function swapRandom() {
      const homeless = circles.filter(c => parseInt(c.dataset.index) !== parseInt(c.dataset.home));
      if (homeless.length === 0) return;

      // Pick a random homeless circle
      const c1 = LAB.sample(homeless);
      const idx1 = parseInt(c1.dataset.index);
      const h1 = parseInt(c1.dataset.home);

      const r1 = Math.floor(idx1 / gridSize);
      const col1 = idx1 % gridSize;
      const rh = Math.floor(h1 / gridSize);
      const ch = h1 % gridSize;

      const moves = [];
      if (col1 < ch) moves.push(idx1 + 1);
      if (col1 > ch) moves.push(idx1 - 1);
      if (r1 < rh) moves.push(idx1 + gridSize);
      if (r1 > rh) moves.push(idx1 - gridSize);

      if (moves.length === 0) return;

      // Move toward target
      const idx2 = LAB.sample(moves);
      const c2 = circles.find(c => parseInt(c.dataset.index) === idx2);

      // This shouldn't happen in a full grid, but best to be sure
      if (!c2) return;

      const pos1 = getPos(idx1);
      const pos2 = getPos(idx2);

      c1.style.left = `${pos2.x + offset}px`;
      c1.style.top = `${pos2.y + offset}px`;
      c1.dataset.index = idx2;

      c2.style.left = `${pos1.x + offset}px`;
      c2.style.top = `${pos1.y + offset}px`;
      c2.dataset.index = idx1;
    }

    window.addEventListener('resize', computeSizes);

    createGrid();
    computeSizes();
    setInterval(swapRandom, 60);

  </script>
</body>

</html>
