<!DOCTYPE html>
<html lang="en">

<!--
Originally this was going to be a simulation of tectonic movement.
But halfway through, I realised that it looked kind of interesting on its own.
It looks like the sort of page that might actually appear on superbad.com.
Which is an aesthetic that I haven't really replicated on many of these pages.
So actually I've not just abandoned this in the middle of prototyping.
This is an Aesthetic Choice :-)
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="throw bombs on it, throw bombs on it">
  <title>tectonic</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      background-color: #0a0a0a;
      font-family: monospace;
      overflow: hidden;
    }

    main {
      position: relative;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      display: flex;
      justify-content: center;
    }

    #world {
      position: relative;
      width: 512px;
      height: 192px;
    }

    .plate {
      position: absolute;
      display: grid;
      border: 1px solid rgba(255, 0, 255, 0.15);
      transition: left 0.8s ease, top 0.8s ease;
    }

    .plate>a,
    .plate>span {
      display: flex;
      width: 32px;
      height: 32px;
      font-size: 16px;
      text-decoration: none;
      justify-content: center;
      align-items: center;
    }

    .plate>a {
      color: #e0e0d0;
      transition: all 0.15s ease;
    }

    .plate>a:hover {
      color: #000000;
      background-color: #ff00ff;
      box-shadow: 0 0 20px #ff00ff;
      transform: scale(1.3);
      z-index: 100;
    }

    .plate>span {
      color: rgba(224, 224, 208, 0.08);
    }

    .fault-line {
      position: absolute;
      background: rgba(255, 0, 255, 0.12);
      pointer-events: none;
      z-index: 5;
    }

    #crt-scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 2px;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>

<body>
  <div id="crt-scanlines"></div>
  <main>
    <div id="world"></div>
  </main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('symbol-drift');

    const world = document.getElementById('world');
    const chars = "▲▼◀▶◆◇○●□■△▽☆★♢♤♧♡♥♦♣♠";
    const plates = [];

    // Divide screen into geographic plates
    const plateDefs = [
      { cols: 4, rows: 3, x: 0, y: 0 },
      { cols: 4, rows: 3, x: 128, y: 0 },
      { cols: 4, rows: 3, x: 256, y: 0 },
      { cols: 3, rows: 3, x: 384, y: 0 },
      { cols: 5, rows: 3, x: 0, y: 96 },
      { cols: 4, rows: 3, x: 160, y: 96 },
      { cols: 3, rows: 3, x: 288, y: 96 },
      { cols: 4, rows: 3, x: 384, y: 96 },
    ];

    function init() {
      world.replaceChildren();

      plateDefs.forEach((def, pi) => {
        const plate = document.createElement('div');
        plate.className = 'plate';
        plate.style.gridTemplateColumns = `repeat(${def.cols}, 32px)`;
        plate.style.gridTemplateRows = `repeat(${def.rows}, 32px)`;
        plate.style.left = def.x + 'px';
        plate.style.top = def.y + 'px';

        for (let y = 0; y < def.rows; y++) {
          for (let x = 0; x < def.cols; x++) {
            const isLink = (x + y + pi) % 2 === 0;
            const el = document.createElement(isLink ? 'a' : 'span');
            if (isLink) el.href = LAB.pageRandomiser.nextOne();
            el.innerText = LAB.sample(chars);
            plate.appendChild(el);
          }
        }

        world.appendChild(plate);
        plates.push({
          el: plate,
          x: def.x,
          y: def.y,
          vx: LAB.rand(-0.15, 0.15),
          vy: LAB.rand(-0.15, 0.15),
        });
      });

      // Add fault lines between plates
      plateDefs.forEach((def, i) => {
        if (i > 0) {
          const line = document.createElement('div');
          line.className = 'fault-line';
          line.style.left = def.x + 'px';
          line.style.top = '0px';
          line.style.width = '2px';
          line.style.height = '100vh';
          world.appendChild(line);
        }
      });
    }

    function tick() {
      plates.forEach(p => {
        p.x += p.vx * 0.8;
        p.y += p.vy * 0.8;

        // Bounce off edges
        if (p.x < -20 || p.x > 80) p.vx *= -1;
        if (p.y < -20 || p.y > 80) p.vy *= -1;

        p.el.style.left = p.x + 'px';
        p.el.style.top = p.y + 'px';
      });

      requestAnimationFrame(tick);
    }

    init();
    tick();

  </script>
</body>

</html>
