<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Turning and turning in the widening gyre">
  <title>rotation notation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      background-color: #080810;
      font-family: monospace;
      overflow: hidden;
    }

    main {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      z-index: 1;
    }

    .layer {
      position: absolute;
      display: grid;
      transform-origin: center center;
      pointer-events: none;
    }

    .layer>a,
    .layer>span {
      display: flex;
      justify-content: center;
      align-items: center;
      width: var(--cell, 30px);
      height: var(--cell, 30px);
      font-size: calc(var(--cell, 30px) * 0.47);
      text-decoration: none;
    }

    .layer>a {
      color: #e0e0d0;
      transition: all 0.2s ease;
      pointer-events: auto;
    }

    .layer>a:hover {
      color: #ff00ff;
      transform: scale(1.8);
      text-shadow: 0 0 15px #ff00ff;
      z-index: 20;
    }

    .layer>span {
      color: rgba(224, 224, 208, 0.15);
      pointer-events: none;
    }

    #crt-scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>

<body>
  <div id="crt-scanlines"></div>
  <main id="main"></main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('symbol-rotate');

    const main = document.getElementById('main');
    const chars = '~*+×÷±∞≈≠≤≥';

    const layers = [
      { size: 7, speed: 0.003, color: '#ff4444', opacity: 0.7 },
      { size: 9, speed: -0.002, color: '#44ff44', opacity: 0.6 },
      { size: 11, speed: 0.0015, color: '#4488ff', opacity: 0.5 },
    ];

    const maxLayerSize = Math.max(...layers.map(l => l.size));
    const layerEls = [];

    layers.forEach((cfg, li) => {
      const layer = document.createElement('div');
      layer.className = 'layer';
      layer.style.gridTemplateColumns = `repeat(${cfg.size}, var(--cell, 30px))`;
      layer.style.gridTemplateRows = `repeat(${cfg.size}, var(--cell, 30px))`;
      layer.style.left = `calc(var(--cell, 30px) * ${-cfg.size / 2})`;
      layer.style.top = `calc(var(--cell, 30px) * ${-cfg.size / 2})`;

      for (let y = 0; y < cfg.size; y++) {
        for (let x = 0; x < cfg.size; x++) {
          const isLink = (x + y) % 3 === li || (x * y) % 5 === li;
          const el = document.createElement(isLink ? 'a' : 'span');
          if (isLink) {
            el.href = LAB.pageRandomiser.nextOne();
          }
          el.innerText = chars[LAB.randIndex(chars)];
          el.style.color = isLink ? cfg.color : `rgba(224,224,208,0.12)`;
          layer.appendChild(el);
        }
      }

      main.appendChild(layer);
      layerEls.push({ el: layer, speed: cfg.speed, angle: LAB.rand(0, Math.PI * 2) });
    });

    function init() {
      const winH = window.innerHeight;
      const winW = window.innerWidth;
      const cell = Math.max(30, Math.floor(Math.min(winH, winW) * 0.94 / maxLayerSize));
      document.documentElement.style.setProperty('--cell', cell + 'px');
    }

    function tick() {
      layerEls.forEach(l => {
        l.angle += l.speed;
        l.el.style.transform = `rotate(${l.angle}rad)`;
      });
      requestAnimationFrame(tick);
    }

    function randomSpeeds() {
      layerEls.forEach(layer => {
        layer.speed = LAB.randNegToPos(0.004, 0.0005);
      });
    }

    window.addEventListener('resize', init);

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a')) randomSpeeds();
    });

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, randomSpeeds);
    });

    init();
    tick();

  </script>
</body>

</html>
