<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="cataclyzm">
  <title>symbolizm</title>
  <style>
    :root {
      --bg-colour: #050505;
      --text-colour: #00ff41;
      --highlight: #ff00ff;
      --flicker-speed: 0.12s;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-colour);
      color: var(--text-colour);
      font-family: monospace;
      overflow: hidden;
      user-select: none;
    }

    body {
      animation: flicker var(--flicker-speed) infinite alternate;
    }

    main {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
      grid-template-rows: repeat(auto-fill, minmax(80px, 1fr));
      position: relative;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    .cell {
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      border: 1px solid rgba(0, 255, 65, 0.1);
      color: var(--text-colour);
      font-size: 16px;
      text-decoration: none;
      transition: all 0.4s ease;
      overflow: hidden;
    }

    .cell:hover {
      background-color: var(--text-colour);
      color: var(--bg-colour);
      border: none;
      transform: scale(0.9) rotate(2deg);
      z-index: 10;
    }

    .cell.tilde {
      font-weight: bold;
      font-family: sans-serif;
      text-transform: uppercase;
      font-size: 24px;
    }

    .cell.tilde:hover,
    .cell.tilde.flash {
      background-color: var(--highlight);
      box-shadow: 0 0 20px var(--highlight);
      color: var(--bg-colour);
    }

    @keyframes flicker {
      0% {
        opacity: 0.8;
      }

      50% {
        opacity: 1;
      }

      100% {
        opacity: 0.9;
      }
    }

    #crt-scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
      background-size: 100% 2px, 3px 100%;
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>

<body>
  <div id="crt-scanlines"></div>
  <main id="main"></main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('symbolizm');

    const main = document.getElementById('main');

    const characters = "01$!@#%^&*()_+-=[]{}|;:,.<>?/\\";
    const cellSize = 80;

    let cellCount = 0;

    // Work out how many cells actually fit in the current viewport
    function resize() {
      const cols = Math.max(1, Math.floor(window.innerWidth / cellSize));
      const rows = Math.max(1, Math.floor(window.innerHeight / cellSize));
      cellCount = cols * rows;
      init();
    }

    // Make a bunch of cells, with tildes and non-tilde cells
    // Tildes are hyperlinks to other pages
    // Non-tilde cells are random characters
    function init() {
      main.replaceChildren();
      for (let _i = 0; _i < cellCount; _i++) {
        let cell;

        if (LAB.chance(0.1)) {
          // For tilde cells
          cell = document.createElement('a');
          cell.classList.add('tilde');
          cell.innerText = '~';
          cell.href = LAB.pageRandomiser.nextOne();

        } else {
          // For non-tilde cells
          cell = document.createElement('div');
          cell.innerText = characters[LAB.randIndex(characters)];
          cell.style.cursor = 'pointer';
        }

        cell.className += ' cell';
        cell.style.animationDelay = LAB.rand(0, 1) + 's';
        main.appendChild(cell);
      }
    }

    // Change background colour to something dark and recreate cells
    function recreate() {
      const min = 0;
      const max = 50;
      const r = LAB.randInt(min, max - 1);
      const g = LAB.randInt(min, max - 1);
      const b = LAB.randInt(min, max - 1);
      document.documentElement.style.setProperty('--bg-colour', `rgb(${r},${g},${b})`);
      init();
      flashTildes();
    }

    // Random cell updates
    function glitch() {
      const cells = document.querySelectorAll('.cell:not(.tilde)');
      const luckyCell = LAB.sample(cells);
      if (luckyCell) {
        luckyCell.innerText = characters[LAB.randIndex(characters)];
        const min = 0.3;
        const max = 1.0;
        const randomValue = LAB.rand(min, max);
        luckyCell.style.opacity = randomValue;
      }
      setTimeout(glitch, 50);
    }

    // Flash tilde cells, to hint to the user that these are special cells
    // We want them to figure out that tildes are clickable hyperlinks
    function flashTildes() {
      const tildes = document.querySelectorAll('.cell.tilde');
      tildes.forEach(t => t.classList.add('flash'));
      setTimeout(() => {
        tildes.forEach(t => t.classList.remove('flash'));
      }, 340);
    }

    window.addEventListener('resize', resize);

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a')) recreate();
    });

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, recreate);
    });

    resize();
    glitch();

  </script>
</body>

</html>
