<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="cataclyzma">
  <title>symbolizma</title>
  <style>
    body {
      background-color: #000;
      color: #0f0;
      font-family: "Courier New", Courier, monospace;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      background-image: radial-gradient(#111 1px, transparent 1px);
      background-size: 20px 20px;
    }

    #container {
      position: relative;
      width: 600px;
      height: 600px;
    }

    .shard {
      position: absolute;
      width: 50px;
      height: 50px;
      background-color: #111;
      border: 1px solid #333;
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      color: #444;
      font-size: 12px;
      transition: all 0.2s ease-in-out;
      z-index: 10;
    }

    .shard:hover {
      background-color: #ff00ff;
      color: #fff;
      border-color: #fff;
      transform: scale(1.2) rotate(5deg);
      z-index: 100;
      box-shadow: 0 0 15px #ff00ff;
    }

    .shard.corrupted {
      background-color: #00ffff;
      color: #000;
    }

    #overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
      background-size: 100% 3px, 3px 100%;
    }
  </style>
</head>

<body>
  <div id="overlay"></div>
  <div id="container"></div>

  <script src="../../common/CyclicRandomiser.js"></script>
  <script src="../../common/labyrinthPages.js"></script>
  <script>
    const currentPage = "corridors/symbolizma";
    const otherPages = labyrinthPages.filter(p => !p.includes(currentPage));
    const pageRandomiser = new CyclicRandomiser(otherPages);

    const container = document.getElementById('container');
    const chars = '!?@#$%^&*()_+-=[]{}|;:,.<>/\\0123456789';

    function createShards() {
      for (let y = 0; y < 12; y++) {
        for (let x = 0; x < 12; x++) {
          // Add some randomness to position to make it look "fragmented"
          const offsetX = (Math.random() - 0.5) * 15;
          const offsetY = (Math.random() - 0.5) * 15;

          const shard = document.createElement('a');
          shard.href = pageRandomiser.nextOne();
          shard.className = 'shard';
          shard.style.left = (x * 50 + offsetX) + 'px';
          shard.style.top = (y * 50 + offsetY) + 'px';
          shard.innerText = chars[Math.floor(Math.random() * chars.length)];

          // Randomize initial tilt
          shard.style.transform = `rotate(${(Math.random() - 0.5) * 10}deg)`;

          shard.addEventListener('mouseenter', () => {
            // Chance to "corrupt" the neighbors
            if (Math.random() > 0.7) {
              const shards = document.querySelectorAll('.shard');
              const randomShard = shards[Math.floor(Math.random() * shards.length)];
              randomShard.classList.add('corrupted');
              randomShard.innerText = '~';
              setTimeout(() => randomShard.classList.remove('corrupted'), 1000);
            }
          });

          container.appendChild(shard);
        }
      }
    }

    // Each square should drift around a bit
    function drift() {
      const shards = document.querySelectorAll('.shard');
      shards.forEach(s => {
        if (Math.random() > 0.98) {
          const currentLeft = parseFloat(s.style.left);
          const currentTop = parseFloat(s.style.top);
          s.style.left = (currentLeft + (Math.random() - 0.5) * 2) + 'px';
          s.style.top = (currentTop + (Math.random() - 0.5) * 2) + 'px';
          s.innerText = chars[Math.floor(Math.random() * chars.length)];
        }
      });
      requestAnimationFrame(drift);
    }

    createShards();
    drift();

  </script>
</body>

</html>
