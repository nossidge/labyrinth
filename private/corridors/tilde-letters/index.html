<!DOCTYPE html>
<html lang="en">

<!--
A page that cycles through the tilde town users list, displaying one name at a time.
Each username is displayed for a few seconds before being replaced with another user.
The characters they have in common are highlighted and animate to their new positions.

I genuinely thought that this would be quite an easy one to figure out.
But this code got real dodgy real quick, though I did solve it somehow :-)
I like the results a lot, it's quite hypnotic after a while.
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="We all are characters in other people's stories">
  <title>~ letters ~</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      height: 100vh;
      background-color: #000000;
      color: #e0b0ff;
      font-family: 'Courier New', Courier, monospace;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #main {
      display: flex;
      position: relative;
      width: 100%;
      min-height: 10vw;
      font-size: 6vw;
      font-weight: normal;
      text-align: center;
      justify-content: center;
      align-items: center;
    }

    #main a {
      display: inline-block;
      color: inherit;
      text-decoration: none;
    }

    #main span {
      display: inline-block;
      transition: opacity 1.5s ease-in-out, left 1.5s ease-in-out;
    }

    .highlight {
      animation: colorFade 1500ms ease-in-out forwards;
    }

    .fading-in {
      animation: fadeIn 1500ms ease-in-out forwards;
    }

    @keyframes colorFade {
      0% {
        color: #e0b0ff;
        font-size: 6vw;
      }

      50% {
        color: #ffffff;
        font-size: 8vw;
      }

      100% {
        color: #e0b0ff;
        font-size: 6vw;
      }
    }

    @keyframes fadeIn {
      0% {
        color: #000000;
      }

      100% {
        color: #e0b0ff;
      }
    }

    .crt-scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.04) 0 1px, transparent 1px 3px),
        radial-gradient(circle at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.55));
      z-index: 100;
    }
  </style>
</head>

<body>
  <div class="crt-scanlines"></div>
  <main id="main">
    <a id="userlink" href="../index.html"></a>
  </main>

  <script src="../../common/labyrinth.js"></script>
  <script src="../../common/tilde-town-users.js"></script>
  <script>
    const LAB = new Labyrinth('tilde-letters');

    const main = document.getElementById('main');
    const userlink = document.getElementById('userlink');

    const TRANSITION_DURATION = 1500;
    const INTERVAL_DURATION = 4000;

    let currentUser = null;
    let intervalId = null;
    let transitionInProgress = false;
    let pendingResume = false;

    const cleanUser = (user) => user.replace('~', '');

    // If we always look for lots of letters in common, we'll never pick shorter names.
    // So occasionally drop the threshold down.
    function lettersToMatch() {
      const percent = LAB.randInt(1, 100);
      if (percent < 10) return 1;
      else if (percent < 20) return 2;
      else if (percent < 30) return 3;
      else if (percent < 40) return 4;
      else return 5;
    }

    function selectNextUser(previousUser) {
      const previousChars = new Set(cleanUser(previousUser).toLowerCase());
      for (let threshold = lettersToMatch(); threshold >= 1; threshold--) {
        const candidates = tildeTownUsers.filter(user => {
          if (user === previousUser) return false;
          const userChars = new Set(user.toLowerCase());
          let commonCount = 0;
          for (const char of userChars) {
            if (previousChars.has(char)) {
              commonCount++;
              if (commonCount >= threshold) return true;
            }
          }
          return false;
        });
        if (candidates.length > 0) {
          return LAB.sample(candidates);
        }
      }
      return LAB.sample(tildeTownUsers);
    }

    // letterSpans[i] is the span for currentUser[i]
    let letterSpans = [];

    function makeSpan(char) {
      const span = document.createElement('span');
      span.textContent = char;
      return span;
    }

    // Where each letter of `text` belongs, measured from a hidden copy.
    // This is relative to `#main`.
    function measureLayout(text) {
      const mainRect = main.getBoundingClientRect();
      const temp = document.createElement('div');
      temp.id = 'main';
      temp.style.position = 'absolute';
      temp.style.top = `${mainRect.top}px`;
      temp.style.left = `${mainRect.left}px`;
      temp.style.visibility = 'hidden';
      const spans = text.split('').map(makeSpan);
      spans.forEach(s => temp.appendChild(s));
      document.body.appendChild(temp);
      const positions = spans.map(s => {
        const r = s.getBoundingClientRect();
        return { left: r.left - mainRect.left, top: r.top - mainRect.top };
      });
      document.body.removeChild(temp);
      return positions;
    }

    // Jump a span to a position with no animation.
    function snapSpan(span, pos) {
      span.style.transition = 'none';
      span.style.position = 'absolute';
      span.style.left = `${pos.left}px`;
      span.style.top = `${pos.top}px`;
    }

    // Get rid of the styles so the snaps above are committed, then re-enable transitions.
    function releaseSnaps(spans) {
      void main.offsetWidth;
      spans.forEach(s => { s.style.transition = ''; });
    }

    // Put every current letter where it belongs.
    function resizeLayout() {
      if (!currentUser || transitionInProgress) return;
      const positions = measureLayout(currentUser);
      letterSpans.forEach((span, i) => snapSpan(span, positions[i]));
      releaseSnaps(letterSpans);
    }

    function renderUser(newUser, oldUser = null) {
      // First user gets a cool scroll-in effect.
      if (!oldUser) {
        const positions = measureLayout(newUser);
        userlink.replaceChildren();
        letterSpans = newUser.split('').map((char, i) => {
          const span = makeSpan(char);
          snapSpan(span, positions[i]);
          span.style.opacity = 0;
          userlink.appendChild(span);
          return span;
        });
        releaseSnaps(letterSpans);
        letterSpans.forEach((span, i) => {
          setTimeout(() => span.style.opacity = 1, i * 100);
        });
        return;
      }

      transitionInProgress = true;

      const oldSpans = letterSpans.slice();
      const oldPos = measureLayout(oldUser);
      const newPos = measureLayout(newUser);

      const oldChars = oldUser.split('').map((char, index) => ({ char: char.toLowerCase(), index }));
      const newChars = newUser.split('').map((char, index) => ({ char: char.toLowerCase(), index }));
      const commonMapping = new Map();
      const usedNewIndices = new Set();
      for (const oldChar of oldChars) {
        const match = newChars.find(nc => nc.char === oldChar.char && !usedNewIndices.has(nc.index));
        if (match) {
          commonMapping.set(oldChar.index, match.index);
          usedNewIndices.add(match.index);
        }
      }

      main.style.height = `${main.offsetHeight}px`;
      main.style.display = 'block';

      // Start every old letter from its starting home location.
      oldSpans.forEach((span, i) => {
        span.classList.remove('fading-in');
        snapSpan(span, oldPos[i]);
      });
      releaseSnaps(oldSpans);

      // Slide the shared letters to their new spot, fade out the rest.
      oldSpans.forEach((span, i) => {
        if (commonMapping.has(i)) {
          span.classList.add('highlight');
          span.style.left = `${newPos[commonMapping.get(i)].left}px`;
        } else {
          span.style.opacity = 0;
        }
      });

      // Drop old letters, fade new ones in, then snap everything to its exact final position.
      // Older code was dependant on the animation, which borked on page resize and tab hiding.
      setTimeout(() => {
        oldSpans.forEach((span, i) => {
          if (commonMapping.has(i)) span.classList.remove('highlight');
          else span.remove();
        });

        main.style.display = 'flex';
        main.style.height = '';

        const finalPos = measureLayout(newUser);
        const nextSpans = new Array(newUser.length);
        commonMapping.forEach((newIdx, oldIdx) => { nextSpans[newIdx] = oldSpans[oldIdx]; });
        for (let i = 0; i < nextSpans.length; i++) {
          if (!nextSpans[i]) {
            const span = makeSpan(newUser[i]);
            span.classList.add('fading-in');
            nextSpans[i] = span;
          }
          snapSpan(nextSpans[i], finalPos[i]);
        }
        userlink.replaceChildren(...nextSpans);
        letterSpans = nextSpans;
        releaseSnaps(letterSpans);

        transitionInProgress = false;
        if (pendingResume && !document.hidden) {
          pendingResume = false;
          startInterval();
        }
      }, TRANSITION_DURATION);
    }

    function startInterval() {
      if (intervalId !== null) return;
      intervalId = setInterval(cycle, INTERVAL_DURATION);
    }

    function stopInterval() {
      if (intervalId !== null) {
        clearInterval(intervalId);
        intervalId = null;
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopInterval();
      } else if (transitionInProgress) {
        pendingResume = true;
      } else {
        pendingResume = false;
        resizeLayout();
        startInterval();
      }
    });

    // Snap letters to their exact spots if the window size changes.
    window.addEventListener('resize', resizeLayout);

    function cycle() {
      if (transitionInProgress) return;
      const oldUser = currentUser;
      const newUser = oldUser ? selectNextUser(oldUser) : LAB.sample(tildeTownUsers);
      currentUser = newUser;
      userlink.href = LAB.pageRandomiser.nextOne();
      renderUser(newUser, oldUser);
    }

    cycle();

    // Account for if the page is loaded in a background tab.
    if (!document.hidden) startInterval();

  </script>
</body>

</html>
