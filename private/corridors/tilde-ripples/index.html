<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="I have ripples, Greg">
  <title>~ ripples ~</title>
  <style>
    :root {
      --tilde-color: #e0b0ff;
      --bg-color: #000000;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      font-family: monospace;
      overflow: hidden;
      touch-action: none;
    }

    main {
      display: grid;
      width: fit-content;
      height: fit-content;
      padding: 0;
    }

    .tilde-cell {
      display: flex;
      position: relative;
      justify-content: center;
      align-items: center;
      width: var(--cell-w);
      height: var(--cell-h);
      color: var(--tilde-color);
      font-size: var(--font-size, 24px);
      font-weight: bold;
      text-decoration: none;
      transition: color 0.1s ease;
      user-select: none;
      -webkit-user-drag: none;
    }

    .tilde-cell span {
      display: block;
      transform: scale(var(--scale, 1));
      will-change: transform;
      /* Chrome fix for blurry text on transform */
      backface-visibility: hidden;
      -webkit-font-smoothing: antialiased;
      transform-style: preserve-3d;
    }

    /* I noticed this looked a bit dodgy in Chrome */
    /* Apparently `will-change` can cause a blur by creating a low-res buffer */
    /* So this @media rule overrides `will-change` for Chrome/Blink browsers only */
    @media screen and (-webkit-min-device-pixel-ratio: 0) {
      .tilde-cell span {
        will-change: auto;
      }
    }

    .tilde-cell:hover {
      color: #ffffff;
      z-index: 100;
    }

    .grain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC42NSIgbnVtT2N0YXZlcz0iMyIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIvPjwvc3ZnPg==');
      opacity: 0.05;
      pointer-events: none;
      z-index: 1000;
    }
  </style>
</head>

<body>
  <div class="grain"></div>
  <main id="main"></main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('tilde-ripples');

    const main = document.getElementById('main');

    // Limits for responsive scaling
    const MAX_CELL_SIZE = 40;
    const MIN_CELL_SIZE = 8;
    const TARGET_CELL_SIZE = 32;

    const HIGHLIGHT_SCALE_FACTOR = 3.5;
    const RIPPLE_DECAY_RATE = 0.015;
    const RIPPLE_SPREAD_DELAY = 80;
    const HOLD_RIPPLE_INTERVAL = 150;
    const HOLD_DELAY = 250;

    // Max grid (landscape screens) and min grid (portrait screens)
    const GRID_WIDTH = 40;
    const GRID_HEIGHT = 25;
    const MIN_GRID_WIDTH = 8;
    const MIN_GRID_HEIGHT = 5;

    let gridW = GRID_WIDTH;
    let gridH = GRID_HEIGHT;
    let strengths = new Float32Array(gridW * gridH);

    const elements = [];
    let cellSize = MIN_CELL_SIZE;

    function computeLayout() {
      const isPortrait = window.innerHeight > window.innerWidth;

      // Less margin on portrait
      const margin = isPortrait ? 0.05 : 0.15;

      const availableW = window.innerWidth * (1 - margin * 2);
      const availableH = window.innerHeight * (1 - margin * 2);

      // Fit the grid's aspect to the screen's aspect
      const cols = Math.min(
        GRID_WIDTH,
        Math.max(MIN_GRID_WIDTH, Math.round(availableW / TARGET_CELL_SIZE))
      );
      const rows = Math.min(
        GRID_HEIGHT,
        Math.max(MIN_GRID_HEIGHT, Math.round(availableH / TARGET_CELL_SIZE))
      );

      // Keep the cells square, don't let them get microscopic
      let cell = Math.min(availableW / cols, availableH / rows, MAX_CELL_SIZE);
      cell = Math.max(cell, MIN_CELL_SIZE);

      return { cols, rows, cell };
    }

    function resize() {
      const layout = computeLayout();

      if (layout.cols !== gridW || layout.rows !== gridH) {
        gridW = layout.cols;
        gridH = layout.rows;
        init(layout.cell);
        return;
      }

      applyCellSize(layout.cell);
    }

    function init(cell) {
      main.replaceChildren();
      elements.length = 0;
      strengths = new Float32Array(gridW * gridH);

      for (let y = 0; y < gridH; y++) {
        for (let x = 0; x < gridW; x++) {
          const a = document.createElement('a');
          a.className = 'tilde-cell';
          a.href = LAB.pageRandomiser.nextOne();

          const span = document.createElement('span');
          span.textContent = '~';
          a.appendChild(span);

          a.addEventListener('mouseenter', () => {
            triggerRipple(x, y, 1);
          });

          main.appendChild(a);
          elements.push(span);
        }
      }
      applyCellSize(cell);
    }

    function applyCellSize(size) {
      cellSize = size;

      main.style.gridTemplateColumns = `repeat(${gridW}, ${size}px)`;
      main.style.gridTemplateRows = `repeat(${gridH}, ${size}px)`;

      main.style.setProperty('--cell-w', `${size}px`);
      main.style.setProperty('--cell-h', `${size}px`);
      main.style.setProperty('--font-size', `${size * 0.96}px`);
    }

    function triggerRipple(x, y, strength = 1) {
      if (x < 0 || x >= gridW || y < 0 || y >= gridH) return;

      const index = y * gridW + x;
      if (strengths[index] < strength) {
        strengths[index] = strength;

        // Spread to Moore neighbourhood cells
        setTimeout(() => {
          const nextStrength = strength * 0.75;
          if (nextStrength < 0.1) return;

          // 8-neighbour expansion
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              if (dx === 0 && dy === 0) continue;
              triggerRipple(x + dx, y + dy, nextStrength);
            }
          }
        }, RIPPLE_SPREAD_DELAY);
      }
    }

    function tick() {
      for (let i = 0; i < strengths.length; i++) {
        if (strengths[i] > 0) {
          strengths[i] -= RIPPLE_DECAY_RATE;
          if (strengths[i] < 0) strengths[i] = 0;

          const scale = 1 + (HIGHLIGHT_SCALE_FACTOR - 1) * strengths[i];
          elements[i].style.setProperty('--scale', scale);
        }
      }
      requestAnimationFrame(tick);
    }

    // Prevent default drag behaviour on the tildes
    document.addEventListener('dragstart', (e) => e.preventDefault());

    // Touch stuff: hold to ripple, tap to navigate
    let holdTimer = null;
    let holdInterval = null;
    let lastPoint = null;
    let lastCellKey = null;
    let wasHold = false;
    let suppressClick = false;

    function gridPosFromClient(clientX, clientY) {
      const rect = main.getBoundingClientRect();
      const x = Math.floor((clientX - rect.left) / cellSize);
      const y = Math.floor((clientY - rect.top) / cellSize);
      return {
        x: Math.max(0, Math.min(gridW - 1, x)),
        y: Math.max(0, Math.min(gridH - 1, y))
      };
    }

    function rippleAt(clientX, clientY) {
      const p = gridPosFromClient(clientX, clientY);
      lastPoint = p;
      lastCellKey = p.x + ',' + p.y;
      triggerRipple(p.x, p.y, 1);
    }

    function clearHold() {
      if (holdTimer) {
        clearTimeout(holdTimer);
        holdTimer = null;
      }
      if (holdInterval) {
        clearInterval(holdInterval);
        holdInterval = null;
      }
    }

    main.addEventListener('touchstart', (e) => {
      const t = e.touches[0];
      if (!t) return;
      rippleAt(t.clientX, t.clientY);
      holdTimer = setTimeout(() => {
        wasHold = true;
        holdInterval = setInterval(() => {
          if (lastPoint) triggerRipple(lastPoint.x, lastPoint.y, 1);
        }, HOLD_RIPPLE_INTERVAL);
      }, HOLD_DELAY);
    }, { passive: true });

    main.addEventListener('touchmove', (e) => {
      const t = e.touches[0];
      if (!t) return;
      const p = gridPosFromClient(t.clientX, t.clientY);
      const key = p.x + ',' + p.y;
      if (key !== lastCellKey) {
        lastPoint = p;
        lastCellKey = key;
        triggerRipple(p.x, p.y, 1);
      }
    }, { passive: true });

    function endTouch(e) {
      clearHold();
      if (wasHold) {
        wasHold = false;
        suppressClick = true;
        e.preventDefault();
      }
    }
    main.addEventListener('touchend', endTouch, { passive: false });
    main.addEventListener('touchcancel', endTouch, { passive: false });

    // Block navigation if the previous touch was a hold
    main.addEventListener('click', (e) => {
      if (suppressClick) {
        suppressClick = false;
        e.preventDefault();
        e.stopPropagation();
      }
    }, true);

    window.addEventListener('resize', resize);

    requestAnimationFrame(tick);

    resize();

  </script>
</body>

</html>
