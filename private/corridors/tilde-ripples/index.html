<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shake, tilde & roll">
  <title>~ ripples ~</title>
  <style>
    :root {
      --tilde-color: #e0b0ff;
      --bg-color: #000;
    }

    * {
      box-sizing: border-box;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      overflow: hidden;
      font-family: monospace;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #grid-container {
      display: grid;
      width: fit-content;
      height: fit-content;
      padding: 0;
    }

    .tilde-cell {
      display: flex;
      justify-content: center;
      align-items: center;
      text-decoration: none;
      color: var(--tilde-color);
      font-size: var(--font-size, 24px);
      font-weight: bold;
      transition: color 0.1s ease;
      position: relative;
      user-select: none;
      -webkit-user-drag: none;
      width: var(--cell-w);
      height: var(--cell-h);
    }

    .tilde-cell span {
      display: block;
      transform: scale(var(--scale, 1));
      will-change: transform;
      /* Chrome fix for blurry text on transform */
      backface-visibility: hidden;
      -webkit-font-smoothing: antialiased;
      transform-style: preserve-3d;
    }

    /* I noticed this looked a bit dodgy in Chrome */
    /* Apparently `will-change` can cause a blur by creating a low-res buffer */
    /* So this @media rule overrides `will-change` for Chrome/Blink browsers only */
    @media screen and (-webkit-min-device-pixel-ratio: 0) {
      .tilde-cell span {
        will-change: auto;
      }
    }

    .tilde-cell:hover {
      color: #fff;
      z-index: 100;
    }

    .grain {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC42NSIgbnVtT2N0YXZlcz0iMyIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIvPjwvc3ZnPg==');
      opacity: 0.05;
      z-index: 1000;
    }
  </style>
</head>

<body>
  <div class="grain"></div>
  <div id="grid-container"></div>

  <script src="../../common/CyclicRandomiser.js"></script>
  <script src="../../common/labyrinthPages.js"></script>
  <script>
    const GRID_WIDTH = 40;
    const GRID_HEIGHT = 25;

    // Limits for responsive scaling
    const MAX_CELL_SIZE = 40;
    const MIN_CELL_SIZE = 8;

    const HIGHLIGHT_SCALE_FACTOR = 3.5;
    const RIPPLE_DECAY_RATE = 0.015;
    const RIPPLE_SPREAD_DELAY = 80;

    const gridContainer = document.getElementById('grid-container');
    let strengths = new Float32Array(GRID_WIDTH * GRID_HEIGHT);
    const elements = [];

    // Navigation setup
    const currentPage = "corridors/tilde-ripples";
    const otherPages = labyrinthPages.filter(p => !p.includes(currentPage));
    const pageRandomiser = new CyclicRandomiser(otherPages);

    // Initialize grid
    function initGrid() {
      gridContainer.innerHTML = '';
      elements.length = 0;
      strengths = new Float32Array(GRID_WIDTH * GRID_HEIGHT);

      for (let y = 0; y < GRID_HEIGHT; y++) {
        for (let x = 0; x < GRID_WIDTH; x++) {
          const a = document.createElement('a');
          a.className = 'tilde-cell';
          a.href = pageRandomiser.nextOne();

          const span = document.createElement('span');
          span.textContent = '~';
          a.appendChild(span);

          a.addEventListener('mouseenter', () => {
            triggerRipple(x, y, 1);
          });

          a.addEventListener('click', (e) => {
            triggerRipple(x, y, 1.5);
          });

          gridContainer.appendChild(a);
          elements.push(span);
        }
      }
      updateLayout();
    }

    function updateLayout() {
      const isPortrait = window.innerHeight > window.innerWidth;

      // Calculate margins: less margin on portrait
      const horizontalMargin = isPortrait ? 0.05 : 0.15;
      const verticalMargin = isPortrait ? 0.05 : 0.15;

      const availableW = window.innerWidth * (1 - horizontalMargin * 2);
      const availableH = window.innerHeight * (1 - verticalMargin * 2);

      // We want to keep the cells square, or at least consistent
      let cellSize = Math.min(
        availableW / GRID_WIDTH,
        availableH / GRID_HEIGHT,
        MAX_CELL_SIZE
      );

      // Don't let it get microscopic
      cellSize = Math.max(cellSize, MIN_CELL_SIZE);

      const cellW = cellSize;
      const cellH = cellSize;
      const fontSize = cellSize * 0.96;

      gridContainer.style.gridTemplateColumns = `repeat(${GRID_WIDTH}, ${cellW}px)`;
      gridContainer.style.gridTemplateRows = `repeat(${GRID_HEIGHT}, ${cellH}px)`;

      gridContainer.style.setProperty('--cell-w', `${cellW}px`);
      gridContainer.style.setProperty('--cell-h', `${cellH}px`);
      gridContainer.style.setProperty('--font-size', `${fontSize}px`);
    }

    function triggerRipple(x, y, strength = 1) {
      if (x < 0 || x >= GRID_WIDTH || y < 0 || y >= GRID_HEIGHT) return;

      const index = y * GRID_WIDTH + x;
      if (strengths[index] < strength) {
        strengths[index] = strength;

        // Spread to Moore neighborhood cells
        setTimeout(() => {
          const nextStrength = strength * 0.75;
          if (nextStrength < 0.1) return;

          // 8-neighbor expansion
          for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
              if (dx === 0 && dy === 0) continue;
              triggerRipple(x + dx, y + dy, nextStrength);
            }
          }
        }, RIPPLE_SPREAD_DELAY);
      }
    }

    function update() {
      for (let i = 0; i < strengths.length; i++) {
        if (strengths[i] > 0) {
          // Decaying strength
          strengths[i] -= RIPPLE_DECAY_RATE;
          if (strengths[i] < 0) strengths[i] = 0;

          // Update CSS variable for scale
          const scale = 1 + (HIGHLIGHT_SCALE_FACTOR - 1) * strengths[i];
          elements[i].style.setProperty('--scale', scale);
        }
      }
      requestAnimationFrame(update);
    }

    initGrid();
    window.addEventListener('resize', updateLayout);
    requestAnimationFrame(update);

    // Prevent default drag behavior on the tildes
    document.addEventListener('dragstart', (e) => e.preventDefault());

  </script>
</body>

</html>
