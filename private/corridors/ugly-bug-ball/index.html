<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="I've got nobody to hug, I'm such an ugly bug">
  <title>The Ugly Bug Ball</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: monospace;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Disco ball */
    .disco-ball-wrap {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .disco-string {
      width: 4px;
      height: 30px;
      background: #888888;
    }

    .disco-ball {
      position: relative;
      width: 64px;
      height: 64px;
    }

    .disco-ball span {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: 64px;
      line-height: 1;
      animation: spin-ball 4s linear infinite;
      filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.5));
    }

    .disco-ball span:nth-child(2) {
      animation-delay: -0.5s;
    }

    .disco-ball span:nth-child(3) {
      animation-delay: -1s;
    }

    .disco-ball span:nth-child(4) {
      animation-delay: -1.5s;
    }

    .disco-ball span:nth-child(5) {
      animation-delay: -2s;
    }

    .disco-ball span:nth-child(6) {
      animation-delay: -2.5s;
    }

    .disco-ball span:nth-child(7) {
      animation-delay: -3s;
    }

    .disco-ball span:nth-child(8) {
      animation-delay: -3.5s;
    }

    @keyframes spin-ball {
      0% {
        transform: rotateY(0deg);
      }

      100% {
        transform: rotateY(360deg);
      }
    }

    /* Light beams from disco ball */
    .light-beams {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .beam {
      position: absolute;
      top: -20px;
      width: 0;
      height: 0;
      border-left: 30px solid transparent;
      border-right: 30px solid transparent;
      border-top: 120vh solid var(--beam-color);
      opacity: 0.15;
      transform-origin: top center;
      animation: beam-sweep 6s ease-in-out infinite alternate;
    }

    .beam:nth-child(1) {
      left: 10%;
      --beam-color: #ff00ff;
      animation-delay: 0s;
    }

    .beam:nth-child(2) {
      left: 25%;
      --beam-color: #00ffff;
      animation-delay: -0.8s;
    }

    .beam:nth-child(3) {
      left: 40%;
      --beam-color: #ffff00;
      animation-delay: -1.6s;
    }

    .beam:nth-child(4) {
      left: 55%;
      --beam-color: #ff00ff;
      animation-delay: -2.4s;
    }

    .beam:nth-child(5) {
      left: 70%;
      --beam-color: #00ff00;
      animation-delay: -3.2s;
    }

    .beam:nth-child(6) {
      left: 85%;
      --beam-color: #00ffff;
      animation-delay: -4.0s;
    }

    @keyframes beam-sweep {
      0% {
        transform: rotate(-15deg);
        opacity: 0.1;
      }

      50% {
        opacity: 0.25;
      }

      100% {
        transform: rotate(15deg);
        opacity: 0.1;
      }
    }

    /* Dance floor */
    .dance-floor {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65%;
      display: grid;
      grid-template-columns: repeat(var(--floor-cols), 1fr);
      grid-template-rows: repeat(var(--floor-rows), 1fr);
      gap: 2px;
      padding: 2px;
      z-index: 2;
      perspective: 600px;
      transform: rotateX(25deg);
      transform-origin: bottom center;
    }

    .floor-tile {
      background: #222;
      border: 1px solid #333;
      animation: tile-glow 2s ease-in-out infinite;
    }

    @keyframes tile-glow {

      0%,
      100% {
        background: var(--tile-c1);
      }

      50% {
        background: var(--tile-c2);
      }
    }

    /* Bug container (on top of floor) */
    .bug-zone {
      position: fixed;
      bottom: 5%;
      left: 0;
      width: 100%;
      height: 55%;
      z-index: 5;
      pointer-events: none;
    }

    /* Individual dancing bug */
    .dancer {
      position: absolute;
      text-decoration: none;
      font-size: 36px;
      pointer-events: auto;
      animation-duration: var(--dance-speed, 1s);
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.3));
      transition: transform 0.2s;
    }

    .dancer:hover {
      filter: drop-shadow(0 0 14px #ffffff);
      z-index: 100;
    }

    .dancer.face-right {
      scale: -1 1;
    }

    /* Paired bugs container */
    .pair {
      position: absolute;
      display: flex;
      gap: 6px;
      align-items: center;
      pointer-events: none;
    }

    .pair .dancer {
      position: relative;
    }

    /* Dance animations */
    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      25% {
        transform: translateY(-14px) rotate(-8deg);
      }

      75% {
        transform: translateY(-14px) rotate(8deg);
      }
    }

    @keyframes wiggle {

      0%,
      100% {
        transform: rotate(0deg);
      }

      25% {
        transform: rotate(-18deg);
      }

      75% {
        transform: rotate(18deg);
      }
    }

    @keyframes hop {

      0%,
      100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-20px) scale(1.15);
      }
    }

    @keyframes sway {

      0%,
      100% {
        transform: translateX(0) rotate(0deg);
      }

      25% {
        transform: translateX(-10px) rotate(-10deg);
      }

      75% {
        transform: translateX(10px) rotate(10deg);
      }
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.25);
      }
    }

    @keyframes groove {

      0%,
      100% {
        transform: translateY(0) rotate(0deg) scale(1);
      }

      25% {
        transform: translateY(-8px) rotate(-12deg) scale(1.1);
      }

      50% {
        transform: translateY(0) rotate(0deg) scale(1);
      }

      75% {
        transform: translateY(-8px) rotate(12deg) scale(1.1);
      }
    }

    /* Pair-level animations */
    @keyframes pair-sway {

      0%,
      100% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(12px);
      }
    }

    @keyframes pair-bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    #crt-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.03));
      background-size: 100% 2px, 3px 100%;
    }
  </style>
</head>

<body>
  <div id="crt-overlay"></div>

  <!-- Disco ball, really hacky but I like it :-) -->
  <a class="disco-ball-wrap" href="../index.html">
    <div class="disco-string"></div>
    <div class="disco-ball">
      <span>🪩</span>
      <span>🪩</span>
      <span>🪩</span>
      <span>🪩</span>
      <span>🪩</span>
      <span>🪩</span>
      <span>🪩</span>
      <span>🪩</span>
    </div>
  </a>

  <!-- Light beams -->
  <div class="light-beams">
    <div class="beam"></div>
    <div class="beam"></div>
    <div class="beam"></div>
    <div class="beam"></div>
    <div class="beam"></div>
    <div class="beam"></div>
  </div>

  <!-- Dance floor tiles -->
  <div class="dance-floor" id="dance-floor"></div>

  <!-- Bug zone -->
  <div class="bug-zone" id="bug-zone"></div>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('ugly-bug-ball');

    // Floor tiles
    const floorEl = document.getElementById('dance-floor');
    const neonColors = [
      ['#ff00ff', '#ff44aa'],
      ['#00ffff', '#0088ff'],
      ['#ffff00', '#ff8800'],
      ['#00ff00', '#00cc88'],
      ['#ff0066', '#ff00ff'],
      ['#8800ff', '#ff00ff'],
      ['#00ffcc', '#00ff66'],
      ['#ff4400', '#ffcc00'],
    ];

    const soloBugCount = 16;
    const pairBugCount = 8;

    // These are set here, and referenced in the CSS
    const floorCols = 8;
    const floorRows = 4;
    floorEl.style.setProperty('--floor-cols', floorCols);
    floorEl.style.setProperty('--floor-rows', floorRows);

    for (let row = 0; row < floorRows; row++) {
      for (let col = 0; col < floorCols; col++) {
        const tile = document.createElement('div');
        tile.className = 'floor-tile';
        const pair = LAB.sample(neonColors);
        tile.style.setProperty('--tile-c1', pair[0]);
        tile.style.setProperty('--tile-c2', pair[1]);
        tile.style.animationDelay = '-' + (LAB.rand(0, 2)).toFixed(2) + 's';
        tile.style.animationDuration = LAB.rand(1.5, 3).toFixed(2) + 's';
        floorEl.appendChild(tile);
      }
    }

    // Bugs
    const bugs = ['🐛', '🐜', '🐝', '🐞', '🦗', '🪲', '🪳', '🦟', '🪰', '🪱', '🐌', '🕷️', '🦋', '🦂'];
    const dances = ['bounce', 'wiggle', 'hop', 'sway', 'spin', 'pulse', 'groove'];
    const bugZone = document.getElementById('bug-zone');

    function pickDance() { return LAB.sample(dances); }
    function pickBug() { return LAB.sample(bugs); }
    function bugFontSize() { return LAB.rand(50, 70).toFixed(0) + 'px' }

    // Pre-calculate positions that don't overlap
    const MIN_DIST = 10; // minimum distance in % between spawn points
    function generatePositions(count, xMin, xMax, yMin, yMax) {
      const placed = [];
      const maxAttempts = 100;
      for (let i = 0; i < count; i++) {
        let best = null;
        let bestMinDist = -1;
        for (let attempt = 0; attempt < maxAttempts; attempt++) {
          const x = LAB.rand(xMin, xMax);
          const y = LAB.rand(yMin, yMax);
          let nearest = Infinity;
          for (const p of placed) {
            const d = Math.sqrt((x - p.x) ** 2 + (y - p.y) ** 2);
            if (d < nearest) nearest = d;
          }
          if (nearest >= MIN_DIST) {
            best = { x, y };
            break;
          }
          if (nearest > bestMinDist) {
            bestMinDist = nearest;
            best = { x, y };
          }
        }
        placed.push(best);
      }
      return placed;
    }

    function makeSoloDancer(emoji, x, y) {
      const a = document.createElement('a');
      a.href = LAB.pageRandomiser.nextOne();
      a.className = (LAB.chance(0.5)) ? 'dancer' : 'dancer face-right';
      a.textContent = emoji;
      a.style.left = x + '%';
      a.style.top = y + '%';
      a.style.animationName = pickDance();
      a.style.setProperty('--dance-speed', LAB.rand(0.6, 1.8).toFixed(2) + 's');
      a.style.animationDelay = '-' + LAB.rand(0, 2).toFixed(2) + 's';
      a.style.fontSize = bugFontSize();
      return a;
    }

    function makePair(bug1, bug2, x, y) {
      const container = document.createElement('div');
      container.className = 'pair';
      container.style.left = x + '%';
      container.style.top = y + '%';
      const pairAnims = ['pair-sway', 'pair-bounce'];
      container.style.animationName = LAB.sample(pairAnims);
      container.style.animationDuration = LAB.rand(1, 2).toFixed(2) + 's';
      container.style.animationIterationCount = 'infinite';
      container.style.animationTimingFunction = 'ease-in-out';
      container.style.animationDelay = '-' + LAB.rand(0, 2).toFixed(2) + 's';

      const size = bugFontSize();

      const a1 = document.createElement('a');
      a1.href = LAB.pageRandomiser.nextOne();
      a1.className = 'dancer face-right';
      a1.textContent = bug1;
      a1.style.animationName = pickDance();
      a1.style.setProperty('--dance-speed', LAB.rand(0.6, 1.4).toFixed(2) + 's');
      a1.style.fontSize = size;

      const a2 = document.createElement('a');
      a2.href = LAB.pageRandomiser.nextOne();
      a2.className = 'dancer';
      a2.textContent = bug2;
      a2.style.animationName = pickDance();
      a2.style.setProperty('--dance-speed', LAB.rand(0.6, 1.4).toFixed(2) + 's');
      a2.style.fontSize = size;

      container.appendChild(a1);
      container.appendChild(a2);
      return container;
    }

    function populateBugs() {
      bugZone.innerHTML = '';
      const positions = generatePositions(soloBugCount + pairBugCount, 5, 85, 5, 80);
      for (let i = 0; i < soloBugCount; i++) {
        const p = positions[i];
        bugZone.appendChild(makeSoloDancer(pickBug(), p.x, p.y));
      }
      for (let i = 0; i < pairBugCount; i++) {
        const p = positions[soloBugCount + i];
        bugZone.appendChild(makePair(pickBug(), pickBug(), p.x, p.y));
      }
    }

    populateBugs();

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a')) {
        populateBugs();
      }
    });

  </script>
</body>

</html>
