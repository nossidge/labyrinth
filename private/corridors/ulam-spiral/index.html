<!DOCTYPE html>
<html lang="en">

<!--
https://en.wikipedia.org/wiki/Ulam_spiral
Write the integers in a square spiral, light up the primes, and mysterious
diagonal streaks appear. Stanislaw Ulam doodled this during a dull lecture.
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Miss Jean Brodie">
  <title>Optimus</title>
  <style>
    :root {
      --bg-colour: #04060a;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-colour);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #main {
      display: grid;
      gap: 1px;
    }

    .cell {
      width: var(--cell);
      height: var(--cell);
    }

    .composite {
      background: var(--bg-colour);
    }

    .prime {
      display: block;
      text-decoration: none;
      border-radius: 50%;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .prime:hover {
      transform: scale(1.8);
      box-shadow: 0 0 12px currentColor;
      z-index: 10;
    }

    #crt-scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 100;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%),
        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 255, 0, 0.03));
      background-size: 100% 2px, 3px 100%;
    }
  </style>
</head>

<body>
  <div id="crt-scanlines"></div>
  <main id="main"></main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('ulam-spiral');

    const main = document.getElementById('main');
    let primeCells = [];
    let twinkleIndex = 0;
    let lastGridSize = 0;

    function sieve(max) {
      const isPrime = new Uint8Array(max + 1).fill(1);
      isPrime[0] = isPrime[1] = 0;
      for (let p = 2; p * p <= max; p++) {
        if (isPrime[p]) {
          for (let m = p * p; m <= max; m += p) isPrime[m] = 0;
        }
      }
      return isPrime;
    }

    function spiral(n) {
      const arr = Array.from({ length: n }, () => new Array(n).fill(0));
      let x = Math.floor(n / 2), y = Math.floor(n / 2);
      let num = 1;
      arr[y][x] = num++;
      const dirs = [[1, 0], [0, -1], [-1, 0], [0, 1]]; // right, up, left, down
      let d = 0, step = 1;
      while (num <= n * n) {
        for (let twice = 0; twice < 2 && num <= n * n; twice++) {
          const [dx, dy] = dirs[d % 4];
          for (let s = 0; s < step && num <= n * n; s++) {
            x += dx; y += dy;
            if (x >= 0 && x < n && y >= 0 && y < n) arr[y][x] = num;
            num++;
          }
          d++;
        }
        step++;
      }
      return arr;
    }

    function init() {
      const minSide = Math.min(window.innerWidth, window.innerHeight);
      let n = Math.floor((minSide * 0.92) / 17);
      n = Math.max(21, Math.min(61, n));
      if (n % 2 === 0) n -= 1;

      if (n !== lastGridSize) {
        twinkleIndex = 0;
        lastGridSize = n;
      }

      main.innerHTML = '';
      primeCells = [];

      const cell = Math.floor((minSide * 0.92) / n) - 1;
      document.documentElement.style.setProperty('--cell', cell + 'px');
      main.style.gridTemplateColumns = `repeat(${n}, ${cell}px)`;

      const arr = spiral(n);
      const isPrime = sieve(n * n);

      for (let r = 0; r < n; r++) {
        for (let c = 0; c < n; c++) {
          const value = arr[r][c];
          if (isPrime[value]) {
            const a = document.createElement('a');
            a.href = LAB.pageRandomiser.nextOne();
            a.className = 'cell prime';
            const hue = (value / (n * n)) * 280;
            a.style.color = `hsl(${hue}, 90%, 62%)`;
            a.style.backgroundColor = `hsl(${hue}, 90%, 62%)`;
            main.appendChild(a);
            primeCells.push({ el: a, value: value });
          } else {
            const div = document.createElement('div');
            div.className = 'cell composite';
            main.appendChild(div);
          }
        }
      }
    }

    // Twinkle primes in number order, spiraling outward from the centre
    function twinkle() {
      primeCells.sort((a, b) => a.value - b.value);
      const p = primeCells[twinkleIndex];
      if (p) {
        const origColor = p.el.style.backgroundColor;
        p.el.style.backgroundColor = '#fff';
        p.el.style.color = '#fff';
        setTimeout(() => { p.el.style.backgroundColor = origColor; p.el.style.color = origColor; }, 400);
        twinkleIndex = (twinkleIndex + 1) % primeCells.length;
      }
      setTimeout(twinkle, 120);
    }

    let resizeTimeout;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(init, 200);
    });

    init();
    twinkle();

  </script>
</body>

</html>
