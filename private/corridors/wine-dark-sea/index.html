<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="οἶνοψ πόντος">
  <title>oinops pontos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #14040f;
      font-family: monospace;
      overflow: hidden;
    }

    main {
      display: flex;
      inset: 0;
      flex-direction: column;
      justify-content: center;
      font-size: 20px;
      line-height: 1.0;
      white-space: pre;
      letter-spacing: 1px;
      user-select: none;
    }

    a {
      text-decoration: none;
    }

    .row {
      color: #6a2748;
      text-align: center;
    }

    #vignette {
      position: fixed;
      background: radial-gradient(circle, transparent 45%, rgba(10, 2, 8, 0.85) 100%);
      inset: 0;
      pointer-events: none;
      z-index: 50;
    }
  </style>
</head>

<body>
  <div id="vignette"></div>
  <main id="main"></main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('wine-dark-sea');

    const main = document.getElementById('main');
    const waveChars = '~≈∿〜⌇';
    let rows = [];
    let cols, rowCount;

    function init() {
      main.replaceChildren();
      rowCount = Math.ceil(window.innerHeight / 20);
      cols = Math.ceil(window.innerWidth / 13) + 4;
      rows = [];

      for (let r = 0; r < rowCount; r++) {
        const row = document.createElement('a');
        row.className = 'row';
        row.href = LAB.pageRandomiser.nextOne();
        main.appendChild(row);
        rows.push({ el: row, phase: LAB.rand(0, Math.PI * 2), speed: LAB.rand(0.4, 1.1) });
      }
    }

    function tick(time) {
      const t = time * 0.001;
      rows.forEach((row, r) => {
        let html = '';
        for (let col = 0; col < cols; col++) {
          const sin1 = Math.sin(col * 0.35 + row.phase + t * row.speed);
          const sin2 = Math.sin(col * 0.12 - t * 0.5 + r * 0.3);
          const wave = sin1 + sin2;
          const crestness = Math.floor(((wave + 2) / 4) * waveChars.length);
          const char = waveChars[Math.min(waveChars.length - 1, crestness)];
          html += char;
        }
        row.el.innerHTML = html;
      });
      requestAnimationFrame(tick);
    }

    window.addEventListener('resize', init);

    document.addEventListener('click', (e) => {
      if (!e.target.closest('a')) init();
    });

    document.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, init);
    });

    init();
    tick();

  </script>
</body>

</html>
