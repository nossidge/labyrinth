<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hair are your aerials. They pick up signals from the cosmos.">
  <title>This'll tend to make you very high.</title>
  <style>
    :root {
      --sky-blue: #0080ff;
      --cloud-white: #ffffff;
      --cosmos-purple: #2a0845;
      --signal-yellow: #fff33b;
      --text-colour: #fefefe;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, var(--cosmos-purple), var(--sky-blue));
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
    }

    main {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #clouds {
      position: fixed;
      display: flex;
      width: 200%;
      height: 150px;
      top: -14px;
      left: 0;
      z-index: 10;
      animation: drift 60s linear infinite;
    }

    .cloud-bottom {
      width: 300px;
      height: 120px;
      margin-right: -50px;
      background: var(--cloud-white);
      box-shadow: 0 10px 30px rgba(255, 255, 255, 0.5);
      border-radius: 0 0 150px 150px;
      filter: blur(5px);
      opacity: 0.8;
    }

    @keyframes drift {
      from {
        transform: translateX(0);
      }

      to {
        transform: translateX(-50%);
      }
    }

    #quote-container {
      position: absolute;
      width: 100%;
      color: var(--text-colour);
      text-align: center;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      text-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      pointer-events: none;
    }

    .quote-line {
      display: block;
      margin-bottom: 0.5rem;
      font-size: clamp(1.125rem, 5vw, 2.2rem);
    }

    .quote-line.large {
      font-size: clamp(1.875rem, 9.1vw, 3.8rem);
    }

    #withnail-row {
      position: fixed;
      display: flex;
      width: 100%;
      height: 20vh;
      bottom: 0;
      left: 0;
      flex-direction: row;
      overflow: hidden;
      z-index: 20;
    }

    .withnail-link {
      display: block;
      height: 100%;
      flex-shrink: 0;
    }

    .withnail-img {
      height: 100%;
      width: auto;
      filter: sepia(0.3) contrast(1.2);
      transition: transform 0.3s ease;
      cursor: pointer;
    }

    .withnail-img:hover {
      transform: translateY(10px) scale(1.05);
      filter: sepia(0) contrast(1.5);
    }

    .signal {
      position: absolute;
      width: 100%;
      height: 2px;
      background: rgba(255, 243, 59, 0.4);
      box-shadow: 0 0 15px var(--signal-yellow);
      top: -20px;
      z-index: 15;
      pointer-events: none;
    }

    .signal-wave {
      position: absolute;
      border: 1px solid var(--signal-yellow);
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
    }

    .lightning {
      position: absolute;
      pointer-events: none;
      z-index: 25;
      filter: drop-shadow(0 0 10px var(--signal-yellow));
    }

    .grain {
      position: fixed;
      width: 100%;
      height: 100%;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44NSIgbnVtT2N0YXZlcz0iMyIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIvPjwvc3ZnPg==');
      top: 0;
      left: 0;
      opacity: 0.1;
      z-index: 100;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="grain"></div>

  <main id="main">
    <div id="clouds">
      <!-- Generated clouds -->
    </div>

    <div id="quote-container">
      <span class="quote-line">
        I don't advise a hair cut, man.
      </span>
      <span class="quote-line">
        All hairdressers are in the employment of the government.
      </span>
      <span class="quote-line large">
        Hair are your aerials.
      </span>
      <span class="quote-line">
        They pick up signals from the cosmos
      </span>
      <span class="quote-line">
        and transmit them directly into the brain.
      </span>
      <span class="quote-line">
        (This is the reason bald-headed men are uptight.)
      </span>
    </div>

    <div id="withnail-row">
      <!-- Images will repeat here -->
    </div>
  </main>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('withnail');

    const main = document.getElementById('main');
    const cloudsContainer = document.getElementById('clouds');
    const withnailRow = document.getElementById('withnail-row');

    // Populate clouds
    for (let i = 0; i < 20; i++) {
      const c = document.createElement('div');
      c.className = 'cloud-bottom';
      c.style.transform = `scale(${LAB.rand(0.8, 1.3)})`;
      cloudsContainer.appendChild(c);
    }

    // Populate Withnail
    function fillWithnail() {
      const imgWidth = withnailRow.clientHeight * (460 / 350);
      const count = Math.max(1, Math.ceil(window.innerWidth / imgWidth));
      withnailRow.replaceChildren();
      for (let i = 0; i < count; i++) {
        const link = document.createElement('a');
        link.className = 'withnail-link';
        link.href = LAB.pageRandomiser.nextOne();

        const img = document.createElement('img');
        img.className = 'withnail-img';
        img.src = 'withnail.jpg';
        img.alt = "Grant and McGann, doin' all they can";

        link.appendChild(img);
        withnailRow.appendChild(link);
      }
    }

    // Radio signal logic
    function launchSignal() {
      const signal = document.createElement('div');
      signal.className = 'signal';
      signal.style.left = '0px';
      main.appendChild(signal);

      let pos = -20;
      const targetY = window.innerHeight - (window.innerHeight * 0.20); // Target the hair line

      function move() {
        pos += 8;
        signal.style.top = pos + 'px';
        signal.style.opacity = LAB.rand(0.2, 0.7); // Flicker

        if (pos >= targetY) {
          impact();
          signal.remove();
        } else {
          requestAnimationFrame(move);
        }
      }
      requestAnimationFrame(move);
    }

    function spawnLightning(img) {
      const rect = img.getBoundingClientRect();

      const startX = rect.left + rect.width / 2;
      const startY = rect.top;

      for (let i = 0; i < 3; i++) {
        const svg = LAB.svgElement('svg');
        svg.setAttribute('class', 'lightning');
        svg.setAttribute('width', '120');
        svg.setAttribute('height', '300');
        svg.setAttribute('viewBox', '0 0 120 300');

        svg.style.left = (startX - 100 + LAB.rand(-30, 30)) + 'px';
        svg.style.top = (startY - 250) + 'px';
        svg.style.zIndex = '19';

        const path = LAB.svgElement('path');
        let d = 'M60,300 ';
        let curX = 60;
        let curY = 300;
        const segments = 6;
        for (let j = 0; j < segments; j++) {
          curX += LAB.rand(-40, 40);
          curY -= 50;
          d += `L${curX},${curY} `;
        }

        path.setAttribute('d', d);
        path.setAttribute('stroke', i === 0 ? 'white' : 'var(--signal-yellow)');
        path.setAttribute('stroke-width', LAB.rand(2, 6));
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');

        svg.appendChild(path);
        main.appendChild(svg);

        let jitterCount = 0;
        const jitter = setInterval(() => {
          svg.style.transform = `translateX(${LAB.rand(-5, 5)}px)`;
          jitterCount++;
          if (jitterCount > 10) {
            clearInterval(jitter);
            svg.style.transition = 'opacity 0.4s, transform 0.4s';
            svg.style.opacity = '0';
            svg.style.transform = 'translateY(-100px) scaleX(0.2)';
            setTimeout(() => svg.remove(), 500);
          }
        }, 30);
      }
    }

    function impact() {
      const images = document.querySelectorAll('.withnail-img');
      if (images.length === 0) return;

      const luckyIndex = LAB.randIndex(images);
      const img = images[luckyIndex];

      img.style.filter = 'brightness(3) contrast(1.5) hue-rotate(45deg)';
      spawnLightning(img);
      setTimeout(() => {
        img.style.filter = '';
      }, 150);
    }

    let signalTimer = null;
    function startSignals() {
      if (signalTimer !== null) return;
      signalTimer = setInterval(() => {
        if (!document.hidden) launchSignal();
      }, 2000);
    }
    function stopSignals() {
      if (signalTimer === null) return;
      clearInterval(signalTimer);
      signalTimer = null;
    }
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopSignals();
        document.querySelectorAll('.signal').forEach(s => s.remove());
      } else {
        startSignals();
      }
    });
    startSignals();

    // Movement interaction
    document.addEventListener('mousemove', (e) => {
      const wave = document.createElement('div');
      wave.className = 'signal-wave';
      wave.style.left = e.clientX + 'px';
      wave.style.top = e.clientY + 'px';
      wave.style.width = '2px';
      wave.style.height = '2px';
      main.appendChild(wave);

      setTimeout(() => {
        wave.style.width = '100px';
        wave.style.height = '100px';
        wave.style.transform = 'translate(-50%, -50%)';
        wave.style.opacity = '0.3';
      }, 10);
      setTimeout(() => {
        wave.style.opacity = '0';
        setTimeout(() => wave.remove(), 500);
      }, 1000);
    });

    window.addEventListener('resize', fillWithnail);

    fillWithnail();

  </script>
</body>

</html>
