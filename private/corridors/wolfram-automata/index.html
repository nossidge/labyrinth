<!DOCTYPE html>
<html lang="en">

<!--
I used to be very into cellular automata:
https://github.com/nossidge/1d-cellular-automata
https://tilde.town/~nossidge/automata/
https://twitter.com/auto_automata
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Wolfram Alfalfa">
  <title>Elementary cellular automata</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      background-color: #0a0a14;
      overflow: hidden;
      font-family: monospace;
      color: #ffffff;
    }

    #canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 1;
    }

    #crt-scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(0, 0, 0, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
      background-size: 100% 3px;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>

<body>
  <canvas id="canvas"></canvas>
  <div id="crt-scanlines"></div>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('wolfram-automata');

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const RULES = [
      22,
      30,
      54,
      73,
      90,
      110,
      150,
    ];
    const ruleRandomiser = new LAB.CyclicRandomiser(RULES);
    let rule = ruleRandomiser.nextOne();
    document.title = `Rule ${rule}`;

    const cellSize = 4;
    let cols, rows, row, generation;
    let running = false;

    function setup() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      cols = Math.floor(canvas.width / cellSize);
      rows = Math.floor(canvas.height / cellSize);
      ctx.fillStyle = '#0a0a14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      row = new Array(cols).fill(0);
      // Seed with a single cell in the middle, plus a few random sprinkles
      row[Math.floor(cols / 2)] = 1;
      for (let i = 0; i < 5; i++) row[LAB.randInt(0, cols - 1)] = 1;
      generation = 0;
    }

    function step() {
      // Draw current row
      for (let i = 0; i < cols; i++) {
        if (row[i]) {
          // Vary colour by generation to give a subtle gradient
          const hue = (generation * 2) % 360;
          ctx.fillStyle = `hsl(${hue}, 80%, 70%)`;
          ctx.fillRect(i * cellSize, generation * cellSize, cellSize, cellSize);
        }
      }
      // Compute next row
      const next = new Array(cols).fill(0);
      for (let i = 0; i < cols; i++) {
        const l = row[(i - 1 + cols) % cols];
        const c = row[i];
        const r = row[(i + 1) % cols];
        const pattern = (l << 2) | (c << 1) | r;
        next[i] = (rule >> pattern) & 1;
      }
      row = next;
      generation++;

      if (generation >= rows) {
        running = false;
        return;
      }
      requestAnimationFrame(step);
    }

    function init() {
      running = true;
      setup();
      step();
    }

    window.addEventListener('resize', init);

    window.addEventListener('keydown', (e) => {
      LAB.handleKeydown(e, () => {
        if (e.key !== ' ') {
          rule = ruleRandomiser.nextOne();
          document.title = `Rule ${rule}`;
        }
        init();
      });
    });

    window.addEventListener('click', () => {
      window.location.href = LAB.pageRandomiser.nextOne();
    });

    init();

  </script>
</body>

</html>
