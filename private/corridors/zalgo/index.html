<!DOCTYPE html>
<html lang="en">

<!--
For the uninitiated:
https://en.wikipedia.org/wiki/Zalgo_text
-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="He comes">
  <title>ẗö ̷i̶n̵v̷o̶k̵e̷</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body,
    html {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    #zalgo-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
      user-select: none;
    }

    .zalgo-letter {
      font-size: clamp(18px, 18vw, 120px);
      color: #c8c8c8;
      display: inline-block;
      text-decoration: none;
      line-height: 1;
      vertical-align: middle;
      transition: color 0.3s;
    }

    .zalgo-letter:hover {
      color: #ff0000;
    }

    /* Love my CRT scanline */
    body::after {
      content: "";
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
      background-size: 100% 3px;
      pointer-events: none;
      z-index: 10;
    }

    /* Glitch overlay */
    #glitch-overlay {
      position: fixed;
      top: -5%;
      left: -5%;
      width: 110%;
      height: 110%;
      pointer-events: none;
      z-index: 5;
      opacity: 0;
    }

    #glitch-overlay.active {
      opacity: 0.2;
    }

    .glitch-slice {
      position: absolute;
      left: 0;
      width: 100%;
      background: #000;
      mix-blend-mode: difference;
    }

    /* Noise grain kinda like an old monitor with RGB static */
    #noise {
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIj48ZmlsdGVyIGlkPSJuIj48ZmVUdXJidWxlbmNlIHR5cGU9ImZyYWN0YWxOb2lzZSIgYmFzZUZyZXF1ZW5jeT0iMC44NSIgbnVtT2N0YXZlcz0iMyIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIvPjwvc3ZnPg==');
      opacity: 0.4;
      pointer-events: none;
      z-index: 11;
      animation: noise 0.3s steps(3) infinite;
    }

    @keyframes noise {
      0% {
        transform: translate(0, 0);
      }

      20% {
        transform: translate(-2%, -1%);
      }

      40% {
        transform: translate(1%, 2%);
      }

      60% {
        transform: translate(-1%, -2%);
      }

      80% {
        transform: translate(2%, 1%);
      }

      100% {
        transform: translate(0, 0);
      }
    }
  </style>
</head>

<body>
  <div id="zalgo-container"></div>
  <div id="glitch-overlay"></div>
  <div id="noise"></div>

  <script src="../../common/CyclicRandomiser.js"></script>
  <script src="../../common/labyrinthPages.js"></script>
  <script>
    const currentPage = "corridors/zalgo";
    const otherPages = labyrinthPages.filter(p => !p.includes(currentPage));
    const pageRandomiser = new CyclicRandomiser(otherPages);

    const container = document.getElementById('zalgo-container');
    const glitchOverlay = document.getElementById('glitch-overlay');

    // Build the three sets of combining diacritical marks
    // Categorised by where they render: above, below, or through the letter
    const diacritics = { top: [], middle: [], bottom: [] };

    (function buildDiacritics() {
      function add(target, code) { target.push(String.fromCharCode(code)); }
      function addRange(target, from, to) {
        for (let i = from; i <= to; i++) add(target, i);
      }

      addRange(diacritics.top, 768, 789);
      for (let i = 790; i <= 819; i++) {
        // U+0316 - U+0333: below, except 794 & 795 go above
        add((i === 794 || i === 795) ? diacritics.top : diacritics.bottom, i);
      }
      addRange(diacritics.middle, 820, 824);
      addRange(diacritics.bottom, 825, 828);
      addRange(diacritics.top, 829, 836);
      add(diacritics.bottom, 837);
      add(diacritics.top, 838);
      addRange(diacritics.bottom, 839, 841);
      addRange(diacritics.top, 842, 844);
      addRange(diacritics.bottom, 845, 846);
      addRange(diacritics.top, 848, 850);
      addRange(diacritics.bottom, 851, 854);
      addRange(diacritics.top, 855, 856);
      addRange(diacritics.bottom, 857, 858);
      add(diacritics.top, 859);
      add(diacritics.bottom, 860);
      addRange(diacritics.top, 861, 862);
      add(diacritics.bottom, 863);
      addRange(diacritics.top, 864, 865);
    })();

    // Randomisation helpers
    function rand(min, max) { return Math.random() * (max - min) + min; }
    function randInt(min, max) { return Math.floor(rand(min, max)); }
    function randIndex(array) { return randInt(0, array.length - 1); }
    function sample(array) { return array[randIndex(array)]; }

    // Generate a small batch of random diacritics
    function growDiacritics(count) {
      let marks = '';
      for (let i = 0; i < count; i++) {
        const roll = Math.random();
        if (roll < 0.45) {
          marks += sample(diacritics.top);
        } else if (roll < 0.9) {
          marks += sample(diacritics.bottom);
        } else {
          marks += sample(diacritics.middle);
        }
      }
      return marks;
    }

    // Each letter tracks its own accumulated marks
    const BASE = 'Zalgo';
    const MAX_MARKS = 80;
    const letters = [];

    for (let i = 0; i < BASE.length; i++) {
      const el = document.createElement('a');
      el.className = 'zalgo-letter';
      el.href = pageRandomiser.nextOne();
      el.textContent = BASE[i];
      container.appendChild(el);
      letters.push({ el: el, base: BASE[i], marks: '' });
    }

    function render(letter) {
      letter.el.textContent = letter.base + letter.marks;
    }

    function tick() {
      const letter = sample(letters);
      const markCount = [...letter.marks].length;

      // Once heavy enough, growing chance to reset back to bare letter
      if (markCount > 10 && Math.random() < (markCount - 10) / (MAX_MARKS * 1.5)) {
        letter.marks = '';
      } else {
        // Append 1 to 3 new diacritics onto what's already there
        letter.marks += growDiacritics(randInt(1, 3));
      }

      render(letter);
      setTimeout(tick, randInt(80, 120));
    }

    tick();

    // Randomly fires horizontal glitchy slice distortions
    function fireGlitch() {
      glitchOverlay.innerHTML = '';
      const sliceCount = randInt(3, 6);

      for (let i = 0; i < sliceCount; i++) {
        const slice = document.createElement('div');
        slice.className = 'glitch-slice';
        const h = randInt(1, 6);
        slice.style.top = randInt(0, 100) + '%';
        slice.style.height = h + '%';
        slice.style.background = '#ff0000';
        glitchOverlay.appendChild(slice);
      }

      glitchOverlay.classList.add('active');

      // Hold for a short burst then disappear
      const duration = randInt(60, 200);
      setTimeout(() => {
        glitchOverlay.classList.remove('active');
        glitchOverlay.innerHTML = '';
      }, duration);

      setTimeout(fireGlitch, randInt(150, 2000));
    }

    setTimeout(fireGlitch, randInt(80, 200));

  </script>
</body>

</html>
