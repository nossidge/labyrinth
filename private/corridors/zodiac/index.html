<!DOCTYPE html>
<html lang="en">

<!--
This is all very approximate, as constellations have multiple interpretations.
Lines can pretty much be drawn between any stars, and there are no "official" constellations.
So I've just settled on a source that can be easily calculated.
Luckily, some lovely person has made all these in SVG format.

Constellation paths sourced from these SVGs by eukisuri:
https://thenounproject.com/browse/collection-icon/stars-and-planets-173402/
https://thenounproject.com/icon/capricorn-constellation-5421417/
https://x.com/eukisuri
https://www.instagram.com/eukisuri/

Background stars by
https://oldwww.tumblr.com/post/673223302462013440
-->

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zodiac (2007)</title>
  <meta name="description" content="Starring Jake Gyllenhaal, Mark Ruffalo, and Robert Downey Jr.">
  <style>
    :root {
      --bg-color: #02040a;
      --star-color: #fffae0;
      --line-color: rgba(255, 255, 0, 0.5);
      --highlight-color: #ffff00;
      --highlight-glow: rgba(255, 255, 0, 0.8);
      --text-color: #e0e0e0;
    }

    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000 url('stars.webp') repeat;
      color: var(--text-color);
      font-family: monospace;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .constellation-map {
      position: relative;
      width: 85vw;
      aspect-ratio: 1000 / 800;
      max-width: 1200px;
      max-height: 960px;
      transition: transform 0.1s ease-out;
    }

    svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    .constellation-line {
      stroke: var(--line-color);
      stroke-width: 1.5;
      transition: stroke 0.4s ease, stroke-width 0.4s ease, filter 0.4s ease;
      stroke-linecap: round;
    }

    .constellation-line.highlight {
      stroke: var(--highlight-color);
      stroke-width: 3;
      filter: drop-shadow(0 0 8px var(--highlight-glow));
    }

    .star {
      position: absolute;
      text-decoration: none;
      font-size: 32px;
      cursor: pointer;
      z-index: 5;
      transform: translate(-50%, -50%);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), filter 0.3s ease;
      user-select: none;
      animation: twinkle var(--twinkle-duration, 3s) infinite ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .star-name-tag {
      position: fixed;
      pointer-events: none;
      color: var(--highlight-color);
      font-family: monospace;
      font-size: 2.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: 100;
      text-shadow: 0 0 10px var(--highlight-glow);
    }

    .star:hover {
      transform: translate(-50%, -50%) scale(1.5);
      filter: drop-shadow(0 0 10px var(--highlight-glow));
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.8;
        transform: translate(-50%, -50%) scale(1);
      }

      50% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.1);
      }
    }
  </style>
</head>

    // Show the current sign for today's date
    function getCurrentSignKey() {
      const now = new Date();
      const m = now.getMonth() + 1;
      const d = now.getDate();

      for (const key in CONSTELLATIONS) {
        const sign = CONSTELLATIONS[key];
        const start = sign.date.start;
        const end = sign.date.end;

        // Handle year wrap (Capricorn: Dec 22 - Jan 19)
        if (start.m > end.m) {
          if ((m === start.m && d >= start.d) || (m === end.m && d <= end.d) || (m < end.m) || (m > start.m)) {
            return key;
          }
        } else {
          if ((m > start.m || (m === start.m && d >= start.d)) && (m < end.m || (m === end.m && d <= end.d))) {
            return key;
          }
        }
      }
      return 'Capricorn'; // Fallback
    }

    function drawConstellation(key) {
      const sign = CONSTELLATIONS[key];
      const starsData = sign.stars;

      // During dev this was useful, so I'm leaving it in (but commented out) just in case
      // starsData.forEach(star => { star.x = star.x - 100; console.log(star.x); });
      // starsData.forEach(star => { star.y = star.y - 100; console.log(star.y); });

      // Update UI
      document.title = key + ': ' + sign.description;
      const mapElement = document.getElementById('map');
      const svgElement = document.getElementById('lines-svg');
      const starTag = document.getElementById('star-tag');

      // Clear existing
      mapElement.querySelectorAll('.star').forEach(s => s.remove());
      svgElement.innerHTML = '';

      // Create stars
      starsData.forEach(star => {
        const el = document.createElement('a');
        el.href = pageRandomiser.nextOne();
        el.className = 'star';
        el.style.left = `${(star.x / 1000) * 100}%`;
        el.style.top = `${(star.y / 800) * 100}%`;
        el.dataset.id = star.id;
        el.innerHTML = ['✨', '⭐', '🌟'][Math.floor(Math.random() * 3)];
        el.style.setProperty('--twinkle-duration', (2 + Math.random() * 3) + 's');

        // TODO: Possibly never, but it might be nice...
        // This `starTag` stuff is all to do with star names.
        // But it's so much effort to find these, so just leave it for now.
        el.addEventListener('mouseenter', (e) => {
          highlight(star.id);
          starTag.innerText = star.name;
          starTag.style.opacity = 0;
        });
        el.addEventListener('mousemove', (e) => {
          starTag.style.left = (e.clientX + 25) + 'px';
          starTag.style.top = (e.clientY + 10) + 'px';
        });
        el.addEventListener('mouseleave', () => {
          unhighlight();
          starTag.style.opacity = 0;
        });

        mapElement.appendChild(el);
      });

      // Create lines
      const processedConnections = new Set();
      starsData.forEach(star => {
        star.connections.forEach(targetId => {
          const target = starsData.find(s => s.id === targetId);
          if (target) {
            const pairId = [star.id, targetId].sort().join('-');
            if (!processedConnections.has(pairId)) {
              const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
              line.setAttribute('x1', star.x);
              line.setAttribute('y1', star.y);
              line.setAttribute('x2', target.x);
              line.setAttribute('y2', target.y);
              line.classList.add('constellation-line');
              line.dataset.stars = `${star.id} ${targetId}`;
              svgElement.appendChild(line);
              processedConnections.add(pairId);
            }
          }
        });
      });
    }

    // Highlight lines connected to a star
    function highlight(starId) {
      const lines = document.querySelectorAll('.constellation-line');
      lines.forEach(line => {
        if (line.dataset.stars.split(' ').includes(starId)) {
          line.classList.add('highlight');
        } else {
          line.classList.remove('highlight');
        }
      });
    }

    // Remove highlight from all lines
    function unhighlight() {
      const lines = document.querySelectorAll('.constellation-line');
      lines.forEach(line => {
        line.classList.remove('highlight');
      });
    }

    // Dev mode for those who know the secret key
    document.addEventListener('keydown', (e) => {
      if (e.key === '`') {
        if (document.getElementById('dev-nav')) return;

        const nav = document.createElement('div');
        nav.id = 'dev-nav';
        nav.style.position = 'fixed';
        nav.style.top = '20px';
        nav.style.left = '20px';
        nav.style.zIndex = '1000';
        nav.style.background = 'rgba(0,0,0,0.8)';
        nav.style.padding = '10px';
        nav.style.border = '1px solid yellow';

        const keys = Object.keys(CONSTELLATIONS).sort((a, b) => CONSTELLATIONS[a].id - CONSTELLATIONS[b].id);
        let idx = keys.indexOf(currentSignKey);

        const update = (dir) => {
          idx = (idx + dir + keys.length) % keys.length;
          currentSignKey = keys[idx];
          drawConstellation(currentSignKey);
        };

        const prevBtn = document.createElement('button');
        prevBtn.innerText = 'PREV';
        prevBtn.onclick = () => update(-1);

        const nextBtn = document.createElement('button');
        nextBtn.innerText = 'NEXT';
        nextBtn.onclick = () => update(1);

        nav.appendChild(prevBtn);
        nav.appendChild(nextBtn);
        document.body.appendChild(nav);
      }
    });

    // Get today's sign constellation and draw it
    let currentSignKey = getCurrentSignKey();
    drawConstellation(currentSignKey);

  </script>
</body>

</html>
