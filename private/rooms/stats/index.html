<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page creation statistics">
  <title>Labyrinth Statistics</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #f0f0f0;
      color: #333;
      font-family: Georgia, serif;
      line-height: 1.6;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background-color: white;
      border: 3px solid #333;
      padding: 30px;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
      text-align: center;
    }

    /* Tab navigation */
    .tabs {
      display: flex;
      gap: 5px;
      margin-bottom: 16px;
      border-bottom: 3px solid #333;
    }

    .tab-button {
      padding: 10px 20px;
      background-color: #ddd;
      border: 2px solid #333;
      border-bottom: none;
      cursor: pointer;
      font-size: 1rem;
      font-family: Georgia, serif;
      transition: background-color 0.2s;
    }

    .tab-button:hover {
      background-color: #ccc;
    }

    .tab-button.active {
      background-color: #333;
      color: white;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Cards */
    .card {
      background-color: #f9f9f9;
      border: 2px solid #ccc;
      padding: 20px;
    }

    .card h2 {
      border-bottom: 2px solid #ccc;
      padding-bottom: 10px;
      margin-bottom: 15px;
      font-size: 1.3rem;
    }

    /* Status cards grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .metric-card {
      background-color: white;
      border: 2px solid #999;
      padding: 15px;
      text-align: center;
    }

    .metric-card-wide {
      grid-column: span 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .random-button {
      padding: 12px 24px;
      background-color: #333;
      color: white;
      border: 2px solid #333;
      font-size: 1rem;
      font-family: Georgia, serif;
      cursor: pointer;
      transition: background-color 0.2s;
      text-decoration: none;
    }

    .random-button:hover {
      background-color: #555;
    }

    .random-button:active {
      background-color: #222;
    }

    .metric-label {
      font-size: 0.85rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .metric-value {
      font-size: 2rem;
      font-weight: bold;
      color: #333;
      font-family: 'Courier New', monospace;
      margin-bottom: 5px;
    }

    .metric-subtitle {
      font-size: 0.8rem;
      color: #999;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 10px;
      background-color: #ddd;
      border: 1px solid #999;
      font-size: 0.9rem;
      margin-top: 10px;
    }

    .status-badge.ahead {
      background-color: #e6f7e6;
      border-color: #66bb6a;
      color: #2e7d32;
    }

    .status-badge.behind {
      background-color: #fff3e0;
      border-color: #ffb74d;
      color: #e65100;
    }

    .status-badge.on-target {
      background-color: #e3f2fd;
      border-color: #42a5f5;
      color: #1565c0;
    }

    /* Charts */
    .chart-container {
      height: 500px;
      padding-bottom: 40px;
      position: relative;
    }

    .chart-container h2 {
      font-size: 1.3rem;
      border-bottom: 2px solid #ccc;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    /* Table */
    table {
      width: 100%;
      border-collapse: collapse;
      background-color: white;
      margin-top: 15px;
    }

    thead {
      background-color: #333;
      color: white;
    }

    th {
      padding: 12px;
      text-align: left;
      font-size: 0.9rem;
      font-weight: bold;
      border: 1px solid #333;
      cursor: pointer;
      user-select: none;
      font-family: Georgia, serif;
    }

    th:hover {
      background-color: #555;
    }

    th.sorted-asc::after {
      content: ' ↑';
      font-size: 0.8rem;
    }

    th.sorted-desc::after {
      content: ' ↓';
      font-size: 0.8rem;
    }

    tbody tr {
      border-bottom: 1px solid #ddd;
      cursor: pointer;
    }

    tbody tr:nth-child(even) {
      background-color: #f9f9f9;
    }

    tbody tr:hover {
      background-color: #f0f0f0;
    }

    td {
      padding: 10px 12px;
      font-size: 0.95rem;
    }

    td.timestamp {
      font-family: 'Courier New', monospace;
    }

    td.id {
      font-family: 'Courier New', monospace;
    }

    td a {
      color: inherit;
      text-decoration: none;
      display: block;
    }

    /* Mobile (not exact, but good enough) */
    @media (max-width: 768px) {
      .container {
        padding: 15px;
      }

      h1 {
        font-size: 1.8rem;
      }

      .metrics-grid {
        grid-template-columns: 1fr;
      }

      .tabs {
        flex-wrap: wrap;
      }

      .tab-button {
        flex: 1;
        min-width: 100px;
      }

      .chart-container {
        height: 300px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Labyrinth Statistics</h1>

    <!-- Tab navigation -->
    <div class="tabs">
      <button class="tab-button active" data-tab="status">Status</button>
      <button class="tab-button" data-tab="graph">Graph</button>
      <button class="tab-button" data-tab="table">Table</button>
    </div>

    <!-- Status tab -->
    <div id="status" class="tab-content active">
      <div class="card">
        <h2>Metrics</h2>
        <div class="metrics-grid">
          <div class="metric-card">
            <div class="metric-label">Total Pages</div>
            <div class="metric-value" id="totalCorridors">—</div>
            <div class="metric-subtitle">Pages created</div>
          </div>

          <div class="metric-card">
            <div class="metric-label">Pages Remaining</div>
            <div class="metric-value" id="pagesRemaining">—</div>
            <div class="metric-subtitle">Pages until 365 goal</div>
          </div>

          <div class="metric-card">
            <div class="metric-label">Days Active</div>
            <div class="metric-value" id="daysActive">—</div>
            <div class="metric-subtitle">Since start of 2026</div>
          </div>

          <div class="metric-card">
            <div class="metric-label">Days Remaining</div>
            <div class="metric-value" id="daysRemaining">—</div>
            <div class="metric-subtitle">Until end of 2026</div>
          </div>

          <div class="metric-card">
            <div class="metric-label">Avg Per Day</div>
            <div class="metric-value" id="avgPerDay">—</div>
            <div class="metric-subtitle" id="upToDate">Up to 2026-12-31</div>
          </div>

          <div class="metric-card">
            <div class="metric-label">Schedule Status</div>
            <div id="statusBadge" class="status-badge on-target">On Target</div>
            <div class="metric-subtitle" id="scheduleText">—</div>
          </div>

          <div class="metric-card metric-card-wide">
            <a href="../index.html" id="randomPageButton" class="random-button">
              Visit Random Page
            </a>
          </div>
        </div>
      </div>
    </div>

    <!-- Graph tab -->
    <div id="graph" class="tab-content">
      <div class="card chart-container">
        <h2>Page count over time</h2>
        <canvas id="cumulativeChart"></canvas>
      </div>
    </div>

    <!-- Table tab -->
    <div id="table" class="tab-content">
      <div class="card">
        <h2>All pages</h2>
        <table id="corridorsTable">
          <thead>
            <tr>
              <th class="sortable" data-sort="created">Created</th>
              <th class="sortable" data-sort="id">ID</th>
              <th class="sortable" data-sort="title">Title</th>
            </tr>
          </thead>
          <tbody id="corridorsTableBody">
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="../../common/labyrinth.js"></script>
  <script>
    const LAB = new Labyrinth('stats');

    const epochDate = new Date('2026-01-01');
    const today = new Date();

    // Tab navigation
    const tabButtons = document.querySelectorAll('.tab-button');
    const tabContents = document.querySelectorAll('.tab-content');

    tabButtons.forEach(button => {
      button.addEventListener('click', () => {
        const tabName = button.getAttribute('data-tab');

        // Remove active class from all
        tabButtons.forEach(btn => btn.classList.remove('active'));
        tabContents.forEach(content => content.classList.remove('active'));

        // Add active class to clicked button and corresponding content
        button.classList.add('active');
        document.getElementById(tabName).classList.add('active');

        // Trigger chart resize if switching to graph tab
        if (tabName === 'graph') {
          setTimeout(() => {
            cumulativeChart.resize();
          }, 100);
        }
      });
    });

    // Calculate metrics
    function calculateMetrics() {
      const sortedByDate = [...LAB.corridorsData].sort((a, b) =>
        new Date(a.created) - new Date(b.created)
      );

      const totalCorridors = LAB.corridorsData.length;
      const daysActive = Math.floor((today - epochDate) / (1000 * 60 * 60 * 24));
      const avgPerDay = (totalCorridors / daysActive).toFixed(2);
      const daysRemaining = 365 - daysActive;
      const targetCorridors = 365;
      const difference = totalCorridors - daysActive;

      // Format current date as YYYY-MM-DD
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      const formattedDate = `${year}-${month}-${day}`;

      // Update DOM
      document.getElementById('totalCorridors').textContent = totalCorridors;
      document.getElementById('daysActive').textContent = daysActive;
      document.getElementById('avgPerDay').textContent = avgPerDay;
      document.getElementById('daysRemaining').textContent = daysRemaining;
      document.getElementById('pagesRemaining').textContent = 365 - totalCorridors;
      document.getElementById('upToDate').textContent = `Up to ${formattedDate}`;

      // Status badge
      const statusBadge = document.getElementById('statusBadge');
      const scheduleText = document.getElementById('scheduleText');

      if (difference > 0) {
        statusBadge.className = 'status-badge ahead';
        statusBadge.textContent = 'Ahead of schedule';
        scheduleText.textContent = `+${difference} pages ahead`;
      } else if (difference < 0) {
        statusBadge.className = 'status-badge behind';
        statusBadge.textContent = 'Behind schedule';
        scheduleText.textContent = `${Math.abs(difference)} pages behind`;
      } else {
        statusBadge.className = 'status-badge on-target';
        statusBadge.textContent = 'On target';
        scheduleText.textContent = 'Perfect pace';
      }

      return { sortedByDate, totalCorridors, daysActive, avgPerDay };
    }

    const metrics = calculateMetrics();

    // Create daily progress data
    function generateDailyData() {
      const dailyCount = {};
      const cumulativeData = [];
      let running = 0;

      // Initialise all days with 0
      for (let i = 0; i <= Math.floor((today - epochDate) / (1000 * 60 * 60 * 24)); i++) {
        const date = new Date(epochDate);
        date.setDate(date.getDate() + i);
        const dateStr = date.toISOString().split('T')[0];
        dailyCount[dateStr] = 0;
      }

      // Count corridors per day
      metrics.sortedByDate.forEach(corridor => {
        const dateStr = corridor.created.split(' ')[0];
        dailyCount[dateStr] = (dailyCount[dateStr] || 0) + 1;
      });

      // Build cumulative data
      Object.keys(dailyCount).sort().forEach(date => {
        running += dailyCount[date];
        cumulativeData.push({ date, count: running });
      });

      return { dailyCount, cumulativeData };
    }

    const { dailyCount, cumulativeData } = generateDailyData();

    // Cumulative chart with target
    const ctxCumulative = document.getElementById('cumulativeChart').getContext('2d');
    const idealData = cumulativeData.map((d, i) => i + 1);

    const cumulativeChart = new Chart(ctxCumulative, {
      type: 'line',
      data: {
        labels: cumulativeData.map(d => new Date(d.date).toLocaleDateString('en-GB', { month: 'short', day: 'numeric' })),
        datasets: [
          {
            label: 'Target (1 per day)',
            data: idealData,
            borderColor: '#999999',
            borderWidth: 2,
            borderDash: [5, 5],
            fill: false,
            pointRadius: 0,
            pointHoverRadius: 0
          },
          {
            label: 'Actual progress',
            data: cumulativeData.map(d => d.count),
            borderColor: '#333333',
            backgroundColor: '#dddddd',
            borderWidth: 2,
            fill: true,
            pointBackgroundColor: '#333333',
            pointBorderColor: '#333333',
            pointRadius: 2,
            pointHoverRadius: 4
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        layout: {
          padding: {
            bottom: 30
          }
        },
        plugins: {
          legend: {
            labels: { color: '#333333' }
          }
        },
        scales: {
          y: {
            beginAtZero: true,
            ticks: { color: '#333333' }
          },
          x: {
            ticks: { color: '#333333' }
          }
        }
      }
    });

    // Generate and manage corridors table
    let tableData = [...LAB.corridorsData];
    let currentSort = { column: 'created', direction: 'asc' };

    function sortTable(column) {
      if (currentSort.column === column) {
        currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
      } else {
        currentSort.column = column;
        currentSort.direction = column === 'created' ? 'desc' : 'asc';
      }

      tableData.sort((a, b) => {
        let aVal = a[column];
        let bVal = b[column];

        if (column === 'created') {
          aVal = new Date(aVal);
          bVal = new Date(bVal);
        } else if (typeof aVal === 'string') {
          aVal = aVal.toLowerCase();
          bVal = bVal.toLowerCase();
        }

        if (currentSort.direction === 'asc') {
          return aVal > bVal ? 1 : aVal < bVal ? -1 : 0;
        } else {
          return aVal < bVal ? 1 : aVal > bVal ? -1 : 0;
        }
      });

      // Update header indicators
      document.querySelectorAll('th.sortable').forEach(header => {
        header.classList.remove('sorted-asc', 'sorted-desc');
      });
      const activeHeader = document.querySelector(`th[data-sort="${column}"]`);
      if (activeHeader) {
        activeHeader.classList.add(`sorted-${currentSort.direction}`);
      }

      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('corridorsTableBody');
      tbody.innerHTML = '';

      tableData.forEach(corridor => {
        const row = document.createElement('tr');

        const createdCell = document.createElement('td');
        createdCell.className = 'timestamp';
        const createdLink = document.createElement('a');
        createdLink.href = corridor.url;
        createdLink.textContent = corridor.created;
        createdCell.appendChild(createdLink);

        const idCell = document.createElement('td');
        idCell.className = 'id';
        const idLink = document.createElement('a');
        idLink.href = corridor.url;
        idLink.textContent = corridor.id;
        idCell.appendChild(idLink);

        const titleCell = document.createElement('td');
        const titleLink = document.createElement('a');
        titleLink.href = corridor.url;
        titleLink.textContent = corridor.title;
        titleCell.appendChild(titleLink);

        row.appendChild(createdCell);
        row.appendChild(idCell);
        row.appendChild(titleCell);
        tbody.appendChild(row);
      });
    }

    // Add click handlers to table headers
    document.querySelectorAll('th.sortable').forEach(header => {
      header.addEventListener('click', () => {
        const column = header.getAttribute('data-sort');
        sortTable(column);
      });
    });

    // Initial render with default sort (created descending)
    sortTable('created');

  </script>
</body>

</html>
